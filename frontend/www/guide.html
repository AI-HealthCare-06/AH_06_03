<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 검사·상담 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .riskrow{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--sage-light); border-radius:18px; padding:14px 18px}
  .chip{font-size:11.5px; font-weight:700; border-radius:999px; padding:3px 11px; border:1.5px solid currentColor; white-space:nowrap}
  .tworow{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .mini{background:#fff; border:1px solid var(--sage-light); border-radius:18px; padding:14px; text-align:left}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen">
        <div class="riskrow" style="border-color:var(--risk)">
          <span class="chip" style="color:var(--risk)">고혈압 범위</span>
          <span><b>의료기관 진료를 권합니다.</b> 이 화면은 진단이 아니며, 검사 여부는 의사가 판단합니다</span>
        </div>
        <div class="tworow">
          <div class="mini"><b>무엇을 상의하면 되나</b>
            <p class="hint" style="margin-top:6px">· 혈압이 계속 높게 나오는지<br>· 추가 검사가 필요한지<br>· 생활습관으로 조절 가능한 범위인지</p></div>
          <div class="mini"><b>가져갈 것</b>
            <p class="hint" style="margin-top:6px">· 최근 혈압 기록<br>· 입력한 검진 수치<br>· 실천 중인 생활습관</p></div>
        </div>
        <p class="hint">특정 병원·검사를 추천하지 않습니다.</p>
        <div style="display:flex; gap:8px">
          <a class="ghost" href="result.html">결과로 돌아가기</a>
          <a class="cta" style="display:block; text-align:center; text-decoration:none" href="challenges.html">챌린지도 함께 시작하기</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
</body>
</html>
