<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 홈</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .home{display:flex; flex-direction:column; gap:12px}
  .home h1{font-size:24px; line-height:1.35; letter-spacing:-.5px; padding-bottom:4px}
  .ring{display:flex; flex-direction:column; gap:18px; background:var(--cream); border-radius:28px; padding:22px 22px 20px; text-decoration:none}
  .ring .t{font-size:15px; font-weight:800}
  .ring .go{align-self:flex-end; font-size:14px; font-weight:800; color:var(--ink)}
  .ring .mid{display:flex; align-items:center; gap:20px}
  .ring .mid svg,.ring .mid img{width:123px; height:123px; flex:none; image-rendering:pixelated}
  .ring .mid .tx{flex:1; display:flex; flex-direction:column; gap:4px}
  .ring .lb{font-size:13px; color:var(--muted)}
  .ring .big{font-size:26px; font-weight:800; letter-spacing:-.5px; line-height:1.1}
  .ring .sub{font-size:14px; color:#4A5C6D; line-height:1.5; padding-top:6px}
  .week{display:flex; justify-content:space-between}
  .week div{display:flex; flex-direction:column; align-items:center; gap:6px}
  .week span{font-size:12px; color:var(--muted)}
  .week i{width:30px; height:30px; border-radius:15px; box-sizing:border-box; border:1px dashed var(--sage)}
  .week .on i{background:var(--accent); border:0}
  .week .now span{font-weight:800; color:var(--ink)}
  .week .now i{border:2px solid var(--accent); background:#fff}
  .week .now.on i{background:var(--accent)}
  .tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
  .tiles.one{grid-template-columns:1fr}
  .tile{display:flex; flex-direction:column; justify-content:space-between; gap:14px; min-height:148px; border-radius:24px; padding:18px; text-decoration:none}
  .tile.line{border:1px solid var(--line)}
  .tile.blue{background:var(--notice)}
  .tile .lb{font-size:13px; color:var(--muted); line-height:1.4}
  .tile.blue .lb{color:#4A5C6D}
  .tile .vv{font-size:28px; font-weight:800; letter-spacing:-.5px; line-height:1; display:flex; align-items:center; gap:8px}
  .tile .vv small{font-size:14px; font-weight:700; color:#4A5C6D}
  .tile .bars{display:flex; gap:4px; margin-top:10px}
  .tile .bars i{flex:1; height:6px; border-radius:3px; background:var(--line)}
  .tile .bars i.on{background:var(--accent)}
  .tile .trk{height:6px; border-radius:3px; background:#fff; margin:8px 0}
  .tile .trk b{display:block; height:6px; border-radius:3px; background:var(--accent)}
  .tile .ft{font-size:12px; color:#4A5C6D}
  .shortcut{display:flex; gap:8px; padding-top:2px}
  .shortcut a{display:flex; flex-direction:column; align-items:center; gap:6px; width:76px; text-decoration:none; font-size:12px; font-weight:700; color:var(--body)}
  .shortcut a span{width:56px; height:56px; border-radius:20px; background:var(--cream); color:var(--ink); display:flex; align-items:center; justify-content:center}
  .foot{font-size:12px; color:var(--muted); line-height:1.6; text-align:center; padding-top:2px}
  .state{background:#fff; border:1px solid var(--line); border-radius:20px; padding:24px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center}
  .state svg{width:44px; height:44px; color:var(--muted)}
  .state .st{font-size:18px; font-weight:800; line-height:1.4}
  .state .sd{font-size:14px; color:#4A5C6D; line-height:1.6}
  .state .cta,.state .ghost{margin-top:8px; width:auto; height:48px; padding:0 28px; font-size:15px}
  .state .segs{display:flex; gap:4px}
  .state .segs i{width:28px; height:6px; border-radius:3px; background:var(--line)}
  .state .segs i.on{background:var(--accent)}
  figure{margin:0; border:1px solid var(--line); border-radius:24px; padding:14px 18px}
  figcaption{font-size:12.5px; color:var(--muted); margin-bottom:8px}
  .chart{width:100%; height:auto; display:block}
  .agecard{background:var(--cream); border-radius:20px; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px}
  .agecard .t{display:flex; flex-direction:column; gap:3px; min-width:0}
  .agecard .t b{font-size:16px}
  .agecard .t span{font-size:13px; color:var(--muted)}
  .agecard .n{font-size:32px; font-weight:800; letter-spacing:-1px; flex:none}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen home" id="screen"></div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>showNoticePopups();</script>

<script>
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function shortDate(iso) { if (!iso) return ''; const [, m, d] = iso.split('-'); return `${Number(m)}/${Number(d)}`; }
function bpPoints(health, bpLog) {
  const pts = health ? [{ v: health.sbp, d: health.recorded_at ? shortDate(health.recorded_at) : '시작' }] : [];
  bpLog.forEach(l => pts.push({ v: l.sys, d: l.date ? shortDate(l.date) : `${l.w}주차` }));
  return pts;
}

function bpChart(points) {
  const series = points.map(p => p.v);
  const W = 356, H = 144, padL = 32, padR = 16, padT = 20, padB = 34;
  const lo = Math.min(120, ...series) - 4, hi = Math.max(150, ...series) + 4;
  const Xp = i => padL + (series.length > 1 ? i * (W - padL - padR) / (series.length - 1) : 0);
  const Yp = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const s = [`<svg class="chart" viewBox="0 0 ${W} ${H}">`];
  s.push(`<line x1="${padL}" y1="${Yp(140).toFixed(1)}" x2="${W - padR}" y2="${Yp(140).toFixed(1)}" stroke="${cssv('--danger')}" stroke-width="1.5" stroke-dasharray="5 4"/>`);
  s.push(`<text x="${W - padR - 60}" y="${(Yp(140) - 4).toFixed(1)}" font-size="10" fill="${cssv('--danger')}">고혈압 140</text>`);
  s.push(`<polyline fill="none" stroke="${cssv('--accent')}" stroke-width="2.5" points="${points.map((p, i) => Xp(i).toFixed(1) + ',' + Yp(p.v).toFixed(1)).join(' ')}"/>`);
  points.forEach((p, i) => {
    const x = Xp(i).toFixed(1), y = Yp(p.v);
    s.push(`<circle cx="${x}" cy="${y.toFixed(1)}" r="4" fill="#fff" stroke="${cssv('--accent')}" stroke-width="2"/>`);
    s.push(`<text x="${x}" y="${(y - 9).toFixed(1)}" font-size="10.5" font-weight="700" text-anchor="middle" fill="${cssv('--ink')}">${p.v}</text>`);
    s.push(`<text x="${x}" y="${H - 8}" font-size="9.5" text-anchor="middle" fill="${cssv('--muted')}">${p.d}</text>`);
  });
  s.push('</svg>');
  return s.join('');
}

const health = JSON.parse(localStorage.getItem('paeon-health') || 'null');
const pred = JSON.parse(localStorage.getItem('paeon-prediction') || 'null');
const cycle = JSON.parse(localStorage.getItem('paeon-cycle') || 'null');
const progress = JSON.parse(localStorage.getItem('paeon-progress') || '{"days":[],"bpLog":[]}');

const RISK_LABEL = { normal: '양호', borderline: '주의', high: '높음' };
const RISK_BARS = { normal: 1, borderline: 2, high: 3 };
const ICON_WARN = '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#243749" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l6.5 11.5h-13z"/></svg>';
const ICON_OK = '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#243749" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M5.3 8.2l1.9 1.9 3.5-4"/></svg>';
const STATE_ICON = {
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>',
};
const btn = (href, label, cls = 'cta') => `<a class="${cls}" href="${href}">${label}</a>`;
const stateCard = (icon, title, desc, extra = '', actions = '') => `<div class="state">${icon}<div class="st">${title}</div>${extra}<div class="sd">${desc}</div>${actions}</div>`;

const todayD = new Date(); todayD.setHours(0, 0, 0, 0);
const cycleNo = cycle ? (cycle.cycleNo || 1) : 1;                 // 12주 = 4주 x 3차
const startedOn = cycle ? new Date(cycle.startedOn + 'T00:00:00') : null;
const dayNo = startedOn ? Math.round((todayD - startedOn) / 86400000) + 1 : 0;   // 시작한 날이 1일째
const cycleDone = cycle && dayNo > 28;
// 건강정보만 있고 예측 결과가 없으면(대상 확인·입력 검토를 안 마쳤으면) 'pending': 이어서 하도록 안내
let doneCycles = 0;
const state = (health || pred) ? (cycle ? (cycleDone ? 'redo' : 'active') : (pred ? 'ready' : 'pending')) : 'empty';
// 4주 재입력은 서버에 저장되는 화면으로 (사이클 번호가 있을 때). 없으면 예전 추이 화면
const reassessHref = cycle && cycle.cycleId ? `reassessment.html?cycle=${encodeURIComponent(cycle.cycleId)}` : 'trend.html';

// 파이 n조각 중 done조각을 구운 그림 (시안의 파이 이미지 대신 SVG)
function pieSvg(n, done) {
  const k = Math.min(3, Math.round(3 * done / Math.max(1, n)));   // 시안의 파이 그림은 3조각 기준
  return pieDish(`<img src="assets/img/pie${k}.png" alt="파이 ${n}조각 중 ${done}조각을 구웠어요">`, k > 0);
}

// 서버 /home/summary 값. 실패하면 챌린지 기록(paeon-progress)으로 계산
let summary = null;
function ringHtml() {
  const doneDays = new Set(progress.days);
  const ml = progress.missionLog || {};
  const idxToday = dayNo - 1;
  const dow = ['일', '월', '화', '수', '목', '금', '토'];
  const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  let n, todaySet, streak, week = '';
  if (summary) {
    n = summary.today_total; todaySet = summary.today_done; streak = summary.streak;
    summary.week.forEach(w => {
      const d = new Date(w.date + 'T00:00:00');
      week += `<div class="${[w.done ? 'on' : '', iso(d) === iso(todayD) ? 'now' : ''].join(' ')}"><span>${dow[d.getDay()]}</span><i></i></div>`;
    });
  } else {
    n = cycle.missions.length;
    todaySet = doneDays.has(idxToday) ? n : (ml[idxToday] ? new Set(ml[idxToday]).size : 0);
    streak = 0;
    for (let i = doneDays.has(idxToday) ? idxToday : idxToday - 1; i >= 0 && doneDays.has(i); i--) streak++;
    const mon = new Date(todayD); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
    for (let k = 0; k < 7; k++) {
      const d = new Date(mon); d.setDate(mon.getDate() + k);
      const i = Math.round((d - startedOn) / 86400000);
      week += `<div class="${[i >= 0 && doneDays.has(i) ? 'on' : '', d.getTime() === todayD.getTime() ? 'now' : ''].join(' ')}"><span>${dow[d.getDay()]}</span><i></i></div>`;
    }
  }
  const left = n - todaySet;
  const sub = left <= 0 ? '오늘 파이를 모두 구웠어요!' : left === 1 ? '하나만 더 구우면<br>오늘 파이 완성!' : `${left}개 더 구우면<br>오늘 파이 완성!`;
  return `<a class="ring" href="challenge-progress.html">
    <span class="t">챌린지를 완료해서 파이를 구워봐요!</span>
    <div class="mid">${pieSvg(n, todaySet)}<div class="tx"><span class="lb">연속 달성</span><span class="big">${streak}일째</span><span class="sub">${sub}</span></div></div>
    <div class="week">${week}</div>
    <span class="go">오늘 챌린지 하러 가기 ›</span>
  </a>`;
}

function tilesHtml() {
  const a = pred && pred.model_a && pred.model_a.status === 'completed' ? pred.model_a : null;
  let html = '';
  if (!a) {
    const ma = pred && pred.model_a;
    const age = ma && ma.skip_reason === 'age_out_of_range';
    if (!ma || ma.status !== 'skipped') html += stateCard(STATE_ICON.doc, '아직 분석 결과가 없어요', '건강정보와 설문을 입력하면 결과를 볼 수 있어요.', '', btn('health-info.html', '입력 시작하기'));
    else html += stateCard(STATE_ICON.info, '이번엔 분석할 수 없어요',
      (age ? '만 32~70세가 아니어서<br>10년 내 심장 혈관 건강 신호는<br>분석하지 않아요.' : '심장 혈관 질환 진단 이력이 있거나<br>고혈압으로 진단·치료 중이면<br>분석하지 않아요.<br>담당 의사와 상의해 주세요.')
      + '<br>챌린지는 그대로 할 수 있어요.');
  }
  const risk = a ? `<a class="tile line" href="result.html"><span class="lb">10년 내 심장<br>혈관 건강 신호</span><div><div class="vv">${a.risk_level === 'normal' ? ICON_OK : ICON_WARN}${RISK_LABEL[a.risk_level]}${probText(a.probability) ? `<small>${probText(a.probability)}</small>` : ''}</div><div class="bars">${[1, 2, 3].map(i => `<i class="${i <= RISK_BARS[a.risk_level] ? 'on' : ''}"></i>`).join('')}</div></div></a>` : '';
  let vv, pct, ft;
  if (state === 'active') {
    const left = 28 - dayNo;
    vv = left > 0 ? `${left}일 <small>남았어요</small>` : '<small>오늘이에요</small>'; pct = Math.round(dayNo / 28 * 100); ft = `12주 중 ${(cycleNo - 1) * 4 + Math.min(4, Math.ceil(dayNo / 7))}주차 · ${dayNo} / 28일`;
  } else if (state === 'redo') { vv = '<small>지금 재요</small>'; pct = 100; ft = `12주 중 ${cycleNo * 4}주차 · 28 / 28일`; }
  else { vv = '<small>챌린지 시작 전</small>'; pct = 0; ft = '챌린지 0 / 28일'; }
  const href = state === 'active' || state === 'redo' ? reassessHref : 'challenges.html';
  const when = `<a class="tile blue" href="${href}"><span class="lb">혈압·체중을<br>다시 재는 날까지</span><div><div class="vv">${vv}</div><div class="trk"><b style="width:${pct}%"></b></div><span class="ft">${ft}</span></div></a>`;
  html += `<div class="tiles${risk ? '' : ' one'}">${risk}${when}</div>`;
  if (a && probText(a.probability)) html += probNoteHtml(a.vascular_age != null, true);
  if (a && a.vascular_age != null) html += `<div class="agecard"><div class="t"><b>혈관 나이 (추정)</b><span>실제 나이와 차이가 클 수 있어요</span></div><div class="n">${Math.round(a.vascular_age)}세</div></div>`;
  return html;
}

function render() {
  const sp = setupProgress();
  let body = '<h1>오늘도 하나씩,<br>차근차근 해봐요</h1>' + adviceBannerHtml(pred, health);

  if (state === 'empty') {
    body += stateCard(STATE_ICON.doc, '아직 분석 결과가 없어요', '건강정보와 설문을 입력하면 결과를 볼 수 있어요.', '', btn('health-info.html', '입력 시작하기'));
  } else if (state === 'pending') {
    const segs = `<div class="segs">${sp.steps.map(s => `<i class="${s.done ? 'on' : ''}"></i>`).join('')}</div>`;
    body += stateCard(STATE_ICON.doc, '입력을 이어서 마무리해 주세요', '네 단계를 마치면 결과를 볼 수 있어요.', segs, btn(sp.next ? sp.next.href : 'review.html', '이어서 하기'));
  } else {
    if (state === 'active') body += ringHtml();
    else if (state === 'ready' && doneCycles >= 3) body += stateCard(STATE_ICON.doc, '12주를 모두 마쳤어요!', '지난 기록에서 처음과 달라진 점을 볼 수 있어요.', '', btn('twelve-weeks.html', '12주 기록 보기'));
    else if (state === 'ready' && doneCycles > 0) body += stateCard(STATE_ICON.doc, `${['', '첫', '두'][doneCycles]} 번째 4주를 마쳤어요!`, `이제 ${['', '두', '한'][doneCycles]} 번(${(3 - doneCycles) * 4}주) 남았어요.`, '', btn('challenges.html', `${doneCycles + 1}차 4주 챌린지 시작`));
    else if (state === 'ready') body += stateCard(STATE_ICON.doc, '분석이 끝났어요', '결과에 맞는 챌린지를 골라요.<br><b style="font-size:17px;color:var(--ink)">12주 = 4주씩 3번</b>', '', btn('challenges.html', '4주 챌린지 시작'));
    else {
      const last = cycleNo >= 3;
      body += stateCard(STATE_ICON.doc, last ? '12주 계획을 모두 마쳤어요' : `12주 계획 ${cycleNo}/3차가 끝났어요`, '바뀐 항목만 다시 입력하면 비교해 드려요.', '',
        btn(reassessHref, last ? '12주 결과 확인하기' : '4주 결과 확인하기') + (!last && !cycle.cycleId ? btn('challenges.html', `다음 4주 챌린지 시작 (${cycleNo + 1}차)`, 'ghost') : ''));
    }
    if (pred) body += tilesHtml();
    body += `<div class="shortcut"><a href="calendar-diary.html"><span>${ICON.calendar}</span>캘린더</a></div>`;
    const bpPts = bpPoints(health, progress.bpLog);
    if (bpPts.length > 1) body += `<figure><figcaption>수축기 혈압 · <b>시작과 4주마다 측정</b></figcaption>${bpChart(bpPts)}</figure>`;
    body += '<div class="foot">진단이 아닌 참고 정보입니다. 정확한 판단은 의료진과 상담하세요.</div>';
  }
  document.getElementById('screen').innerHTML = body;
}
render();
// 진행 중인 4주가 없을 때, 이미 끝낸 4주가 몇 번인지 알아서 안내 문구를 맞춘다(실패하면 처음 문구 그대로)
if (state === 'ready') apiListCycles().then(l => { doneCycles = (l || []).filter(c => c.status === 'completed' || c.status === 'incomplete').length; if (doneCycles) render(); }).catch(() => {});
if (state === 'active') apiCall('GET', '/home/summary', undefined, '').then(r => { summary = r.data; render(); }).catch(() => {});
</script>
</body>
</html>
