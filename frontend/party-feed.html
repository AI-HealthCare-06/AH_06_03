<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 파티 피드</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .tabs{display:flex; border-bottom:1px solid var(--line); margin:0 -20px; padding:0 20px}
  .tabs a,.tabs button,.tabs span{flex:1; height:46px; border:0; border-bottom:3px solid transparent; margin-bottom:-1px; background:none; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--muted); text-decoration:none}
  .tabs .on{color:var(--ink); font-weight:800; border-bottom-color:var(--ink)}
  .cats{display:flex; gap:8px; overflow-x:auto; padding:14px 0 6px; margin:0 -20px; padding-left:20px; padding-right:20px; scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cats .chip{flex:none}
  .rule{background:var(--cream); border-radius:12px; padding:12px 16px; font-size:13px; color:var(--body); line-height:1.6}
  .search{display:flex; gap:8px}
  .search input{flex:1; height:44px; border:0; border-radius:12px; background:var(--cream); padding:0 14px; font:inherit; font-size:15px}
  .post{display:flex; flex-direction:column; gap:10px; padding:18px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit}
  .post .top{display:flex; align-items:center; gap:12px}
  .post .av{width:52px; height:52px; border-radius:16px; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; font-weight:800; color:var(--muted)}
  .post .meta{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
  .post .cat{height:22px; padding:0 8px; border-radius:11px; border:1px solid #D2C4B4; color:#3B5063; display:inline-flex; align-items:center}
  .post .ttl{font-size:16px; font-weight:800; line-height:1.4; word-break:break-all}
  .post .pv{font-size:14px; color:var(--body); line-height:1.6; word-break:break-all}
  .post .cnt{display:flex; gap:16px; font-size:13px; color:var(--body)}
  .attach{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:12px; padding:8px 12px; align-self:flex-start; font-size:13px; max-width:100%}
  .attach .lb{font-weight:700}
  .attach .dy{color:var(--muted); font-size:12px}
  .fab{position:fixed; bottom:100px; right:max(20px, calc(50% - 195px)); height:52px; padding:0 22px; border-radius:26px; background:var(--accent-light); color:#1E3246; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; text-decoration:none; z-index:55; border:0}
  .more{display:flex; justify-content:center; padding:14px 0}
  .feed-head{display:flex; align-items:center; justify-content:space-between; min-height:64px}
  .feed-head h1{font-size:20px}
  .icon-btn{width:44px; height:44px; border:0; background:none; display:flex; align-items:center; justify-content:center; color:var(--ink)}
  .sub{display:flex; gap:8px; padding-top:4px}
  .sub a,.sub span{height:40px; padding:0 18px; border-radius:20px; display:inline-flex; align-items:center; font-size:14px; text-decoration:none; box-sizing:border-box; border:1px solid var(--sage); color:var(--ink)}
  .sub .on{background:var(--accent-light); border-color:var(--accent-light); color:#1E3246; font-weight:700}
  .pill{height:28px; padding:0 12px; border-radius:14px; background:var(--notice); color:#234257; font-size:13px; font-weight:800; display:inline-flex; align-items:center}
</style>
</head>
<body>
<div id="header-slot"></div>
<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" id="screen" style="gap:0">
        <div class="feed-head"><h1>커뮤니티</h1><a class="icon-btn" id="me-char" href="character.html" aria-label="내 캐릭터"></a></div>
        <div class="tabs" role="tablist">
          <a href="feed.html" role="tab">피드</a>
          <a href="common-challenges.html" role="tab">챌린지</a>
          <span class="on" role="tab" aria-selected="true">파티</span>
        </div>
        <p class="hint" id="loading" style="padding:20px 0">불러오는 중이에요…</p>
        <div id="main" hidden>
          <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 0 14px">
            <div style="display:flex; flex-direction:column; gap:2px; min-width:0"><span id="pname" style="font-size:22px; font-weight:800; letter-spacing:-.5px; word-break:break-all"></span><span style="font-size:13px; color:var(--muted)">파티원에게만 보이는 글이에요</span></div>
            <span class="pill" id="pcount"></span>
          </div>
          <div class="sub"><a href="party-home.html">현황</a><span class="on">파티 피드</span></div>
          <div id="list"></div>
          <div class="more" id="more" hidden><button type="button" class="pill-btn" id="more-btn">더 보기</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
<a class="fab" href="write.html?to=party" id="fab"></a>
<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
if (!loggedIn()) location.replace('login.html');
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const CATS = [['', 'latest', '전체'], ['', 'popular', '인기'], ['diet', 'latest', '식단'], ['exercise', 'latest', '운동'], ['challenge', 'latest', '챌린지 인증'], ['tips', 'latest', '고민과 꿀팁']];
const CAT_LABEL = { diet: '식단', exercise: '운동', challenge: '챌린지 인증', tips: '고민과 꿀팁' };
const KIND = { fixed: ['고정', 'fixed'], selected: ['선택', 'selected'], common: ['공통', 'common'] };
const PAGE = 20;
const st = { cat: 0, q: '', offset: 0, total: 0, items: [], nickname: undefined };

const _avc = {};
const _avView = (n) => _avc[n] || (_avc[n] = apiCall('GET', '/characters/by-nickname/' + encodeURIComponent(n), undefined, '').then(r => r.data));
function hydrateAvatars(root, px) {
  (root || document).querySelectorAll('[data-av]:not([data-done])').forEach(el => {
    el.dataset.done = '1';
    _avView(el.dataset.av).then(v => { el.innerHTML = characterSvg(v, px || 40); }).catch(() => {});
  });
}
function ago(iso) {
  const d = new Date(/Z|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z'), s = (Date.now() - d) / 1000;
  if (s < 60) return '방금 전'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  if (s < 172800) return '어제'; return Math.floor(s / 86400) + '일 전';
}
function attachHtml(a) {
  if (!a) return '';
  const [lb, cls] = KIND[a.kind] || ['', ''];
  return `<div class="attach"><span class="ctag ${cls}">${lb}</span><span class="lb">${esc(a.label)}</span><span class="dy">인증 ${a.days}일째</span></div>`;
}
function postHtml(p) {
  const nick = p.author_nickname || '알 수 없음';
  return `<a class="post" href="post.html?id=${encodeURIComponent(p.post_id)}&from=party">
    <div class="top"><span class="av" aria-hidden="true"${p.author_nickname ? ` data-av="${esc(nick)}"` : ''}>${esc(nick.slice(0, 1))}</span>
      <div><div class="meta"><span>${esc(nick)} · ${ago(p.created_at)}</span></div>
      <div class="ttl">${esc(p.title)}</div></div></div>
    ${p.hidden ? `<div class="pv" style="color:var(--muted)">${esc(p.notice || '')}</div>` : `<div class="pv">${esc(p.preview)}</div>`}
    ${attachHtml(p.attach)}
    <div class="cnt"><span>좋아요 ${p.like_count}</span><span>댓글 ${p.comment_count}</span></div></a>`;
}
function renderList() {
  const el = document.getElementById('list');
  el.innerHTML = st.items.length ? st.items.map(postHtml).join('') : '<div class="empty">아직 글이 없어요.<br>파티원에게 첫 글을 남겨 보세요.</div>';
  document.getElementById('more').hidden = st.items.length >= st.total;
  hydrateAvatars(el, 40);
}
async function load(append) {
  const d = (await apiCall('GET', `/parties/me/posts?limit=${PAGE}&offset=${append ? st.offset : 0}`, undefined, '글을 불러오지 못했어요')).data;
  st.total = d.total; st.items = append ? st.items.concat(d.items) : d.items; st.offset = st.items.length; renderList();
}
document.getElementById('fab').innerHTML = ICON.plus + '파티 글쓰기';
document.getElementById('more-btn').addEventListener('click', () => load(true).catch(() => {}));
apiCall('GET', '/characters/me', undefined, '').then(r => { document.getElementById('me-char').innerHTML = characterSvg(r.data, 36); }).catch(() => {});
(async () => {
  try {
    const home = (await apiCall('GET', '/parties/me', undefined, '파티를 불러오지 못했어요')).data;
    document.getElementById('pname').textContent = home.party.name;
    document.getElementById('pcount').textContent = home.party.member_count + ' / ' + home.party.max_members + '명';
    await load(false);
    document.getElementById('loading').hidden = true; document.getElementById('main').hidden = false;
  } catch (e) {
    if (e.code === 'PARTY_NOT_JOINED') { location.replace('party-start.html'); return; }
    document.getElementById('loading').textContent = friendlyError(e);
  }
})();
</script>
</body>
</html>
