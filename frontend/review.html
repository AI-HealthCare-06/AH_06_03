<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 입력 검토</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .head h1{margin:0; font-size:28px; font-weight:800; letter-spacing:-.7px; line-height:1.3}
  .head p{margin:10px 0 0; font-size:14px; color:var(--body); line-height:1.6}
  .sec .sh{display:flex; align-items:baseline; justify-content:space-between; padding-bottom:8px}
  .sec .sh b{font-size:18px; font-weight:800}
  .sec .sh a{min-height:44px; display:flex; align-items:center; font-size:14px; font-weight:700; color:#5C86AC; text-decoration:none}
  .sec .r{display:flex; justify-content:space-between; align-items:center; gap:16px; min-height:52px; border-top:1px solid var(--line); font-size:15px}
  .sec .r:last-of-type{border-bottom:1px solid var(--line)}
  .sec .r span:first-child{color:var(--body)}
  .sec .r span:last-child{font-weight:700; text-align:right}
  .cream{background:var(--cream); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:4px}
  .cream .t{display:flex; justify-content:space-between; align-items:baseline}
  .cream .t span:first-child{font-size:14px; color:var(--body)}
  .cream .t span:last-child{font-size:15px; font-weight:700}
  .cream p{margin:0; font-size:13px; color:var(--body); line-height:1.6}
  .bar{position:sticky; bottom:84px; background:#fff; border-top:1px solid var(--line); padding:12px 0; display:flex; flex-direction:column; gap:8px; z-index:5; margin-top:auto}
  .bar .cta{height:56px; font-size:17px; border-radius:28px}
  .bar span{text-align:center; font-size:12px; color:var(--muted)}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen">
        <div class="page-bar"><a class="back" href="survey.html" aria-label="뒤로"><span data-icon="back"></span></a></div>
        <div class="head"><h1>입력한 내용을<br>확인해 주세요</h1><p class="confirm-headline" style="font-size:14px; font-weight:400; color:var(--body); margin:10px 0 0">틀린 곳이 있으면 눌러서 고칠 수 있어요.</p></div>
        <p class="lede" style="display:none"></p>
        <div id="status-callout" class="callout"></div>
        <div id="kpis" style="display:flex; flex-direction:column; gap:22px"></div>

        <p id="form-err" class="err" style="display:none"></p>
        <div class="bar"><button type="button" id="submit-btn" class="cta">분석하기</button><span>진단이 아닌 참고 정보입니다.</span></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const profile = JSON.parse(localStorage.getItem('paeon-profile') || 'null');
const elig = JSON.parse(localStorage.getItem('paeon-eligibility') || 'null');
const health = JSON.parse(localStorage.getItem('paeon-health') || 'null');
const survey = JSON.parse(localStorage.getItem('paeon-survey') || 'null');

if (!profile || !elig || !health || !survey) {
  // 빠진 단계가 있으면 막다른 길처럼 보이지 않게 진행 상황과 다음 단계 버튼을 보여 준다
  const sp = setupProgress();
  const go = !profile ? { label: '로그인하러 가기', href: 'login.html' } : sp.next && sp.next.href !== 'review.html' ? { label: `${sp.next.label}부터 이어서 하기`, href: sp.next.href } : null;
  document.querySelector('.confirm-headline').style.display = 'none';
  document.querySelector('.lede').style.display = 'none';
  const box = document.getElementById('status-callout');
  box.className = '';
  box.innerHTML = `<p class="sect" style="margin-top:0">아직 마치지 않은 단계가 있어요</p>
    <p class="hint" style="margin:0 0 10px">네 단계를 마치면 분석할 수 있어요.</p>
    ${sp.html}
    ${go ? `<a class="cta" style="display:block; text-align:center; text-decoration:none; margin-top:14px" href="${go.href}">${go.label}</a>` : ''}`;
  document.getElementById('submit-btn').style.display = 'none';
} else {
  const skipA = elig.ageBand !== 'in' || elig.chd;
  const skipB = elig.ageBand === 'under19' || health.htn_status !== 'none';
  document.getElementById('status-callout').innerHTML = (skipA && skipB)
    ? '<b>두 모델 모두 분석 대상이 아닙니다</b><br>분석은 건너뛰고 바로 챌린지로 안내합니다.'
    : '<b>위험 신호 분석 가능</b>';

  const L = {
    sex: { male: '남성', female: '여성' },
    smoking: { never: '비흡연', former: '과거 흡연', current: '흡연' },
    drink: { never_lifetime: '안 마심', none_past_year: '안 마심', lt_monthly: '월 1회 미만', monthly: '월 1회', '2_4_per_month': '월 2–4회', '2_3_per_week': '주 2–3회', '4plus_per_week': '주 4회 이상' },
    parent: { yes: '있음', no: '없음', unknown: '모름' },
    ex: { none: '거의 안 함', lt60: '1시간 미만', '60_149': '1시간 이상 ~ 2시간 30분 미만', '150plus': '2시간 30분 이상' },
    eat: { rare: '거의 안 함', '1_2_week': '주 1–2회', '3_4_week': '주 3–4회', '5_6_week': '주 5–6회', '1_day': '하루 1회', '2plus_day': '하루 2회 이상' },
    bf: { '5_7': '주 5–7회', '3_4': '주 3–4회', '1_2': '주 1–2회', '0': '거의 안 함' },
    na: { careful_low: '주의 (약간 적음)', very_moderate: '매우 적정', moderate: '적정', careful_high: '주의 (많음)', severe: '심각' },
  };
  const age = profile.birth ? Math.floor((Date.now() - new Date(profile.birth)) / 31557600000) : null;
  const r = (k, v) => `<div class="r"><span>${k}</span><span>${v}</span></div>`;
  const a = survey.answers || {}, sd = survey.sodium;
  const steps = survey.baseline_steps != null ? survey.baseline_steps : a.P2;
  const surveyRows = [
    a.P1 ? r('운동', L.ex[a.P1] || a.P1) : '',
    steps != null ? r('하루 평균 걸음 수', `${Number(steps).toLocaleString()}걸음`) : '',
    sd && sd.status === 'ok' ? r('짠 음식', L.na[sd.grade] || '') : '',
    a.E1 ? r('외식·배달', L.eat[a.E1] || a.E1) : '',
    a.B1 ? r('아침 식사', L.bf[a.B1] || a.B1) : '',
  ].join('');
  document.getElementById('kpis').innerHTML = `
    <div class="sec"><div class="sh"><b>건강정보</b><a href="health-info.html">수정</a></div>
      ${r('성별 · 나이대', `${L.sex[health.sex] || ''}${age != null ? ` · ${Math.floor(age / 10) * 10}대` : ''}`)}
      ${r('키 · 몸무게', `${health.height_cm}cm · ${health.weight_kg}kg`)}
      ${r('허리둘레', `${health.waist_cm}cm`)}
      ${r('혈압', `${health.sbp} / ${health.dbp} mmHg`)}
      ${r('흡연 · 음주', `${L.smoking[health.smoking] || ''} · ${L.drink[health.drink_freq] || ''}`)}
      ${r('당뇨 · 고혈압 진단', `${health.diabetes ? '있음' : '없음'} · ${health.htn_status === 'none' ? '없음' : '있음'}`)}
      ${r('부모 고혈압', L.parent[health.parent_htn] || '')}
    </div>
    ${health.total_chol == null ? `<div class="cream"><div class="t"><span>총콜레스테롤</span><span>입력 안 함</span></div><p>비워 두면 중앙값(234)으로 계산해요. 내 실제 수치는 아니에요.</p></div>`
      : `<div class="cream"><div class="t"><span>총콜레스테롤</span><span>${health.total_chol} mg/dL</span></div></div>`}
    <div class="sec"><div class="sh"><b>생활습관 설문</b><a href="survey.html">수정</a></div>${surveyRows}</div>`;
}

// 실제 분석 요청이 끝날 때까지 바가 차오르고(최대 92%), 끝나면 100%로 채운 뒤 계획 화면으로 간다
function buildingOverlay() {
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed; inset:0; z-index:300; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center';
  box.innerHTML = '<b style="font-size:22px; font-weight:800; line-height:1.4">내 12주 계획을<br>만드는 중이에요</b><p style="margin:0; font-size:14px; color:var(--body); line-height:1.6">답해 주신 내용으로 분석하고<br>4주 일정을 맞추고 있어요</p><div style="width:min(280px,80%); height:10px; border-radius:5px; background:var(--line); overflow:hidden; margin-top:10px"><i id="build-bar" style="display:block; height:100%; width:0; border-radius:5px; background:var(--accent); transition:width .35s"></i></div><span id="build-pct" style="font-size:13px; font-weight:700; color:var(--muted)">0%</span>';
  document.body.appendChild(box);
  let v = 0;
  const set = (n) => { v = n; box.querySelector('#build-bar').style.width = n + '%'; box.querySelector('#build-pct').textContent = Math.round(n) + '%'; };
  const timer = setInterval(() => set(Math.min(92, v + (92 - v) * 0.08 + 0.4)), 300);
  return { finish: () => { clearInterval(timer); set(100); return new Promise((r) => setTimeout(r, 500)); }, cancel: () => { clearInterval(timer); box.remove(); } };
}

document.getElementById('submit-btn').addEventListener('click', async () => {
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('form-err');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '분석하는 중...';
  const building = buildingOverlay();
  try {
    const result = await apiRequestPrediction(profile, elig, health, survey);
    localStorage.setItem('paeon-prediction', JSON.stringify(result.data));
    await building.finish();
    window.location.href = 'plan.html';   // 분석이 끝나면 12주 계획을 먼저 보여 준다
  } catch (e) {
    building.cancel();
    errEl.textContent = friendlyError(e);
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '분석하기';
  }
});
</script>
</body>
</html>
