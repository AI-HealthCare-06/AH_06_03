<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 챌린지 인증</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .countbar{font-size:12.5px; color:var(--muted)}

  .cal-card{background:#fff; border:1px solid var(--sage-light); border-radius:20px; padding:16px 18px}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px}
  .cal-head .ym{font-family:'Gowun Dodum','Noto Sans KR',sans-serif; font-size:15px; font-weight:700}
  .cal-head .nav{display:flex; gap:4px}
  .cal-head .nav button{width:26px; height:26px; border-radius:999px; border:1px solid var(--sage-light); background:#fff; color:var(--muted); font-size:12px}
  .cal-head .nav button:disabled{opacity:.35}
  .dow-row{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--muted); font-weight:700; margin-bottom:4px}
  .dow-row span:first-child{color:var(--danger)}
  .day-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px 0}
  .day{position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:12.5px; color:var(--ink)}
  .day.blank{visibility:hidden}
  .day .num{position:relative; z-index:1}
  .day.clickable{cursor:pointer}
  .day.today .num{color:#fff; font-weight:900}
  .day.today::before{content:''; position:absolute; width:26px; height:26px; border-radius:999px; background:var(--petal2)}
  .day.picked:not(.today)::before{content:''; position:absolute; width:26px; height:26px; border-radius:999px; border:2px solid var(--sage-deep)}
  .day .dots{position:absolute; bottom:4px; left:50%; transform:translateX(-50%); display:flex; gap:3px}
  .day .dot{width:4px; height:4px; border-radius:999px; background:var(--peach)}
  .day .dot-bp{width:4px; height:4px; border-radius:999px; background:var(--sage-deep)}
  .day.sun .num{color:var(--danger)}
  .cal-legend{display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--muted); flex-wrap:wrap}
  .cal-legend span{display:inline-flex; align-items:center; gap:5px}
  .dot-sample{width:5px; height:5px; border-radius:999px; background:var(--peach); display:inline-block}
  .dot-bp-sample{width:5px; height:5px; border-radius:999px; background:var(--sage-deep); display:inline-block}
  .ring-sample{width:12px; height:12px; border-radius:999px; background:var(--petal2); display:inline-block}

  .today-card{background:var(--cream); border:1px solid var(--sage-light); border-radius:20px; padding:16px 18px; display:flex; flex-direction:column; gap:10px}
  .today-card .tt{font-size:12px; color:var(--muted); font-weight:700}
  .today-card .dd{font-family:'Gowun Dodum','Noto Sans KR',sans-serif; font-size:20px; font-weight:700}
  .mission{display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--sage-light); border-radius:14px; padding:9px 12px; font-size:12.5px; font-weight:600}
  .mission.clickable{cursor:pointer}
  .mission .mark{width:18px; height:18px; border-radius:999px; border:2px solid var(--sage); flex:none}
  .mission.done .mark{background:var(--petal2); border-color:var(--petal2)}
  .mission.done{color:var(--muted); text-decoration:line-through}

  .bplog{display:flex; flex-direction:column}
  .bplog-row{display:flex; align-items:center; gap:10px; padding:10px 0 10px 16px; border-left:2px solid var(--sage-light); margin-left:5px; position:relative}
  .bplog-row:last-child{border-left-color:transparent}
  .bplog-row .bp-dot{position:absolute; left:-6px; top:50%; transform:translateY(-50%); width:10px; height:10px; border-radius:999px; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--sage-light)}
  .bplog-row .bp-date{font-size:11.5px; color:var(--muted); width:72px; flex:none}
  .bplog-row .bp-val{font-size:15.5px; font-weight:800; flex:1}
  .bplog-row .bp-val .unit{font-weight:500; color:var(--muted); font-size:12px}
  .bp-badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; flex:none; white-space:nowrap}
  .bp-badge.ok{background:var(--ok-soft); color:var(--ok)}
  .bp-badge.high{background:var(--risk-soft); color:var(--risk)}
  .inline{display:flex; gap:8px; align-items:flex-end}
  .inline .field{flex:1}
  .inline button{width:auto; padding:10px 20px}

  .mrow{background:#fff; border:1.5px solid var(--sage-light); border-radius:14px; padding:9px 12px}
  .mhead{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600}
  .mhead.clickable{cursor:pointer}
  .mhead .mark{width:18px; height:18px; border-radius:999px; border:2px solid var(--sage); flex:none}
  .mrow[data-s="completed"] .mark{background:var(--petal2); border-color:var(--petal2)}
  .mrow[data-s="failed"] .mark{border-color:var(--peach); background:var(--peach)}
  .mrow[data-s="skipped"] .mark{border-style:dashed}
  .mhead .mt{flex:1}
  .mstat{font-size:11px; font-weight:700; color:var(--muted); white-space:nowrap}
  .mq{margin-top:8px; display:flex; flex-direction:column; gap:7px}
  .mq .qt{font-size:12.5px; font-weight:700}
  .mopts{display:flex; flex-wrap:wrap; gap:6px}
  .mopt{border:1.5px solid var(--sage-light); background:#fff; border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600; color:var(--ink)}
  .mopt[data-on="1"]{border-color:var(--sage-deep); background:var(--sage-light)}
  .mask{display:flex; gap:6px; align-items:center; font-size:12px}
  .mask input{width:110px; font:inherit; padding:7px 10px; border-radius:10px; border:1.5px solid var(--sage-light)}
  .mask button{width:auto; padding:7px 14px}
  .mwarn{font-size:11.5px; color:var(--warn)}
  .mweek{margin-top:6px; font-size:11px; color:var(--muted)}
  .mbar{height:6px; background:var(--track); border-radius:999px; overflow:hidden; margin-top:3px}
  .mbar i{display:block; height:100%; background:var(--petal2); border-radius:999px}
  .cups{border-collapse:collapse; margin-top:4px; font-size:11px; color:var(--muted)}
  .cups th,.cups td{border:1px solid var(--sage-light); padding:3px 7px; text-align:left}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen">
        <p class="lede">오늘 한 일을 미션별로 기록하세요. 목표는 하루가 아니라 주 단위 횟수이고, 알림은 하루에 한 번 이하예요.</p>
        <div class="countbar"><span id="cyc-label">1차</span> · 모든 미션을 마친 날 <b id="count-label">0 / 28</b>일</div>
        <div id="week-strip"></div>
        <div id="day-detail"></div>
        <div style="display:flex; gap:8px">
          <button type="button" id="fill-all" class="ghost">전부 인증 (데모)</button>
          <button type="button" id="fill-bp" class="ghost">혈압 4주치 기록 (데모)</button>
          <button type="button" id="reset" class="ghost">초기화</button>
        </div>
        <div id="bp-section"></div>
        <div class="bplog" id="bp-log"></div>
        <a class="cta" style="display:block; text-align:center; text-decoration:none" href="dashboard.html">대시보드 보기</a>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
// 가이드(modeling/handoff/생활습관_입력_가이드.md) §5 매일 기록 (W10).
// 기록은 서버(챌린지 API)가 준비되면 서버에 저장한다. 그 전까지 같은 필드(status·quantity·limit_exceeded)로 브라우저에 둔다.
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const TOTAL_DAYS = 28;                  // 사이클 길이 (12주 = 4주 x 3 구조가 정해지면 사이클 번호와 함께 바꾼다)
function localIso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const read = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };

const cycle = read('paeon-cycle');
const health = read('paeon-health') || {};
const survey = read('paeon-survey') || {};
const progress = read('paeon-progress') || { days: [], bpLog: [] };
if (!progress.logs) progress.logs = {};          // { 날짜번호: { 미션코드: { status, quantity, limit_exceeded } } }
if (!progress.missionLog) progress.missionLog = {};
if (!progress.days) progress.days = [];
if (!progress.bpLog) progress.bpLog = [];

const startedOn = new Date((cycle ? cycle.startedOn : localIso(new Date())) + 'T00:00:00');
const today = new Date(); today.setHours(0, 0, 0, 0);
const todayIdx = Math.round((today - startedOn) / 86400000);
const clampedToday = Math.min(TOTAL_DAYS - 1, Math.max(0, todayIdx));
const dateForIdx = (i) => new Date(startedOn.getTime() + i * 86400000);
const missions = cycle ? cycle.missions : [];
const cycleNo = cycle ? (cycle.cycleNo || 1) : 1;

let selectedIdx = clampedToday;
let weekOffset = Math.floor(clampedToday / 7);
let openMission = null;                         // 오늘 화면에서 질문이 펼쳐진 미션

// ---- §5.2 미션별 질문과 선택지 → 저장값
const male = health.sex !== 'female';
const stepsTarget = survey.baseline_steps != null ? survey.baseline_steps + 2000 : null;
const CUPS = '<table class="cups"><tr><th>술</th><th>1잔</th><th>병·캔으로 셀 때</th></tr><tr><td>소주</td><td>소주잔 1잔</td><td>1병(360ml) = 7잔</td></tr><tr><td>맥주</td><td>맥주잔 1잔</td><td>캔 355ml = 1.5잔 · 500ml = 2잔</td></tr><tr><td>와인</td><td>와인잔 1잔</td><td>1병(750ml) = 5잔</td></tr><tr><td>막걸리</td><td>막걸리 사발 1잔</td><td>1병(750ml) = 3잔</td></tr><tr><td>양주</td><td>양주잔 1잔</td><td></td></tr><tr><td>소맥</td><td colspan="2">맥주잔 1잔 = 1잔</td></tr></table>';
const RECORD = {
  'SMK-1': { q: '오늘 일반담배나 전자담배를 피우셨나요?', opts: [
    { label: '아니오', status: 'completed' },
    { label: '예', status: 'failed', ask: { text: '몇 개비 피우셨나요? (선택)', optional: true, min: 0, max: 200 } }] },
  'ALC-1': { q: '오늘 술을 드셨나요?', extra: CUPS, opts: male ? [
    { label: '안 마심', status: 'completed', quantity: 0 }, { label: '1잔', status: 'completed', quantity: 1 }, { label: '2잔', status: 'completed', quantity: 2 },
    { label: '3잔 이상', status: 'failed', quantity: 3, limit: true }] : [
    { label: '안 마심', status: 'completed', quantity: 0 }, { label: '1잔', status: 'completed', quantity: 1 },
    { label: '2잔 이상', status: 'failed', quantity: 2, limit: true }] },
  'NA-1': { q: '오늘 국·찌개·탕·라면의 국물을 남기셨나요?', opts: [
    { label: '남겼어요', status: 'completed' }, { label: '국물 요리를 먹지 않았어요', status: 'completed' }, { label: '다 먹었어요', status: 'failed' }] },
  'NA-2': { q: '오늘 음식에 소금이나 간장을 더 넣지 않으셨나요?', opts: [
    { label: '넣지 않았어요', status: 'completed' }, { label: '넣었어요', status: 'failed' }] },
  'ACT-1': { q: '오늘 걸음 수를 입력해 주세요', hint: stepsTarget ? `목표 ${stepsTarget.toLocaleString()}보 · 휴대폰 건강 앱에 나온 숫자를 입력해요` : '휴대폰 건강 앱에 나온 숫자를 입력해요',
    steps: true },
  'ACT-2': { q: '오늘 숨이 조금 찰 정도로 빠르게 걸은 시간은?', opts: [
    { label: '안 걸었어요', status: 'failed', quantity: 0 }, { label: '30분 미만', status: 'failed', quantity: 15 }, { label: '30분 이상', status: 'completed', quantity: 30 }] },
  'ACT-3': { q: '오늘 벽 스쿼트를 하셨나요?', opts: [
    { label: '4번 모두 했어요', status: 'completed', quantity: 4 },
    { label: '일부만 했어요', status: 'failed', ask: { text: '몇 번 하셨나요? (1–3)', min: 1, max: 3 } },
    { label: '안 했어요', status: 'failed', quantity: 0 }] },
  'OUT-1': { q: '오늘 외식·배달 때 "싱겁게" 요청하셨나요?', opts: [
    { label: '요청했어요', status: 'completed' }, { label: '외식·배달을 하지 않았어요', status: 'skipped' }, { label: '요청하지 않았어요', status: 'failed' }] },
  'BRK-1': { q: '오늘 아침 식사를 하셨나요?', opts: [{ label: '했어요', status: 'completed' }, { label: '안 했어요', status: 'failed' }] },
  'WT-1': { q: '오늘 끼니마다 밥을 2/3공기 이하로 드셨나요?', opts: [{ label: '네', status: 'completed' }, { label: '아니요', status: 'failed' }] },
};
const GENERIC = { q: '오늘 했나요?', opts: [{ label: '했어요', status: 'completed' }, { label: '못 했어요', status: 'failed' }] };   // 예전 데이터의 미션 코드용
const STATUS_LABEL = { completed: '완료', failed: '오늘은 못 했어요', skipped: '해당 없음' };   // 질책하는 문구를 쓰지 않는다 (REQ-CHAL-007)

function save() {
  // 다른 화면(대시보드·캘린더·추이)이 읽는 요약값을 같이 갱신한다: 오늘 완료한 미션 목록, 모든 미션을 마친 날
  progress.missionLog = {}; progress.days = [];
  Object.entries(progress.logs).forEach(([idx, day]) => {
    const done = Object.keys(day).filter(id => day[id].status === 'completed');
    progress.missionLog[idx] = done;
    const all = missions.length > 0 && missions.every(m => day[m.id] && ['completed', 'skipped'].includes(day[m.id].status));
    if (all && done.length) progress.days.push(Number(idx));
  });
  localStorage.setItem('paeon-progress', JSON.stringify(progress));
}
const logOf = (idx, id) => (progress.logs[idx] || {})[id] || null;
function setLog(idx, id, rec) {
  if (!progress.logs[idx]) progress.logs[idx] = {};
  if (rec) progress.logs[idx][id] = rec; else delete progress.logs[idx][id];
  save();
}
function weekCount(id, wStart) {
  let n = 0;
  for (let i = wStart; i < Math.min(TOTAL_DAYS, wStart + 7); i++) { const l = logOf(i, id); if (l && l.status === 'completed') n++; }
  return n;
}

function weekStripHtml() {
  const wStart = weekOffset * 7;
  const d0 = dateForIdx(wStart), d1 = dateForIdx(Math.min(TOTAL_DAYS - 1, wStart + 6));
  let cells = '';
  for (let i = wStart; i < wStart + 7; i++) {
    if (i > TOTAL_DAYS - 1) { cells += `<div class="day blank"></div>`; continue; }
    const dt = dateForIdx(i);
    const cls = ['day', 'clickable'];
    if (i === clampedToday) cls.push('today');
    if (i === selectedIdx) cls.push('picked');
    if (dt.getDay() === 0) cls.push('sun');
    const hasChal = progress.days.includes(i);
    const hasBp = progress.bpLog.some(l => l.date === localIso(dt));
    const dots = (hasChal || hasBp) ? `<span class="dots">${hasChal ? '<span class="dot"></span>' : ''}${hasBp ? '<span class="dot-bp"></span>' : ''}</span>` : '';
    cells += `<div class="${cls.join(' ')}" data-idx="${i}"><span class="num">${dt.getDate()}</span>${dots}</div>`;
  }
  return `<div class="cal-card">
    <div class="cal-head">
      <div class="ym">${cycleNo}차 ${weekOffset + 1}주차 · ${d0.getMonth() + 1}/${d0.getDate()} ~ ${d1.getMonth() + 1}/${d1.getDate()}</div>
      <div class="nav"><button type="button" id="wk-prev" ${weekOffset === 0 ? 'disabled' : ''}>‹</button><button type="button" id="wk-next" ${weekOffset === Math.ceil(TOTAL_DAYS / 7) - 1 ? 'disabled' : ''}>›</button></div>
    </div>
    <div class="dow-row"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="day-grid">${cells}</div>
    <div class="cal-legend"><span><i class="ring-sample"></i>오늘</span><span><i class="dot-sample"></i>모든 미션 완료</span><span><i class="dot-bp-sample"></i>혈압 기록</span></div>
  </div>`;
}

function missionHtml(m) {
  const isToday = selectedIdx === clampedToday;
  const rec = logOf(selectedIdx, m.id);
  const def = RECORD[m.id] || GENERIC;
  const wStart = weekOffset * 7, target = m.weekly || 5, cnt = weekCount(m.id, wStart);
  const pct = Math.min(100, Math.round(cnt / target * 100));
  let q = '';
  if (isToday && openMission === m.id) {
    let body;
    if (def.steps) {
      body = `<div class="mask"><input type="number" id="ask-in" min="0" max="100000" placeholder="걸음 수" value="${rec && rec.quantity != null ? rec.quantity : ''}"><span>걸음</span><button type="button" class="ghost" data-save-steps="${m.id}">기록</button></div>`;
    } else {
      body = `<div class="mopts">${def.opts.map((o, i) => `<button type="button" class="mopt" data-opt="${i}" data-m="${m.id}" data-on="${rec && rec.optIndex === i ? 1 : 0}">${o.label}</button>`).join('')}</div>`;
    }
    const ask = (!def.steps && rec && def.opts[rec.optIndex] && def.opts[rec.optIndex].ask)
      ? `<div class="mask"><span>${def.opts[rec.optIndex].ask.text}</span><input type="number" id="ask-in" min="${def.opts[rec.optIndex].ask.min}" max="${def.opts[rec.optIndex].ask.max}" value="${rec.quantity != null ? rec.quantity : ''}"><button type="button" class="ghost" data-save-ask="${m.id}">저장</button></div>` : '';
    q = `<div class="mq"><div class="qt">${def.q}</div>${def.hint ? `<div class="qh">${def.hint}</div>` : ''}${body}${ask}${def.extra || ''}</div>`;
  }
  const warn = rec && rec.limit_exceeded ? '<div class="mwarn">오늘은 권장량을 넘었어요. 건강을 위해서는 술을 마시지 않는 것이 가장 좋아요.</div>' : '';
  const stat = rec ? STATUS_LABEL[rec.status] + (rec.quantity != null && rec.status !== 'skipped' && m.id !== 'SMK-1' && !['NA-1', 'NA-2'].includes(m.id) ? ` · ${rec.quantity}` : '') : (isToday ? '탭해서 기록' : (selectedIdx < clampedToday ? '기록 없음' : ''));
  return `<div class="mrow" data-s="${rec ? rec.status : ''}">
    <div class="mhead${isToday ? ' clickable' : ''}" data-toggle="${m.id}"><span class="mark"></span><span class="mt">${m.t}</span><span class="mstat">${stat}</span></div>
    ${q}${warn}
    <div class="mweek">${weekOffset + 1}주차 ${cnt} / ${target}회 · ${pct}%<div class="mbar"><i style="width:${pct}%"></i></div></div>
  </div>`;
}

function dayDetailHtml() {
  const dt = dateForIdx(selectedIdx);
  const label = `${dt.getMonth() + 1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]})`;
  const isToday = selectedIdx === clampedToday;
  let action;
  if (isToday) action = '<p class="hint">미션을 눌러 오늘 한 일을 기록하세요. 오늘 안에는 언제든 고칠 수 있어요.</p>';
  else if (selectedIdx < clampedToday) action = '<p class="hint">지난 날짜는 그날의 기록만 볼 수 있어요</p>';
  else action = '<p class="hint">아직 오지 않은 날짜예요</p>';
  return `<div class="today-card">
    <div><div class="tt">선택한 날</div><div class="dd">${label}</div></div>
    ${missions.map(missionHtml).join('') || '<p class="hint">아직 시작한 챌린지가 없어요. <a href="challenges.html" style="color:var(--sage-deep); font-weight:700">챌린지 고르기</a></p>'}
    ${action}
  </div>`;
}

function bpSectionHtml() {
  if (survey.bp_measure_method === 'difficult') {
    return '<p class="sect">혈압 기록</p><div class="callout">혈압을 주 1회 재기 어렵다고 답하셔서 기록 칸을 숨겼어요. 약국이나 보건소에서 잴 수 있게 되면 설문에서 바꿔 주세요.</div>';
  }
  const wStart = Math.floor(clampedToday / 7) * 7;
  const weekDates = new Set();
  for (let i = wStart; i < wStart + 7 && i < TOTAL_DAYS; i++) weekDates.add(localIso(dateForIdx(i)));
  const loggedThisWeek = progress.bpLog.find(l => weekDates.has(l.date));
  const body = loggedThisWeek
    ? `<div class="callout"><b>이번 주 혈압을 기록했어요</b> — ${loggedThisWeek.sys}/${loggedThisWeek.dia} mmHg<br>다음 주에 다시 입력 칸이 나타나요</div>`
    : `<div class="inline">
        <div class="field"><label>수축기</label><input id="bp-sys" type="number" value="140"></div>
        <div class="field"><label>이완기</label><input id="bp-dia" type="number" value="88"></div>
        <button type="button" id="log-bp" class="ghost">기록</button>
      </div>`;
  return `<p class="sect">혈압 기록 <span class="muted">— 주 1회, 입력할 때까지 계속 떠있어요</span></p>${body}`;
}

function renderBpLog() {
  document.getElementById('bp-log').innerHTML = progress.bpLog.map(l => {
    const high = l.sys >= 140;
    return `<div class="bplog-row">
      <span class="bp-dot" style="background:${high ? 'var(--risk)' : 'var(--ok)'}"></span>
      <span class="bp-date">${l.date || l.w + '주차'}</span>
      <span class="bp-val">${l.sys}/${l.dia} <span class="unit">mmHg</span></span>
      <span class="bp-badge ${high ? 'high' : 'ok'}">${high ? '140/90 기준 이상' : '140/90 기준 미만'}</span>
    </div>`;
  }).join('');
}

function commit(m, optIndex, qty) {
  const def = RECORD[m] || GENERIC, o = def.opts[optIndex];
  const rec = { status: o.status, optIndex };
  if (qty != null) rec.quantity = qty; else if (o.quantity != null) rec.quantity = o.quantity;
  if (o.limit) rec.limit_exceeded = true;
  setLog(clampedToday, m, rec);
}

function wireEvents() {
  document.querySelectorAll('.day[data-idx]').forEach(el => el.addEventListener('click', () => { selectedIdx = Number(el.dataset.idx); openMission = null; render(); }));
  const prev = document.getElementById('wk-prev');
  if (prev) prev.addEventListener('click', () => { weekOffset = Math.max(0, weekOffset - 1); render(); });
  const next = document.getElementById('wk-next');
  if (next) next.addEventListener('click', () => { weekOffset = Math.min(Math.ceil(TOTAL_DAYS / 7) - 1, weekOffset + 1); render(); });
  document.querySelectorAll('.mhead.clickable[data-toggle]').forEach(el => el.addEventListener('click', () => {
    openMission = openMission === el.dataset.toggle ? null : el.dataset.toggle; render();
  }));
  document.querySelectorAll('.mopt[data-opt]').forEach(el => el.addEventListener('click', () => {
    const m = el.dataset.m, i = Number(el.dataset.opt), o = (RECORD[m] || GENERIC).opts[i];
    if (o.ask) {                                   // 숫자를 더 받아야 하는 선택지: 먼저 상태만 저장하고 입력 칸을 보여 준다
      setLog(clampedToday, m, { status: o.status, optIndex: i }); render();
    } else { commit(m, i); openMission = null; render(); }
  }));
  const askBtn = document.querySelector('[data-save-ask]');
  if (askBtn) askBtn.addEventListener('click', () => {
    const m = askBtn.dataset.saveAsk, rec = logOf(clampedToday, m), o = (RECORD[m] || GENERIC).opts[rec.optIndex];
    const raw = document.getElementById('ask-in').value;
    if (raw === '' && o.ask.optional) { commit(m, rec.optIndex, null); }
    else { const v = Math.max(o.ask.min, Math.min(o.ask.max, Math.round(Number(raw)))); if (isNaN(v)) return; commit(m, rec.optIndex, v); }
    openMission = null; render();
  });
  const stepsBtn = document.querySelector('[data-save-steps]');
  if (stepsBtn) stepsBtn.addEventListener('click', () => {
    const m = stepsBtn.dataset.saveSteps, v = Math.round(Number(document.getElementById('ask-in').value));
    if (isNaN(v) || v < 0) return;
    const ok = stepsTarget != null ? v >= stepsTarget : false;
    setLog(clampedToday, m, { status: ok ? 'completed' : 'failed', quantity: v });
    openMission = null; render();
  });
  const logBp = document.getElementById('log-bp');
  if (logBp) logBp.addEventListener('click', () => {
    progress.bpLog.push({ w: Math.floor(clampedToday / 7) + 1, date: localIso(dateForIdx(clampedToday)), sys: Number(document.getElementById('bp-sys').value), dia: Number(document.getElementById('bp-dia').value) });
    save(); render();
  });
}

function render() {
  document.getElementById('cyc-label').textContent = `12주 중 ${cycleNo}차`;
  document.getElementById('count-label').textContent = `${progress.days.length} / ${TOTAL_DAYS}`;
  document.getElementById('week-strip').innerHTML = weekStripHtml();
  document.getElementById('day-detail').innerHTML = dayDetailHtml();
  document.getElementById('bp-section').innerHTML = bpSectionHtml();
  renderBpLog();
  wireEvents();
}

// ---- 데모 버튼 (배포 직전에 제거)
document.getElementById('fill-all').addEventListener('click', () => {
  for (let i = 0; i < TOTAL_DAYS; i++) missions.forEach(m => { const def = RECORD[m.id] || GENERIC; const k = def.opts ? def.opts.findIndex(o => o.status === 'completed') : -1; progress.logs[i] = progress.logs[i] || {}; progress.logs[i][m.id] = { status: 'completed', optIndex: Math.max(0, k) }; });
  save(); render();
});
document.getElementById('reset').addEventListener('click', () => { progress.logs = {}; save(); render(); });
document.getElementById('fill-bp').addEventListener('click', () => {
  const sys = [145, 142, 140, 138], dia = [92, 90, 88, 86];
  progress.bpLog = sys.map((s, w) => ({ w: w + 1, date: localIso(dateForIdx(w * 7)), sys: s, dia: dia[w] }));
  save(); render();
});

if (Object.keys(progress.logs).length) save();   // 예전 기록(logs 없음)을 덮어쓰지 않는다
render();

</script>
</body>
</html>
