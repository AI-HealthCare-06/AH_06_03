<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 챌린지 인증</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .countbar{font-size:12.5px; color:var(--muted)}

  .cal-card{background:#fff; border:1px solid var(--sage-light); border-radius:20px; padding:16px 18px}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px}
  .cal-head .ym{font-family:'Gowun Dodum','Noto Sans KR',sans-serif; font-size:15px; font-weight:700}
  .cal-head .nav{display:flex; gap:4px}
  .cal-head .nav button{width:26px; height:26px; border-radius:999px; border:1px solid var(--sage-light); background:#fff; color:var(--muted); font-size:12px}
  .cal-head .nav button:disabled{opacity:.35}
  .dow-row{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--muted); font-weight:700; margin-bottom:4px}
  .dow-row span:first-child{color:var(--danger)}
  .day-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px 0}
  .day{position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:12.5px; color:var(--ink)}
  .day.blank{visibility:hidden}
  .day .num{position:relative; z-index:1}
  .day.clickable{cursor:pointer}
  .day.today .num{color:#fff; font-weight:900}
  .day.today::before{content:''; position:absolute; width:26px; height:26px; border-radius:999px; background:var(--petal2)}
  .day.picked:not(.today)::before{content:''; position:absolute; width:26px; height:26px; border-radius:999px; border:2px solid var(--sage-deep)}
  .day .dots{position:absolute; bottom:4px; left:50%; transform:translateX(-50%); display:flex; gap:3px}
  .day .dot{width:4px; height:4px; border-radius:999px; background:var(--peach)}
  .day .dot-bp{width:4px; height:4px; border-radius:999px; background:var(--sage-deep)}
  .day.sun .num{color:var(--danger)}
  .cal-legend{display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--muted); flex-wrap:wrap}
  .cal-legend span{display:inline-flex; align-items:center; gap:5px}
  .dot-sample{width:5px; height:5px; border-radius:999px; background:var(--peach); display:inline-block}
  .dot-bp-sample{width:5px; height:5px; border-radius:999px; background:var(--sage-deep); display:inline-block}
  .ring-sample{width:12px; height:12px; border-radius:999px; background:var(--petal2); display:inline-block}

  .today-card{background:var(--cream); border:1px solid var(--sage-light); border-radius:20px; padding:16px 18px; display:flex; flex-direction:column; gap:10px}
  .today-card .tt{font-size:12px; color:var(--muted); font-weight:700}
  .today-card .dd{font-family:'Gowun Dodum','Noto Sans KR',sans-serif; font-size:20px; font-weight:700}
  .mission{display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--sage-light); border-radius:14px; padding:9px 12px; font-size:12.5px; font-weight:600}
  .mission.clickable{cursor:pointer}
  .mission .mark{width:18px; height:18px; border-radius:999px; border:2px solid var(--sage); flex:none}
  .mission.done .mark{background:var(--petal2); border-color:var(--petal2)}
  .mission.done{color:var(--muted); text-decoration:line-through}

  .bplog{display:flex; flex-direction:column}
  .bplog-row{display:flex; align-items:center; gap:10px; padding:10px 0 10px 16px; border-left:2px solid var(--sage-light); margin-left:5px; position:relative}
  .bplog-row:last-child{border-left-color:transparent}
  .bplog-row .bp-dot{position:absolute; left:-6px; top:50%; transform:translateY(-50%); width:10px; height:10px; border-radius:999px; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--sage-light)}
  .bplog-row .bp-date{font-size:11.5px; color:var(--muted); width:72px; flex:none}
  .bplog-row .bp-val{font-size:15.5px; font-weight:800; flex:1}
  .bplog-row .bp-val .unit{font-weight:500; color:var(--muted); font-size:12px}
  .bp-badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; flex:none; white-space:nowrap}
  .bp-badge.ok{background:var(--ok-soft); color:var(--ok)}
  .bp-badge.high{background:var(--risk-soft); color:var(--risk)}
  .inline{display:flex; gap:8px; align-items:flex-end}
  .inline .field{flex:1}
  .inline button{width:auto; padding:10px 20px}
  .mission-card{background:#fff; border:1.5px solid var(--sage-light); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:8px}
  .mission-card .mt{font-size:13.5px; font-weight:700}
  .mission-card .mq{font-size:12.5px; color:var(--muted)}
  .mission-card .bar{height:8px; background:var(--sage-light); border-radius:999px; overflow:hidden}
  .mission-card .bar i{display:block; height:100%; background:var(--petal2)}
  .mission-card .meta{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted)}
  .answers{display:flex; flex-wrap:wrap; gap:6px}
  .answers button{width:auto; padding:7px 12px; font-size:12.5px; border-radius:999px; border:1.5px solid var(--sage-light); background:#fff; color:var(--ink)}
  .answers button.on{border-color:var(--sage-deep); background:var(--sage-light); font-weight:700}
  .answers input{width:120px}
  .logged{font-size:12px; font-weight:700}
  .logged.completed{color:var(--ok)} .logged.failed{color:var(--risk)} .logged.skipped{color:var(--muted)}
  .warn{font-size:12px; color:var(--risk); background:var(--risk-soft); border-radius:10px; padding:6px 10px}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen">
        <p class="lede" id="lede">오늘 미션을 기록하세요. 목표는 하루가 아니라 주 단위 횟수예요. 기록은 오늘만 고칠 수 있어요.</p>
        <div id="err" class="callout" style="display:none"></div>
        <div id="week-strip"></div>
        <div id="day-detail"></div>
        <div id="bp-section"></div>
        <a class="cta" style="display:block; text-align:center; text-decoration:none" href="dashboard.html">대시보드 보기</a>
        <button type="button" id="stop-btn" class="ghost" style="display:none">챌린지 중단하기</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const STATUS_LABEL = { completed: '달성', failed: '미달성', skipped: '해당 없음' };
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

let cycle = null;          // 서버 사이클
let selectedIdx = 0;       // 0~27
let weekOffset = 0;
let partialFor = null;     // 벽 스쿼트 "일부만" 횟수 고르는 중

const startDate = () => new Date(cycle.started_on + 'T00:00:00');
const dateForIdx = (i) => new Date(startDate().getTime() + i * 86400000);
const todayIdx = () => cycle.day_number - 1;
function logOn(m, d) { return m.logs.find(l => l.log_date === d) || null; }

function showError(msg) { const el = document.getElementById('err'); el.style.display = msg ? 'block' : 'none'; el.textContent = msg || ''; }

// 주차는 시작한 요일부터 7일이라, 요일 머리글도 그 순서로 맞춘다
function dowHeader(wStart) {
  let h = '';
  for (let i = wStart; i < wStart + 7; i++) {
    const dw = dateForIdx(i).getDay();
    h += `<span style="color:var(${dw === 0 ? '--danger' : '--muted'})">${DOW[dw]}</span>`;
  }
  return h;
}

function weekStripHtml() {
  const wStart = weekOffset * 7;
  const d0 = dateForIdx(wStart), d1 = dateForIdx(wStart + 6);
  let cells = '';
  for (let i = wStart; i < wStart + 7; i++) {
    const dt = dateForIdx(i), d = iso(dt);
    const cls = ['day', 'clickable'];
    if (i === todayIdx()) cls.push('today');
    if (i === selectedIdx) cls.push('picked');
    if (dt.getDay() === 0) cls.push('sun');
    const allDone = cycle.missions.every(m => (logOn(m, d) || {}).status === 'completed');
    const dots = allDone ? '<span class="dots"><span class="dot"></span></span>' : '';
    cells += `<div class="${cls.join(' ')}" data-idx="${i}"><span class="num">${dt.getDate()}</span>${dots}</div>`;
  }
  return `<div class="cal-card">
    <div class="cal-head">
      <div class="ym">${weekOffset + 1}주차 · ${d0.getMonth() + 1}/${d0.getDate()} ~ ${d1.getMonth() + 1}/${d1.getDate()}</div>
      <div class="nav"><button type="button" id="wk-prev" ${weekOffset === 0 ? 'disabled' : ''}>‹</button><button type="button" id="wk-next" ${weekOffset === 3 ? 'disabled' : ''}>›</button></div>
    </div>
    <div class="dow-row">${dowHeader(wStart)}</div>
    <div class="day-grid">${cells}</div>
    <div class="cal-legend"><span><i class="ring-sample"></i>오늘</span><span><i class="dot-sample"></i>미션 모두 달성</span></div>
  </div>`;
}

function answerHtml(m, log) {
  const code = m.card.code;
  if (code === 'ACT-1') {
    const target = (m.target_config || {}).steps_target;
    return `<div class="answers"><input type="number" min="0" max="100000" id="steps-${code}" placeholder="걸음 수" value="${log ? log.quantity : ''}">
      <button type="button" data-save-steps="${code}">저장</button></div>${target ? `<div class="mq">목표 ${target.toLocaleString()}보</div>` : ''}`;
  }
  if (code === 'ACT-3' && partialFor === code) {
    return `<div class="answers">${[1, 2, 3].map(n => `<button type="button" data-code="${code}" data-answer="partial" data-qty="${n}">${n}번</button>`).join('')}</div>`;
  }
  return `<div class="answers">${m.card.answers.map(a => {
    const on = log && log.answer === a.code;
    const attr = (code === 'ACT-3' && a.code === 'partial') ? 'data-partial="1"' : '';
    return `<button type="button" class="${on ? 'on' : ''}" data-code="${code}" data-answer="${esc(a.code)}" ${attr}>${esc(a.label)}</button>`;
  }).join('')}</div>`;
}

function missionCardHtml(m, d, editable) {
  const log = logOn(m, d);
  const week = m.weeks[Math.min(3, Math.floor(selectedIdx / 7))];
  const pct = Math.round(week.rate * 100);
  return `<div class="mission-card">
    <div class="mt">${esc(m.card.name)} <span class="lvl" data-l="${LEVEL_LABEL[m.card.difficulty]}">${LEVEL_LABEL[m.card.difficulty]}</span></div>
    <div class="mq">${esc(m.card.question)}</div>
    ${editable ? answerHtml(m, log) : `<div class="logged ${log ? log.status : ''}">${log ? STATUS_LABEL[log.status] : '기록 없음'}</div>`}
    ${editable && log ? `<div class="logged ${log.status}">오늘 기록: ${STATUS_LABEL[log.status]}</div>` : ''}
    ${log && log.warning ? `<div class="warn">${esc(log.warning)}</div>` : ''}
    ${m.card.notice ? `<div class="mq">${esc(m.card.notice)}</div>` : ''}
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>${week.week}주차 ${week.completed} / ${week.target}회</span><span>연속 ${m.streak}일</span></div>
  </div>`;
}

function dayDetailHtml() {
  const dt = dateForIdx(selectedIdx), d = iso(dt);
  const editable = cycle.status === 'active' && selectedIdx === todayIdx();
  let hint = '';
  if (selectedIdx < todayIdx()) hint = '<p class="hint">지난 날짜는 그날의 기록만 볼 수 있어요</p>';
  else if (selectedIdx > todayIdx()) hint = '<p class="hint">아직 오지 않은 날짜예요</p>';
  return `<div class="today-card">
    <div><div class="tt">${editable ? '오늘' : '선택한 날'}</div><div class="dd">${dt.getMonth() + 1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]})</div></div>
    ${selectedIdx > todayIdx() ? '' : cycle.missions.map(m => missionCardHtml(m, d, editable)).join('')}
    ${hint}
  </div>`;
}

// 혈압은 미션이 아니라 시작·4주 재입력 때만 재요 (가이드 §5.3). 주간 혈압 기록은 없음
function bpSectionHtml() {
  const end = new Date(cycle.ended_on + 'T00:00:00');
  return `<div class="callout"><b>혈압은 4주마다 재요</b><br>${end.getMonth() + 1}월 ${end.getDate()}일 사이클이 끝나면 4주 재입력에서 다시 입력해요</div>`;
}

async function record(code, answer, quantity) {
  showError('');
  try {
    await apiRecordChallengeLog(code, answer, quantity);
    partialFor = null;
    cycle = await apiGetCurrentCycle();  // 달성률·연속 기록일을 서버 값으로 다시 그림
    render();
  } catch (e) { showError(friendlyError(e)); }
}

function wireEvents() {
  document.querySelectorAll('.day[data-idx]').forEach(el => el.addEventListener('click', () => { selectedIdx = Number(el.dataset.idx); render(); }));
  const prev = document.getElementById('wk-prev');
  if (prev) prev.addEventListener('click', () => { weekOffset = Math.max(0, weekOffset - 1); render(); });
  const next = document.getElementById('wk-next');
  if (next) next.addEventListener('click', () => { weekOffset = Math.min(3, weekOffset + 1); render(); });
  document.querySelectorAll('.answers button[data-code]').forEach(el => el.addEventListener('click', () => {
    if (el.dataset.partial) { partialFor = el.dataset.code; render(); return; }
    record(el.dataset.code, el.dataset.answer, el.dataset.qty ? Number(el.dataset.qty) : undefined);
  }));
  document.querySelectorAll('[data-save-steps]').forEach(el => el.addEventListener('click', () => {
    const code = el.dataset.saveSteps;
    const v = document.getElementById(`steps-${code}`).value;
    if (v === '') { showError('걸음 수를 입력해 주세요.'); return; }
    record(code, null, Number(v));
  }));
}

function render() {
  document.getElementById('lede').textContent =
    `${cycle.total_cycles * 4}주 중 ${cycle.cycle_number}차 · ${cycle.day_number}일째. 오늘 한 일을 미션별로 기록하세요. 목표는 하루가 아니라 주 단위 횟수이고, 오늘 안에는 언제든 고칠 수 있어요.`;
  document.getElementById('week-strip').innerHTML = weekStripHtml();
  document.getElementById('day-detail').innerHTML = dayDetailHtml();
  document.getElementById('bp-section').innerHTML = bpSectionHtml();
  wireEvents();
}

async function main() {
  try { cycle = await apiGetCurrentCycle(); }
  catch (e) { showError(friendlyError(e)); return; }
  if (!cycle) {
    // 진행 중인 사이클이 없음: 방금 4주가 끝났으면 안내, 아니면 선택 화면으로
    let last = null;
    try { last = (await apiListCycles())[0] || null; } catch (e) { /* 이력이 없어도 진행 */ }
    if (last && (last.status === 'completed' || last.status === 'incomplete')) {
      const msg = last.status === 'completed'
        ? '4주 목표를 모두 달성했어요! 다음 사이클을 이어서 시작해 볼까요?'
        : '4주가 끝났어요. 이번 기록을 바탕으로 다음 사이클을 다시 골라 볼까요?';
      // 4주 재입력 전이면 재입력 먼저 (다음 사이클 추천이 재입력 값으로 바뀜, 가이드 §6.2)
      const next = last.reassessed
        ? `<a class="cta" style="display:block; text-align:center; text-decoration:none" href="challenges.html">다음 사이클 시작하기</a>
           <a class="ghost" style="display:block; text-align:center; text-decoration:none; margin-top:8px" href="reassessment.html?cycle=${encodeURIComponent(last.cycle_id)}">4주 변화 다시 보기</a>`
        : `<a class="cta" style="display:block; text-align:center; text-decoration:none" href="reassessment.html?cycle=${encodeURIComponent(last.cycle_id)}">4주 재입력하고 변화 보기</a>`;
      document.getElementById('day-detail').innerHTML =
        `<div class="callout"><b>${last.cycle_number}차 종료 · 달성률 ${Math.round(last.cycle_rate * 100)}%</b><br>${msg}</div>${next}`;
      return;
    }
    location.replace('challenges.html');
    return;
  }
  selectedIdx = todayIdx();
  weekOffset = Math.floor(selectedIdx / 7);
  render();
  const stop = document.getElementById('stop-btn');
  stop.style.display = 'block';
  stop.addEventListener('click', async () => {
    if (!confirm('진행 중인 챌린지를 중단할까요? 지금까지 기록은 남아요.')) return;
    try { await apiStopCycle(); location.replace('challenges.html'); } catch (e) { showError(friendlyError(e)); }
  });
}

main();
</script>
</body>
</html>
