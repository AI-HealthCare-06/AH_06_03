<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PAEON — 관리자 (미션 관리)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .adm h3{margin:0 0 4px; font-size:20px}
  .adm .meta{font-size:12.5px; color:var(--muted); margin:0 0 14px; line-height:1.6}
  .adm .notice{background:#fff; border:1px solid var(--sage-light); border-radius:14px; padding:10px 16px; font-size:12.5px; line-height:1.7; color:var(--muted); margin-bottom:14px}
  .adm .notice b{color:inherit}
  #msg{min-height:20px; font-size:13px; margin:0 0 10px}
  #msg.err{color:var(--danger,#C97B6B); font-weight:700}
  #msg.ok{color:#4C7A5A; font-weight:700}
  .cat{background:#fff; border:1px solid var(--sage-light); border-radius:14px; padding:4px 16px; margin-bottom:12px}
  .cat.off{opacity:.62}
  .cat-head{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--sage-light)}
  .cat-head .nm{flex:1; font-weight:700; font-size:15px}
  .cat-head .nm small{font-weight:400; color:var(--muted); margin-left:6px; font-size:12px}
  .mv{display:flex; flex-direction:column; gap:2px}
  .mv button{border:1px solid var(--sage-light); background:#fff; border-radius:6px; font-size:11px; line-height:1; padding:3px 7px; cursor:pointer}
  .mv button:disabled{opacity:.35; cursor:default}
  .ms{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--sage-light); font-size:13.5px}
  .ms:last-child{border-bottom:0}
  .ms .nm{flex:1}
  .ms .nm small{color:var(--muted); margin-left:6px; font-size:12px}
  .tag{font-size:11.5px; color:var(--muted); border:1px solid var(--sage-light); border-radius:20px; padding:2px 9px; white-space:nowrap}
  .sw{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer; white-space:nowrap}
  .sw input{width:18px; height:18px; cursor:pointer}
  .lock{max-width:520px; margin:40px auto; text-align:center; line-height:1.7}
  .lock a{font-weight:700; text-decoration:underline}
</style>
</head>
<body>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen adm" style="max-width:680px; margin:0 auto; width:100%">
        <h3>미션 관리 (관리자)</h3>
        <p class="meta">챌린지 미션을 새 추천에 보일지(노출)와 카테고리 순서를 바꿔요. 바꾼 값은 바로 반영돼요.</p>
        <div class="notice">
          · <b>켬</b> = 새로 챌린지를 시작하는 사람의 추천 후보에 나와요. 이미 챌린지를 하는 사람은 그대로 끝까지 해요.<br>
          · 금연·절주 같은 <b>고정 미션</b>은 추천 규칙이 정해서 스위치가 없어요. 흡연·음주를 하지 않는 사람의 고정 칸에 들어가는 대체 미션도 이 스위치와 상관없이 배정돼요.<br>
          · <b>순서</b>는 추천 후보가 보이는 순서예요 (같은 카테고리 안에서는 규칙 순서 그대로).<br>
          · 선택 미션이 하나도 안 남게 끄는 건 막아 둬요.
        </div>
        <div id="msg" role="status" aria-live="polite"></div>
        <div id="list"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
const $list = document.getElementById('list');
const $msg = document.getElementById('msg');
let categories = [];
let busy = false;

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids) e.append(kid);
  return e;
}

function say(text, kind) { $msg.textContent = text || ''; $msg.className = kind || ''; }

function showLocked(text) {
  $list.replaceChildren(el('div', { class: 'lock' }, text, el('br'), el('a', { href: 'login.html' }, '관리자 계정으로 로그인하기')));
}

async function run(job, okText) {
  if (busy) return;
  busy = true;
  say('저장하는 중...');
  try {
    await job();
    say(okText, 'ok');
  } catch (e) {
    say(friendlyError(e), 'err');
  } finally {
    busy = false;
    await load(true);
  }
}

function setCategoryActive(c, active) {
  return run(() => apiCall('PATCH', `/admin/challenge-categories/${c.category_id}`, { active }, '저장하지 못했어요'),
    `${c.category_name}: ${active ? '노출을 켰어요' : '노출을 껐어요'}`);
}

function setMissionActive(m, active) {
  return run(() => apiCall('PATCH', `/admin/challenges/${m.challenge_id}`, { active }, '저장하지 못했어요'),
    `${m.challenge_name}: ${active ? '노출을 켰어요' : '노출을 껐어요'}`);
}

function move(index, delta) {
  const next = categories.slice();
  const [item] = next.splice(index, 1);
  next.splice(index + delta, 0, item);
  return run(async () => {
    // 1, 2, 3... 으로 다시 번호를 매기고, 달라진 것만 저장 (순서가 같은 값으로 겹치는 일을 막는다)
    for (let i = 0; i < next.length; i++) {
      if (next[i].display_order !== i + 1) {
        await apiCall('PATCH', `/admin/challenge-categories/${next[i].category_id}`, { display_order: i + 1 }, '저장하지 못했어요');
      }
    }
  }, `${item.category_name}: 순서를 바꿨어요`);
}

function render() {
  const nodes = categories.map((c, i) => {
    const up = el('button', { type: 'button', 'aria-label': '위로', disabled: i === 0, onclick: () => move(i, -1) }, '▲');
    const down = el('button', { type: 'button', 'aria-label': '아래로', disabled: i === categories.length - 1, onclick: () => move(i, 1) }, '▼');
    const head = el('div', { class: 'cat-head' },
      el('div', { class: 'mv' }, up, down),
      el('div', { class: 'nm' }, c.category_name, el('small', {}, c.category_code)),
      c.switchable
        ? el('label', { class: 'sw' }, el('input', { type: 'checkbox', checked: c.active, onchange: (ev) => setCategoryActive(c, ev.target.checked) }), c.active ? '노출 중' : '숨김')
        : el('span', { class: 'tag' }, '고정'));
    const rows = c.missions.map((m) => el('div', { class: 'ms' },
      el('div', { class: 'nm' }, m.challenge_name, el('small', {}, m.challenge_code)),
      m.switchable
        ? el('label', { class: 'sw' }, el('input', { type: 'checkbox', checked: m.active, onchange: (ev) => setMissionActive(m, ev.target.checked) }), m.active ? '노출 중' : '숨김')
        : el('span', { class: 'tag' }, '규칙으로 정해짐')));
    return el('div', { class: 'cat' + (c.active ? '' : ' off') }, head, ...rows);
  });
  $list.replaceChildren(...nodes);
}

async function load(keepMessage) {
  if (!keepMessage) say('');
  try {
    const body = await apiCall('GET', '/admin/challenges', undefined, '목록을 불러오지 못했어요');
    categories = body.data;
    render();
  } catch (e) {
    if (e.code === 'ADMIN_FORBIDDEN') showLocked('이 계정은 관리자가 아니에요.');
    else showLocked(friendlyError(e));
  }
}

load();
</script>
</body>
</html>
