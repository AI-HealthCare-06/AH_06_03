<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 법정대리인 동의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .modal-backdrop{position:fixed; inset:0; background:rgba(56,64,56,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100}
  .modal-card{background:#fff; border-radius:20px; padding:24px 22px; max-width:340px; width:100%; text-align:center; box-shadow:0 12px 30px rgba(56,64,56,.2)}
  .modal-card b{font-size:15px}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" style="max-width:420px; margin:0 auto; width:100%" id="screen"></div>
    </div>
  </div>
</div>

<div id="success-modal" class="modal-backdrop" style="display:none">
  <div class="modal-card">
    <div style="font-size:32px">✅</div>
    <b>가입 완료!</b>
    <a class="cta" style="display:block; text-align:center; text-decoration:none; margin-top:14px" href="eligibility.html">다음으로</a>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const screen = document.getElementById('screen');
const pending = JSON.parse(localStorage.getItem('paeon-pending-signup') || 'null');

if (!pending) {
  screen.innerHTML = `<div class="callout"><b>가입 진행 정보가 없어요</b><br>회원가입 화면에서 다시 시작해주세요.</div>
    <a class="cta" style="display:block; text-align:center; text-decoration:none; margin-top:10px" href="signup.html">회원가입으로</a>`;
} else {
  screen.innerHTML = `
    <h3 style="text-align:center">법정대리인 동의</h3>
    <p class="lede" style="text-align:center">가입하려는 이용자(${pending.email})는 만 14세 미만이라, 법정대리인이 직접 아래 내용을 확인하고 동의해야 가입이 완료됩니다.</p>

    <div class="card plain" style="font-size:12.5px">
      <b>수집·이용 목적</b>
      <p class="muted" style="margin:4px 0 0">아이디(이메일)·생년월일과, 이후 입력하는 건강정보(혈압·신장·체중 등)를 위험도 예측과 챌린지 추천에만 사용합니다. 이름·전화번호는 수집하지 않습니다.</p>
    </div>

    <form id="guardian-form">
      <div class="field" style="margin-top:10px">
        <label for="g-name">법정대리인 이름</label>
        <input id="g-name" required>
      </div>
      <div class="field" style="margin-top:10px">
        <label for="g-relation">이용자와의 관계</label>
        <select id="g-relation" required>
          <option value="">선택</option>
          <option value="parent">부·모</option>
          <option value="legal_guardian">그 외 법정대리인</option>
        </select>
      </div>
      <div class="field" style="margin-top:10px">
        <label for="g-contact">법정대리인 연락처 (이메일 또는 휴대폰)</label>
        <input id="g-contact" required>
      </div>

      <p id="form-err" class="err" style="margin-top:8px; display:none"></p>

      <div class="callout" style="margin-top:14px">
        <label style="display:flex; gap:8px; align-items:flex-start; font-size:12.5px">
          <input id="g-agree" type="checkbox" required style="margin-top:2px">
          <span>[필수] 본인은 위 이용자의 법정대리인이며, 이용자의 개인정보·건강정보 수집·이용에 동의합니다</span>
        </label>
      </div>

      <button type="submit" id="submit-btn" class="cta" style="margin-top:14px">동의하고 가입 완료</button>
      <a class="ghost" style="display:block; text-align:center; text-decoration:none; margin-top:8px" href="signup.html">취소하고 돌아가기</a>
    </form>
  `;

  const form = document.getElementById('guardian-form');
  const errEl = document.getElementById('form-err');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errEl.style.display = 'none';

    if (!document.getElementById('g-agree').checked) {
      errEl.textContent = '법정대리인 동의 체크가 필요합니다';
      errEl.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '처리하는 중...';
    const guardian = {
      name: document.getElementById('g-name').value,
      relation: document.getElementById('g-relation').value,
      contact: document.getElementById('g-contact').value,
    };
    try {
      const signupRes = await apiSignup(pending.email, pending.pw, pending.birth, { guardian });
      ['paeon-eligibility', 'paeon-health', 'paeon-survey', 'paeon-prediction', 'paeon-cycle', 'paeon-cycle-history', 'paeon-progress'].forEach(k => localStorage.removeItem(k));
      localStorage.setItem('paeon-profile', JSON.stringify({ email: pending.email, birth: pending.birth }));
      localStorage.setItem('paeon-guardian-consent', JSON.stringify({
        ...guardian,
        consented_at: new Date().toISOString(),
        verification_status: signupRes.data.guardian_verification_status || null,
      }));
      localStorage.removeItem('paeon-pending-signup');
      document.getElementById('success-modal').style.display = 'flex';
    } catch (e) {
      errEl.textContent = friendlyError(e);
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = '동의하고 가입 완료';
    }
  });
}
</script>
</body>
</html>
