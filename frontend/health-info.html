<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 건강정보 입력</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .sum-card{border:1px solid var(--line); border-radius:20px; padding:2px 16px}
  .sumrow{display:flex; justify-content:space-between; gap:16px; padding:11px 0; font-size:14px; border-top:1px solid var(--line)}
  .sumrow:first-child{border-top:0}
  .sumrow .lb{color:var(--muted); flex:none}
  .sumrow .vv{font-weight:700; text-align:right}
  .modal-backdrop{position:fixed; inset:0; background:rgba(56,64,56,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100}
  .modal-card{background:#fff; border-radius:20px; padding:24px 22px; max-width:340px; width:100%; text-align:center; box-shadow:0 12px 30px rgba(56,64,56,.2)}
  .modal-card b{font-size:15px}
  .grid2{grid-template-columns:1fr; gap:16px}
  .grid2 > .field:empty{display:none}
  .head h1{margin:0; font-size:28px; font-weight:800; letter-spacing:-.7px; line-height:1.3}
  .head p{margin:10px 0 0; font-size:14px; color:var(--body); line-height:1.6}
  .prog{display:flex; align-items:center; gap:12px; font-size:13px; font-weight:700; color:var(--body)}
  .prog i{flex:1; height:6px; border-radius:3px; background:var(--line); overflow:hidden}
  .prog i b{display:block; height:100%; border-radius:3px; background:var(--accent); transition:width .2s}
  .bar .off{display:none !important}
  .step{display:none; flex-direction:column; gap:16px}
  .step.on{display:flex}
  .step .field label{font-size:15px}
  .sumrow.go{cursor:pointer}
  .sumrow.go .vv::after{content:" ›"; color:var(--muted); font-weight:400}
  body.typing .tabbar{display:none}
  body.typing .bar{bottom:0}
  .bar{position:sticky; bottom:84px; background:#fff; padding:12px 0; display:flex; flex-direction:column; gap:10px; z-index:5}
  .bar .cta,.bar .ghost{height:56px; font-size:17px; border-radius:28px; margin:0}
</style>
<style>
  .cupguide{width:100%; border-collapse:collapse; margin-top:6px; font-size:12px; color:var(--muted)}
  .cupguide th,.cupguide td{border:1px solid var(--sage-light); padding:4px 8px; text-align:left; vertical-align:top}
  .cupguide th{background:var(--cream); color:var(--ink); font-weight:700}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
          <div id="summary-view" class="screen" style="display:none">
            <div class="page-bar"><a class="back" href="dashboard.html" aria-label="뒤로"><span data-icon="back"></span></a></div>
            <div class="head"><h1>입력한 건강정보</h1></div>
            <div class="sum-card" id="summary-rows"></div>
            <div class="bar"><button type="button" id="edit-btn" class="ghost">정보 수정하기</button>
            <a class="cta" id="summary-cta" style="text-decoration:none"></a></div>
          </div>

          <form id="health-form" class="screen">
            <div class="page-bar"><a class="back" id="step-back" href="dashboard.html" aria-label="뒤로"><span data-icon="back"></span></a></div>
            <div class="prog"><span id="prog-t"></span><i><b id="prog-b"></b></i></div>
            <div class="head"><h1 id="step-title"></h1></div>
            <div id="steps"></div>

            <div class="grid2">
              <div class="field">
                <label for="sex">성별</label>
                <select id="sex" required>
                  <option value="">선택</option>
                  <option value="male">남</option>
                  <option value="female">여</option>
                </select>
              </div>
              <div class="field"></div>
              <div class="field">
                <label for="height">키 (cm)</label>
                <input id="height" type="number" step="0.1" min="100" max="230" required>
              </div>
              <div class="field">
                <label for="weight">몸무게 (kg)</label>
                <input id="weight" type="number" step="0.1" min="20" max="300" required>
              </div>
            </div>

            <div class="grid2">
              <div class="field">
                <label for="sbp">높은 쪽 혈압(수축기) (mmHg)</label>
                <input id="sbp" type="number" min="60" max="260" required>
              </div>
              <div class="field">
                <label for="dbp">낮은 쪽 혈압(이완기) (mmHg)</label>
                <input id="dbp" type="number" min="30" max="160" required>
              </div>

              <div class="field">
                <label for="waist">허리둘레 (cm)</label>
                <input id="waist" type="number" step="0.1" min="40" max="200" required>
              </div>
              <div class="field"></div>

              <div class="field">
                <label for="smoking">현재 일반담배를 피우십니까?</label>
                <select id="smoking" required>
                  <option value="">선택</option>
                  <option value="current_daily">매일 피움</option>
                  <option value="current_sometimes">가끔 피움</option>
                  <option value="former">과거엔 피웠으나, 현재 피우지 않음</option>
                  <option value="never">피운 적 없음</option>
                </select>
              </div>
              <div class="field">
                <label for="ecig">현재 전자담배(궐련형 또는 액상형)를 사용하십니까?</label>
                <select id="ecig" required>
                  <option value="">선택</option>
                  <option value="daily">매일 사용</option>
                  <option value="occasional">가끔 사용</option>
                  <option value="none">사용 안 함</option>
                </select>
              </div>

              <div class="field">
                <label for="drink-freq">최근 1년 동안 술을 얼마나 자주 마십니까?</label>
                <select id="drink-freq" required>
                  <option value="">선택</option>
                  <option value="never_lifetime">평생 술을 마셔 본 적 없음</option>
                  <option value="none_past_year">최근 1년간 전혀 마시지 않았다</option>
                  <option value="lt_monthly">한 달에 1번 미만</option>
                  <option value="monthly">한 달에 1번 정도</option>
                  <option value="2_4_per_month">한 달에 2–4번</option>
                  <option value="2_3_per_week">일주일에 2–3번 정도</option>
                  <option value="4plus_per_week">일주일에 4번 이상</option>
                </select>
              </div>
              <div class="field" id="drink-amount-field" style="display:none">
                <label for="drink-amount">한 번에 술을 얼마나 마십니까?</label>
                <select id="drink-amount">
                  <option value="1_2">1–2잔</option>
                  <option value="3_4">3–4잔</option>
                  <option value="5_6">5–6잔</option>
                  <option value="7_9">7–9잔</option>
                  <option value="10plus">10잔 이상</option>
                </select>
                <table class="cupguide">
                  <thead><tr><th>술</th><th>1잔</th><th>병·캔으로 셀 때</th></tr></thead>
                  <tbody>
                    <tr><td>소주</td><td>소주잔 1잔</td><td>1병(360ml) = 7잔</td></tr>
                    <tr><td>맥주</td><td>맥주잔 1잔</td><td>캔 355ml = 1.5잔 · 500ml(캔·병·생맥주 500cc) = 2잔</td></tr>
                    <tr><td>와인</td><td>와인잔 1잔</td><td>1병(750ml) = 5잔</td></tr>
                    <tr><td>막걸리</td><td>막걸리 사발 1잔</td><td>1병(750ml) = 3잔</td></tr>
                    <tr><td>양주</td><td>양주잔 1잔</td><td></td></tr>
                    <tr><td>소맥</td><td colspan="2">맥주잔 1잔 = 1잔</td></tr>
                  </tbody>
                </table>
              </div>

              <div class="field">
                <label for="diabetes">당뇨병 여부</label>
                <select id="diabetes" required>
                  <option value="false">없음</option>
                  <option value="true">있음</option>
                </select>
              </div>
              <div class="field">
                <label for="htn-status">고혈압 진단·치료 상태</label>
                <select id="htn-status" required>
                  <option value="none">진단받은 적 없음</option>
                  <option value="diagnosed_untreated">진단받았지만 약은 안 먹음</option>
                  <option value="treated">진단받았고 약을 먹는 중</option>
                </select>
              </div>

              <div class="field">
                <label for="total-chol">총콜레스테롤 (mg/dL)</label>
                <input id="total-chol" type="number" min="50" max="600">
                <p class="hint" style="margin:4px 0 0">모르면 비워 두세요. 중앙값(234)으로 대신해 분석해요.</p>
              </div>
              <div class="field">
                <label for="parent-htn">부모 고혈압 가족력</label>
                <select id="parent-htn" required>
                  <option value="no">없음</option>
                  <option value="yes">있음</option>
                  <option value="unknown">모름</option>
                </select>
              </div>
              <div class="field"></div>
            </div>

            <p id="form-err" class="err" style="display:none"></p>

            <div class="privacy" id="privacy-note">
              <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px; flex:none; margin-top:2px"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
              <span>입력하신 건강정보는 위험 신호 분석과 챌린지 추천에만 씁니다. 다른 용도로 쓰거나 제3자에게 제공하지 않습니다.</span>
            </div>

            <div class="sum-card" id="review-rows" style="display:none"></div>
            <div class="bar"><button type="button" id="step-skip" class="ghost off">건너뛰기</button><button type="button" id="step-next" class="cta">다음</button><button type="submit" id="submit-btn" class="cta off">생활습관 설문으로</button></div>
          </form>
    </div>
  </div>
</div>

<div id="success-modal" class="modal-backdrop" style="display:none">
  <div class="modal-card">
    <div><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6.4"/></svg></div>
    <b>건강정보를 저장했어요!</b>
    <a class="cta" style="display:block; text-align:center; text-decoration:none; margin-top:14px" href="survey.html">생활습관 설문으로</a>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
function localIso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

const form = document.getElementById('health-form');
const summaryView = document.getElementById('summary-view');
const drinkFreqSelect = document.getElementById('drink-freq');
const drinkAmountField = document.getElementById('drink-amount-field');
const errEl = document.getElementById('form-err');
const submitBtn = document.getElementById('submit-btn');

const NON_DRINKER_FREQS = ['', 'never_lifetime', 'none_past_year'];
drinkFreqSelect.addEventListener('change', () => {
  const isDrinker = !NON_DRINKER_FREQS.includes(drinkFreqSelect.value);
  drinkAmountField.style.display = isDrinker ? 'flex' : 'none';
  document.getElementById('drink-amount').required = isDrinker;
});

// 흡연: 화면은 4지선다(매일/가끔 구분), 서버·모델에는 SMOKING = current/former/never만 보낸다
const smokingValue = (ui) => (ui.startsWith('current') ? 'current' : ui);
const smokingUi = (h) => (h.smoking === 'current' ? (h.smoking_freq === 'sometimes' ? 'current_sometimes' : 'current_daily') : h.smoking);

function showError(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }
function clearError() { errEl.style.display = 'none'; }

function optionLabel(selectId, value) {
  const opt = Array.from(document.getElementById(selectId).options).find(o => o.value === String(value));
  return opt ? opt.textContent : value;
}

// [이름, 값, 고칠 때 가는 단계]
function summaryRows(health) {
  const rows = [
    ['성별', optionLabel('sex', health.sex), 0],
    ['키 / 몸무게', `${health.height_cm}cm / ${health.weight_kg}kg`, 1],
    ['혈압', `${health.sbp}/${health.dbp} mmHg`, 2],
    ['허리둘레', `${health.waist_cm}cm`, 3],
    ['일반담배', optionLabel('smoking', smokingUi(health)), 4],
    ['전자담배', health.ecig ? optionLabel('ecig', health.ecig) : '입력 안 함', 4],
    ['음주 빈도(최근 1년)', optionLabel('drink-freq', health.drink_freq), 5],
  ];
  if (health.drink_amount) rows.push(['한 번 음주량', optionLabel('drink-amount', health.drink_amount), 5]);
  rows.push(
    ['당뇨병 여부', optionLabel('diabetes', health.diabetes), 6],
    ['고혈압 진단·치료 상태', optionLabel('htn-status', health.htn_status), 6],
    ['부모 고혈압 가족력', optionLabel('parent-htn', health.parent_htn), 6],
    ['총콜레스테롤', health.total_chol != null ? `${health.total_chol} mg/dL` : '입력 안 함', 7],
  );
  return rows;
}

function renderSummary(health) {
  document.getElementById('summary-rows').innerHTML = summaryRows(health).map(([lb, vv]) => `<div class="sumrow"><span class="lb">${lb}</span><span class="vv">${vv}</span></div>`).join('');

  const cta = document.getElementById('summary-cta');
  if (localStorage.getItem('paeon-survey')) {
    cta.textContent = '홈으로';
    cta.href = 'dashboard.html';
  } else {
    cta.textContent = '생활습관 설문으로';
    cta.href = 'survey.html';
  }
}

function fillForm(health) {
  document.getElementById('sex').value = health.sex;
  document.getElementById('height').value = health.height_cm;
  document.getElementById('weight').value = health.weight_kg;
  document.getElementById('sbp').value = health.sbp;
  document.getElementById('dbp').value = health.dbp;
  document.getElementById('waist').value = health.waist_cm;
  document.getElementById('smoking').value = smokingUi(health);
  document.getElementById('ecig').value = health.ecig || '';
  drinkFreqSelect.value = health.drink_freq;
  drinkFreqSelect.dispatchEvent(new Event('change'));
  if (health.drink_amount) document.getElementById('drink-amount').value = health.drink_amount;
  document.getElementById('diabetes').value = String(health.diabetes);
  document.getElementById('htn-status').value = health.htn_status;
  document.getElementById('total-chol').value = health.total_chol ?? '';
  document.getElementById('parent-htn').value = health.parent_htn;
}

function showSummary() {
  const health = JSON.parse(localStorage.getItem('paeon-health') || 'null');
  if (!health) return showForm();
  renderSummary(health);
  summaryView.style.display = 'flex';
  form.style.display = 'none';
}
function showForm() {
  summaryView.style.display = 'none';
  form.style.display = 'flex';
  goStep(0);
}

// 챌린지를 시작한 뒤에는 처음 입력(전·후 비교의 기준)을 고칠 수 없다(서버 409 HEALTH_RECORD_LOCKED).
const LOCK_TITLE = '처음 입력은 고칠 수 없어요';
const LOCK_MSG = '챌린지를 시작한 뒤에는 처음 입력한 건강정보를 고칠 수 없어요. 처음 값은 4주·12주 변화를 비교하는 기준이에요. 요즘 수치는 주간 혈압 기록이나 4주 재입력에 남겨 주세요.';

document.getElementById('edit-btn').addEventListener('click', async () => {
  if (localStorage.getItem('paeon-cycle')) { await confirmDialog(LOCK_TITLE, LOCK_MSG, '확인'); return; }
  fillForm(JSON.parse(localStorage.getItem('paeon-health')));
  showForm();
  goStep(REVIEW);
});

// ---- 질문을 묶음(단계)으로 하나씩 보여 준다. 입력칸은 그대로고 화면에만 나눠 담는다.
const STEPS = [
  { title: '성별을 알려 주세요', ids: ['sex'] },
  { title: '키와 몸무게를 알려 주세요', ids: ['height', 'weight'] },
  { title: '혈압을 알려 주세요', ids: ['sbp', 'dbp'] },
  { title: '허리둘레를 알려 주세요', ids: ['waist'] },
  { title: '흡연 여부를 알려 주세요', ids: ['smoking', 'ecig'] },
  { title: '음주 습관을 알려 주세요', ids: ['drink-freq', 'drink-amount'] },
  { title: '병력과 가족력을 알려 주세요', ids: ['diabetes', 'htn-status', 'parent-htn'] },
  { title: '선택 항목이에요', ids: ['total-chol'], optional: true },
];
const REVIEW = STEPS.length;
const stepsBox = document.getElementById('steps');
// 입력 중에는 하단 탭바를 숨겨 키보드가 올라와도 입력칸과 다음 버튼이 가려지지 않게 한다
document.addEventListener('focusin', (e) => { if (e.target.matches('input, select, textarea')) document.body.classList.add('typing'); });
document.addEventListener('focusout', () => { setTimeout(() => { if (!document.activeElement || !document.activeElement.matches('input, select, textarea')) document.body.classList.remove('typing'); }, 100); });
const reviewBox = document.getElementById('review-rows');
let stepIdx = 0, backToReview = false;
STEPS.forEach((st) => {
  const box = document.createElement('div');
  box.className = 'step';
  st.ids.forEach((id) => box.appendChild(document.getElementById(id).closest('.field')));
  st.box = box;
  stepsBox.appendChild(box);
});
document.querySelectorAll('.grid2, .sect').forEach((n) => n.remove());

function currentPayload() {
  return {
    sex: document.getElementById('sex').value,
    height_cm: Number(document.getElementById('height').value),
    weight_kg: Number(document.getElementById('weight').value),
    waist_cm: Number(document.getElementById('waist').value),
    sbp: Number(document.getElementById('sbp').value),
    dbp: Number(document.getElementById('dbp').value),
    smoking: smokingValue(document.getElementById('smoking').value),
    smoking_freq: document.getElementById('smoking').value === 'current_sometimes' ? 'sometimes' : (document.getElementById('smoking').value === 'current_daily' ? 'daily' : null),
    ecig: document.getElementById('ecig').value,
    drink_freq: drinkFreqSelect.value,
    drink_amount: drinkAmountField.style.display === 'none' ? null : document.getElementById('drink-amount').value,
    diabetes: document.getElementById('diabetes').value === 'true',
    htn_status: document.getElementById('htn-status').value,
    total_chol: document.getElementById('total-chol').value ? Number(document.getElementById('total-chol').value) : null,
    parent_htn: document.getElementById('parent-htn').value,
  };
}

function goStep(i, fromReview) {
  stepIdx = i; backToReview = !!fromReview;
  clearError();
  const review = i === REVIEW;
  STEPS.forEach((st, k) => st.box.classList.toggle('on', k === i));
  reviewBox.style.display = review ? 'block' : 'none';
  document.getElementById('privacy-note').style.display = review ? 'flex' : 'none';
  document.getElementById('step-title').innerHTML = review ? '입력한 내용을<br>확인해 주세요' : STEPS[i].title;
  document.getElementById('prog-t').textContent = review ? '확인' : `${i + 1} / ${STEPS.length}`;
  document.getElementById('prog-b').style.width = `${((review ? STEPS.length : i + 1) / STEPS.length) * 100}%`;
  if (review) {
    reviewBox.innerHTML = summaryRows(currentPayload()).map(([lb, vv, k]) => `<div class="sumrow go" data-go="${k}"><span class="lb">${lb}</span><span class="vv">${vv}</span></div>`).join('');
  }
  document.getElementById('step-next').classList.toggle('off', review);
  document.getElementById('step-next').textContent = backToReview ? '확인' : '다음';
  document.getElementById('submit-btn').classList.toggle('off', !review);
  document.getElementById('step-skip').classList.toggle('off', review || !STEPS[i].optional || backToReview);
  window.scrollTo(0, 0);
  // 터치 기기(아이폰·카카오톡 브라우저 등)에서는 커서를 자동으로 넣지 않는다: 키보드가 저절로 올라와 화면이 위로 밀린다
  if (!review && window.matchMedia('(pointer: fine)').matches) { const f = STEPS[i].box.querySelector('input'); if (f) f.focus({ preventScroll: true }); }
}

// 값끼리 맞는지(범위 안이어도 말이 안 되는 조합): 수축기 > 이완기, 키·몸무게로 계산한 BMI 10~60
function checkPair() {
  const v = (id) => { const e = document.getElementById(id); return e && e.value !== '' ? Number(e.value) : null; };
  document.getElementById('dbp').setCustomValidity(v('sbp') != null && v('dbp') != null && v('sbp') <= v('dbp') ? '높은 쪽 혈압은 낮은 쪽 혈압보다 커야 해요. 두 칸이 바뀌지 않았는지 확인해 주세요.' : '');
  const h = v('height'), w = v('weight'), bmi = h && w ? w / (h / 100) ** 2 : null;
  document.getElementById('weight').setCustomValidity(bmi != null && (bmi < 10 || bmi > 60) ? '키와 몸무게를 다시 확인해 주세요.' : '');
}
['sbp', 'dbp', 'height', 'weight'].forEach(id => document.getElementById(id).addEventListener('input', checkPair));

function stepValid() {
  checkPair();
  for (const id of STEPS[stepIdx].ids) {
    const el = document.getElementById(id);
    if (el.offsetParent !== null && !el.checkValidity()) { el.reportValidity(); return false; }
  }
  return true;
}
function goNext() {
  if (!stepValid()) return;
  if (backToReview) goStep(REVIEW);
  else goStep(stepIdx + 1);
}
document.getElementById('step-next').addEventListener('click', goNext);
form.addEventListener('keydown', (e) => {   // 숨겨진 제출 버튼에 기대지 않고 Enter로 다음 질문으로
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && stepIdx < REVIEW) { e.preventDefault(); goNext(); }
});
document.getElementById('step-skip').addEventListener('click', () => {
  STEPS[stepIdx].ids.forEach((id) => { document.getElementById(id).value = ''; });
  goStep(stepIdx + 1);
});
document.getElementById('step-back').addEventListener('click', (e) => {
  if (stepIdx === REVIEW) { e.preventDefault(); goStep(REVIEW - 1); }
  else if (backToReview) { e.preventDefault(); goStep(REVIEW); }
  else if (stepIdx > 0) { e.preventDefault(); goStep(stepIdx - 1); }
});
reviewBox.addEventListener('click', (e) => {
  const row = e.target.closest('[data-go]');
  if (row) goStep(Number(row.dataset.go), true);
});
goStep(0);

const existingHealth = JSON.parse(localStorage.getItem('paeon-health') || 'null');
if (existingHealth) showSummary();

// 이미 분석한 사람이 값을 고쳐 저장하면, 새 값으로 다시 분석할지 묻는다(안 하면 결과는 예전 값 그대로).
async function offerReanalysis(before, after) {
  const L = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const same = (k) => JSON.stringify(before[k]) === JSON.stringify(after[k]);
  if (!L('paeon-prediction') || Object.keys(after).filter(k => k !== 'recorded_at').every(same)) return;
  if (!(await confirmDialog('새 값으로 다시 분석할까요?', '고친 값이 저장됐어요. 다시 분석하지 않으면 결과 화면은 예전 값 기준으로 남아 있어요.', '다시 분석하기'))) return;
  const building = progressOverlay('분석을 다시<br>하는 중이에요', '바뀐 정보로 결과를 새로 계산하고 있어요');
  try {
    const r = await apiRequestPrediction(L('paeon-profile'), L('paeon-eligibility'), L('paeon-health'), L('paeon-survey'));
    localStorage.setItem('paeon-prediction', JSON.stringify(r.data));
    await building.finish();
    location.href = 'result.html';
  } catch (e) { building.cancel(); showError(friendlyError(e)); }
}

// 확인 화면에서 저장할 때 비어 있는 필수 칸(예전에 만든 기록 등)이 있으면 브라우저가 말없이 막으므로, 그 칸의 단계로 보내서 알려 준다.
form.addEventListener('invalid', (e) => {
  const k = STEPS.findIndex(st => st.box.contains(e.target));
  if (k >= 0 && stepIdx !== k) { goStep(k, true); setTimeout(() => e.target.reportValidity(), 0); }
}, true);

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (stepIdx < REVIEW) { goNext(); return; }   // 입력 중 Enter는 다음 질문으로
  clearError();

  const payload = { ...currentPayload(), recorded_at: existingHealth ? existingHealth.recorded_at : localIso(new Date()) };

  if (!payload.sex) return showError('성별을 선택해주세요');

  submitBtn.disabled = true;
  submitBtn.textContent = '저장하는 중...';
  try {
    await apiSubmitHealthRecord(payload);
    localStorage.setItem('paeon-health', JSON.stringify(payload));
    if (existingHealth) {
      showSummary();
      await offerReanalysis(existingHealth, payload);
    } else {
      document.getElementById('success-modal').style.display = 'flex';
    }
  } catch (e) {
    submitBtn.disabled = false;
    submitBtn.textContent = '생활습관 설문으로';
    if (e.code === 'HEALTH_RECORD_LOCKED') { showSummary(); await confirmDialog(LOCK_TITLE, LOCK_MSG, '확인'); return; }
    showError(e.message);
  }
});
</script>
</body>
</html>
