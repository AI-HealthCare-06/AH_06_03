<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 글</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .head{display:flex; align-items:center; gap:12px}
  .head > div{min-width:0}
  .head .meta{overflow-wrap:anywhere}
  .av{width:52px; height:52px; border-radius:16px; background:var(--cream); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--muted); flex:none}
  .meta{font-size:13px; color:var(--muted)}
  .cat{height:22px; padding:0 8px; border-radius:11px; border:1px solid #D2C4B4; color:#3B5063; display:inline-flex; align-items:center; font-size:13px; margin-right:6px; flex:none; white-space:nowrap}
  h1.ttl2{font-size:20px; line-height:1.4; word-break:break-all}
  .bodytx{font-size:15px; line-height:1.75; white-space:pre-wrap; word-break:break-all}
  .attach{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:12px; padding:8px 12px; align-self:flex-start; font-size:13px}
  .attach .lb{font-weight:700}
  .attach .dy{color:var(--muted); font-size:12px}
  .acts{display:flex; gap:10px; align-items:center}
  .like{height:44px; padding:0 18px; border-radius:22px; border:1px solid var(--sage); background:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px}
  .like.on{background:var(--notice); border-color:var(--accent)}
  .lnk{border:0; background:none; font-size:13px; color:var(--muted); text-decoration:underline; min-height:44px}
  .cm{padding:16px 0 12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
  .cm .t{display:flex; justify-content:space-between; font-size:13px; color:var(--muted)}
  .cm.re{padding:12px 0 4px 6px; border-top:0; flex-direction:row; gap:8px; align-items:flex-start}
  .cm.re .ln{flex:none; width:14px; color:var(--muted); font-size:15px; line-height:28px}
  .cm.re .col{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}
  .cm.re .b{font-size:14px}
  .cm.re + .cm:not(.re){margin-top:2px}
  .clk{display:inline-flex; align-items:center; gap:4px; min-height:32px; padding:0 10px 0 0; border:0; background:none; font-size:13px; color:var(--muted); cursor:pointer}
  .clk .h{font-size:16px; line-height:1; color:#E5484D}
  .clk.on{color:#E5484D; font-weight:700}
  .cm .b{font-size:14.5px; line-height:1.6; word-break:break-all; white-space:pre-wrap}
  .cmbar{display:flex; gap:8px}
  .cmbar{align-items:center}
  #cmbar{margin:18px 0 96px}   /* 입력칸 위 여백 + 아래는 하단 탭바(84px)에 붙지 않게 */
  #cmbar .pill-btn{flex:none; white-space:nowrap}
  .cmbar input{min-width:0; flex:1; height:48px; border:0; border-radius:12px; background:var(--cream); padding:0 14px; font:inherit; font-size:15px}
  .sheet-bg{position:fixed; inset:0; background:rgba(36,55,73,.5); z-index:200; display:flex; align-items:flex-end; justify-content:center}
  .sheet{background:var(--cream); width:100%; max-width:430px; border-radius:16px 16px 0 0; padding:14px 20px 28px; display:flex; flex-direction:column; gap:10px}
  .sheet .grab{width:36px; height:4px; border-radius:2px; background:var(--sage); align-self:center}
  .sheet b{font-size:16px}
  .rb{height:52px; border:1px solid var(--sage); border-radius:14px; background:#fff; font-size:15px; text-align:left; padding:0 16px}
  .ph{width:100%; aspect-ratio:4/3; border-radius:14px; background:#F3E3D0 center/cover no-repeat}
</style>
</head>
<body>
<div id="header-slot"></div>
<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" style="gap:16px">
        <div class="page-bar"><a class="back" href="feed.html" aria-label="뒤로" id="back"></a><span class="ttl">글</span></div>
        <div id="post"><p class="hint">불러오는 중...</p></div>
        <div id="cms"></div>
        <div class="cmbar" id="cmbar" hidden><input id="cm-in" maxlength="300" placeholder="댓글을 남겨 보세요" aria-label="댓글"><button type="button" class="lnk" id="cm-cancel" hidden onclick="clearReply()">취소</button><button type="button" class="pill-btn" id="cm-go">등록</button></div>
        <p class="err" id="err" hidden></p>
      </div>
    </div>
  </div>
</div>
<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
if (!loggedIn()) location.replace('login.html');
document.getElementById('back').innerHTML = ICON.back;
const id = new URLSearchParams(location.search).get('id');
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const $ = (x) => document.getElementById(x);
const CAT_LABEL = { diet: '식단', exercise: '운동', challenge: '챌린지 인증', tips: '고민과 꿀팁' };
const KIND = { fixed: ['고정', 'fixed'], selected: ['선택', 'selected'], common: ['공통', 'common'], party: ['파티', 'party'] };
const REASONS = [['health_info', '건강정보나 개인정보가 들어 있어요'], ['spam', '광고·스팸이에요'], ['abuse', '욕설·비방이에요'], ['other', '기타']];
const _avc = {};
const _avView = (n) => _avc[n] || (_avc[n] = apiCall('GET', '/characters/by-nickname/' + encodeURIComponent(n), undefined, '').then(r => r.data));
function hydrateAvatars(root, px) {
  (root || document).querySelectorAll('[data-av]:not([data-done])').forEach(el => {
    el.dataset.done = '1';
    _avView(el.dataset.av).then(v => { el.innerHTML = characterSvg(v, px || 40); }).catch(() => {});
  });
}
function ago(iso) {
  const d = new Date(/Z|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z'), s = (Date.now() - d) / 1000;
  if (s < 60) return '방금 전'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  if (s < 172800) return '어제'; return Math.floor(s / 86400) + '일 전';
}
document.addEventListener('click', (e) => {   // 아바타·닉네임을 누르면 그 사람의 프로필로
  const t = e.target.closest('[data-prof]'); if (t) location.href = 'profile.html?nick=' + encodeURIComponent(t.dataset.prof);
});
let post = null;
function sheet(title, items, onPick) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span><b>' + esc(title) + '</b>' + items.map(([v, l]) => '<button type="button" class="rb" data-v="' + v + '">' + esc(l) + '</button>').join('') + '<button type="button" class="ghost" data-v="">닫기</button></div>';
  bg.addEventListener('click', (e) => { if (e.target === bg || e.target.dataset.v === '') bg.remove(); else if (e.target.dataset.v) { bg.remove(); onPick(e.target.dataset.v); } });
  document.body.appendChild(bg);
}
function renderPost() {
  const p = post, nick = p.author_nickname || '알 수 없음';
  let att = '';
  if (p.attach) { const k = KIND[p.attach.kind]; att = '<div class="attach"><span class="ctag ' + k[1] + '">' + k[0] + '</span><span class="lb">' + esc(p.attach.label) + '</span><span class="dy">' + (p.attach.kind === 'party' ? (p.attach.days ? p.attach.days + '일째' : '이제 시작') : '인증 ' + p.attach.days + '일째') + '</span></div>'; }
  $('post').innerHTML = '<div style="display:flex; flex-direction:column; gap:14px">'
    + '<div class="head"><span class="av"' + (p.author_nickname ? ' data-av="' + esc(nick) + '" data-prof="' + esc(nick) + '"' : '') + '>' + esc(nick.slice(0, 1)) + '</span><div><div class="meta"><span class="cat">' + esc(CAT_LABEL[p.category] || '') + '</span>' + (p.author_nickname ? '<span data-prof="' + esc(nick) + '" style="text-decoration:underline; text-underline-offset:2px">' + esc(nick) + '</span>' : esc(nick)) + ' · ' + ago(p.created_at) + '</div></div></div>'
    + (new URLSearchParams(location.search).get('from') === 'party' ? '' : '<h1 class="ttl2">' + esc(p.title) + '</h1>')
    + (p.hidden ? '<div class="callout">' + esc(p.notice || '') + '</div>' : '<div class="bodytx">' + esc(p.body) + '</div>') + att
    + (p.hidden ? '' : Array.from({ length: p.photo_count || 0 }, (_, i) => '<div class="ph" data-ph="' + esc(p.post_id) + '" data-n="' + i + '"></div>').join(''))
    + '<div class="acts"><button type="button" class="like' + (p.liked_by_me ? ' on' : '') + '" id="like">좋아요 <span id="lc">' + p.like_count + '</span></button>'
    + (p.mine ? '<button type="button" class="lnk" id="del">삭제</button>' : '<button type="button" class="lnk" id="rep">신고</button>') + '</div></div>';
  $('like').addEventListener('click', onLike);
  if ($('del')) $('del').addEventListener('click', onDelete);
  if ($('rep')) $('rep').addEventListener('click', () => sheet('신고 사유를 골라 주세요', REASONS, (v) => report('posts/' + id, v)));
  $('cmbar').hidden = !!p.hidden;
  hydrateAvatars($('post'), 40);
  document.querySelectorAll('#post [data-ph]').forEach(el => apiPhotoUrl(el.dataset.ph, +el.dataset.n).then(u => { el.style.backgroundImage = `url(${u})`; }).catch(() => {}));
}
async function onLike() {
  try {
    const d = (await apiCall('POST', '/community/posts/' + id + '/like', undefined, '좋아요를 하지 못했어요')).data;
    $('lc').textContent = d.like_count; $('like').classList.toggle('on', d.liked); post.liked_by_me = d.liked;
  } catch (e) { if (e.code === 'NICKNAME_REQUIRED') location.href = 'nickname.html?next=feed.html'; else showErr(friendlyError(e)); }
}
async function onDelete() {
  if (!(await confirmDialog('글을 삭제할까요?', '댓글과 좋아요도 함께 사라져요.', '삭제'))) return;
  try { await apiCall('DELETE', '/community/posts/' + id, undefined, '삭제하지 못했어요'); location.replace(document.getElementById('back').href); } catch (e) { showErr(friendlyError(e)); }
}
async function report(path, reason) {
  try {
    await apiCall('POST', '/community/' + path + '/report', { reason }, '신고하지 못했어요');
    await noticeDialog('신고했어요', '운영팀이 확인해요. 알려 주셔서 고마워요.', '확인');
    if (path.startsWith('posts/')) location.replace(document.getElementById('back').href); else loadComments();   // 신고한 글·댓글은 내 목록에서 바로 빠진다
  } catch (e) { showErr(e.code === 'ALREADY_REPORTED' ? '이미 신고했어요.' : friendlyError(e)); }
}
function showErr(m) { $('err').textContent = m; $('err').hidden = false; }
let replyTo = null;   // 답글을 다는 중인 원 댓글 id
function cmHtml(c, reply) {
  if (c.deleted) return '<div class="cm"><div class="b" style="color:var(--muted)">삭제된 댓글이에요.</div></div>';
  const who = '<span style="display:flex; align-items:center; gap:8px"><span class="av" style="width:' + (reply ? 28 : 36) + 'px; height:' + (reply ? 28 : 36) + 'px; border-radius:12px; font-size:14px" data-av="' + esc(c.author_nickname) + '" data-prof="' + esc(c.author_nickname) + '">' + esc((c.author_nickname || '?').slice(0, 1)) + '</span>' + '<span data-prof="' + esc(c.author_nickname) + '" style="text-decoration:underline; text-underline-offset:2px">' + esc(c.author_nickname) + '</span> · ' + ago(c.created_at) + '</span>';
  const act = (reply ? '' : '<button type="button" class="lnk" style="min-height:0" data-reply="' + c.comment_id + '">답글</button>')
    + (c.mine ? '<button type="button" class="lnk" style="min-height:0" data-edit="' + c.comment_id + '">수정</button>' : '') + (c.mine ? '<button type="button" class="lnk" style="min-height:0" data-del="' + c.comment_id + '">삭제</button>' : '<button type="button" class="lnk" style="min-height:0" data-rep="' + c.comment_id + '">신고</button>');
  const inner = '<div class="t">' + who + '<span style="display:flex; gap:10px">' + act + '</span></div><div class="b">' + esc(c.body) + '</div>'
    + '<div><button type="button" class="clk' + (c.liked_by_me ? ' on' : '') + '" data-cl="' + c.comment_id + '" aria-pressed="' + !!c.liked_by_me + '" aria-label="댓글 좋아요"><span class="h">' + (c.liked_by_me ? '❤️' : '♡') + '</span><span class="n">' + (c.like_count || 0) + '</span></button></div>';
  return '<div class="cm' + (reply ? ' re' : '') + '" id="c-' + c.comment_id + '">' + (reply ? '<span class="ln" aria-hidden="true">ㄴ</span><div class="col">' + inner + '</div>' : inner) + '</div>';
}
async function loadComments() {
  try {
    const list = (await apiCall('GET', '/community/posts/' + id + '/comments', undefined, '댓글을 불러오지 못했어요')).data;
    const ids = new Set(list.map(c => c.comment_id));
    const roots = list.filter(c => !c.parent_id || !ids.has(c.parent_id));   // 원 댓글이 숨겨졌으면 답글도 맨 위로 보인다
    const kids = (pid) => list.filter(c => c.parent_id === pid);
    const shown = list.filter(c => !c.deleted).length;
    $('cms').innerHTML = '<div class="sect" style="margin:0 0 4px">댓글 ' + shown + '</div>' + (shown ? roots.map(c => cmHtml(c, false) + kids(c.comment_id).map(k => cmHtml(k, true)).join('')).join('') : '<div class="empty" style="padding:20px 0">첫 댓글을 남겨 보세요.</div>');
    hydrateAvatars($('cms'), 28);
    document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      if (await confirmDialog('댓글을 삭제할까요?', '', '삭제')) { try { await apiCall('DELETE', '/community/comments/' + b.dataset.del, undefined, '삭제하지 못했어요'); loadComments(); } catch (e) { showErr(friendlyError(e)); } }
    }));
    document.querySelectorAll('[data-rep]').forEach(b => b.addEventListener('click', () => sheet('신고 사유를 골라 주세요', REASONS, (v) => report('comments/' + b.dataset.rep, v))));
    document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => {
      const c = list.find(x => x.comment_id === b.dataset.edit), box = document.querySelector('#c-' + c.comment_id + ' .b');
      box.innerHTML = '<div class="cmbar" style="gap:6px"><input id="ed-in" style="height:40px" maxlength="300" aria-label="댓글 수정"><button type="button" class="pill-btn" id="ed-go">저장</button><button type="button" class="lnk" id="ed-x">취소</button></div>';
      const inp = $('ed-in'); inp.value = c.body; inp.focus();
      $('ed-x').addEventListener('click', loadComments);
      $('ed-go').addEventListener('click', async () => {
        const v = inp.value.trim(); if (!v) return;
        try { await apiCall('PATCH', '/community/comments/' + c.comment_id, { body: v }, '수정하지 못했어요'); loadComments(); } catch (e) { showErr(friendlyError(e)); }
      });
    }));
    document.querySelectorAll('[data-cl]').forEach(b => b.addEventListener('click', async () => {
      b.disabled = true;
      try {
        const r = (await apiCall('POST', '/community/comments/' + b.dataset.cl + '/like', undefined, '좋아요를 누르지 못했어요')).data;
        b.classList.toggle('on', r.liked); b.setAttribute('aria-pressed', String(r.liked));
        b.querySelector('.h').textContent = r.liked ? '❤️' : '♡'; b.querySelector('.n').textContent = r.like_count;
      } catch (e) { if (e.code === 'NICKNAME_REQUIRED') location.href = 'nickname.html?next=feed.html'; else showErr(friendlyError(e)); }
      b.disabled = false;
    }));
    document.querySelectorAll('[data-reply]').forEach(b => b.addEventListener('click', () => {
      replyTo = b.dataset.reply; const who = list.find(c => c.comment_id === replyTo);
      $('cm-in').placeholder = (who ? who.author_nickname + '님에게 ' : '') + '답글을 남겨 보세요'; $('cm-in').focus();
      $('cm-cancel').hidden = false;
    }));
    const hash = location.hash.slice(1);   // 알림에서 #c-댓글id로 들어오면 그 댓글로 이동해 잠깐 강조한다
    if (hash && document.getElementById(hash)) { const el = document.getElementById(hash); el.scrollIntoView({ block: 'center' }); el.style.background = 'var(--cream)'; setTimeout(() => { el.style.background = ''; }, 1800); }
  } catch (e) { $('cms').innerHTML = ''; }
}
function clearReply() { replyTo = null; $('cm-in').placeholder = '댓글을 남겨 보세요'; $('cm-cancel').hidden = true; }
$('cm-go').addEventListener('click', async () => {
  const v = $('cm-in').value.trim(); if (!v) return;
  try { await apiCall('POST', '/community/posts/' + id + '/comments', replyTo ? { body: v, parent_id: replyTo } : { body: v }, '댓글을 남기지 못했어요'); $('cm-in').value = ''; clearReply(); $('err').hidden = true; loadComments(); }
  catch (e) { if (e.code === 'NICKNAME_REQUIRED') location.href = 'nickname.html?next=feed.html'; else showErr(friendlyError(e)); }
});
(async () => {
  if (!id) { location.replace('feed.html'); return; }
  try { post = (await apiCall('GET', '/community/posts/' + id, undefined, '글을 불러오지 못했어요')).data; renderPost(); loadComments(); }
  catch (e) { $('post').innerHTML = '<div class="empty">' + esc(e.code === 'COMMUNITY_NOT_FOUND' ? '글을 찾을 수 없어요. 삭제되었거나 숨김 처리된 글일 수 있어요.' : friendlyError(e)) + '</div>'; }
})();
</script>
<script>
if (new URLSearchParams(location.search).get('from') === 'party') document.getElementById('back').href = 'party-feed.html';
</script>
</body>
</html>
