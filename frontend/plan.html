<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 내 12주 계획</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .head h1{margin:0; font-size:28px; font-weight:800; letter-spacing:-.7px; line-height:1.3}
  .rule{background:var(--notice); border-radius:22px; padding:18px 20px; display:flex; flex-direction:column; gap:6px; color:#234257}
  .rule b{font-size:20px; font-weight:800; line-height:1.4}
  .rule span{font-size:14px; line-height:1.65}
  .plan{border:1px solid var(--line); border-radius:22px; padding:6px 18px}
  .rnd{display:flex; gap:14px; padding:16px 0; border-top:1px solid var(--line)}
  .rnd:first-child{border-top:0}
  .rnd .no{width:34px; height:34px; border-radius:17px; background:var(--accent-light); color:#1E3246; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none}
  .rnd .tx{display:flex; flex-direction:column; gap:3px}
  .rnd .tx b{font-size:16px; font-weight:800}
  .rnd .tx .d{font-size:13px; color:var(--muted)}
  .rnd .tx .s{font-size:14px; color:var(--body); line-height:1.6}
  .sig{border:1px solid var(--line); border-radius:22px; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:14px}
  .sig b{font-size:17px; font-weight:800}
  .foot{font-size:13px; color:var(--muted); line-height:1.65; margin:0}
  .bar{position:sticky; bottom:84px; background:#fff; padding:12px 0; display:flex; flex-direction:column; gap:10px; z-index:5}
  .bar .cta,.bar .ghost{height:56px; font-size:17px; border-radius:28px; margin:0}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" id="screen">
        <div class="page-bar"><a class="back" href="dashboard.html" aria-label="뒤로"><span data-icon="back"></span></a></div>
        <div class="head"><h1>내 12주 계획</h1></div>
        <div class="rule"><b>12주 = 4주씩 3번</b><span>4주가 끝날 때마다 바뀐 항목만 다시 입력해 처음과 비교해요.</span></div>
        <div class="plan" id="rounds"></div>
        <div class="sig" id="signal" hidden></div>
        <p class="foot">진단이 아닌 참고 정보입니다. 정확한 판단은 의료진과 상담하세요.</p>
        <div class="bar">
          <a class="cta" id="go-result" href="result.html" style="text-decoration:none">내 분석 결과 보기</a>
          <a class="ghost" id="go-challenge" href="challenges.html" style="text-decoration:none">챌린지 고르러 가기</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
if (!loggedIn()) location.replace('login.html');
const cycle = JSON.parse(localStorage.getItem('paeon-cycle') || 'null');
const pred = JSON.parse(localStorage.getItem('paeon-prediction') || 'null');
const RISK_LABEL = { normal: '양호', borderline: '주의', high: '높음' };
const md = (d) => `${d.getMonth() + 1}월 ${d.getDate()}일`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const started = !!(cycle && cycle.startedOn);
const base = started ? new Date(cycle.startedOn + 'T00:00:00') : new Date(); base.setHours(0, 0, 0, 0);
const STEP = ['처음 상태에서 시작해요', '바뀐 점을 이어서 확인해요', '12주를 마무리해요'];
document.getElementById('rounds').innerHTML = [0, 1, 2].map((k) => {
  const from = addDays(base, k * 28), to = addDays(base, k * 28 + 27);
  return `<div class="rnd"><span class="no">${k + 1}</span><div class="tx"><b>${k + 1}차 · 4주</b><span class="d">${md(from)} ~ ${md(to)}</span><span class="s">${STEP[k]}. 끝나면 다시 입력해요.</span></div></div>`;
}).join('');
if (!started) document.querySelector('.rule span').textContent += ' 날짜는 오늘 시작한다고 보고 계산했어요.';

const a = pred && pred.model_a && pred.model_a.status === 'completed' ? pred.model_a : null;
const sig = document.getElementById('signal');
if (a && RISK_LABEL[a.risk_level]) {
  sig.innerHTML = `<span>10년 내 심장 혈관 건강 신호</span><b>${RISK_LABEL[a.risk_level]}</b>`;
  sig.hidden = false;
} else if (pred && pred.model_a && pred.model_a.status === 'skipped') {
  sig.innerHTML = '<span>이번엔 신호를 분석하지 않아요. 챌린지는 그대로 할 수 있어요.</span>';
  sig.hidden = false;
}
if (started) document.getElementById('go-challenge').href = 'challenge-progress.html', document.getElementById('go-challenge').textContent = '내 챌린지 보기';
</script>
</body>
</html>
