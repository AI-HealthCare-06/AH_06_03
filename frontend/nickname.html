<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 닉네임 정하기</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .pv{height:244px; border-radius:28px; background:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px}
  .pv i{width:110px; height:7px; border-radius:4px; background:var(--line)}
  .tabs{display:flex; border-bottom:1px solid var(--line)}
  .tabs button{flex:1; height:44px; border:0; border-bottom:3px solid transparent; margin-bottom:-1px; background:none; font-size:15px; color:var(--muted)}
  .tabs button.on{color:var(--ink); font-weight:800; border-bottom-color:var(--ink)}
  .grid4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px 8px; min-height:150px; align-content:start}
  .it{display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0; border-radius:16px; background:var(--cream); border:2px solid transparent; color:var(--ink)}
  .it.on{background:var(--notice,#E4F0F5); border-color:var(--accent)}
  .it span{font-size:12px; font-weight:700}
  .sw{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px 0; justify-items:center; padding:8px 0}
  .sw button{width:36px; height:36px; border-radius:18px; padding:0; border:1px solid var(--sage)}
  .sw button.on{box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--ink)}
</style>
</head>
<body>
<div id="header-slot"></div>
<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" style="gap:20px">
        <div class="page-bar"><a class="back" href="feed.html" aria-label="뒤로" id="back"></a><span class="ttl">닉네임</span></div>
        <div>
          <h1 style="font-size:26px; line-height:1.35">커뮤니티에서 쓸<br>닉네임을 정해요</h1>
          <p class="lede" style="margin-top:8px">글·댓글에는 닉네임만 보여요. 이름·연락처는 쓰지 마세요.</p>
        </div>
        <div class="pv"><div id="pv" role="img" aria-label="내 캐릭터 미리보기"></div><i></i></div>
        <div class="tabs" id="tabs"></div>
        <div id="opts"></div>
        <div class="field"><label for="nick">닉네임 (한글·영문·숫자·밑줄 2~10자)</label><input id="nick" maxlength="10" autocomplete="off" placeholder="닉네임 (2~10자)" style="height:48px; border-radius:14px; font-weight:700; font-size:16px"></div>
        <p class="err" id="err" hidden></p>
        <div class="callout" id="gift" style="font-size:18px; font-weight:800; text-align:center; border-radius:20px; padding:16px">처음 정하면 파이 10개 선물</div>
        <button type="button" class="cta" id="save" disabled>커뮤니티 시작하기</button>
      </div>
    </div>
  </div>
</div>
<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
if (!loggedIn()) location.replace('login.html');
document.getElementById('back').innerHTML = ICON.back;
const next = new URLSearchParams(location.search).get('next');
const NEXT_OK = ['write.html', 'feed.html', 'common-challenges.html'];
const dest = NEXT_OK.includes(next) ? next : 'feed.html';
const input = document.getElementById('nick'), btn = document.getElementById('save'), err = document.getElementById('err');
const valid = (v) => /^[0-9A-Za-z가-힣_]{2,10}$/.test(v);
input.addEventListener('input', () => { btn.disabled = !valid(input.value.trim()); err.hidden = true; });
apiCall('GET', '/community/me', undefined, '').then(r => {
  if (r.data.nickname) { input.value = r.data.nickname; btn.disabled = false; document.getElementById('gift').hidden = true; }
}).catch(() => {});
const TAB = { body: '몸체', color: '색', expr: '표정', face: '얼굴', head: '머리' };
const ch = { tab: 'body', slots: [], view: { ...CHARACTER_DEFAULT } };
function renderCh() {
  document.getElementById('pv').innerHTML = characterSvg(ch.view, 176);
  document.getElementById('tabs').innerHTML = Object.entries(TAB).map(([k, l]) => '<button type="button" class="' + (k === ch.tab ? 'on' : '') + '" data-t="' + k + '">' + l + '</button>').join('');
  const sl = ch.slots.find(x => x.slot === ch.tab); if (!sl) return;
  const free = sl.items.filter(i => i.owned);
  document.getElementById('opts').innerHTML = ch.tab === 'color'
    ? '<div class="sw">' + free.map(i => '<button type="button" class="' + (ch.view.color === i.key ? 'on' : '') + '" data-k="' + i.key + '" aria-label="' + i.label + '" style="background:' + i.key + '"></button>').join('') + '</div>'
    : '<div class="grid4">' + free.map(i => '<button type="button" class="it' + (ch.view[ch.tab] === i.key ? ' on' : '') + '" data-k="' + i.key + '" aria-label="' + i.label + '">' + characterSvg({ ...ch.view, [ch.tab]: i.key }, 64) + '<span>' + i.label + '</span></button>').join('') + '</div>';
}
document.getElementById('tabs').addEventListener('click', (e) => { const t = e.target.closest('[data-t]'); if (t) { ch.tab = t.dataset.t; renderCh(); } });
document.getElementById('opts').addEventListener('click', (e) => { const t = e.target.closest('[data-k]'); if (t) { ch.view[ch.tab] = t.dataset.k; renderCh(); } });
renderCh();
Promise.all([apiCall('GET', '/characters/items', undefined, ''), apiCall('GET', '/characters/me', undefined, '')]).then(([it, me]) => { ch.slots = it.data.slots; ch.view = { ...me.data }; renderCh(); }).catch(() => {});
btn.addEventListener('click', async () => {
  btn.disabled = true;
  try {
    const d = (await apiCall('PUT', '/community/me', { nickname: input.value.trim() }, '닉네임을 저장하지 못했어요')).data;
    await apiCall('PUT', '/characters/me', ch.view, '캐릭터를 저장하지 못했어요');
    if (d.pie_gift) await noticeDialog('환영해요!', '시작 선물로 파이 ' + d.pie_gift + '개를 드렸어요.', '확인');
    location.replace(dest);
  } catch (e) {
    err.textContent = e.code === 'NICKNAME_TAKEN' ? '이미 쓰고 있는 닉네임이에요. 다른 닉네임을 적어 주세요.' : friendlyError(e);
    err.hidden = false; btn.disabled = false;
  }
});
</script>
</body>
</html>
