<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 글쓰기</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .sec{display:flex; flex-direction:column; gap:10px}
  .sec .lb{font-size:13px; color:var(--muted)}
  .tt{width:100%; height:56px; border:0; border-bottom:1px solid var(--line); padding:0; font:800 20px 'Nanum Gothic',sans-serif; color:var(--ink); background:transparent}
  .tt:focus{outline:none; border-bottom-color:var(--ink)}
  .bd{width:100%; min-height:200px; border:0; padding:16px 0 0; resize:none; font:500 15px 'Nanum Gothic',sans-serif; line-height:1.7; color:var(--ink); background:transparent}
  .bd:focus{outline:none}
  .att-card{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:16px; padding:12px 14px}
  .att-card .nm{flex:1; display:flex; flex-direction:column; gap:2px}
  .att-card .nm b{font-size:14px}
  .att-card .nm span{font-size:12px; color:var(--muted)}
  .att-card button{border:0; background:none; font-size:13px; color:var(--muted); text-decoration:underline}
  .photo{display:flex; align-items:center; gap:12px; opacity:.7}
  .photo .box{width:72px; height:72px; border:1px dashed var(--sage); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; color:var(--muted); text-align:center}
  .bar{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:430px; padding:12px 20px 28px; background:#fff; border-top:1px solid var(--line); z-index:60}
  .photos{display:flex; gap:10px; flex-wrap:wrap}
  .photos .addp,.photos .th{width:72px; height:72px; border-radius:14px; flex:none; position:relative}
  .photos .addp{border:1px dashed var(--sage); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:22px; color:var(--muted); cursor:pointer}
  .photos .addp small{font-size:11px}
  .photos .th{background:center/cover no-repeat}
  .photos .th button{position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:11px; border:0; background:var(--ink); color:#fff; font-size:13px; line-height:1; padding:0}
</style>
</head>
<body style="padding-bottom:110px">
<div id="header-slot"></div>
<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" style="gap:20px">
        <div class="page-bar"><a class="back" href="feed.html" aria-label="뒤로" id="back"></a><span class="ttl">글쓰기</span></div>
        <div style="background:var(--cream); border-radius:14px; padding:14px 16px; font-size:13px; color:var(--body); line-height:1.6"><b>건강정보와 개인정보는 쓰지 마세요.</b></div>

        <div class="sec"><span class="lb">올릴 곳</span>
          <div class="chips"><button type="button" class="chip on" id="to-all">전체 커뮤니티</button><button type="button" class="chip" id="party">파티</button></div>
          <span class="hint">한 곳에만 올라가요. 파티 글은 파티원에게만 보여요.</span></div>

        <div class="sec" id="card-sec" hidden><span class="lb">파티 연속 인증 카드 붙이기 (선택)</span><div class="chips"><button type="button" class="chip" id="card-chip">파티 연속 인증 카드</button></div></div>
        <div class="sec" id="cat-sec"><span class="lb">카테고리</span><div class="chips" id="cats"></div></div>

        <div class="sec"><span class="lb">오늘 인증한 챌린지 붙이기 (선택)</span>
          <div class="chips" id="att-chips"></div>
          <div id="att-card"></div>
          <span class="hint">이름과 인증 일수만 붙어요.</span></div>

        <div>
          <input class="tt" id="title" maxlength="100" placeholder="제목" aria-label="제목" data-t>
          <textarea class="bd" id="body" maxlength="1000" placeholder="오늘의 챌린지 이야기를 남겨 보세요" aria-label="내용"></textarea>
          <div style="text-align:right; font-size:13px; color:var(--muted)"><span id="cnt">0</span> / 1000</div>
        </div>
        <div class="photos" id="photos"><label class="addp" id="addp"><input type="file" id="pfile" accept="image/*" multiple hidden>+<small id="pcnt">0 / 3</small></label></div>
        <span class="hint">얼굴과 이름이 보이는 사진은 올리지 않아요.</span>
        <p class="err" id="err" hidden></p>
      </div>
    </div>
  </div>
</div>
<div class="bar"><button type="button" class="cta" id="submit" disabled>등록하기</button></div>
<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
if (!loggedIn()) location.replace('login.html');
document.getElementById('back').innerHTML = ICON.back;
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const CATS = [['diet', '식단'], ['exercise', '운동'], ['challenge', '챌린지 인증'], ['tips', '고민과 꿀팁']];
const KIND = { fixed: ['고정', 'fixed'], selected: ['선택', 'selected'], common: ['공통', 'common'] };
const st = { photos: [], cat: 'challenge', options: [], pick: null, to: 'all', inParty: false, card: false };
const $ = (id) => document.getElementById(id);

function renderCats() {
  $('cats').innerHTML = CATS.map(([v, l]) => '<button type="button" class="chip' + (v === st.cat ? ' on' : '') + '" data-v="' + v + '">' + l + '</button>').join('');
  document.querySelectorAll('#cats .chip').forEach(b => b.addEventListener('click', () => { st.cat = b.dataset.v; renderCats(); }));
}
function renderAttach() {
  const opts = st.options;
  $('att-chips').innerHTML = opts.length ? opts.map((o, i) => {
    const k = KIND[o.kind];
    return '<button type="button" class="chip' + (st.pick === i ? ' on' : '') + '" data-i="' + i + '"><span class="ctag ' + k[1] + '" style="margin-right:6px">' + k[0] + '</span>' + esc(o.label) + '</button>';
  }).join('') : '<span class="hint">오늘 인증을 완료한 챌린지만 붙일 수 있어요. <a href="challenge-progress.html" style="text-decoration:underline">챌린지 기록하러 가기</a></span>';
  document.querySelectorAll('#att-chips .chip').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.i; st.pick = st.pick === i ? null : i; renderAttach(); }));
  const o = st.pick === null ? null : opts[st.pick];
  $('att-card').innerHTML = o ? '<div class="att-card"><span class="ctag ' + KIND[o.kind][1] + '">' + KIND[o.kind][0] + '</span><div class="nm"><b>' + esc(o.label) + '</b><span>인증 ' + o.days + '일째</span></div><button type="button" id="att-del">빼기</button></div>' : '';
  const del = $('att-del'); if (del) del.addEventListener('click', () => { st.pick = null; renderAttach(); });
}

// 사진: 고른 파일을 640px·300KB 이하 JPEG로 줄여 미리 보여 주고, 글을 올린 뒤 한 장씩 올린다
function renderPhotos() {
  const box = $('photos');
  box.querySelectorAll('.th').forEach(e => e.remove());
  st.photos.forEach((ph, i) => {
    const d = document.createElement('div'); d.className = 'th'; d.style.backgroundImage = `url(${ph.url})`;
    d.innerHTML = '<button type="button" aria-label="사진 빼기">×</button>';
    d.querySelector('button').addEventListener('click', () => { URL.revokeObjectURL(ph.url); st.photos.splice(i, 1); renderPhotos(); });
    box.insertBefore(d, $('addp'));
  });
  $('addp').hidden = st.photos.length >= PHOTO_MAX_COUNT; $('pcnt').textContent = st.photos.length + ' / ' + PHOTO_MAX_COUNT;
}
$('pfile').addEventListener('change', async (e) => {
  for (const f of [...e.target.files].slice(0, PHOTO_MAX_COUNT - st.photos.length)) {
    try { const b = await shrinkPhotoBlob(f); st.photos.push({ blob: b, url: URL.createObjectURL(b) }); }
    catch (err) { $('err').textContent = err.message; $('err').hidden = false; }
  }
  e.target.value = ''; renderPhotos();
});
function check() { $('submit').disabled = !(($('title').value.trim() || st.to === 'party') && $('body').value.trim()); $('cnt').textContent = $('body').value.length; }
['title', 'body'].forEach(id => $(id).addEventListener('input', check));
// 올릴 곳: 전체 커뮤니티 / 내 파티 (파티 글은 파티원에게만 보이고 카테고리가 없다)
function renderTo() {
  $('to-all').classList.toggle('on', st.to === 'all'); $('party').classList.toggle('on', st.to === 'party');
  $('cat-sec').hidden = st.to === 'party'; $('title').hidden = st.to === 'party'; $('card-sec').hidden = st.to !== 'party'; $('card-chip').classList.toggle('on', st.card); check();
}
$('to-all').addEventListener('click', () => { st.to = 'all'; renderTo(); });
$('card-chip').addEventListener('click', () => { st.card = !st.card; renderTo(); });
$('party').addEventListener('click', async () => {
  if (st.inParty) { st.to = 'party'; renderTo(); return; }
  if (await confirmDialog('들어가 있는 파티가 없어요', '파티를 만들거나 초대 코드로 들어가면 파티 글을 쓸 수 있어요.', '파티로 가기')) location.href = 'party.html';
});
if (new URLSearchParams(location.search).get('to') === 'party') st.to = 'party';
apiCall('GET', '/parties/me', undefined, '').then(() => { st.inParty = true; renderTo(); }).catch(() => { if (st.to === 'party') { st.to = 'all'; renderTo(); } });
$('submit').addEventListener('click', async () => {
  $('submit').disabled = true; $('err').hidden = true;
  const payload = { category: st.to === 'party' ? 'tips' : st.cat, title: st.to === 'party' ? $('body').value.trim().slice(0, 30) : $('title').value.trim(), body: $('body').value.trim() };
  const o = st.pick === null ? null : st.options[st.pick];
  if (st.to === 'party' && st.card) payload.attach = { party_card: true };
  else if (o) payload.attach = o.mission_code ? { mission_code: o.mission_code } : { common_challenge_id: o.common_challenge_id };
  try {
    const d = (await apiCall('POST', st.to === 'party' ? '/parties/me/posts' : '/community/posts', payload, '글을 올리지 못했어요')).data;
    try { for (const ph of st.photos) await apiUploadPhoto(d.post_id, ph.blob); }
    catch (pe) { try { await apiCall('DELETE', '/community/posts/' + encodeURIComponent(d.post_id), undefined, ''); } catch (x) { /* 지우지 못해도 아래 안내는 한다 */ } throw pe; }
    if (d.pie_gain) toastNext('파이 ' + d.pie_gain + '개를 받았어요');   // 팝업 없이 이동한 화면에서 잠깐 알린다
    location.href = st.to === 'party' ? 'party-feed.html' : 'post.html?id=' + encodeURIComponent(d.post_id);
  } catch (e) {
    if (e.code === 'NICKNAME_REQUIRED') { location.href = 'nickname.html?next=write.html'; return; }
    $('err').textContent = e.code === 'ATTACH_NOT_ALLOWED' ? '오늘 인증한 챌린지만 붙일 수 있어요.' : friendlyError(e);
    $('err').hidden = false; $('submit').disabled = false;
  }
});
renderCats(); renderAttach(); renderTo(); renderPhotos(); check();
apiCall('GET', '/community/me', undefined, '').then(r => { if (!r.data.nickname) location.replace('nickname.html?next=write.html'); }).catch(() => {});
apiCall('GET', '/community/attachable', undefined, '').then(r => { st.options = r.data; renderAttach(); }).catch(() => {});
</script>
</body>
</html>
