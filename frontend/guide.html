<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 검사·상담 안내</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body{padding-bottom:170px}
  #header-slot,.tabbar{display:none !important}
  .bar{height:64px; padding:0 8px; display:flex; align-items:center; gap:4px; max-width:430px; margin:0 auto}
  .bar .back{width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--ink)}
  .bar .ttl{font-size:17px; font-weight:800}
  .frame-body{padding:0 20px 28px}
  .alert{background:var(--notice); border:1px solid var(--sky); border-radius:22px; padding:18px; display:flex; flex-direction:column; gap:8px; color:#234257}
  .alert .tag{height:26px; padding:0 12px; border-radius:13px; background:#fff; font-size:13px; font-weight:800; display:inline-flex; align-items:center; align-self:flex-start}
  .alert .big{font-size:18px; font-weight:800; line-height:1.45}
  .alert .sm{font-size:14px; line-height:1.65}
  .gc{border:1px solid var(--line); border-radius:22px; padding:18px; display:flex; flex-direction:column; gap:8px}
  .gc b{font-size:16px; font-weight:800; line-height:1.3}
  .gc div{font-size:14px; color:#4A5C6D; line-height:1.85}
  .foot{font-size:13px; color:var(--muted); line-height:1.65}
  .dock{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:430px; padding:12px 20px 28px; background:#fff; z-index:60; display:flex; flex-direction:column; gap:8px}
  .dock .cta{height:56px; font-size:17px}
  .dock .ghost{height:52px; font-size:16px}
</style>
</head>
<body>

<div id="header-slot"></div>
<div class="bar"><a class="back" href="result.html" aria-label="뒤로" data-icon="back"></a><span class="ttl">검사 · 상담 안내</span></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen">
        <div class="alert">
          <span class="tag">고혈압 범위</span>
          <span class="big">의료기관 진료를 권해요</span>
          <span class="sm">이 화면은 진단이 아니며, 검사 여부는 의사가 판단해요.</span>
        </div>
        <div class="gc"><b>무엇을 상의하면 되나요</b>
          <div>· 혈압이 계속 높게 나오는지<br>· 추가 검사가 필요한지<br>· 생활습관으로 조절 가능한 범위인지</div></div>
        <div class="gc"><b>가져갈 것</b>
          <div>· 최근 혈압 기록<br>· 입력한 검진 수치<br>· 실천 중인 생활습관</div></div>
        <p class="foot">특정 병원이나 검사를 추천하지 않아요.</p>
      </div>
    </div>
  </div>
</div>

<div class="dock">
  <a class="cta" href="challenges.html">챌린지도 함께 시작하기</a>
  <a class="ghost" href="result.html">결과로 돌아가기</a>
</div>

<script src="assets/common.js"></script>
</body>
</html>
