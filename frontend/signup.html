<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 회원가입</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .modal-backdrop{position:fixed; inset:0; background:rgba(56,64,56,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100}
  .modal-card{background:#fff; border-radius:20px; padding:24px 22px; max-width:340px; width:100%; text-align:center; box-shadow:0 12px 30px rgba(56,64,56,.2)}
  .modal-card b{font-size:15px}
  body{padding-bottom:290px}
  #header-slot{display:none}
  .bar{height:64px; padding:0 8px; display:flex; align-items:center; gap:4px; max-width:430px; margin:0 auto}
  .bar .back{width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--ink)}
  .frame-body{padding:0 20px 28px}
  .screen{gap:0}
  .h1{font-size:28px; font-weight:800; letter-spacing:-.7px; line-height:1.3}
  .sub{font-size:14px; color:#4A5C6D; line-height:1.6; margin-top:10px}
  .fields{display:flex; flex-direction:column; gap:16px; padding-top:28px}
  .field{gap:8px}
  .field label{font-weight:500; line-height:1.25}
  .field input{height:56px; border:2px solid transparent; border-radius:14px; font-size:16px; font-weight:500}
  .field input:focus{outline:0; border-color:var(--ink)}
  .agrees{padding-top:28px; display:flex; flex-direction:column}
  .agrees input[type=checkbox]{width:22px; height:22px; margin:0; flex:none; accent-color:var(--sage-deep)}
  .ag-all{display:flex; align-items:center; gap:12px; min-height:56px; font-size:16px; font-weight:800; border-bottom:1px solid var(--line)}
  .ag{display:flex; align-items:center; justify-content:space-between; min-height:52px}
  .ag label{display:flex; align-items:center; gap:12px; font-size:14px; flex:1}
  .ag a{min-height:44px; display:flex; align-items:center; font-size:13px; color:var(--muted); text-decoration:underline; white-space:nowrap; padding-left:8px}
  .agrees .hint{padding-top:6px; font-size:12px}
  .dock{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:430px; padding:12px 20px 28px; background:#fff; border-top:1px solid var(--line); z-index:60; display:flex; flex-direction:column; gap:8px}
  .dock .cta{height:56px; font-size:17px}
  .dock a{min-height:44px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--muted); text-decoration:none}
  .dock .note{font-size:12px; color:var(--muted); line-height:1.6; text-align:center}
</style>
</head>
<body>

<div id="header-slot"></div>
<div class="bar"><a class="back" href="index.html" aria-label="뒤로" data-icon="back"></a></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen">
        <div style="padding-top:16px"><div class="h1">회원가입</div><div class="sub" style="font-size:17px; font-weight:800; color:var(--ink)">만 19세 이상부터 가입할 수 있어요</div></div>

        <form id="signup-form">
          <div class="fields">
            <div class="field">
              <label for="email">이메일</label>
              <input id="email" type="email" placeholder="example@email.com" required>
            </div>
            <div class="field">
              <label for="pw">비밀번호</label>
              <input id="pw" type="password" placeholder="8자 이상" minlength="8" required>
            </div>
            <div class="field">
              <label for="pw2">비밀번호 확인</label>
              <input id="pw2" type="password" placeholder="한 번 더 입력" minlength="8" required>
            </div>
            <div class="field">
              <label for="birth">생년월일</label>
              <input id="birth" type="date" required>
            </div>
          </div>

          <p id="form-err" class="err" style="margin-top:10px; display:none"></p>

          <div class="agrees">
            <label class="ag-all"><input id="agree-all" type="checkbox">전체 동의</label>
            <div class="ag">
              <label><input id="agree-terms" class="agree" type="checkbox" required>[필수] 서비스 이용약관 동의</label>
              <a href="#" class="view-terms" data-types="terms_of_service">내용 보기</a>
            </div>
            <div class="ag">
              <label><input id="agree-privacy" class="agree" type="checkbox" required>[필수] 개인정보 수집·이용 동의</label>
              <a href="#" class="view-terms" data-types="privacy">내용 보기</a>
            </div>
            <div class="ag">
              <label><input id="agree-health" class="agree" type="checkbox" required>[필수] 건강정보(민감정보) 수집·이용 동의</label>
              <a href="#" class="view-terms" data-types="health_data">내용 보기</a>
            </div>
            <div class="ag">
              <label><input id="agree-age" class="agree" type="checkbox" required>[필수] 만 19세 이상입니다.</label>
            </div>
            <p class="hint"><a href="terms.html" target="_blank" style="text-decoration:underline; color:var(--muted)">이용약관 전문 보기</a> · <a href="privacy.html" target="_blank" style="text-decoration:underline; color:var(--muted)">개인정보 처리방침 전체 보기</a></p>
          </div>

          <div id="age-box" class="callout" style="margin-top:12px; display:none">
            <b>만 19세 미만은 가입할 수 없어요 · </b>이 서비스는 만 19세 이상만 이용할 수 있습니다.
          </div>

          <div class="dock">
            <button type="submit" id="submit-btn" class="cta">가입하기</button>
            <a href="login.html">이미 계정이 있어요 · 로그인</a>
            <div class="note">이름·전화번호는 받지 않아요.</div>
            <a href="guest-inquiry.html" style="font-size:13px; text-decoration:underline">가입이 안 되나요? 문의하기</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="terms-modal" class="modal-backdrop" style="display:none">
  <div class="modal-card" style="max-width:520px; max-height:80vh; overflow:auto; text-align:left">
    <div id="terms-body" style="font-size:13px; line-height:1.6"></div>
    <button type="button" id="terms-close" class="cta" style="margin-top:14px">닫기</button>
  </div>
</div>

<div id="success-modal" class="modal-backdrop" style="display:none">
  <div class="modal-card">
    <div style="font-size:32px">✅</div>
    <b>회원가입 완료</b>
    <a class="cta" style="display:block; text-align:center; text-decoration:none; margin-top:14px" href="index.html">확인</a>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script src="assets/policies.js"></script>
<script>
// 전체 동의: 아래 네 개를 한 번에 켜고 끈다
document.getElementById('agree-all').addEventListener('change', (e) => document.querySelectorAll('.agree').forEach(c => { c.checked = e.target.checked; }));
document.querySelectorAll('.agree').forEach(c => c.addEventListener('change', () => { document.getElementById('agree-all').checked = [...document.querySelectorAll('.agree')].every(x => x.checked); }));
</script>
<script>
// 가입할 때 서버에 보내는 동의: 화면에 보여 준 정책(서버의 현재 유효한 정책)의 ID·버전과 체크 값. 서버가 이 값을 검사하고 그대로 기록한다.
const AGREE_BOX = { terms_of_service: 'agree-terms', privacy: 'agree-privacy', health_data: 'agree-health' };
let shownPolicies = null;
async function fetchServerPolicies() {
  try {
    const list = (await (await fetch(`${API_BASE}/consent-policies/active`)).json()).data;
    if (Array.isArray(list) && list.length) return list;
  } catch (e) { /* 아래에서 다시 시도 */ }
  return null;
}
fetchServerPolicies().then(l => { shownPolicies = l; });
function buildConsents() {
  return Object.keys(AGREE_BOX).map(t => {
    const p = (shownPolicies || []).find(x => x.policy_type === t);
    return p ? { policy_id: p.policy_id, version: p.version, agreed: document.getElementById(AGREE_BOX[t]).checked } : null;
  });
}

// 약관 내용 보기: 서버의 현재 유효한 정책(GET /consent-policies/active)을 보여 주고, 못 받으면 내장 문구(policies.js)를 보여 준다.
const TERMS_TITLE = { terms_of_service: '이용약관', privacy: '개인정보 수집·이용', health_data: '건강정보(민감정보) 수집·이용' };
const esc = (t) => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
document.querySelectorAll('.view-terms').forEach(a => a.addEventListener('click', async (e) => {
  e.preventDefault(); e.stopPropagation();
  const body = document.getElementById('terms-body');
  body.innerHTML = '<p>불러오는 중...</p>';
  document.getElementById('terms-modal').style.display = 'flex';
  try {
    const policies = await loadActivePolicies();
    const want = a.dataset.types.split(',');
    body.innerHTML = want.map(t => policies.find(p => p.policy_type === t)).filter(Boolean).map(p => `
      <h3 style="margin:0 0 6px">${TERMS_TITLE[p.policy_type]}</h3>
      <p><b>목적</b><br>${esc(p.purpose_text)}</p>
      <p><b>수집 항목</b><br>${esc(p.collection_items)}</p>
      <p><b>보유·이용 기간</b><br>${esc(p.retention_policy)}</p>
      <p><b>동의 거부·철회 방법</b><br>${esc(p.withdrawal_method)}</p>
      <p><b>제3자 제공</b><br>${esc(p.third_party_notice)}</p>`).join('<hr style="margin:12px 0">') || '<p>내용을 찾지 못했어요.</p>';
  } catch (err) { body.innerHTML = '<p>내용을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</p>'; }
}));
document.getElementById('terms-close').addEventListener('click', () => { document.getElementById('terms-modal').style.display = 'none'; });

function ageOf(birthDateStr) {
  const birth = new Date(birthDateStr);
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const beforeBirthdayThisYear = now < new Date(now.getFullYear(), birth.getMonth(), birth.getDate());
  if (beforeBirthdayThisYear) age--;
  return age;
}

const form = document.getElementById('signup-form');
const birthInput = document.getElementById('birth');
const ageBox = document.getElementById('age-box');
const MIN_AGE = 19;   // 서버(auth_service.MIN_AGE)·이용약관과 같은 기준
const errEl = document.getElementById('form-err');
const submitBtn = document.getElementById('submit-btn');

birthInput.addEventListener('change', () => {
  ageBox.style.display = birthInput.value && ageOf(birthInput.value) < MIN_AGE ? 'block' : 'none';
});

function showError(msg) {
  errEl.textContent = msg;
  errEl.style.display = 'block';
}
function clearError() {
  errEl.style.display = 'none';
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  clearError();

  const email = document.getElementById('email').value;
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  const birth = birthInput.value;

  if (ageOf(birth) < MIN_AGE) return showError('만 19세 이상만 가입할 수 있어요');
  if (pw.length < 8) return showError('비밀번호는 8자 이상이어야 합니다');
  if (pw !== pw2) return showError('비밀번호 확인이 일치하지 않습니다');
  if (![...document.querySelectorAll('.agree')].every(c => c.checked)) {
    return showError('필수 동의 항목을 체크해주세요');
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '가입하는 중...';
  try {
    if (!shownPolicies) shownPolicies = await fetchServerPolicies();
    const consents = buildConsents();
    if (consents.some(c => !c)) throw new Error('약관을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
    await apiSignup(email, pw, birth, { consents });
    ['paeon-eligibility', 'paeon-health', 'paeon-survey', 'paeon-prediction', 'paeon-cycle', 'paeon-cycle-history', 'paeon-progress'].forEach(k => localStorage.removeItem(k));
    localStorage.setItem('paeon-profile', JSON.stringify({ email, birth }));
    // 가입 후 자동 로그인하지 않고 홈에서 다시 로그인하게 한다
    PaeonTokens.clear();
    document.getElementById('success-modal').style.display = 'flex';
  } catch (e) {
    showError(friendlyError(e));
    submitBtn.disabled = false;
    submitBtn.textContent = '가입하기';
  }
});
</script>
</body>
</html>
