<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 로그인</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body{padding-bottom:110px}
  #header-slot{display:none}
  .bar{height:64px; padding:0 8px; display:flex; align-items:center; gap:4px; max-width:430px; margin:0 auto}
  .bar .back{width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--ink)}
  .bar .ttl{font-size:17px; font-weight:800}
  .frame-body{padding:0 20px 28px}
  .screen{gap:0}
  .h1{font-size:28px; font-weight:800; letter-spacing:-.7px; line-height:1.3}
  .sub{font-size:14px; color:#4A5C6D; line-height:1.6; margin-top:10px}
  .fields{display:flex; flex-direction:column; gap:16px}
  .field{gap:8px}
  .field label{font-weight:500; line-height:1.25}
  .field input{height:56px; border:2px solid transparent; border-radius:14px; font-size:16px; font-weight:500}
  .field input:focus{outline:0; border-color:var(--ink)}
  .keep{display:flex; align-items:center; gap:10px; min-height:44px; font-size:14px; color:#4A5C6D}
  .keep input{width:22px; height:22px; margin:0; accent-color:var(--sage-deep)}
  .links{padding-top:8px; display:flex; justify-content:center; gap:20px; font-size:14px; color:var(--muted)}
  .links a{min-height:44px; display:flex; align-items:center; text-decoration:underline}
  .dock{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:430px; padding:12px 20px 28px; background:#fff; z-index:60}
  .dock .cta{height:56px; font-size:17px}
</style>
</head>
<body>

<div id="header-slot"></div>
<div class="bar"><a class="back" href="index.html" aria-label="뒤로" data-icon="back"></a></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen">
        <div style="padding-top:24px"><div class="h1">다시 만나서<br>반가워요</div><div class="sub">가입한 이메일로 로그인해 주세요.</div></div>

        <form id="login-form" style="padding-top:36px">
          <div class="fields">
            <div class="field">
              <label for="email">이메일</label>
              <input id="email" type="email" placeholder="example@email.com" required>
            </div>
            <div class="field">
              <label for="pw">비밀번호</label>
              <input id="pw" type="password" placeholder="비밀번호" required>
            </div>
            <label class="keep"><input type="checkbox" checked onclick="return false">로그인 상태 유지</label>
          </div>

          <p id="form-err" class="err" style="margin-top:4px; display:none"></p>

          <div class="dock"><button type="submit" id="submit-btn" class="cta">로그인</button></div>
        </form>

        <div class="links"><a href="signup.html">회원가입</a><a href="guest-inquiry.html">문의하기</a></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const form = document.getElementById('login-form');
const errEl = document.getElementById('form-err');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errEl.style.display = 'none';

  const email = document.getElementById('email').value;
  const pw = document.getElementById('pw').value;

  submitBtn.disabled = true;
  submitBtn.textContent = '로그인하는 중...';
  try {
    const res = await apiLogin(email, pw);
    localStorage.setItem('paeon-access-token', res.data.access_token);
    localStorage.setItem('paeon-refresh-token', res.data.refresh_token);
    if (!localStorage.getItem('paeon-profile')) {
      localStorage.setItem('paeon-profile', JSON.stringify({ email }));
    }
    await apiSyncAfterLogin();
    // 처음 가입한 사람은 대상 확인부터 시작한다 (이미 한 사람은 서버에서 복원돼 바로 대시보드로)
    window.location.href = localStorage.getItem('paeon-eligibility') ? 'dashboard.html' : 'eligibility.html';
  } catch (e) {
    errEl.textContent = friendlyError(e);
    errEl.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = '로그인';
  }
});
</script>
</body>
</html>
