<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" style="max-width:420px; margin:0 auto; width:100%">
        <h3 style="text-align:center">파이온 PAEON</h3>

        <form id="login-form">
          <div class="field">
            <label for="email">이메일</label>
            <input id="email" type="email" placeholder="you@email.com" required>
          </div>
          <div class="field" style="margin-top:10px">
            <label for="pw">비밀번호</label>
            <input id="pw" type="password" required>
          </div>

          <p id="form-err" class="err" style="margin-top:8px; display:none"></p>

          <button type="submit" id="submit-btn" class="cta" style="margin-top:14px">로그인</button>
        </form>

        <p class="hint" style="text-align:center; margin-top:10px">계정이 없으신가요? <a href="signup.html">회원가입</a></p>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const form = document.getElementById('login-form');
const errEl = document.getElementById('form-err');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errEl.style.display = 'none';

  const email = document.getElementById('email').value;
  const pw = document.getElementById('pw').value;

  submitBtn.disabled = true;
  submitBtn.textContent = '로그인하는 중...';
  try {
    const res = await apiLogin(email, pw);
    localStorage.setItem('paeon-access-token', res.data.access_token);
    localStorage.setItem('paeon-refresh-token', res.data.refresh_token);
    if (!localStorage.getItem('paeon-profile')) {
      localStorage.setItem('paeon-profile', JSON.stringify({ email }));
    }
    window.location.href = 'dashboard.html';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = '로그인';
  }
});
</script>
</body>
</html>
