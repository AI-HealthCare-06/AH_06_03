<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 캘린더</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .top{display:flex; align-items:center; justify-content:space-between}
  .top b{font-size:20px; font-weight:800}
  .top a{height:36px; padding:0 14px; border-radius:18px; border:1px solid var(--sage); font-size:13px; font-weight:700; display:flex; align-items:center; text-decoration:none}
  .cal-head{display:flex; align-items:center; justify-content:space-between}
  .cal-head .ym{font-size:18px; font-weight:800; cursor:pointer; padding:4px 8px; border-radius:10px}
  .cal-head button{width:44px; height:44px; border:0; background:none; color:var(--ink); padding:0; display:flex; align-items:center; justify-content:center}
  .jump-pop{display:flex; gap:6px; align-items:center; background:var(--cream); border-radius:14px; padding:8px 10px}
  .jump-pop input,.jump-pop select{font:inherit; font-size:13px; padding:6px 8px; border-radius:8px; border:1.5px solid var(--line)}
  .jump-pop input{width:70px}
  .dow-row{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); text-align:center; font-size:13px; color:var(--muted); padding-bottom:6px}
  .day-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px}
  .day{position:relative; aspect-ratio:1/1; border-radius:10px; background:var(--cream); cursor:pointer; overflow:hidden; box-sizing:border-box}
  .day.blank{visibility:hidden; cursor:default}
  .day .num{position:absolute; top:4px; left:6px; font-size:13px; line-height:1; color:#4A5C6D; z-index:1}
  .day.future .num{color:#8A98A5}
  .day.has-photo{background:#AACDDC}
  .day.has-photo .num{color:var(--ink)}
  .day .photo{position:absolute; inset:0; background-size:cover; background-position:center}
  .day.picked{border:2px solid var(--ink)}
  .day.picked .num,.day.today .num{font-weight:800}
  .day .memo{position:absolute; right:5px; bottom:5px; width:6px; height:6px; border-radius:3px; background:var(--accent); z-index:1}
  .cal-legend{display:flex; gap:16px; padding-top:12px; font-size:12px; color:var(--muted)}
  .cal-legend span{display:inline-flex; align-items:center; gap:6px}
  .cal-legend .a{width:12px; height:12px; border-radius:4px; background:#AACDDC}
  .cal-legend .b{width:6px; height:6px; border-radius:3px; background:var(--accent)}

  .sel{display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--line); padding-top:18px}
  .sel h2{font-size:18px}
  .diary{background:var(--cream); border-radius:20px; padding:16px 18px; display:flex; flex-direction:column; gap:6px}
  .diary .hd{display:flex; justify-content:space-between; align-items:center}
  .diary .hd b{font-size:14px}
  .diary .hd button{min-height:32px; border:0; background:none; font-size:13px; font-weight:700; color:var(--accent)}
  .diary textarea{font:inherit; font-size:14px; line-height:1.6; color:#4A5C6D; border:0; background:#fff; border-radius:12px; padding:10px 12px; width:100%; min-height:72px; resize:vertical}
  .photos{display:flex; gap:10px; align-items:flex-start}
  .photos .ph{width:84px; height:84px; border-radius:16px; background:var(--cream-2) center/cover; flex:none}
  .photos .add{width:84px; height:84px; box-sizing:border-box; border-radius:16px; border:1.5px dashed var(--sage); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer}
  .photos .rm{align-self:center; height:32px; padding:0 12px; border-radius:16px; border:1px solid var(--risk); background:#fff; color:var(--risk); font-size:12px; font-weight:700}
  .todos h3{font-size:14px; padding:4px 0}
  .trow{display:flex; align-items:center; gap:12px; min-height:48px}
  .trow .chk{width:26px; height:26px; border-radius:13px; box-sizing:border-box; border:2px solid var(--accent); flex:none; display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; padding:0; background:none}
  .trow.done .chk{background:var(--accent)}
  .trow .tx{font-size:15px; flex:1; min-width:0}
  .trow.done .tx{color:var(--muted); text-decoration:line-through}
  .tag{height:22px; padding:0 8px; border-radius:11px; font-size:12px; font-weight:700; display:inline-flex; align-items:center; flex:none}
  .tag.chal{background:var(--notice); color:#234257}
  .tag.mine{background:var(--cream-2); color:#4A5C6D}
  .small-btn{height:32px; padding:0 10px; font-size:12px; border-radius:16px; border:1px solid var(--sage); background:#fff; color:var(--ink); font-weight:700}
  .small-btn.danger{border-color:var(--risk); color:var(--risk)}
  .trow .acts{display:flex; gap:6px; flex:none}
  .edit-row{display:flex; gap:8px; align-items:center}
  .edit-row input{flex:1; min-width:0; height:44px; border:0; border-radius:12px; background:var(--cream); padding:0 14px; font:inherit; font-size:15px}
  .recs{display:flex; flex-direction:column; gap:10px; background:var(--cream); border-radius:20px; padding:16px 16px 18px; margin-top:10px}
  .recs b{font-size:14px}
  .recs span.s{font-size:13px; color:#4A5C6D}
  .recs .chips{display:flex; gap:8px; flex-wrap:wrap}
  .idea-chip{height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--sage); background:#fff; font-size:14px; display:inline-flex; align-items:center; gap:6px; color:var(--ink)}
  .add-row{display:flex; gap:8px; margin-top:10px}
  .add-row input{flex:1; min-width:0; height:52px; border:0; border-radius:14px; background:var(--cream); padding:0 16px; font:inherit; font-size:15px; color:var(--ink)}
  .add-row button{width:76px; height:52px; border:0; border-radius:14px; background:var(--accent-light); color:#1E3246; font-weight:700; font-size:15px}
  .note{font-size:12.5px; color:var(--muted)}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen">
        <div class="top"><b>캘린더</b><a href="trend.html">내 기록으로</a></div>
        <div id="cal-wrap"></div>
        <div id="detail-wrap"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
function localIso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// 저장소: 서버(GET/PUT /calendar/...)가 되면 서버에 저장하고, 서버에 API가 없거나 실패하면 브라우저(localStorage)에 저장한다.
const STORE_KEY = 'paeon-calendar';
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{"entries":{}}'); } catch (e) { return { entries: {} }; } }
let store = load();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* 용량 초과 등 */ } }
let serverOn = true;                 // 서버 저장 가능 여부 (한 번 실패하면 이 화면에서는 브라우저 저장으로)
let serverNote = '';
const loadedMonths = new Set();
async function srv(method, path, body) {
  if (!serverOn) throw new Error('server off');
  try { return (await apiCall(method, path, body, '캘린더 저장에 실패했습니다')); }
  catch (e) { serverOn = false; serverNote = '서버에 저장하지 못해 이 브라우저에만 저장하고 있어요.'; throw e; }
}
// 그 달의 서버 기록을 가져와 화면 데이터에 합친다
async function loadMonth(y, m) {
  const key = `${y}-${String(m + 1).padStart(2, '0')}`;
  if (!serverOn || loadedMonths.has(key)) return;
  loadedMonths.add(key);
  try {
    const days = (await srv('GET', `/calendar/days?month=${key}`)).data;
    const prefix = key + '-';
    Object.keys(store.entries).filter(k => k.startsWith(prefix)).forEach(k => delete store.entries[k]);   // 서버 값이 기준
    days.forEach(d => {
      store.entries[d.entry_date] = { photo: null, hasPhoto: !!d.has_photo, diary: d.diary || '', todos: d.todos.map(t => ({ id: t.todo_id, text: t.text, done: t.done })) };
    });
    save(); render(); loadPhoto(selectedKey);
  } catch (e) { render(); }
}
// 사진은 작게 줄여서(가로세로 최대 640px, JPEG) 보낸다. 서버는 약 300KB까지 받는다.
function shrinkPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 640 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let q = 0.75, out = c.toDataURL('image/jpeg', q);
      while (out.length > 380000 && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(img.src); resolve(out);
    };
    img.onerror = () => reject(new Error('이미지를 읽지 못했어요'));
    img.src = URL.createObjectURL(file);
  });
}

const cycle = JSON.parse(localStorage.getItem('paeon-cycle') || 'null');
const progress = JSON.parse(localStorage.getItem('paeon-progress') || '{"days":[],"bpLog":[]}');
const cycleStartedOn = cycle ? new Date(cycle.startedOn + 'T00:00:00') : null;
function chalOnDate(dt) {
  if (!cycleStartedOn) return false;
  const idx = Math.round((dt - cycleStartedOn) / 86400000);
  return idx >= 0 && idx < 28 && progress.days.includes(idx);
}
function bpOnDate(dt) { return progress.bpLog.some(l => l.date === localIso(dt)); }

const today = new Date(); today.setHours(0, 0, 0, 0);

const CHECK = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5l2.5 2.5L11 4.5"/></svg>';
// 그날의 챌린지 기록은 읽기만 한다 (기록은 챌린지 화면에서)
function chalLogHtml(key) {
  if (!cycle || !cycleStartedOn) return '';
  const idx = Math.round((new Date(key + 'T00:00:00') - cycleStartedOn) / 86400000);
  const day = progress.logs && progress.logs[idx];
  if (idx < 0 || idx >= 28) return '';
  return cycle.missions.map(m => {
    const done = day && day[m.id] && day[m.id].status === 'completed';
    return `<div class="trow${done ? ' done' : ''}"><span class="chk" role="img" aria-label="${done ? '완료' : '미완료'}">${done ? CHECK : ''}</span><span class="tx">${escapeHtml(m.t)}</span><a class="tag chal" href="challenge-progress.html" style="text-decoration:none">챌린지</a></div>`;
  }).join('');
}

function blankEntry() { return { photo: null, diary: '', todos: [] }; }
function entryFor(key) { return store.entries[key] || blankEntry(); }
function ensureEntry(key) { if (!store.entries[key]) store.entries[key] = blankEntry(); return store.entries[key]; }

const params = new URLSearchParams(location.search);
const qDate = params.get('date');
const initialDate = (qDate && /^\d{4}-\d{2}-\d{2}$/.test(qDate)) ? new Date(qDate + 'T00:00:00') : today;

let viewYear = initialDate.getFullYear(), viewMonth = initialDate.getMonth();
let selectedKey = localIso(initialDate);
let jumpOpen = false;
let editingTodoIndex = null;

async function addTodo(text) {
  const todo = { text, done: false };
  ensureEntry(selectedKey).todos.push(todo); save(); render();
  try { todo.id = (await srv('POST', `/calendar/days/${selectedKey}/todos`, { text })).data.todo_id; save(); } catch (e) { /* 브라우저에만 저장됨 */ }
}

// 달 목록에는 사진이 없고 has_photo만 온다. 날짜를 고르면 그날 사진을 따로 받는다.
async function loadPhoto(key) {
  const e = store.entries[key];
  if (!serverOn || !e || e.photo || !e.hasPhoto) return;
  try { e.photo = (await srv('GET', `/calendar/entries/${key}`)).data.photo; render(); } catch (err) { /* 사진 없이 표시 */ }
}

function selectDay(key) {
  loadPhoto(key);
  selectedKey = key;
  editingTodoIndex = null;
  render();
}

function jumpHtml() {
  if (!jumpOpen) return '';
  const opts = Array.from({ length: 12 }, (_, i) => `<option value="${i}" ${i === viewMonth ? 'selected' : ''}>${i + 1}월</option>`).join('');
  return `<div class="jump-pop">
    <input type="number" id="jump-year" value="${viewYear}">
    <select id="jump-month">${opts}</select>
    <button type="button" id="jump-go" class="ghost" style="width:auto; padding:8px 14px">이동</button>
  </div>`;
}

function calendarCellsHtml() {
  const firstDow = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;   // 월요일 시작
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < firstDow; i++) cells += `<div class="day blank"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(viewYear, viewMonth, d);
    const key = localIso(dt);
    const entry = store.entries[key];
    const cls = ['day'];
    if (key === localIso(today)) cls.push('today');
    if (key === selectedKey) cls.push('picked');
    if (dt > today) cls.push('future');
    const hasPhoto = entry && (entry.photo || entry.hasPhoto);
    if (hasPhoto) cls.push('has-photo');
    const photoLayer = entry && entry.photo ? `<span class="photo" style="background-image:url('${entry.photo}')"></span>` : '';
    const memo = entry && entry.diary ? '<i class="memo"></i>' : '';
    cells += `<div class="${cls.join(' ')}" data-key="${key}">${photoLayer}<span class="num">${d}</span>${memo}</div>`;
  }
  return cells;
}

function photoPanelHtml(entry) {
  const add = `<label class="add" aria-label="사진 추가"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><input type="file" accept="image/*" id="photo-input" style="display:none"></label>`;
  if (entry.photo) return `<div class="photos"><span class="ph" style="background-image:url('${entry.photo}')"></span><button type="button" class="rm" id="photo-remove">사진 삭제</button></div>`;
  return `<div class="photos">${add}</div>`;
}

// 혈압에 도움이 되는 걸로 연구된 활동만 (가이드 §4 미션 ACT-1~3). 다른 건 직접 입력한다.
const HEALTH_IDEAS = ['빠르게 걷기 30분', '벽 스쿼트 2분 × 4번', '평소보다 2,000보 더 걷기'];

function todoListHtml(entry) {
  const rows = entry.todos.map((t, i) => editingTodoIndex === i
    ? `<div class="edit-row"><input id="todo-edit-input" value="${escapeHtml(t.text)}"><button type="button" class="small-btn" data-act="save-todo" data-i="${i}">완료</button></div>`
    : `<div class="trow${t.done ? ' done' : ''}">
        <button type="button" class="chk" aria-label="${t.done ? '완료 취소' : '완료'}" data-act="toggle-todo" data-i="${i}">${t.done ? CHECK : ''}</button><span class="tx">${escapeHtml(t.text)}</span><span class="tag mine">내가 추가</span>
        <div class="acts"><button type="button" class="small-btn" data-act="edit-todo" data-i="${i}">수정</button><button type="button" class="small-btn danger" data-act="del-todo" data-i="${i}">삭제</button></div>
      </div>`).join('');
  const chips = HEALTH_IDEAS.map(t => `<button type="button" class="idea-chip" data-idea="${escapeHtml(t)}"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#5C86AC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 2v10M2 7h10"/></svg>${escapeHtml(t)}</button>`).join('');
  return `<div class="todos">
    <h3>오늘 할 일</h3>
    ${chalLogHtml(selectedKey)}${rows}
    <div class="recs"><div><b>건강 활동을 추천해요</b><br><span class="s">눌러서 추가해요</span></div><div class="chips">${chips}</div></div>
    <div class="add-row"><label for="todo-input" style="position:absolute; left:-9999px">할 일 직접 추가</label><input id="todo-input" placeholder="내 할 일 직접 적기"><button type="button" id="todo-add">추가</button></div>
  </div>`;
}

function detailHtml() {
  const entry = entryFor(selectedKey);
  const d = new Date(selectedKey + 'T00:00:00');
  const label = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
  return `<div class="sel">
    <h2>${label}</h2>
    <div class="diary">
      <div class="hd"><b>일기</b><button type="button" id="diary-save">${entry.diary ? "수정" : "등록"}</button></div>
      <textarea id="diary-text" aria-label="일기" placeholder="오늘 챌린지는 어땠나요?">${escapeHtml(entry.diary)}</textarea>
    </div>
    ${photoPanelHtml(entry)}
    ${todoListHtml(entry)}
    ${serverNote ? `<p class="note" style="color:var(--warn)">${serverNote}</p>` : ''}
  </div>`;
}

function wire() {
  document.getElementById('cal-prev').addEventListener('click', () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } jumpOpen = false; render(); });
  document.getElementById('cal-next').addEventListener('click', () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } jumpOpen = false; render(); });
  document.getElementById('ym-label').addEventListener('click', () => { jumpOpen = !jumpOpen; render(); });
  const jumpGo = document.getElementById('jump-go');
  if (jumpGo) jumpGo.addEventListener('click', () => {
    viewYear = Number(document.getElementById('jump-year').value) || viewYear;
    viewMonth = Number(document.getElementById('jump-month').value);
    jumpOpen = false; render();
  });
  document.querySelectorAll('.day[data-key]').forEach(el => el.addEventListener('click', () => selectDay(el.dataset.key)));

  document.getElementById('diary-save').addEventListener('click', async () => {
    const text = document.getElementById('diary-text').value;
    ensureEntry(selectedKey).diary = text;
    save();
    try { await srv('PUT', `/calendar/entries/${selectedKey}`, { diary: text }); } catch (e) { /* 브라우저에만 저장됨 */ }
    const btn = document.getElementById('diary-save');
    if (btn) { btn.textContent = serverOn ? '등록됨' : '이 브라우저에 등록됨'; setTimeout(() => { if (document.getElementById('diary-save')) { document.getElementById('diary-save').textContent = '수정'; render(); } }, 1200); }
  });

  const photoInput = document.getElementById('photo-input');
  if (photoInput) photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (!file) return;
    shrinkPhoto(file).then(async (data) => {
      ensureEntry(selectedKey).photo = data; save();
      try { await srv('PUT', `/calendar/entries/${selectedKey}`, { photo: data }); } catch (e) { /* 브라우저에만 저장됨 */ }
      render();
    }).catch(() => {});
  });
  const rm = document.getElementById('photo-remove');
  if (rm) rm.addEventListener('click', async () => {
    ensureEntry(selectedKey).photo = null; save();
    try { await srv('PUT', `/calendar/entries/${selectedKey}`, { photo: null }); } catch (e) {}
    render();
  });

  document.getElementById('todo-add').addEventListener('click', () => {
    const input = document.getElementById('todo-input');
    if (!input.value.trim()) return;
    addTodo(input.value.trim());
  });
  document.querySelectorAll('[data-idea]').forEach(btn => btn.addEventListener('click', () => addTodo(btn.dataset.idea)));
  document.querySelectorAll('[data-act="toggle-todo"]').forEach(el => el.addEventListener('click', () => {
    const i = Number(el.dataset.i);
    const t = entryFor(selectedKey).todos[i];
    t.done = !t.done; save(); render();
    if (t.id) srv('PATCH', `/calendar/todos/${t.id}`, { done: t.done }).catch(() => {});
  }));
  document.querySelectorAll('[data-act="edit-todo"]').forEach(btn => btn.addEventListener('click', () => {
    editingTodoIndex = Number(btn.dataset.i); render();
  }));
  document.querySelectorAll('[data-act="del-todo"]').forEach(btn => btn.addEventListener('click', () => {
    const [t] = entryFor(selectedKey).todos.splice(Number(btn.dataset.i), 1);
    save(); render();
    if (t && t.id) srv('DELETE', `/calendar/todos/${t.id}`).catch(() => {});
  }));
  const saveTodoBtn = document.querySelector('[data-act="save-todo"]');
  if (saveTodoBtn) saveTodoBtn.addEventListener('click', () => {
    const i = Number(saveTodoBtn.dataset.i);
    const val = document.getElementById('todo-edit-input').value.trim();
    const t = entryFor(selectedKey).todos[i];
    if (val) { t.text = val; if (t.id) srv('PATCH', `/calendar/todos/${t.id}`, { text: val }).catch(() => {}); }
    editingTodoIndex = null;
    save(); render();
  });
}

function render() {
  document.getElementById('cal-wrap').innerHTML = `<div style="display:flex; flex-direction:column; gap:16px">
    <div class="cal-head">
      <button type="button" id="cal-prev" aria-label="이전 달">${ICON.back}</button>
      <span class="ym" id="ym-label">${viewYear}년 ${viewMonth + 1}월</span>
      <button type="button" id="cal-next" aria-label="다음 달">${ICON.chevron}</button>
    </div>
    ${jumpHtml()}
    <div>
      <div class="dow-row"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
      <div class="day-grid">${calendarCellsHtml()}</div>
      <div class="cal-legend"><span><i class="a"></i>사진 있는 날</span><span><i class="b"></i>글만 있는 날</span></div>
    </div>
  </div>`;
  document.getElementById('detail-wrap').innerHTML = detailHtml();
  wire();
  loadMonth(viewYear, viewMonth);
}

render();
</script>
</body>
</html>
