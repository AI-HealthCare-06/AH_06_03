<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 1:1 문의</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .pb{margin-bottom:-6px}
  .fl{display:flex; gap:8px; overflow:hidden}
  .fl button{flex:none; height:36px; padding:0 16px; border-radius:18px; border:1px solid var(--sage); background:#fff; color:var(--ink); font:inherit; font-size:14px; cursor:pointer}
  .fl button.on{background:var(--accent-light); border-color:var(--accent-light); color:#1E3246; font-weight:700}
  .list{display:flex; flex-direction:column}
  .inq{display:flex; flex-direction:column; gap:8px; width:100%; box-sizing:border-box; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:18px 0; margin:0; cursor:pointer; font:inherit; color:var(--ink)}
  .inq:last-child{border-bottom:1px solid var(--line)}
  .inq .top{display:flex; align-items:center; gap:8px}
  .inq .top .d{font-size:13px; color:var(--muted)}
  .inq .t{font-size:16px; font-weight:800; line-height:1.4; word-break:break-all}
  .inq .pv{font-size:14px; color:var(--body); line-height:1.6; word-break:break-all; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .tag{height:24px; padding:0 10px; border-radius:12px; font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:6px; align-self:flex-start}
  .tag.new{background:#5C86AC; color:#fff} .tag.new i{width:6px; height:6px; border-radius:3px; background:#fff}
  .tag.wait{border:1px solid var(--sage); color:var(--body)}
  .tag.done{background:var(--cream); color:var(--muted)}
  .bar{position:sticky; bottom:84px; background:#fff; padding:12px 0; margin-top:auto; display:flex; gap:10px}
  .bar .cta,.bar .ghost{height:56px; font-size:17px; border-radius:28px; margin:0}
  .box{border:1px solid var(--line); border-radius:20px; padding:16px 18px; display:flex; flex-direction:column; gap:6px; font-size:15px; line-height:1.7; white-space:pre-wrap; word-break:break-all}
  .box.ans{background:var(--cream); border-color:var(--cream)}
  .box .lb{font-size:13px; font-weight:700; color:var(--muted); white-space:normal}
  .field label{font-size:14px; font-weight:800; color:var(--ink)}
  .field input{height:54px; border-radius:14px; font-size:16px}
  .field textarea{height:200px; resize:none; border-radius:14px; padding:14px 16px; font:inherit; font-size:15px; line-height:1.65; border:0; background:var(--cream); color:var(--ink); width:100%; box-sizing:border-box}
  .cnt{text-align:right; font-size:12px; color:var(--muted)}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" id="screen"><p class="hint">불러오는 중...</p></div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const kst = (iso) => {
  const d = new Date(/Z|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z');   // 서버 시각은 UTC
  return isNaN(d) ? '' : d.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
};
const FROM_BELL = new URLSearchParams(location.search).get('from') === 'bell';   // 종 모양으로 들어오면 "알림"
const state = { filter: 'all', view: 'list', list: null, detail: null, err: '', notice: '', busy: false, draft: { title: '', body: '' } };
const $screen = document.getElementById('screen');

function tag(i) {
  return i.unread ? '<span class="tag new"><i></i>답변 도착</span>' : i.answered ? '<span class="tag done">완료</span>' : '<span class="tag wait">답변 대기</span>';
}
const kind = (i) => i.unread ? 'new' : i.answered ? 'done' : 'wait';
const day = (iso) => { const t = kst(iso); return t ? t.split(' ').slice(0, 2).join(' ') : ''; };

function pageBar(href, title) { return `<div class="page-bar pb"><a class="back" href="${href}" aria-label="뒤로" id="back">${ICON.back}</a><span class="ttl">${title}</span></div>`; }

function render() {
  if (state.view === 'new') {
    $screen.innerHTML = `
      ${pageBar('inquiries.html', '문의 남기기')}
      <div class="callout" style="background:var(--cream); color:var(--body); font-size:14px; line-height:1.65">건강 관련 질문도 괜찮아요. 답변은 이 화면에서 확인해요.</div>
      <div class="field"><label>제목</label><input id="q-title" maxlength="100" value="${esc(state.draft.title)}" placeholder="예: 결과가 이해되지 않아요"></div>
      <div class="field"><label>내용</label><textarea id="q-body" maxlength="2000" placeholder="문의 내용을 적어 주세요">${esc(state.draft.body)}</textarea><div class="cnt"><span id="q-cnt">${state.draft.body.length}</span> / 2000</div></div>
      ${state.err ? `<p class="err">${esc(state.err)}</p>` : ''}
      <p class="hint">로그인이 안 되면 <a href="guest-inquiry.html" style="color:inherit; text-decoration:underline">비회원 문의</a>를 써요.</p>
      <div class="bar"><button type="button" class="ghost" id="q-cancel" style="width:96px">취소</button><button type="button" class="cta" id="q-send" style="flex:1" ${state.busy ? 'disabled' : ''}>${state.busy ? '보내는 중...' : '문의 보내기'}</button></div>`;
    const body = document.getElementById('q-body');
    body.addEventListener('input', () => { document.getElementById('q-cnt').textContent = body.value.length; });
    document.getElementById('q-cancel').addEventListener('click', () => { state.view = 'list'; state.err = ''; render(); });
    document.getElementById('q-send').addEventListener('click', send);
    document.getElementById('back').addEventListener('click', (e) => { e.preventDefault(); state.view = 'list'; state.err = ''; render(); });
    return;
  }
  if (state.view === 'detail' && state.detail) {
    const d = state.detail;
    const k = d.answer ? (d.unread ? 'new' : 'done') : 'wait';
    $screen.innerHTML = `
      ${pageBar('inquiries.html', '1:1 문의')}
      <div style="display:flex; flex-direction:column; gap:6px">
        ${k === 'new' ? '<span class="tag new">답변 도착</span>' : k === 'done' ? '<span class="tag done">완료</span>' : '<span class="tag wait">답변 대기</span>'}
        <span style="font-size:22px; font-weight:800; letter-spacing:-.4px; line-height:1.35; word-break:break-all">${esc(d.title)}</span>
        <span style="font-size:13px; color:var(--muted)">${kst(d.created_at)}에 남긴 문의</span>
      </div>
      <div class="box"><span class="lb">내 문의</span>${esc(d.body)}</div>
      ${d.answer
        ? `<div class="box ans"><span class="lb">답변 · ${kst(d.answered_at)}</span>${esc(d.answer)}</div>`
        : '<div class="box ans"><span class="lb">답변</span>아직 답변을 준비하고 있어요.</div>'}
      <div class="bar"><button type="button" class="ghost" id="q-back">목록으로</button></div>`;
    document.getElementById('q-back').addEventListener('click', () => { state.view = 'list'; load(); });
    document.getElementById('back').addEventListener('click', (e) => { e.preventDefault(); state.view = 'list'; load(); });
    return;
  }
  const all = state.list ? state.list.items : [];
  const items = state.filter === 'all' ? all : all.filter(i => kind(i) === state.filter);
  $screen.innerHTML = `
    ${pageBar('menu.html', FROM_BELL ? '알림' : '1:1 문의')}
    ${state.notice ? `<p class="ok" style="font-weight:700; margin:0">${esc(state.notice)}</p>` : ''}
    ${state.err ? `<p class="err">${esc(state.err)}</p>` : ''}
    ${state.list === null ? '<p class="hint">불러오는 중...</p>'
      : items.length ? `<div class="list">${items.map(i => `<button type="button" class="inq" data-id="${esc(i.inquiry_id)}"><span class="top">${tag(i)}<span class="d">${day(i.created_at)}</span></span><span class="t">${esc(i.title)}</span>${i.body ? `<span class="pv">${esc(i.body)}</span>` : ''}</button>`).join('')}</div>`
      : (FROM_BELL ? '<p class="hint">새 알림이 없어요.</p>' : '<p class="hint">남긴 문의가 없어요.</p>')}
    <div class="bar"><button type="button" class="cta" id="q-new">＋ 문의 작성하기</button></div>`;
  document.getElementById('q-new').addEventListener('click', () => { state.view = 'new'; state.err = ''; state.notice = ''; render(); });
  $screen.querySelectorAll('.inq').forEach(b => b.addEventListener('click', () => open(b.dataset.id)));
}

async function load() {
  try { state.list = (await apiCall('GET', '/inquiries', undefined, '문의를 불러오지 못했습니다')).data; state.err = ''; }
  catch (e) { state.err = friendlyError(e); state.list = state.list || { unread: 0, items: [] }; }
  render();
}

async function open(id) {
  try { state.detail = (await apiCall('GET', `/inquiries/${encodeURIComponent(id)}`, undefined, '문의를 불러오지 못했습니다')).data; state.view = 'detail'; state.notice = ''; }
  catch (e) { state.err = friendlyError(e); }
  render();
}

async function send() {
  const title = document.getElementById('q-title').value.trim(), body = document.getElementById('q-body').value.trim();
  state.draft = { title, body };
  if (!title || !body) { state.err = '제목과 내용을 모두 입력해 주세요.'; render(); return; }
  state.busy = true; state.err = ''; render();
  try {
    await apiCall('POST', '/inquiries', { title, body }, '문의를 보내지 못했습니다');
    state.draft = { title: '', body: '' }; state.view = 'list'; state.notice = '문의를 남겼어요.';
    state.busy = false; await load(); return;
  } catch (e) { state.err = friendlyError(e); }
  state.busy = false; render();
}

load();
</script>
</body>
</html>
