<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 1:1 문의</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .inq{display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--sage-light); border-radius:16px; padding:12px 14px; margin:0 0 10px; cursor:pointer; font:inherit; color:var(--ink)}
  .inq b{display:block; font-size:14px; margin-bottom:4px; word-break:break-all}
  .inq .meta{display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted)}
  .tag{font-weight:700} .tag.new{color:#fff; background:#e0584a; border-radius:999px; padding:1px 9px} .tag.done{color:var(--ok)} .tag.wait{color:var(--muted)}
  .box{background:#fff; border:1px solid var(--sage-light); border-radius:16px; padding:14px 16px; margin:0 0 12px; font-size:13.5px; line-height:1.7; white-space:pre-wrap; word-break:break-all}
  .box.ans{background:var(--cream)}
  .box .lb{display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:4px; white-space:normal}
  textarea{font:inherit; font-size:13.5px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--sage-light); background:#fff; color:var(--ink); width:100%; min-height:140px; resize:vertical}
  .cnt{text-align:right; font-size:11.5px; color:var(--faint)}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" id="screen"><p class="hint">불러오는 중...</p></div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const kst = (iso) => {
  const d = new Date(/Z|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z');   // 서버 시각은 UTC
  return isNaN(d) ? '' : d.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
};
const state = { view: 'list', list: null, detail: null, err: '', notice: '', busy: false, draft: { title: '', body: '' } };
const $screen = document.getElementById('screen');

function tag(i) {
  return i.unread ? '<span class="tag new">답변 도착</span>' : i.answered ? '<span class="tag done">답변 완료</span>' : '<span class="tag wait">답변 대기</span>';
}

function render() {
  if (state.view === 'new') {
    $screen.innerHTML = `
      <p class="sect" style="margin-top:0">문의 남기기</p>
      <p class="hint" style="margin:0 0 12px">궁금한 점을 편하게 적어 주세요. 건강 관련 질문도 괜찮아요. 문의는 서비스 안에서만 보관되고, 답변은 이 화면에서 확인할 수 있어요.</p>
      <div class="field"><label>제목</label><input id="q-title" maxlength="100" value="${esc(state.draft.title)}" placeholder="예: 결과가 이해되지 않아요"></div>
      <div class="field" style="margin-top:10px"><label>내용</label><textarea id="q-body" maxlength="2000" placeholder="문의 내용을 적어 주세요">${esc(state.draft.body)}</textarea><div class="cnt"><span id="q-cnt">${state.draft.body.length}</span> / 2000</div></div>
      ${state.err ? `<p class="err" style="margin-top:6px">${esc(state.err)}</p>` : ''}
      <div style="display:flex; gap:8px; margin-top:12px"><button type="button" class="cta" id="q-send" ${state.busy ? 'disabled' : ''}>${state.busy ? '보내는 중...' : '문의 보내기'}</button><button type="button" class="ghost" id="q-cancel" style="width:auto; padding:11px 22px">취소</button></div>
      <p class="hint" style="margin-top:14px">로그인이 안 되거나 가입이 안 될 때는 로그인 화면의 <a href="guest-inquiry.html" style="color:inherit; text-decoration:underline">비회원 문의</a>를 써 주세요.</p>`;
    const body = document.getElementById('q-body');
    body.addEventListener('input', () => { document.getElementById('q-cnt').textContent = body.value.length; });
    document.getElementById('q-cancel').addEventListener('click', () => { state.view = 'list'; state.err = ''; render(); });
    document.getElementById('q-send').addEventListener('click', send);
    return;
  }
  if (state.view === 'detail' && state.detail) {
    const d = state.detail;
    $screen.innerHTML = `
      <p class="sect" style="margin-top:0">${esc(d.title)}</p>
      <p class="hint" style="margin:0 0 10px">${kst(d.created_at)}에 남긴 문의</p>
      <div class="box"><span class="lb">내 문의</span>${esc(d.body)}</div>
      ${d.answer
        ? `<div class="box ans"><span class="lb">답변 · ${kst(d.answered_at)}</span>${esc(d.answer)}</div>`
        : '<div class="box ans"><span class="lb">답변</span>아직 답변을 준비하고 있어요. 답변이 오면 알려 드릴게요.</div>'}
      <button type="button" class="ghost" id="q-back">목록으로</button>`;
    document.getElementById('q-back').addEventListener('click', () => { state.view = 'list'; load(); });
    return;
  }
  const items = state.list ? state.list.items : [];
  $screen.innerHTML = `
    <p class="sect" style="margin-top:0">1:1 문의</p>
    ${state.notice ? `<p class="ok" style="font-weight:700; margin:0 0 10px">${esc(state.notice)}</p>` : ''}
    ${state.err ? `<p class="err">${esc(state.err)}</p>` : ''}
    <button type="button" class="cta" id="q-new" style="margin-bottom:14px">문의 남기기</button>
    ${state.list === null ? '<p class="hint">불러오는 중...</p>'
      : items.length ? items.map(i => `<button type="button" class="inq" data-id="${esc(i.inquiry_id)}"><b>${esc(i.title)}</b><span class="meta"><span>${kst(i.created_at)}</span>${tag(i)}</span></button>`).join('')
      : '<p class="hint">남긴 문의가 없어요. 궁금한 점이 있으면 편하게 남겨 주세요.</p>'}
    <a class="ghost" href="mypage.html" style="margin-top:6px; text-align:center">마이페이지로</a>`;
  document.getElementById('q-new').addEventListener('click', () => { state.view = 'new'; state.err = ''; state.notice = ''; render(); });
  $screen.querySelectorAll('.inq').forEach(b => b.addEventListener('click', () => open(b.dataset.id)));
}

async function load() {
  try { state.list = (await apiCall('GET', '/inquiries', undefined, '문의를 불러오지 못했습니다')).data; state.err = ''; }
  catch (e) { state.err = friendlyError(e); state.list = state.list || { unread: 0, items: [] }; }
  render();
}

async function open(id) {
  try { state.detail = (await apiCall('GET', `/inquiries/${encodeURIComponent(id)}`, undefined, '문의를 불러오지 못했습니다')).data; state.view = 'detail'; state.notice = ''; }
  catch (e) { state.err = friendlyError(e); }
  render();
}

async function send() {
  const title = document.getElementById('q-title').value.trim(), body = document.getElementById('q-body').value.trim();
  state.draft = { title, body };
  if (!title || !body) { state.err = '제목과 내용을 모두 입력해 주세요.'; render(); return; }
  state.busy = true; state.err = ''; render();
  try {
    await apiCall('POST', '/inquiries', { title, body }, '문의를 보내지 못했습니다');
    state.draft = { title: '', body: '' }; state.view = 'list'; state.notice = '문의를 남겼어요. 답변이 오면 알려 드릴게요.';
    state.busy = false; await load(); return;
  } catch (e) { state.err = friendlyError(e); }
  state.busy = false; render();
}

load();
</script>
</body>
</html>
