<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 내 변화</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .screen{gap:20px}
  .h1{font-size:20px; font-weight:800; height:56px; display:flex; align-items:center; margin:0 0 -8px}
  .bpcard{background:var(--cream); border-radius:28px; padding:20px 20px 14px; display:flex; flex-direction:column; gap:4px}
  .bpcard .top{display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:700; color:#4A5C6D}
  .bpcard .delta{height:26px; padding:0 12px; border-radius:13px; background:#fff; font-size:13px; font-weight:800; color:#234257; display:inline-flex; align-items:center}
  .bpcard .val{display:flex; align-items:baseline; gap:6px}
  .bpcard .val b{font-size:44px; font-weight:800; letter-spacing:-1.5px; line-height:1.1}
  .bpcard .val i{font-style:normal; font-size:15px; font-weight:700; color:var(--muted)}
  .bpcard .val span{font-size:13px; color:var(--muted); margin-left:6px}
  .bpcard svg{display:block; width:100%; height:auto; margin-top:4px}
  .shorts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
  .shorts a{display:flex; flex-direction:column; gap:12px; border:1px solid var(--line); border-radius:22px; padding:16px; text-decoration:none; color:inherit; font-size:16px; font-weight:800}
  .shorts a:last-child:nth-child(odd){grid-column:1 / -1; flex-direction:row; align-items:center}
  .shorts .ic{width:48px; height:48px; border-radius:16px; background:var(--notice); color:var(--accent); display:flex; align-items:center; justify-content:center}
  .sec{display:flex; flex-direction:column; gap:12px}
  .sec .t{font-size:18px; font-weight:800}
  .tabs{display:flex; gap:8px}
  .tabs button{flex:1; height:44px; border-radius:22px; padding:0; border:1px solid var(--sage); background:#fff; color:#4A5C6D; font-size:15px; font-weight:500}
  .tabs button.on{background:var(--accent-light); border-color:var(--accent-light); color:#1E3246; font-weight:800}
  .ch{display:flex; flex-direction:column; gap:4px; padding-top:4px}
  .ch .l1{display:flex; align-items:center; justify-content:space-between; font-size:17px; font-weight:800}
  .ch .tag{height:24px; padding:0 10px; border-radius:12px; background:var(--notice); color:#234257; font-size:12px; font-weight:700; display:inline-flex; align-items:center}
  .ch .l2{font-size:13px; color:var(--muted)}
  .rows{border-bottom:1px solid var(--line)}
  .rw{display:flex; align-items:center; justify-content:space-between; min-height:56px; border-top:1px solid var(--line); font-size:15px}
  .rw>span:first-child{color:#4A5C6D}
  .rw .v{display:flex; align-items:center; gap:8px}
  .rw .v em{font-style:normal; color:var(--muted)}
  .rw .v b{font-size:16px}
  .two{display:flex; gap:10px}
  .two .cta,.two .ghost{flex:1; width:auto; height:50px; font-size:15px}
  .pend{background:var(--cream); border-radius:22px; padding:18px 20px; display:flex; flex-direction:column; gap:10px}
  .pend b{font-size:15px; line-height:1.5}
  .pend .tr{height:8px; border-radius:4px; background:var(--track)}
  .pend .tr i{display:block; height:8px; border-radius:4px; background:var(--accent)}
  .pend .s{font-size:13px; color:#4A5C6D; line-height:1.6}
  .pend .cta{height:46px; font-size:15px}
  .wk{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:20px; padding:14px 16px; text-decoration:none; color:inherit}
  .wk.run{background:var(--notice); border-color:var(--notice)}
  .wk .tx{flex:1; display:flex; flex-direction:column; gap:3px}
  .wk .tx b{font-size:15px}
  .wk .tx b em{font-style:normal; font-size:12px; font-weight:700; color:var(--muted)}
  .wk .tx span{font-size:13px; color:var(--muted)}
  .wkhd{display:flex; align-items:baseline; justify-content:space-between}
  .wkhd a{font-size:13px; font-weight:700; color:#4A5C6D; text-decoration:underline; min-height:44px; display:flex; align-items:center}
  .small{font-size:12px; color:var(--muted); line-height:1.6}
  /* 전·후 비교 */
  .cmphd .s{font-size:13px; color:var(--muted)}
  .cmphd .big{font-size:28px; font-weight:800; letter-spacing:-.7px; line-height:1.3; margin-top:8px}
  .cbox{border:1px solid var(--line); border-radius:20px; padding:20px 20px 16px; display:flex; flex-direction:column; gap:8px}
  .cbox .hd{display:flex; justify-content:space-between; align-items:baseline; font-size:15px; font-weight:800}
  .cbox .hd span{font-size:13px; font-weight:500; color:var(--muted)}
  .cbox svg{display:block; width:100%; height:auto}
  .tb .th{display:flex; padding:0 0 10px; font-size:13px; color:var(--muted)}
  .tb .th span:first-child,.tb .rw>span:first-child{flex:1}
  .tb .th span:not(:first-child),.tb .rw>span:not(:first-child){text-align:right}
  .tb .th span:nth-child(2),.tb .rw>span:nth-child(2){width:84px}
  .tb .th span:nth-child(3),.tb .rw>span:nth-child(3){width:96px}
  .tb .rw>span:nth-child(2){color:var(--muted)}
  .tb .rw>span:nth-child(3){font-weight:800}
  .tb .rw:last-child{border-bottom:1px solid var(--line)}
  .hab .t{font-size:18px; font-weight:800; padding-bottom:8px}
  .hab .rw:last-child{border-bottom:1px solid var(--line)}
  .simbox{background:var(--cream); border-radius:16px; padding:18px 20px; display:flex; flex-direction:column; gap:6px}
  .simbox .a{font-size:13px; color:#4A5C6D; line-height:1.6}
  .simbox .b{font-size:18px; font-weight:800}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" id="app"><p class="hint">불러오는 중...</p></div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const RISK = { normal: '양호', borderline: '주의', high: '높음' };
const SMOKING = { current: '현재 피움', former: '끊음', never: '피운 적 없음' };
const DRINK = { never_lifetime: '안 마심', none_past_year: '4주간 안 마심', lt_monthly: '한 달에 1번 미만', monthly: '한 달에 1번',
  '2_4_per_month': '한 달에 2–4번', '2_3_per_week': '일주일에 2–3번', '4plus_per_week': '일주일에 4번 이상' };
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const IC = (p) => `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const md = (iso) => { if (!iso) return ''; const [, m, d] = iso.split('-'); return `${Number(m)}/${Number(d)}`; };
const mdKo = (iso) => { if (!iso) return ''; const [, m, d] = iso.split('-'); return `${Number(m)}월 ${Number(d)}일`; };
const bpText = (x) => x && x.sbp != null ? `${x.sbp}/${x.dbp}` : '—';
const unit = (v, u) => v == null ? '—' : v + u;

// 서버의 사이클별 전후 비교(review)에서 가져온다. 혈압은 시작할 때와 4주 재입력 때만 재므로 점도 그때만 찍힌다.
async function loadReviews() {
  const cycles = (await apiListCycles()).slice().sort((x, y) => x.cycle_number - y.cycle_number);
  const reviews = [];
  for (const c of cycles) {
    try { reviews.push((await apiCall('GET', `/challenges/cycles/${encodeURIComponent(c.cycle_id)}/review`, undefined, '변화를 불러오지 못했습니다')).data); }
    catch (e) { /* 한 사이클을 못 불러와도 나머지는 보여 준다 */ }
  }
  return { cycles, reviews };
}

function bpPoints(reviews) {
  const pts = [];
  const first = reviews.find(r => r.before && r.before.sbp != null);
  if (first) pts.push({ v: first.before.sbp, d: md(first.before.examination_date) });
  reviews.filter(r => r.reassessed && r.after && r.after.sbp != null)
    .forEach(r => pts.push({ v: r.after.sbp, d: md(r.after.examination_date) }));
  return pts;
}

// 점은 첫 번째만 채우고 나머지는 속이 빈 점. 기준선은 140.
function lineChart({ points, W, H, ref, refLabel, color, labelFont, big }) {
  const vals = points.map(p => p.v);
  const lo = Math.min(ref, ...vals) - 6, hi = Math.max(ref, ...vals) + 6;
  const padX = big ? 70 : 20, padT = big ? 36 : 14, padB = big ? 40 : 22;
  const X = i => points.length > 1 ? padX + i * (W - 2 * padX) / (points.length - 1) : W / 2;
  const Y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const fill = big ? '#FFFFFF' : '#F8F1E7';
  const r = big ? 6 : 5, sw = 2.5;
  const s = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="수축기 혈압 ${vals.join(', ')}">`,
    `<line x1="0" y1="${Y(ref).toFixed(1)}" x2="${W}" y2="${Y(ref).toFixed(1)}" stroke="#5A6B7A" stroke-width="1" stroke-dasharray="4 4"/>`,
    `<text x="${W}" y="${(Y(ref) - 6).toFixed(1)}" text-anchor="end" font-size="${big ? 12 : 11}" fill="#5A6B7A">${refLabel}</text>`];
  if (points.length > 1) s.push(`<polyline fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" points="${points.map((p, i) => X(i).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')}"/>`);
  points.forEach((p, i) => {
    const x = X(i).toFixed(1), y = Y(p.v).toFixed(1);
    s.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${i === 0 ? color : fill}" stroke="${color}" stroke-width="${sw}"/>`);
    if (big) s.push(`<text x="${x}" y="${(Y(p.v) + (i === 0 ? -16 : 28)).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="800" fill="#243749">${p.v}</text>`);
    s.push(`<text x="${x}" y="${H - (big ? 8 : 4)}" text-anchor="middle" font-size="${labelFont}" fill="#5A6B7A">${esc(p.d)}</text>`);
  });
  return s.join('') + '</svg>';
}

const row = (label, a, b) => `<div class="rw"><span>${label}</span><span class="v">${a != null && a !== '' ? `<em>${esc(a)} →</em>` : ''}<b>${esc(b)}</b></div>`;
const riskText = (m, k) => m && m[k] ? (RISK[m[k]] || '—') + (probText(m[k.replace('risk_level', 'probability')]) ? ` (${probText(m[k.replace('risk_level', 'probability')])})` : '') : '—';
const modelA = (rv) => (rv.models || []).find(m => m.model_code === 'MODEL_A');

let DATA = null, SEL = 'start';
const cycleOf = (rv) => DATA.cycles.find(c => c.cycle_id === rv.cycle_id) || {};

function renderList() {
  const { cycles, reviews } = DATA;
  const pts = bpPoints(reviews);
  const pending = reviews.filter(r => !r.reassessed && r.cycle_status !== 'active' && r.cycle_status !== 'stopped').pop();
  let html = '<div class="h1">내 변화</div>';

  if (pts.length) {
    const last = pts[pts.length - 1], dl = last.v - pts[0].v;
    html += `<div class="bpcard">
      <div class="top"><span>지금 수축기 혈압</span>${pts.length > 1 ? `<span class="delta">처음보다 ${dl > 0 ? '+' : dl < 0 ? '−' : ''}${Math.abs(dl)}</span>` : ''}</div>
      <div class="val"><b>${last.v}</b><i>mmHg</i><span>${esc(last.d)} 측정</span></div>
      ${lineChart({ points: pts, W: 318, H: 74, ref: 140, refLabel: '기준 140', color: '#5C86AC', labelFont: 12 })}
    </div>`;
  }

  html += `<div class="shorts">
    <a href="calendar-diary.html"><span class="ic">${IC('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>')}</span>캘린더 · 일기</a>
    <a href="health-info.html"><span class="ic">${IC('<path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/>')}</span>건강정보 입력</a>
    <a href="plan.html"><span class="ic">${IC('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 14h4"/>')}</span>내 12주 계획</a>
    <a href="twelve-weeks.html"><span class="ic">${IC('<path d="M6 20V11M12 20V4M18 20v-6"/>')}</span>지난 12주 기록</a>
    <a href="${pending ? `reassessment.html?cycle=${encodeURIComponent(pending.cycle_id)}` : '#'}"${pending ? '' : ` data-notice="${reviews.some(r => r.cycle_status === 'active') ? '아직 4주가 끝나지 않았어요. 끝나면 여기서 다시 입력해요' : '챌린지를 시작하면 4주 뒤에 다시 입력할 수 있어요'}"`}><span class="ic">${IC('<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/>')}</span>4주 재입력</a>
  </div>`;

  html += '<div class="sec"><span class="t">4주 기록</span>';
  if (!cycles.length) {
    html += '<div class="callout"><b>기록이 쌓이면 변화가 보여요</b></div><a class="ghost" href="challenges.html">챌린지 시작하기</a></div>';
    $('app').innerHTML = html;
    return;
  }
  html += `<div class="tabs" id="tabs"><button type="button" data-k="start" class="${SEL === 'start' ? 'on' : ''}">시작</button>${[1, 2, 3].map(n => { const r = reviews.find(x => x.cycle_number === n); return r ? `<button type="button" data-k="${esc(r.cycle_id)}" class="${SEL === r.cycle_id ? 'on' : ''}">${n}차</button>` : `<button type="button" disabled style="opacity:.45">${n}차</button>`; }).join('')}</div>`;
  html += SEL === 'start' ? startPane(reviews) : cyclePane(reviews.find(r => r.cycle_id === SEL));
  html += twelveSection(cycles);
  html += '</div>';
  $('app').innerHTML = html;
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && b.dataset.k) { SEL = b.dataset.k; renderList(); } });
  document.querySelectorAll('a[data-notice]').forEach(el => el.addEventListener('click', (e) => { e.preventDefault(); toast(el.dataset.notice); }));
}

function startPane(reviews) {
  const f = reviews.find(r => r.before && r.before.sbp != null) || reviews[0];
  if (!f) return '';
  const b = f.before || {}, a = modelA(f);
  return `<div class="ch"><div class="l1"><span>처음 입력한 값</span><span class="tag">시작</span></div><span class="l2">${esc(b.examination_date || '').replace(/-/g, '.')} 입력</span></div>
    <div class="rows">${row('혈압', '', bpText(b) === '—' ? '—' : bpText(b) + ' mmHg')}${row('체중', '', unit(b.weight_kg, 'kg'))}${row('허리둘레', '', unit(b.waist_cm, 'cm'))}${row('건강 신호', '', riskText(a, 'before_risk_level'))}</div>${a && probText(a.before_probability) ? probNoteHtml(false, true) : ''}`;
}

function cyclePane(rv) {
  if (!rv) return '';
  const c = cycleOf(rv), run = rv.cycle_status === 'active';
  const period = `${(c.started_on || '').replace(/-/g, '.')} ~ ${c.ended_on ? md(c.ended_on).replace('/', '.') : ''}`;
  const tag = rv.reassessed ? '완료' : run ? '진행 중' : '재입력 전';
  const head = `<div class="ch"><div class="l1"><span>${rv.cycle_number}차 · 4주</span><span class="tag">${tag}</span></div><span class="l2">${esc(period)}</span></div>`;
  if (!rv.reassessed) {
    const day = c.started_on ? Math.min(28, Math.max(1, Math.floor((Date.now() - new Date(c.started_on)) / 864e5) + 1)) : null;
    return head + (run
      ? `<div class="pend"><b>아직 4주가 끝나지 않았어요</b>${day ? `<div class="tr"><i style="width:${Math.round(day / 28 * 100)}%"></i></div><span class="s">${day} / 28일 · 4주가 끝나면 다시 입력해요</span>` : ''}<a class="cta" href="challenge-progress.html">오늘 인증하기</a></div>`
      : `<div class="pend"><b>4주가 끝났어요</b><span class="s">지금 상태를 입력해 주세요.</span><a class="cta" href="reassessment.html?cycle=${encodeURIComponent(rv.cycle_id)}">${rv.cycle_number}차 4주 재입력하기</a></div>`);
  }
  const b = rv.before || {}, a = rv.after || {}, m = modelA(rv), cmpA = m && m.comparable;
  const rate = c.cycle_rate != null ? Math.round(c.cycle_rate * 100) + '%' : '—';
  return head + `<div class="rows">${row('혈압', bpText(b), bpText(a))}${row('체중', unit(b.weight_kg, 'kg'), unit(a.weight_kg, 'kg'))}${row('허리둘레', unit(b.waist_cm, 'cm'), unit(a.waist_cm, 'cm'))}${row('챌린지 달성률', '', rate)}${cmpA ? row('건강 신호', riskText(m, 'before_risk_level'), riskText(m, 'after_risk_level')) : ''}</div>${cmpA && (probText(m.before_probability) || probText(m.after_probability)) ? probNoteHtml(false, true) : ''}
    <div class="two">${DATA.reviews.filter(r => r.reassessed).pop().cycle_id === rv.cycle_id ? '<a class="cta" href="result.html">분석 결과 보기</a>' : ''}<button type="button" class="ghost" id="to-cmp" data-id="${esc(rv.cycle_id)}">전·후 비교</button></div>`;
}

// 서버가 12주 번호를 주기 전까지는 4주 사이클 번호 3개씩을 한 묶음(12주)으로 본다.
function twelveSection(cycles) {
  const by = {};
  cycles.forEach(c => { const n = Math.ceil(c.cycle_number / 3); (by[n] = by[n] || []).push(c); });
  const ps = Object.keys(by).map(n => {
    const cs = by[n].sort((x, y) => x.cycle_number - y.cycle_number), done = cs.length >= 3 && cs.every(c => c.status !== 'active');
    const rated = cs.filter(c => c.status !== 'active' && c.cycle_rate != null);
    return { n: +n, start: cs[0].started_on, end: done ? cs[cs.length - 1].ended_on : null, running: !done, done: cs.filter(c => c.status !== 'active').length,
      rate: rated.length ? Math.round(rated.reduce((s, c) => s + c.cycle_rate, 0) / rated.length * 100) : null };
  }).sort((x, y) => y.n - x.n);
  return `<div class="sec" style="gap:8px; padding-top:8px"><div class="wkhd"><span class="t">지난 12주 기록</span><a href="twelve-weeks.html">전체 보기 (${ps.length})</a></div>
    ${ps.slice(0, 3).map(p => `<a class="wk${p.running ? ' run' : ''}" href="${p.running ? 'challenge-progress.html' : 'twelve-weeks.html'}"><div class="tx"><b>${p.n}번째 12주 <em>· ${p.running ? '진행 중' : '완료'}</em></b><span>${mdKo(p.start)}${p.end ? ' ~ ' + mdKo(p.end) : ' 시작'} · ${p.running ? `4주 ${p.done}번 마침` : p.rate != null ? `평균 달성률 ${p.rate}%` : ''}</span></div>${p.running ? '' : ICON.chevron}</a>`).join('')}</div>`;
}

function renderCompare(rv) {
  const c = cycleOf(rv), b = rv.before || {}, a = rv.after || {}, m = modelA(rv), cmpA = m && m.comparable;
  const mB = (rv.models || []).find(x => x.model_code === 'MODEL_B' && x.comparable);
  const chg = mB ? simChangeText(mB.before_similarity_level, mB.after_similarity_level) : '';
  const rate = c.cycle_rate != null ? Math.round(c.cycle_rate * 100) + '%' : '—';
  const pts = b.sbp != null && a.sbp != null ? [{ v: b.sbp, d: '시작' }, { v: a.sbp, d: '4주 후' }] : [];
  $('app').innerHTML = `<div class="page-bar" style="margin-bottom:-8px"><a class="back" href="#" id="cmp-back" aria-label="뒤로">${ICON.back}</a><span class="ttl">4주 전·후 비교</span></div>
    <div class="cmphd"><span class="s">${rv.cycle_number}차 챌린지${c.started_on ? ' · ' + mdKo(c.started_on) + (c.ended_on ? ' ~ ' + mdKo(c.ended_on) : '') : ''}</span><div class="big">4주 동안<br>이렇게 달라졌어요</div></div>
    ${pts.length ? `<div class="cbox"><div class="hd"><span style="font-size:15px;font-weight:800;color:var(--ink)">수축기 혈압</span><span>mmHg</span></div>${lineChart({ points: pts, W: 310, H: 170, ref: 140, refLabel: '기준 140', color: '#243749', labelFont: 13, big: true })}</div>` : ''}
    <div class="tb"><div class="th"><span>항목</span><span>시작</span><span>4주 후</span></div>
      ${[['혈압', bpText(b), bpText(a)], ['체중', unit(b.weight_kg, 'kg'), unit(a.weight_kg, 'kg')], ['허리둘레', unit(b.waist_cm, 'cm'), unit(a.waist_cm, 'cm')], ['챌린지 달성률', '—', rate]]
        .concat(cmpA ? [['건강 신호', riskText(m, 'before_risk_level'), riskText(m, 'after_risk_level')]] : [])
        .map(r => `<div class="rw"><span>${r[0]}</span><span>${esc(r[1])}</span><span>${esc(r[2])}</span></div>`).join('')}</div>
    ${cmpA && (probText(m.before_probability) || probText(m.after_probability)) ? probNoteHtml(false, true) : ''}
    <div class="hab"><div class="t">습관 변화</div>
      <div class="rw"><span>흡연</span><span>${SMOKING[b.smoking] || '—'} → <b>${SMOKING[a.smoking] || '—'}</b></span></div>
      <div class="rw"><span>음주</span><span>${DRINK[b.drink_freq] || '—'} → <b>${DRINK[a.drink_freq] || '—'}</b></span></div></div>
    ${modelANoticeHtml(rv.models)}
    ${chg ? `<div class="simbox"><span class="a">혈압이 정상인 사람들의 전체 자료와 비교했어요</span><span class="b">${chg}</span><span class="a">허리둘레, 몸무게, 술은 내가 바꿀 수 있어요.</span></div>` : ''}
    <div class="small" style="font-size:13px; line-height:1.7">진단이 아닌 참고 정보입니다. 정확한 판단은 의료진과 상담하세요.</div>
    ${rv.cycle_number < rv.total_cycles ? `<a class="cta" style="height:56px; border-radius:28px; font-size:17px" href="challenges.html">${rv.cycle_number + 1}차 챌린지 시작하기</a>` : ''}
    <a class="ghost" href="twelve-weeks.html">12주 기록 보기</a>`;
  $('cmp-back').addEventListener('click', (e) => { e.preventDefault(); renderList(); window.scrollTo(0, 0); });
  window.scrollTo(0, 0);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('#to-cmp');
  if (b && DATA) renderCompare(DATA.reviews.find(r => r.cycle_id === b.dataset.id));
});

(async () => {
  try { DATA = await loadReviews(); }
  catch (e) { $('app').innerHTML = '<div class="callout"><b>불러오지 못했어요</b><br>잠시 뒤 다시 열어 주세요.</div>'; return; }
  const last = DATA.reviews.filter(r => r.reassessed).pop();
  SEL = last ? last.cycle_id : 'start';
  renderList();
})();
</script>
</body>
</html>
