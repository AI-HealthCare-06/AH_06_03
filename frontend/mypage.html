<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 마이페이지</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .grp{display:flex; flex-direction:column}
  .gt{font-size:13px; color:var(--muted); padding-bottom:6px}
  .ln{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; box-sizing:border-box; min-height:60px; padding:0; margin:0; border:0; border-top:1px solid var(--line); background:none; font:inherit; font-size:15px; color:inherit; text-align:left; text-decoration:none; cursor:pointer}
  .ln.last{border-bottom:1px solid var(--line)}
  .ln.big{min-height:56px; font-size:16px}
  .ln .k{color:var(--body)}
  .ln .v{display:flex; align-items:center; gap:8px; font-weight:700}
  .ln [data-icon=chevron]{color:var(--muted)}
  .ln .nw{color:#e0584a; font-weight:700; font-size:13px}
  .grp .callout{margin-top:10px; font-size:13px}
  .cons{border:1px solid var(--line); border-radius:22px; padding:18px; display:flex; flex-direction:column; gap:14px}
  .cons .hd{display:flex; align-items:center; justify-content:space-between}
  .cons .hd b{font-size:16px; font-weight:800}
  .cons .tag{height:24px; padding:0 10px; border-radius:12px; background:var(--notice); color:#234257; font-size:12px; font-weight:700; display:inline-flex; align-items:center}
  .cons p{margin:0; font-size:14px; color:var(--body); line-height:1.6}
  .cons .btn{height:48px; border-radius:24px; border:1px solid var(--sage); background:#fff; color:var(--ink); font:inherit; font-size:15px; font-weight:700; cursor:pointer}
  .opt{height:36px; padding:0 16px; border-radius:18px; border:1px solid var(--sage); background:#fff; color:var(--body); font:inherit; font-size:13px; cursor:pointer}
  .opt[data-on="1"]{background:var(--accent-light); border-color:var(--accent-light); color:#1E3246; font-weight:700}
  .optrow{display:flex; flex-wrap:wrap; gap:8px}
  .sum-card{border:1px solid var(--line); border-radius:20px; padding:2px 16px; margin:10px 0}
  .sumrow{display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid var(--line); font-size:14px}
  .sumrow:first-child{border-top:0}
  .sumrow .lb{color:var(--muted)} .sumrow .vv{font-weight:700; text-align:right}
  .foot{display:flex; justify-content:space-between; align-items:center}
  .foot button{border:0; background:none; min-height:44px; padding:0; font:inherit; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer}
  .foot button.del{font-size:13px; font-weight:500; color:var(--muted); text-decoration:underline}
  .warnbox{border:1.5px solid var(--danger); background:#FBEAE5; border-radius:18px; padding:14px 18px; font-size:13px}
  .warnbox b{color:var(--risk)}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" id="screen" style="gap:24px"></div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
let me = null;
const SEX_LABEL = { male: '남성', female: '여성' };
const state = { notice: '', editProfile: false, perr: '', rating: null, saved: false, consent: true, mp: null, gone: false, pwd: '', err: '' };

function render() {
  const screen = document.getElementById('screen');
  if (state.gone) {
    screen.innerHTML = `<div class="callout"><b>탈퇴가 완료되었습니다</b><br>건강정보·설문·분석·캘린더 기록을 삭제했고, 계정은 익명 처리했어요.</div>
      <a class="cta" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="index.html">처음으로</a>`;
    return;
  }
  const chev = '<span data-icon="chevron"></span>';
  screen.innerHTML = `
    <div class="page-bar" style="margin-bottom:-16px"><a class="back" href="menu.html" aria-label="뒤로" id="back"></a><span class="ttl">마이페이지</span></div>
    <div class="grp">
      <div class="gt">내 정보</div>
      ${me ? `<div class="ln"><span class="k">이메일</span><span class="v">${me.email}</span></div>
      ${state.editProfile ? `<div style="border-top:1px solid var(--line); padding-top:12px; display:flex; flex-direction:column; gap:10px">
        <div class="field"><label>생년월일</label><input id="p-birth" type="date" value="${me.birth_date || ''}" max="${new Date().toISOString().slice(0, 10)}"></div>
        <div class="field"><label>성별</label><select id="p-sex"><option value="male" ${me.sex === 'male' ? 'selected' : ''}>남성</option><option value="female" ${me.sex === 'female' ? 'selected' : ''}>여성</option></select></div>
        ${state.perr ? `<p class="err">${state.perr}</p>` : ''}
        <p class="hint" style="margin:0">저장하면 새 정보로 바로 다시 분석하고, 분석 결과 화면으로 이동해요.</p>
        <div style="display:flex; gap:8px"><button type="button" id="p-save" class="ghost">저장</button><button type="button" id="p-cancel" class="ghost">취소</button></div></div>`
      : `<button type="button" id="p-edit" class="ln"><span class="k">생년월일</span><span class="v">${(me.birth_date || '').replace(/-/g, '.')}${chev}</span></button>
      <button type="button" id="p-edit2" class="ln last"><span class="k">성별</span><span class="v">${SEX_LABEL[me.sex] || '미입력'}${chev}</span></button>
      <div class="callout">생년월일이나 성별을 수정하면 새 정보로 바로 다시 분석하고, 분석 결과 화면으로 이동해요. 입력한 건강정보가 아직 없으면 저장만 해요.</div>`}` : ''}
    </div>

    <div class="grp" style="gap:12px">
      <div class="gt" style="padding:0">건강정보 동의</div>
      <div class="cons">
        <div class="hd"><b>${state.consent ? '동의 중' : '동의 철회됨'}</b>${state.consent && state.consentAt ? `<span class="tag">${state.consentAt} 동의</span>` : ''}</div>
        ${state.consent ? '<p>철회하면 저장된 건강정보와 파이·배지·파티 기록이 모두 지워져요. 닉네임·글·댓글·캐릭터와 계정은 그대로 남고, 언제든 다시 동의할 수 있어요.</p>'
          : '<p>저장된 건강정보가 삭제되었고 새 입력과 분석이 멈춥니다. 계정은 유지됩니다. 다시 동의하면 처음부터 입력해요.</p>'}
        ${state.notice ? `<p class="ok" style="font-weight:700">${state.notice}</p>` : ''}
        ${state.err && state.mp !== 'delete' ? `<p class="err">${state.err}</p>` : ''}
        <button type="button" id="toggle-consent" class="btn">${state.consent ? '동의 철회하기' : '동의 다시 하기'}</button>
      </div>
    </div>

    <div class="grp">
      <div class="gt">내 데이터</div>
      <a class="ln big" href="my-data.html"><span>내 데이터 내려받기 (JSON · PDF)</span>${chev}</a>
      <button type="button" id="download" class="ln big last"><span>원본 데이터 내려받기 (JSON)</span>${chev}</button>
    </div>

    <div class="grp">
      <div class="gt">내 기록</div>
      <button type="button" class="ln big" data-mp="rec"><span>건강 기록</span>${chev}</button>
      ${state.mp === 'rec' ? renderInfo() : ''}
      <button type="button" class="ln big" data-mp="chal"><span>챌린지 기록</span>${chev}</button>
      ${state.mp === 'chal' ? renderChal() : ''}
      <a class="ln big last" href="inquiries.html"><span>1:1 문의</span><span class="v"><span class="nw" id="inq-count"></span>${chev}</span></a>
    </div>

    <div class="grp" style="gap:8px">
      <div class="gt" style="padding:0">이 결과가 도움이 되었나요?</div>
      <div class="optrow">
        <button type="button" class="opt" data-r="up" data-on="${state.rating === 'up' ? '1' : '0'}">😀 도움됨</button>
        <button type="button" class="opt" data-r="mid" data-on="${state.rating === 'mid' ? '1' : '0'}">😐 보통</button>
        <button type="button" class="opt" data-r="down" data-on="${state.rating === 'down' ? '1' : '0'}">🙁 아님</button>
        <button type="button" id="save-fb" class="opt">${state.saved ? '저장했습니다 ✓' : '평가 저장'}</button>
      </div>
    </div>

    <div class="foot">
      <button type="button" id="logout-btn">로그아웃</button>
      <button type="button" id="delete-btn" class="del">회원 탈퇴</button>
    </div>
    <div style="font-size:12px; color:var(--muted); line-height:1.6; margin-top:-12px">회원 탈퇴는 비밀번호를 다시 확인한 뒤 모든 데이터를 바로 지워요.</div>
    ${state.mp === 'delete-notice' ? '<div class="warnbox"><b>회원 탈퇴는 아직 준비 중이에요</b><br>지금은 계정과 건강정보가 삭제되지 않아요. 삭제를 원하시면 서비스 담당자에게 알려 주세요.</div>' : ''}
    ${state.mp === 'delete' ? `<div class="warnbox"><b>회원 탈퇴 — 재인증이 필요합니다</b><br>삭제: 건강정보·설문·분석·챌린지 기록
      <div class="field" style="margin-top:8px"><label>비밀번호 다시 입력</label><input id="pwd" type="password"></div>${state.err ? `<p class="err" style="margin-top:6px">${state.err}</p>` : ''}
      <div style="display:flex;gap:8px;margin-top:10px"><button type="button" id="cancel-delete" class="ghost" style="width:auto;padding:8px 18px">취소</button>
      <button type="button" id="confirm-delete" class="cta" style="width:auto;padding:8px 18px">탈퇴하기</button></div></div>` : ''}
  `;
  wire();
}

const L = {
  smoking: { never: '피운 적 없음', former: '과거엔 피웠으나 현재 피우지 않음', current: '현재 피움' },
  ecig: { daily: '매일 사용', occasional: '가끔 사용', none: '사용 안 함' },
  freq: { never_lifetime: '평생 마신 적 없음', none_past_year: '최근 1년간 마시지 않음', lt_monthly: '한 달에 1번 미만', monthly: '한 달에 1번 정도', '2_4_per_month': '한 달에 2–4번', '2_3_per_week': '일주일에 2–3번 정도', '4plus_per_week': '일주일에 4번 이상' },
  amount: { '1_2': '1–2잔', '3_4': '3–4잔', '5_6': '5–6잔', '7_9': '7–9잔', '10plus': '10잔 이상' },
  htn: { none: '진단받은 적 없음', diagnosed_untreated: '진단받았지만 약은 안 먹음', treated: '진단받았고 약을 먹는 중' },
  parent: { yes: '있음', no: '없음', unknown: '모름' },
};
const localRead = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };

function renderInfo() {
  const h = localRead('paeon-health');
  if (!h) return '<div class="callout"><b>아직 입력한 건강정보가 없어요</b><br><a href="health-info.html" style="color:var(--sage-deep); font-weight:700">건강정보 입력하기</a></div>';
  const row = (k, v) => `<div class="sumrow"><span class="lb">${k}</span><span class="vv">${v}</span></div>`;
  const smoke = h.smoking === 'current' ? (h.smoking_freq === 'sometimes' ? '가끔 피움' : '매일 피움') : (L.smoking[h.smoking] || '-');
  return `<div class="sum-card">
    ${row('기록일', h.recorded_at || '-')}
    ${row('혈압', `${h.sbp}/${h.dbp} mmHg`)}
    ${row('키 / 몸무게', `${h.height_cm}cm / ${h.weight_kg}kg`)}
    ${row('허리둘레', `${h.waist_cm}cm`)}
    ${row('일반담배', smoke)}
    ${row('전자담배', L.ecig[h.ecig] || '입력 안 함')}
    ${row('음주(최근 1년)', (L.freq[h.drink_freq] || '-') + (h.drink_amount ? ` · 한 번에 ${L.amount[h.drink_amount]}` : ''))}
    ${row('당뇨병', h.diabetes ? '있음' : '없음')}
    ${row('고혈압 진단·치료', L.htn[h.htn_status] || '-')}
    ${row('총콜레스테롤', h.total_chol != null ? `${h.total_chol} mg/dL` : '입력 안 함')}
    ${row('부모 고혈압 가족력', L.parent[h.parent_htn] || '-')}
    ${row('공복혈당', h.fasting_glucose != null ? `${h.fasting_glucose} mg/dL` : '입력 안 함')}
  </div>
  <a class="ghost" href="health-info.html" style="text-align:center">건강정보 수정하기</a>`;
}

function renderChal() {
  const c = localRead('paeon-cycle'), p = localRead('paeon-progress') || { logs: {} }, hist = localRead('paeon-cycle-history') || [];
  if (!c) return '<div class="callout"><b>아직 시작한 챌린지가 없어요</b><br><a href="challenges.html" style="color:var(--sage-deep); font-weight:700">챌린지 고르기</a></div>';
  const no = c.cycleNo || 1;
  const days = Math.max(0, Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(c.startedOn + 'T00:00:00')) / 86400000));
  const done = (id) => Object.values(p.logs || {}).filter(d => d[id] && d[id].status === 'completed').length;
  const rows = c.missions.map(m => `<div class="sumrow"><span class="lb">${m.t}</span><span class="vv">${done(m.id)}회 완료</span></div>`).join('');
  return `<div class="callout"><b>12주 중 ${no}차</b> · ${c.startedOn} 시작 · ${Math.min(days + 1, 28)}일째<br>${(p.days || []).length}일 동안 모든 미션을 마쳤어요${hist.length ? ` · 지난 차수 ${hist.length}개` : ''}</div>
    <div class="sum-card">${rows}</div>
    <a class="ghost" href="challenge-progress.html" style="text-align:center">오늘 기록하러 가기</a>`;
}

function wire() {
  document.getElementById('back').innerHTML = ICON.back;
  document.querySelectorAll('#screen [data-icon]').forEach(e => { e.innerHTML = ICON[e.dataset.icon] || ''; });
  inquiryUnread().then((n) => { const c = document.getElementById('inq-count'); if (c && n) c.textContent = `새 답변 ${n}개`; });
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
  ['p-edit', 'p-edit2'].forEach(id => on(id, () => { state.editProfile = true; state.perr = ''; render(); }));
  on('p-cancel', () => { state.editProfile = false; state.perr = ''; render(); });
  on('p-save', async () => {
    const birth = document.getElementById('p-birth').value, sex = document.getElementById('p-sex').value;
    if (!birth) { state.perr = '생년월일을 입력해 주세요.'; render(); return; }
    const changed = !me || me.birth_date !== birth || me.sex !== sex;
    let saved = false;
    try { me = (await apiCall('PATCH', '/users/me', { birth_date: birth, sex }, '내 정보를 고치지 못했습니다')).data; state.editProfile = false; state.perr = ''; saved = true; }
    catch (e) { state.perr = friendlyError(e); }
    render();
    // 나이·성별이 바뀌면 저장 직후 새 값으로 바로 다시 분석하고 결과 화면으로 간다
    if (saved && changed) {
      const L = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
      localStorage.setItem('paeon-profile', JSON.stringify({ ...(L('paeon-profile') || {}), birth: me.birth_date, sex: me.sex }));
      if (localStorage.getItem('paeon-health-record-id')) {
        try {
          await restoreEligibilityFromServer();                 // 나이대를 새 생년월일로 다시 계산
          const r = await apiRequestPrediction(L('paeon-profile'), L('paeon-eligibility'), L('paeon-health'), L('paeon-survey'));
          localStorage.setItem('paeon-prediction', JSON.stringify(r.data));
          location.href = 'result.html';
        } catch (e) { state.perr = friendlyError(e); render(); }
      }
    }
  });
  document.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { state.rating = b.dataset.r; state.saved = false; render(); }));
  document.getElementById('save-fb').addEventListener('click', () => { if (state.rating) { state.saved = true; render(); } });
  document.querySelectorAll('[data-mp]').forEach(b => b.addEventListener('click', () => { state.mp = state.mp === b.dataset.mp ? null : b.dataset.mp; render(); }));
  document.getElementById('toggle-consent').addEventListener('click', async () => {
    const want = !state.consent;                                   // true = 다시 동의, false = 철회
    if (!want && !(await confirmDialog('동의를 철회할까요?', '철회하면 저장된 건강정보(성별 포함)가 삭제되고 새 입력과 분석이 중단돼요. 계정은 남고, 다시 동의하면 처음부터 입력해야 해요. 필요하면 먼저 "원본 데이터 내려받기"로 저장해 두세요.', '철회하기'))) return;
    try {
      let id = state.healthPolicyId;
      if (!id) id = (await apiCall('GET', '/consent-policies/active', undefined, '')).data.find(p => p.policy_type === 'health_data').policy_id;
      state.healthPolicyId = id;
      if (want) await apiCall('POST', '/users/me/consents', { policy_id: id }, '');
      else {
        await apiCall('POST', '/users/me/consents', { policy_id: id }, '');   // 기록 없는 기존 회원도 철회할 수 있게 먼저 동의 상태로 맞춤 (이미 동의면 그대로)
        const res = await apiCall('DELETE', `/users/me/consents/${id}`, undefined, '');
        const n = res && res.data ? res.data.deleted_total : null;   // 서버가 지운 건수 (없으면 건수 없이 안내)
        state.notice = n ? `건강정보를 삭제했어요 (${n}건).` : '건강정보를 삭제했어요.';
      }
    } catch (e) { if (e.code) { state.err = e.message || '동의 상태를 바꾸지 못했어요.'; render(); return; } }   // 코드 없는 실패 = 서버에 API 없음 → 화면에서만 바꿈
    if (want) state.notice = '';
    state.consent = want; render();
  });
  addPasswordToggles(document.getElementById('screen'));      // 탈퇴 재인증 칸의 "보기" 버튼
  document.getElementById('download').addEventListener('click', async () => {
    let serverData = null;
    try { serverData = await apiCall('GET', '/users/me/data-export', undefined, ''); } catch (e) { /* 서버에 API가 없으면 아래 브라우저 값으로 */ }
    const data = serverData || {
      profile: JSON.parse(localStorage.getItem('paeon-profile') || 'null'),
      health: JSON.parse(localStorage.getItem('paeon-health') || 'null'),
      prediction: JSON.parse(localStorage.getItem('paeon-prediction') || 'null'),
    };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = 'paeon-my-data.json'; a.click();
  });
  document.getElementById('logout-btn').addEventListener('click', async () => {
    if (await confirmDialog('로그아웃할까요?', '다시 이용하려면 로그인해야 해요.', '로그아웃')) apiLogout();
  });
  document.getElementById('delete-btn').addEventListener('click', () => { state.mp = state.mp === 'delete' ? null : 'delete'; render(); });
  const cancelBtn = document.getElementById('cancel-delete');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { state.mp = null; render(); });
  const confirmBtn = document.getElementById('confirm-delete');
  if (confirmBtn) confirmBtn.addEventListener('click', async () => {
    const pwd = document.getElementById('pwd').value;
    if (!pwd) { state.err = '비밀번호를 입력해 주세요.'; render(); return; }
    if (!(await confirmDialog('정말 탈퇴할까요?', '건강정보·설문·분석·챌린지·캘린더 기록이 모두 삭제되고, 되돌릴 수 없어요.', '탈퇴하기'))) return;
    confirmBtn.disabled = true;
    try {
      await apiCall('POST', '/users/me/deletion-requests', { password: pwd }, '');
      localStorage.clear();                                   // 이 브라우저에 남은 값(계정별 보관본 포함)도 모두 지운다
      state.gone = true;
    } catch (e) {
      state.mp = e.code ? 'delete' : 'delete-notice';        // 코드 없는 실패 = 서버에 탈퇴 API가 없음
      state.err = e.code === 'AUTH_INVALID_CREDENTIALS' ? '비밀번호가 맞지 않아요.' : (e.code ? (e.message || '탈퇴하지 못했어요.') : '');
    }
    render();
  });
}
if (location.hash === '#withdraw') state.mp = 'delete';
render();
apiGetMe().then(m => { me = m; render(); }).catch(() => {});
apiCall('GET', '/users/me/consents', undefined, '').then(r => {      // 서버에 저장된 건강정보 동의 상태를 불러온다
  const h = r.data.find(c => c.policy_type === 'health_data');
  if (h) { state.healthPolicyId = h.policy_id; state.consent = h.status === 'agreed'; state.consentAt = (h.consented_at || '').slice(0, 10).replace(/-/g, '.'); render(); }
}).catch(() => {});
</script>
</body>
</html>
