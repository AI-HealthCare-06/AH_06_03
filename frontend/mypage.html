<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 마이페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .tworow{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .opt{border:1.5px solid var(--sage-light); background:#fff; color:var(--ink); border-radius:16px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer}
  .opt[data-on="1"]{border-color:var(--sage-deep); background:var(--sage-light)}
  .optrow{display:flex; flex-wrap:wrap; gap:8px}
  .sum-card{background:#fff; border:1px solid var(--sage-light); border-radius:18px; padding:4px 16px}
  .sumrow{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--sage-light); font-size:13px}
  .sumrow:last-child{border-bottom:0}
  .sumrow .lb{color:var(--muted)} .sumrow .vv{font-weight:700; text-align:right}
  .warnbox{border:1.5px solid var(--danger); background:#FBEAE5; border-radius:18px; padding:14px 18px; font-size:13px}
  .warnbox b{color:var(--risk)}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" id="screen"></div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
let me = null;
const SEX_LABEL = { male: '남', female: '여' };
const state = { rating: null, saved: false, consent: true, mp: null, gone: false, pwd: '', err: '' };

function render() {
  const screen = document.getElementById('screen');
  if (state.gone) {
    screen.innerHTML = `<div class="callout"><b>탈퇴가 완료되었습니다</b><br>건강정보·설문·예측·캘린더 기록을 삭제했고, 계정은 익명 처리했어요.</div>
      <a class="cta" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="index.html">처음으로</a>`;
    return;
  }
  screen.innerHTML = `
    <div class="callout">
      <b>이 결과가 도움이 되었나요?</b>
      <div class="optrow" style="margin-top:8px">
        <button type="button" class="opt" data-r="up" data-on="${state.rating === 'up' ? '1' : '0'}">😀 도움됨</button>
        <button type="button" class="opt" data-r="mid" data-on="${state.rating === 'mid' ? '1' : '0'}">😐 보통</button>
        <button type="button" class="opt" data-r="down" data-on="${state.rating === 'down' ? '1' : '0'}">🙁 아님</button>
      </div>
      <button type="button" id="save-fb" class="ghost" style="margin-top:8px">${state.saved ? '저장했습니다 ✓' : '평가 저장'}</button>
    </div>
    <p class="sect">내 정보</p>
    ${me ? `<div class="callout"><b>${me.email}</b><br>생년월일 ${me.birth_date} · 성별 ${SEX_LABEL[me.sex] || '미입력'}</div>` : ''}
    <div class="tworow">
      <button type="button" class="opt" data-mp="rec" data-on="${state.mp === 'rec' ? '1' : '0'}">🩺 검진 기록</button>
      <button type="button" class="opt" data-mp="chal" data-on="${state.mp === 'chal' ? '1' : '0'}">🌱 챌린지 기록</button>
    </div>
    ${state.mp === 'rec' ? renderInfo() : ''}
    ${state.mp === 'chal' ? renderChal() : ''}
    ${!state.consent ? '<div class="callout"><b>건강정보 처리 동의를 철회했습니다</b><br>새 건강정보 입력과 예측이 멈춥니다. 계정은 유지됩니다.</div>' : ''}
    <p class="hint">동의 철회는 회원 탈퇴와 다릅니다 — 철회해도 계정은 유지됩니다.</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap">
      <button type="button" id="toggle-consent" class="ghost">${state.consent ? '건강정보 처리 동의 철회' : '건강정보 처리 동의 다시 하기'}</button>
      <button type="button" id="download" class="ghost">내 데이터 내려받기</button>
    </div>
    ${state.err && state.mp !== 'delete' ? `<p class="err">${state.err}</p>` : ''}
    <button type="button" id="logout-btn" class="ghost" style="margin-top:6px">로그아웃</button>
    <button type="button" id="delete-btn" class="ghost" style="margin-top:6px">회원 탈퇴</button>
    ${state.mp === 'delete-notice' ? '<div class="warnbox"><b>회원 탈퇴는 아직 준비 중이에요</b><br>지금은 계정과 건강정보가 삭제되지 않아요. 삭제를 원하시면 서비스 담당자에게 알려 주세요.</div>' : ''}
    ${state.mp === 'delete' ? `<div class="warnbox"><b>회원 탈퇴 — 재인증이 필요합니다</b><br>삭제: 건강정보·설문·예측·챌린지 기록
      <div class="field" style="margin-top:8px"><label>비밀번호 다시 입력</label><input id="pwd" type="password"></div>${state.err ? `<p class="err" style="margin-top:6px">${state.err}</p>` : ''}
      <div style="display:flex;gap:8px;margin-top:10px"><button type="button" id="cancel-delete" class="ghost" style="width:auto;padding:8px 18px">취소</button>
      <button type="button" id="confirm-delete" class="cta" style="width:auto;padding:8px 18px">탈퇴하기</button></div></div>` : ''}
  `;
  wire();
}

const L = {
  smoking: { never: '피운 적 없음', former: '과거엔 피웠으나 현재 피우지 않음', current: '현재 피움' },
  ecig: { daily: '매일 사용', occasional: '가끔 사용', none: '사용 안 함' },
  freq: { never_lifetime: '평생 마신 적 없음', none_past_year: '최근 1년간 마시지 않음', lt_monthly: '한 달에 1번 미만', monthly: '한 달에 1번 정도', '2_4_per_month': '한 달에 2–4번', '2_3_per_week': '일주일에 2–3번 정도', '4plus_per_week': '일주일에 4번 이상' },
  amount: { '1_2': '1–2잔', '3_4': '3–4잔', '5_6': '5–6잔', '7_9': '7–9잔', '10plus': '10잔 이상' },
  htn: { none: '진단받은 적 없음', diagnosed_untreated: '진단받았지만 약은 안 먹음', treated: '진단받았고 약을 먹는 중' },
  parent: { yes: '있음', no: '없음', unknown: '모름' },
};
const localRead = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };

function renderInfo() {
  const h = localRead('paeon-health');
  if (!h) return '<div class="callout"><b>아직 입력한 건강정보가 없어요</b><br><a href="health-info.html" style="color:var(--sage-deep); font-weight:700">건강정보 입력하기</a></div>';
  const row = (k, v) => `<div class="sumrow"><span class="lb">${k}</span><span class="vv">${v}</span></div>`;
  const smoke = h.smoking === 'current' ? (h.smoking_freq === 'sometimes' ? '가끔 피움' : '매일 피움') : (L.smoking[h.smoking] || '-');
  return `<div class="sum-card">
    ${row('검진일', h.recorded_at || '-')}
    ${row('혈압', `${h.sbp}/${h.dbp} mmHg`)}
    ${row('키 / 몸무게', `${h.height_cm}cm / ${h.weight_kg}kg`)}
    ${row('허리둘레', `${h.waist_cm}cm`)}
    ${row('일반담배', smoke)}
    ${row('전자담배', L.ecig[h.ecig] || '입력 안 함')}
    ${row('음주(최근 1년)', (L.freq[h.drink_freq] || '-') + (h.drink_amount ? ` · 한 번에 ${L.amount[h.drink_amount]}` : ''))}
    ${row('당뇨병', h.diabetes ? '있음' : '없음')}
    ${row('고혈압 진단·치료', L.htn[h.htn_status] || '-')}
    ${row('총콜레스테롤 / HDL', `${h.total_chol} / ${h.hdl} mg/dL`)}
    ${row('부모 고혈압 가족력', L.parent[h.parent_htn] || '-')}
    ${row('공복혈당', h.fasting_glucose != null ? `${h.fasting_glucose} mg/dL` : '입력 안 함')}
  </div>
  <a class="ghost" href="health-info.html" style="text-align:center">건강정보 수정하기</a>`;
}

function renderChal() {
  const c = localRead('paeon-cycle'), p = localRead('paeon-progress') || { logs: {} }, hist = localRead('paeon-cycle-history') || [];
  if (!c) return '<div class="callout"><b>아직 시작한 챌린지가 없어요</b><br><a href="challenges.html" style="color:var(--sage-deep); font-weight:700">챌린지 고르기</a></div>';
  const no = c.cycleNo || 1;
  const days = Math.max(0, Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(c.startedOn + 'T00:00:00')) / 86400000));
  const done = (id) => Object.values(p.logs || {}).filter(d => d[id] && d[id].status === 'completed').length;
  const rows = c.missions.map(m => `<div class="sumrow"><span class="lb">${m.t}</span><span class="vv">${done(m.id)}회 완료</span></div>`).join('');
  return `<div class="callout"><b>12주 중 ${no}차</b> · ${c.startedOn} 시작 · ${Math.min(days + 1, 28)}일째<br>${(p.days || []).length}일 동안 모든 미션을 마쳤어요${hist.length ? ` · 지난 차수 ${hist.length}개` : ''}</div>
    <div class="sum-card">${rows}</div>
    <a class="ghost" href="challenge-progress.html" style="text-align:center">오늘 기록하러 가기</a>`;
}

function wire() {
  document.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { state.rating = b.dataset.r; state.saved = false; render(); }));
  document.getElementById('save-fb').addEventListener('click', () => { if (state.rating) { state.saved = true; render(); } });
  document.querySelectorAll('[data-mp]').forEach(b => b.addEventListener('click', () => { state.mp = state.mp === b.dataset.mp ? null : b.dataset.mp; render(); }));
  document.getElementById('toggle-consent').addEventListener('click', async () => {
    const want = !state.consent;                                   // true = 다시 동의, false = 철회
    try {
      let id = state.healthPolicyId;
      if (!id) id = (await apiCall('GET', '/consent-policies/active', undefined, '')).data.find(p => p.policy_type === 'health_data').policy_id;
      state.healthPolicyId = id;
      if (want) await apiCall('POST', '/users/me/consents', { policy_id: id }, '');
      else {
        await apiCall('POST', '/users/me/consents', { policy_id: id }, '');   // 기록 없는 기존 회원도 철회할 수 있게 먼저 동의 상태로 맞춤 (이미 동의면 그대로)
        await apiCall('DELETE', `/users/me/consents/${id}`, undefined, '');
      }
    } catch (e) { if (e.code) { state.err = e.message || '동의 상태를 바꾸지 못했어요.'; render(); return; } }   // 코드 없는 실패 = 서버에 API 없음 → 화면에서만 바꿈
    state.consent = want; render();
  });
  document.getElementById('download').addEventListener('click', async () => {
    let serverData = null;
    try { serverData = await apiCall('GET', '/users/me/data-export', undefined, ''); } catch (e) { /* 서버에 API가 없으면 아래 브라우저 값으로 */ }
    const data = serverData || {
      profile: JSON.parse(localStorage.getItem('paeon-profile') || 'null'),
      health: JSON.parse(localStorage.getItem('paeon-health') || 'null'),
      prediction: JSON.parse(localStorage.getItem('paeon-prediction') || 'null'),
    };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = 'paeon-my-data.json'; a.click();
  });
  document.getElementById('logout-btn').addEventListener('click', apiLogout);
  document.getElementById('delete-btn').addEventListener('click', () => { state.mp = state.mp === 'delete' ? null : 'delete'; render(); });
  const cancelBtn = document.getElementById('cancel-delete');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { state.mp = null; render(); });
  const confirmBtn = document.getElementById('confirm-delete');
  if (confirmBtn) confirmBtn.addEventListener('click', async () => {
    const pwd = document.getElementById('pwd').value;
    if (!pwd) { state.err = '비밀번호를 입력해 주세요.'; render(); return; }
    confirmBtn.disabled = true;
    try {
      await apiCall('POST', '/users/me/deletion-requests', { password: pwd }, '');
      localStorage.clear();                                   // 이 브라우저에 남은 값(계정별 보관본 포함)도 모두 지운다
      state.gone = true;
    } catch (e) {
      state.mp = e.code ? 'delete' : 'delete-notice';        // 코드 없는 실패 = 서버에 탈퇴 API가 없음
      state.err = e.code === 'AUTH_INVALID_CREDENTIALS' ? '비밀번호가 맞지 않아요.' : (e.code ? (e.message || '탈퇴하지 못했어요.') : '');
    }
    render();
  });
}
render();
apiGetMe().then(m => { me = m; render(); }).catch(() => {});
apiCall('GET', '/users/me/consents', undefined, '').then(r => {      // 서버에 저장된 건강정보 동의 상태를 불러온다
  const h = r.data.find(c => c.policy_type === 'health_data');
  if (h) { state.healthPolicyId = h.policy_id; state.consent = h.status === 'agreed'; render(); }
}).catch(() => {});
</script>
</body>
</html>
