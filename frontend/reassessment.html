<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 4주 재입력 · 변화 비교</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .screen{gap:22px}
  #lede{font-size:26px; font-weight:800; letter-spacing:-.6px; line-height:1.35; color:var(--ink); white-space:pre-line}
  #sub{font-size:14px; color:#4A5C6D; line-height:1.6; margin-top:-10px}
  #body{display:flex; flex-direction:column; gap:22px}
  #body .sect{margin:0 0 -10px}
  .guide{font-size:13px; color:#4A5C6D; background:var(--cream); border-radius:18px; padding:16px; line-height:1.7}
  .guide .g1{font-size:14px; font-weight:700; color:var(--ink); line-height:1.55; margin-bottom:8px}
  .guide .note{margin-top:8px}
  .field label{font-weight:500}
  .field input{font-weight:800; font-size:18px; border-radius:14px; border:2px solid transparent}
  .field input:focus{outline:0; border-color:var(--ink)}
  .field select{border-radius:14px}
  .cmp{display:grid; grid-template-columns:1fr auto auto auto; gap:8px 12px; align-items:center; font-size:14px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 16px}
  .cmp .h{font-size:12px; color:var(--muted); font-weight:700}
  .cmp .v{font-weight:800; text-align:right}
  .cmp .arrow{color:var(--muted)}
  .note{font-size:12px; color:var(--muted); line-height:1.6}
  .mrow{display:flex; justify-content:space-between; font-size:14px; min-height:44px; align-items:center; border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:none}
  .ok{color:var(--ok); font-weight:700} .risk{color:var(--risk); font-weight:700}
  .bcmp{padding:6px 4px 2px; text-align:center}
  .bcmp .bt{font-size:13.5px; line-height:1.6; color:var(--ink); font-weight:700; margin:0 0 10px}
  .bcmp .chip{display:inline-block; height:auto; margin-top:10px; padding:8px 22px; border-radius:22px; background:var(--cream); border:0; color:var(--ink); font-size:16px; line-height:1.4; font-weight:800}
  .bcmp .bnote{font-size:12px; line-height:1.7; color:var(--muted); margin:12px 0 0}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="page-bar" style="margin-bottom:0"><a class="back" href="challenge-progress.html" aria-label="뒤로" id="back"></a><span class="ttl">4주 재입력</span></div>
      <div class="screen" id="screen">
        <p id="lede">불러오는 중...</p>
        <p id="sub" hidden>처음과 비교해 드려요.</p>
        <div id="err" class="callout" style="display:none"></div>
        <div id="body"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
// 4주 재입력(가이드 §6.1) → 모델 A·B 재예측 → 전후 비교(W11-2)
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const RISK = { normal: '양호', borderline: '주의', high: '높음' };
const SMOKING = { current: '현재 피움', former: '끊음', never: '피운 적 없음' };
const DRINK = { never_lifetime: '안 마심', none_past_year: '4주간 안 마심', lt_monthly: '한 달에 1번 미만', monthly: '한 달에 1번',
  '2_4_per_month': '한 달에 2–4번', '2_3_per_week': '일주일에 2–3번', '4plus_per_week': '일주일에 4번 이상' };

function showError(msg) { const el = document.getElementById('err'); el.style.display = msg ? 'block' : 'none'; el.textContent = msg || ''; }
const cycleId = new URLSearchParams(location.search).get('cycle');

function formHtml() {
  return `
  <p class="sect">혈압</p>
  <div class="guide">
    <div class="g1">같은 시간대에 재야 비교할 수 있어요.</div>
    · 아침: 일어난 뒤 1시간 안, 식사·약 먹기 전<br>· 저녁: 잠자리에 들기 전<br>· 재기 30분 전부터 커피·운동·흡연·음주는 피해요<br>· 앉아서 1~2분 쉰 뒤, 1~2분 간격으로 두 번 재요
    <div class="note">대한고혈압학회 가정혈압포럼 2022</div>
  </div>
  <div class="grid2">
    <div class="field"><label for="sbp1">첫 번째 수축기</label><input id="sbp1" type="number" min="60" max="260"></div>
    <div class="field"><label for="dbp1">첫 번째 이완기</label><input id="dbp1" type="number" min="30" max="160"></div>
    <div class="field"><label for="sbp2">두 번째 수축기 (선택)</label><input id="sbp2" type="number" min="60" max="260"></div>
    <div class="field"><label for="dbp2">두 번째 이완기 (선택)</label><input id="dbp2" type="number" min="30" max="160"></div>
  </div>
  <p class="sect">몸</p>
  <div class="grid2">
    <div class="field"><label for="weight">몸무게 (kg)</label><input id="weight" type="number" step="0.1" min="30" max="200"></div>
    <div class="field"><label for="waist">허리둘레 (cm, 선택)</label><input id="waist" type="number" step="0.1" min="50" max="150"></div>
  </div>
  <p class="sect">흡연 · 음주</p>
  <div class="field"><label for="smoking">현재 일반담배를 피우십니까?</label>
    <select id="smoking"><option value="">선택</option><option value="current">매일 피움</option><option value="current">가끔 피움</option>
      <option value="former">과거엔 피웠으나, 현재 피우지 않음</option><option value="never">피운 적 없음</option></select></div>
  <div class="field"><label for="dfreq">최근 4주 동안 술을 얼마나 자주 마십니까?</label>
    <select id="dfreq"><option value="">선택</option><option value="never_lifetime">평생 술을 마셔 본 적 없음</option>
      <option value="none_past_year">최근 4주간 전혀 마시지 않았다</option><option value="lt_monthly">한 달에 1번 미만</option>
      <option value="monthly">한 달에 1번 정도</option><option value="2_4_per_month">한 달에 2–4번</option>
      <option value="2_3_per_week">일주일에 2–3번 정도</option><option value="4plus_per_week">일주일에 4번 이상</option></select></div>
  <div class="field" id="damount-box" style="display:none"><label for="damount">최근 4주 동안 한 번에 술을 얼마나 마십니까?</label>
    <select id="damount"><option value="">선택</option><option value="1_2">1–2잔</option><option value="3_4">3–4잔</option>
      <option value="5_6">5–6잔</option><option value="7_9">7–9잔</option><option value="10plus">10잔 이상</option></select>
</div>
  <p class="hint" style="font-size:13px">키·콜레스테롤·진단·가족력은 처음 값을 그대로 써요.</p>
  <button type="button" id="submit" class="cta" style="height:56px; font-size:17px">다음 · 생활습관 설문</button>`;
}

function avg(a, b) { return b ? Math.round((a + b) / 2 * 10) / 10 : a; }

function collect() {
  const n = (id) => { const v = document.getElementById(id).value; return v === '' ? null : Number(v); };
  const s = (id) => document.getElementById(id).value || null;
  const sbp1 = n('sbp1'), dbp1 = n('dbp1'), weight = n('weight'), smoking = s('smoking'), dfreq = s('dfreq');
  if (!sbp1 || !dbp1) throw new Error('첫 번째 혈압을 입력해 주세요.');
  if (!weight) throw new Error('몸무게를 입력해 주세요.');
  if (!smoking || !dfreq) throw new Error('흡연과 음주 문항을 골라 주세요.');
  const drinks = !['never_lifetime', 'none_past_year'].includes(dfreq);
  if (drinks && !s('damount')) throw new Error('한 번 음주량을 골라 주세요.');
  const m = [
    { metric_code: 'SBP', value_num: avg(sbp1, n('sbp2')) }, { metric_code: 'DBP', value_num: avg(dbp1, n('dbp2')) },
    { metric_code: 'WEIGHT', value_num: weight }, { metric_code: 'SMOKING', value_code: smoking },
    { metric_code: 'ALCOHOL_FREQ', value_code: dfreq },
  ];
  if (n('waist')) m.push({ metric_code: 'WAIST', value_num: n('waist') });
  if (drinks) m.push({ metric_code: 'ALCOHOL_AMOUNT', value_code: s('damount') });
  return m;
}

function row(label, b, a, unit) {
  const f = (v) => v === null || v === undefined ? '—' : `${v}${unit || ''}`;
  return `<span>${label}</span><span class="v">${f(b)}</span><span class="arrow">→</span><span class="v">${f(a)}</span>`;
}

function reviewHtml(rv) {
  const b = rv.before || {}, a = rv.after || {};
  const bp = (x) => x.sbp ? `${x.sbp}/${x.dbp}` : null;
  const range = rv.normal_weight_range ? `키 기준 정상 체중 ${rv.normal_weight_range[0]}–${rv.normal_weight_range[1]}kg · 허리둘레 기준 ${rv.waist_limit}cm 미만` : '';
  // 모델 A는 위험 범주로, 모델 B는 판정 없이 "닮은 정도"의 방향만 보여준다 (데이터_특성 §2.1: B 확률로 판정 금지)
  const models = modelANoticeHtml(rv.models) + rv.models.filter(m => m.comparable).map(m => {
    if (m.model_code === 'MODEL_A') {
      return `<div class="mrow"><span>10년 내 심장 혈관 건강 신호</span><span>${RISK[m.before_risk_level]}${probText(m.before_probability) ? ` (${probText(m.before_probability)})` : ''} → <b>${RISK[m.after_risk_level]}${probText(m.after_probability) ? ` (${probText(m.after_probability)})` : ''}</b></span></div>${probText(m.before_probability) || probText(m.after_probability) ? probNoteHtml(false, true) : ''}`;
    }
    // 서버가 주는 3단계(similar / slightly_different / different)를 말로만 비교한다. 숫자·막대는 쓰지 않는다.
    const chg = simChangeText(m.before_similarity_level, m.after_similarity_level);
    return `<div class="bcmp">
      <p class="bt">나와 비슷한 사람들과 비교했어요</p>
      ${chg ? `<div class="chip">${chg}</div>` : ''}
      <p class="bnote" style="word-break:keep-all; text-wrap:balance">혈압이 정상인 사람들의 전체 자료와 비교했어요. 허리둘레, 몸무게, 술은 내가 바꿀 수 있어요.</p>
    </div>`;
  }).join('');
  return demoFillHtml(rv) + `
  <p class="sect">혈압 · 몸 변화</p>
  <div class="cmp">
    <span class="h"></span><span class="h">처음</span><span></span><span class="h">4주 후</span>
    ${row('혈압 (mmHg)', bp(b), bp(a))}
    ${row('몸무게', b.weight_kg, a.weight_kg, 'kg')}
    ${row('허리둘레', b.waist_cm, a.waist_cm, 'cm')}
    <p class="note" style="grid-column:1/-1; margin:6px 0 0; padding-top:8px; border-top:1px solid var(--sage-light)">${esc(rv.bp_note)} ${esc(range)}</p>
  </div>
  <p class="sect">미션 달성률</p>
  <div class="cmp" style="display:block">${rv.missions.map(m =>
    `<div class="mrow"><span>${esc(m.name)}</span><span class="${m.status === 'completed' ? 'ok' : ''}">${Math.round(m.cycle_rate * 100)}%${m.status === 'completed' ? ' · 완료' : ''}</span></div>`).join('')}</div>
  <p class="sect">습관 변화</p>
  <div class="cmp" style="display:block">
    <div class="mrow"><span>흡연</span><span>${SMOKING[b.smoking] || '—'} → <b>${SMOKING[a.smoking] || '—'}</b></span></div>
    <div class="mrow"><span>음주</span><span>${DRINK[b.drink_freq] || '—'} → <b>${DRINK[a.drink_freq] || '—'}</b></span></div>
  </div>
  ${models ? `<p class="sect">분석 결과 변화</p><div class="cmp" style="display:block">${models}
    </div>` : ''}
  ${rv.cycle_number < rv.total_cycles
    ? `<a class="cta" style="height:56px; font-size:17px" href="challenges.html">${rv.cycle_number + 1}차 챌린지 시작하기</a>`
    : `<div class="callout"><b>12주 챌린지를 모두 마쳤어요!</b></div>`}`;
}

document.getElementById('back').innerHTML = ICON.back;
async function main() {
  if (!cycleId) { showError('어떤 챌린지의 재입력인지 알 수 없어요. 챌린지 화면에서 다시 들어와 주세요.'); return; }
  let rv;
  try { rv = (await apiCall('GET', `/challenges/cycles/${encodeURIComponent(cycleId)}/review`, undefined, '변화를 불러오지 못했습니다')).data; }
  catch (e) { showError(friendlyError(e)); return; }

  const lede = document.getElementById('lede');
  const body = document.getElementById('body');
  if (rv.reassessed) {
    lede.textContent = `${rv.cycle_number}차 4주 동안의 변화예요.`;
    body.innerHTML = reviewHtml(rv);
    return;
  }
  if (rv.cycle_status === 'active') {
    lede.textContent = '4주가 끝나면 재입력할 수 있어요.';
    return;
  }
  lede.textContent = `${rv.cycle_number}차 4주가 끝났어요.
지금 상태를 적어 주세요`;
  document.getElementById('sub').hidden = false;
  body.innerHTML = formHtml();
  const dfreq = document.getElementById('dfreq');
  dfreq.addEventListener('change', () => {
    document.getElementById('damount-box').style.display = ['', 'never_lifetime', 'none_past_year'].includes(dfreq.value) ? 'none' : 'flex';
  });
  document.getElementById('submit').addEventListener('click', () => {
    showError('');
    let measurements;
    try { measurements = collect(); } catch (e) { showError(e.message); return; }
    // 몸 상태 값은 잠시 보관하고, 최근 4주 생활습관 설문을 한 뒤 돌아와서 함께 저장한다
    try { sessionStorage.setItem('paeon-reassess-draft', JSON.stringify({ cycleId, measurements })); } catch (e) { showError('이 브라우저에서는 저장할 수 없어요.'); return; }
    location.href = `survey.html?type=interim&next=${encodeURIComponent(`reassessment.html?cycle=${cycleId}&done=1`)}`;
  });
  // 설문을 마치고 돌아왔으면 보관해 둔 값을 저장하고 변화를 보여 준다
  if (new URLSearchParams(location.search).get('done') === '1') {
    let draft = null;
    try { draft = JSON.parse(sessionStorage.getItem('paeon-reassess-draft') || 'null'); } catch (e) { /* 없으면 아래에서 폼으로 */ }
    if (draft && draft.cycleId === cycleId) {
      lede.textContent = '변화를 정리하고 있어요...';
      document.getElementById('sub').hidden = true; body.innerHTML = '';
      const building = progressOverlay('처음과 비교하는 중이에요', '4주 동안 달라진 점을 정리하고 있어요');
      try {
        const res = (await apiCall('POST', `/challenges/cycles/${encodeURIComponent(cycleId)}/reassessment`, { measurements: draft.measurements }, '저장하지 못했습니다')).data;
        try { sessionStorage.removeItem('paeon-reassess-draft'); } catch (e) {}
        await building.finish();
        building.cancel();   // 화면을 옮기지 않으므로 덮개를 걷어야 결과가 보인다
        lede.textContent = `${res.cycle_number}차 4주 동안의 변화예요.`;
        body.innerHTML = reviewHtml(res);
        history.replaceState(null, '', `reassessment.html?cycle=${encodeURIComponent(cycleId)}`);
        window.scrollTo(0, 0);
      } catch (e) {
        building.cancel();
        lede.textContent = `${rv.cycle_number}차 4주가 끝났어요.
지금 상태를 적어 주세요`;
        document.getElementById('sub').hidden = false; body.innerHTML = formHtml();
        showError(friendlyError(e));
      }
    }
  }
}

main();
</script>
</body>
</html>
