<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 분석 결과</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .screen{gap:16px}
  #advice-banner{background:var(--notice); border:1px solid var(--sky) !important; border-radius:16px; padding:16px 36px 14px 20px; font-size:14px; line-height:1.6}
  #advice-banner label{font-size:14px !important; font-weight:700; min-height:44px; align-items:center !important; margin-top:6px !important}
  #advice-banner input{width:22px; height:22px; margin:0 !important; accent-color:var(--ink)}
  .rescard{border:1px solid var(--line); border-radius:20px; padding:24px 20px; display:flex; flex-direction:column; gap:16px}
  .rescard .cap{font-size:14px; color:#4A5C6D}
  .rescard .big{display:flex; align-items:center; gap:12px; font-size:48px; font-weight:800; letter-spacing:-1.5px; line-height:1}
  .rescard .seg{display:flex; gap:4px}
  .rescard .seg i{flex:1; height:8px; border-radius:4px; background:var(--line)}
  .rescard .seg i.on{background:var(--accent)}
  .rescard .lv{display:flex; justify-content:space-between; font-size:13px; color:var(--muted)}
  .rescard .lv .cur{font-weight:800; color:var(--ink)}
  .rescard .why{font-size:14px; color:var(--body); line-height:1.6}
  .agebox{background:var(--cream); border-radius:16px; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px}
  .agebox .t{display:flex; flex-direction:column; gap:4px; font-size:14px; font-weight:700}
  .agebox .t span{font-size:13px; font-weight:500; color:#4A5C6D}
  .agebox .n{font-size:28px; font-weight:800; letter-spacing:-.5px; flex:none}
  .blk{display:flex; flex-direction:column; gap:12px; padding-top:8px}
  .blk .sect{margin:0}
  .blk .small{font-size:13px; color:var(--muted); line-height:1.6}
  .blk .desc{font-size:13px; color:#4A5C6D; line-height:1.6}
  .bars{display:flex; flex-direction:column; gap:14px}
  .bars .br{display:flex; align-items:center; gap:12px; font-size:14px}
  .bars .br>span{width:88px; flex:none}
  .bb{flex:1; height:10px; border-radius:5px; background:var(--track)}
  .bb i{display:block; height:10px; border-radius:5px; background:var(--accent)}
  .bb i.neg{background:var(--accent-light)}
  .three{display:flex; gap:8px}
  .three span{flex:1; height:48px; border-radius:24px; border:1px solid var(--sage); font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:center; text-align:center}
  .three span.on{background:var(--accent-light); border-color:var(--accent-light); color:#1E3246; font-weight:800}
  .bprow{display:flex; align-items:center; gap:10px; background:var(--cream); border-radius:16px; padding:14px 20px; font-size:13px; color:var(--muted)}
  .bprow b{font-size:14px; color:var(--ink)}
  .notes{display:flex; flex-direction:column; gap:8px; padding-top:8px; font-size:13px; color:var(--muted); line-height:1.7}
  .linkhint{font-size:13px; color:var(--muted); background:var(--cream); border-radius:12px; padding:10px 14px}
  .linkhint a{color:var(--ink); font-weight:700}
  .simnow{font-size:15px; font-weight:700; line-height:1.6; word-break:keep-all; margin:2px 0 10px}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="page-bar" style="margin-bottom:0"><a class="back" href="dashboard.html" aria-label="뒤로" id="back"></a><span class="ttl">분석 결과</span></div>
      <div class="screen" id="screen"></div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
const LV = { normal: 1, borderline: 2, high: 3 };
const BP_LABEL = { normal: '정상', elevated: '주의혈압', prehypertension: '고혈압전단계', hypertension: '고혈압' };
const RISK_LABEL = { normal: '양호', borderline: '주의', high: '높음' };
const A_SKIP_MSG = { age_out_of_range: '만 32~70세가 아니어서 분석할 수 없습니다', cad_diagnosed: '심장 혈관 질환 진단 이력이 있어 분석할 수 없습니다' };
const B_SKIP_MSG = { age_out_of_range: '19세 미만이어서 분석할 수 없습니다', htn_diagnosed: '고혈압으로 진단·치료 중이라 분석할 수 없습니다' };
const SIM_LABEL = { similar: '비슷한 편이에요', slightly_different: '조금 달라요', different: '많이 달라요' };
const TRI = '<svg width="26" height="26" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l6.5 11.5h-13z"/></svg>';
const OKI = '<svg width="26" height="26" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.2l2 2 3.6-4"/></svg>';   // 양호는 홈 카드와 같은 체크 아이콘

// 명세 §3: 학습 방향이 상식과 반대인 요인(direction_matches_expectation = false)은 요인 목록에 표시하지 않는다.
const visible = (factors) => (factors || []).filter(f => f.direction_matches_expectation !== false);
// 바꿀 수 없는 요인(나이·성별 등)은 막대에서 빼고 한 줄로만 알린다.
const shown = (factors) => visible(factors).filter(f => f.modifiable);
// 입력하지 않아 중앙값으로 채운 값은 요인에서 뺀다 (사용자가 넣은 값이 아니라서 영향으로 보여 주면 안 된다)
const withoutMissing = (res) => {
  const miss = res.missing_features || [];
  if (!miss.length) return res;
  const top = res.top_modifiable_factor;
  return { ...res, factors: (res.factors || []).filter(f => !miss.includes(f.code)), top_modifiable_factor: top && miss.includes(top.code) ? null : top };
};
const fixedNote = (factors) => visible(factors).some(f => !f.modifiable) ? '<div class="small">나이·성별처럼 바꿀 수 없는 요인은 뺐어요.</div>' : '';

// 개선 가능한 1위 요인 → 그 요인을 관리할 수 있는 챌린지 안내 (명세 §7 요인 → 챌린지 연결표, 가이드 §7). 결과 설명용이고 챌린지 추천에는 쓰지 않는다.
const LINK = {
  MODEL_A: { currentSmoker: '금연 미션', sysBP: '나트륨 줄이기·신체 활동 미션', BMI: '신체 활동·체중 관리 미션' },
  MODEL_B: { bmi: '신체 활동·체중 관리 미션', waist: '신체 활동·체중 관리 미션', drink_freq: '절주 미션', drink_amount: '절주 미션' },
};
function linkHint(model, res) {
  const f = res.top_modifiable_factor;
  const to = f && f.direction_matches_expectation !== false && LINK[model][f.code];
  return to ? `<div class="linkhint">'<b>${f.label}</b>' 요인은 ${to}으로 관리할 수 있어요 · <a href="challenges.html">챌린지 보기</a></div>` : '';
}

function bars(factors) {
  const mx = Math.max(0.2, ...factors.map(f => Math.abs(f.contribution)));
  return '<div class="bars">' + factors.map(f => `<div class="br"><span>${f.label}</span><div class="bb"><i class="${f.contribution >= 0 ? '' : 'neg'}" style="width:${Math.abs(f.contribution) / mx * 100}%"></i></div></div>`).join('') + '</div>';
}
function factorBlock(model, res, title) {
  const f = shown(res.factors);
  return `<div class="blk"><div class="sect">${title}</div>
    ${f.length ? bars(f) + '<div class="small">막대가 길수록 영향이 커요.</div>' : '<div class="small">표시할 요인이 없어요.</div>'}
    ${fixedNote(res.factors)}${linkHint(model, res)}</div>`;
}

function readLocal(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
const pred = readLocal('paeon-prediction');
const health = readLocal('paeon-health');
const screen = document.getElementById('screen');
document.getElementById('back').innerHTML = ICON.back;

if (!pred) {
  screen.innerHTML = '<div class="callout"><b>분석 결과가 없어요</b><br>입력을 마치고 분석하면 볼 수 있어요.</div>';
} else {
  const advice = adviceBannerHtml(pred, health);   // 혈압 140/90·160/100 이상이면 의료기관 상담 안내 (결과 카드 바로 아래에 둔다)
  let html = '';

  html += pred.bp_stage ? `<div class="bprow"><b>${BP_LABEL[pred.bp_stage]}</b>입력 혈압 판정</div>` : '';

  // 모델 A는 만 32~70세만 계산한다. 나이 때문에 못 하면 모델 B를 먼저 보여 주고 아래에 작게 알린다.
  const ageSkipA = pred.model_a.status !== 'completed' && pred.model_a.skip_reason === 'age_out_of_range';
  let aHtml = '', aRest = '', bHtml = '';

  if (pred.model_a.status !== 'completed') {
    aHtml = ageSkipA ? '' : `<div class="callout"><b>${A_SKIP_MSG[pred.model_a.skip_reason] || '이번엔 분석할 수 없습니다'}</b></div>`;
  } else {
    const a = withoutMissing(pred.model_a), n = LV[a.risk_level] || 0, top = a.top_modifiable_factor;
    const cur = (i) => n === i ? ' class="cur"' : '';
    aHtml = `<div class="rescard">
        <span class="cap">10년 내 심장 혈관 건강 신호</span>
        <div class="big">${n === 1 ? OKI : TRI}<span>${RISK_LABEL[a.risk_level]}</span></div>
        <div class="seg">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>
        <div class="lv"><span${cur(1)}>양호</span><span${cur(2)}>주의</span><span${cur(3)}>높음</span></div>
        ${top && top.direction_matches_expectation !== false ? `<div class="why">바꿀 수 있는 요인 중 <b>${top.label}</b> 쪽이 이 신호에 가장 크게 영향을 주고 있어요.</div>` : ''}
      </div>
      ${a.vascular_age != null ? `<div class="agebox"><div class="t">혈관 나이 (추정)<span>실제 나이와 차이가 클 수 있어요</span></div><div class="n">${Math.round(a.vascular_age)}세</div></div>` : ''}
      `;
    aRest = factorBlock('MODEL_A', a, '바꿀 수 있는 요인');
  }

  if (pred.model_b.status !== 'completed') {
    bHtml = `<div class="callout"><b>${B_SKIP_MSG[pred.model_b.skip_reason] || '이번엔 분석할 수 없습니다'}</b></div>`;
  } else {
    const b = withoutMissing(pred.model_b);
    bHtml = `<div class="blk"><div class="sect">나와 비슷한 사람</div>
      <div class="desc">혈압이 정상인 사람들의 전체 자료와 비교했어요. 허리둘레, 몸무게, 술은 내가 바꿀 수 있어요.</div>
      ${SIM_NOW[b.similarity_level] ? `<div class="simnow">지금 내 몸 상태는 ${SIM_NOW[b.similarity_level]}</div>` : ''}
      ${SIM_NOW[b.similarity_level] ? `<div class="three">${Object.keys(SIM_LABEL).map(k => `<span class="${k === b.similarity_level ? 'on' : ''}">${SIM_LABEL[k]}</span>`).join('')}</div>` : ''}
      </div>
      ${factorBlock('MODEL_B', b, aHtml ? '비교에 쓰인 요인' : '바꿀 수 있는 요인')}`;
  }

  html += ageSkipA
    ? bHtml + advice + '<div class="callout" style="text-align:center">10년 내 심장 혈관 건강 신호는 <b>만 32~70세</b>에게만 분석해요</div>'
    : aHtml + advice + aRest + bHtml;

  const miss = (pred.model_a.missing_features || []).includes('totChol');
  html += `<div class="notes">${miss ? '<div>총콜레스테롤은 입력하지 않아서 학습 데이터의 중앙값(234)으로 대신해 계산했어요. 이 값은 내 실제 수치가 아니에요.</div>' : ''}<div>진단이 아닌 참고 정보입니다. AI가 분석한 참고 정보이며, 정확한 진단은 의사에게 문의하세요.</div></div>
    <a class="cta" style="height:56px; border-radius:28px; font-size:17px" href="${localStorage.getItem('paeon-cycle') ? 'challenge-progress.html' : 'challenges.html'}">${localStorage.getItem('paeon-cycle') ? '내 챌린지 보기' : '챌린지 시작하기'}</a>`;

  screen.innerHTML = html;
}
</script>
</body>
</html>
