<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 예측 결과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .riskrow{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--sage-light); border-radius:18px; padding:14px 18px}
  .chip{font-size:11.5px; font-weight:700; border-radius:999px; padding:3px 11px; border:1.5px solid currentColor; white-space:nowrap}
  .riskrow .pct{font-size:30px; font-weight:900; margin-left:auto}
  .agebox{background:var(--cream); border:1px solid var(--sage-light); border-radius:18px; padding:16px; text-align:center}
  .agebox .big{font-size:34px; font-weight:900; line-height:1.1}
  figure{margin:0; background:#fff; border:1px solid var(--sage-light); border-radius:18px; padding:14px 18px}
  figcaption{font-size:12.5px; color:var(--muted); margin-bottom:8px}
  .bars{display:grid; grid-template-columns:110px 1fr 46px; gap:8px 10px; align-items:center; font-size:13px}
  .bb{background:var(--track); border-radius:8px; height:9px; overflow:hidden}
  .bb i{display:block; height:100%; border-radius:8px}
  .bv{text-align:right; font-weight:700; font-size:12px}
  .topline{font-size:12.5px; margin-bottom:8px}
  .linkhint{margin-top:10px; font-size:12px; color:var(--muted); background:var(--cream); border:1px solid var(--sage-light); border-radius:12px; padding:8px 12px}
  .linkhint a{color:var(--sage-deep); font-weight:700}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" id="screen"></div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
const COLOR = { normal: 'var(--ok)', borderline: 'var(--warn)', high: 'var(--risk)', hypertension: 'var(--risk)', prehypertension: 'var(--warn)', elevated: 'var(--warn)' };
const BP_LABEL = { normal: '정상', elevated: '주의혈압', prehypertension: '고혈압전단계', hypertension: '고혈압' };
const RISK_LABEL = { normal: '정상', borderline: '경계', high: '위험' };
const A_SKIP_MSG = { age_out_of_range: '만 32~70세가 아니어서 예측할 수 없습니다', cad_diagnosed: '관상동맥질환 진단 이력이 있어 예측할 수 없습니다' };
const B_SKIP_MSG = { age_out_of_range: '19세 미만이어서 예측할 수 없습니다', htn_diagnosed: '고혈압으로 진단·치료 중이라 예측할 수 없습니다' };

// 명세 §3: 학습 방향이 상식과 반대인 요인(direction_matches_expectation = false)은 요인 목록에 표시하지 않는다.
const visible = (factors) => (factors || []).filter(f => f.direction_matches_expectation !== false);
// 바꿀 수 없는 요인(나이·성별 등)은 막대에서 빼고 한 줄로만 알린다.
const shown = (factors) => visible(factors).filter(f => f.modifiable);
const fixedNote = (factors) => visible(factors).some(f => !f.modifiable) ? '<div class="topline" style="color:var(--muted); margin:8px 0 0">나이·성별처럼 바꿀 수 없는 요인은 뺐어요</div>' : '';
// 모델 B 설명 문구의 기준: 학습 데이터에서 경계군 비율(약 35%, modeling/model_b/artifacts/metrics_model_b.json의 positive_rate_train 0.3478)
const B_AVG = 0.35;

// 개선 가능한 1위 요인 → 그 요인을 관리할 수 있는 챌린지 안내 (명세 §7 요인 → 챌린지 연결표, 가이드 §7). 결과 설명용이고 챌린지 추천에는 쓰지 않는다.
const LINK = {
  MODEL_A: { currentSmoker: '금연 미션', sysBP: '나트륨 줄이기·신체 활동 미션', BMI: '신체 활동·체중 관리 미션' },
  MODEL_B: { bmi: '신체 활동·체중 관리 미션', waist: '신체 활동·체중 관리 미션', drink_freq: '절주 미션', drink_amount: '절주 미션' },
};
function linkHint(model, res) {
  const f = res.top_modifiable_factor;
  const to = f && f.direction_matches_expectation !== false && LINK[model][f.code];
  return to ? `<div class="linkhint">'<b>${f.label}</b>' 요인은 ${to}으로 관리할 수 있어요 · <a href="challenges.html">챌린지 보기</a></div>` : '';
}
function topLine(res) {
  const t = res.top_modifiable_factor;
  return t && t.direction_matches_expectation !== false
    ? `<div class="topline">바꿀 수 있는 요인 중 가장 영향이 큰 것: <b>${t.label}</b></div>`
    : '<div class="topline">바꿀 수 있는 요인 중 위험을 높인 것이 없어요</div>';
}

function bars(factors) {
  const mx = Math.max(0.2, ...factors.map(f => Math.abs(f.contribution)));
  return factors.map(f => {
    const col = f.contribution >= 0 ? 'var(--sage-deep)' : 'var(--sage)';
    const width = Math.abs(f.contribution) / mx * 100;
    const val = (f.contribution >= 0 ? '+' : '−') + Math.abs(f.contribution * 100).toFixed(1);
    return `<span>${f.label}</span>
      <span class="bb"><i style="width:${width}%;background:${col}"></i></span>
      <span class="bv">${val}</span>`;
  }).join('');
}

function readLocal(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
const pred = readLocal('paeon-prediction');
const health = readLocal('paeon-health');
const screen = document.getElementById('screen');

if (!pred) {
  screen.innerHTML = '<div class="callout"><b>예측 결과가 없어요</b><br>입력 검토 화면에서 "위험도 분석하기"를 먼저 눌러주세요.</div>';
} else {
  // 혈압 160/100 이상이면 결과보다 먼저 의료기관 상담 안내 (가이드 §3.4, REQ-PRED-005와 같은 위치)
  const bp160 = health && (health.sbp >= 160 || health.dbp >= 100);
  let html = bp160 ? `<div class="callout" style="border-color:var(--risk)"><b>입력하신 혈압이 많이 높아요 (${health.sbp}/${health.dbp} mmHg)</b><br>챌린지를 시작하기 전에 가까운 의료기관에서 상담을 받아 보세요. <a href="guide.html" style="color:var(--sage-deep); font-weight:700">검사 · 상담 안내 보기</a></div>` : '';

  html += pred.bp_stage ? `<div class="riskrow" style="border-color:${COLOR[pred.bp_stage]}">
    <span class="chip" style="color:${COLOR[pred.bp_stage]}">${BP_LABEL[pred.bp_stage]}</span>
    <span style="font-size:12px;color:var(--muted)">입력 혈압 판정</span>
  </div>` : '';

  // 모델 A는 만 32~70세만 계산한다. 나이 때문에 못 하면 모델 B를 먼저 보여 주고 아래에 작게 알린다.
  const ageSkipA = pred.model_a.status !== 'completed' && pred.model_a.skip_reason === 'age_out_of_range';
  let aHtml = '', bHtml = '';

  if (pred.model_a.status !== 'completed') {
    aHtml = ageSkipA ? '' : `<div class="callout"><b>${A_SKIP_MSG[pred.model_a.skip_reason] || '이번엔 예측할 수 없습니다'}</b></div>`;
  } else {
    const a = pred.model_a, fa = shown(a.factors);
    aHtml = `<p class="sect">10년 내 관상동맥질환 위험</p>
      <div class="riskrow" style="border-color:${COLOR[a.risk_level]}">
        <span class="chip" style="color:${COLOR[a.risk_level]}">${RISK_LABEL[a.risk_level]}</span>
        <span style="font-size:12px;color:var(--muted)">같은 조건의 사람들과 비교한 범주입니다</span>
      </div>
      ${a.vascular_age != null ? `<div class="agebox"><div class="big">${a.vascular_age}세</div><div class="sub">혈관 나이(추정) · 첫 번째 모델 버전이라 실제 나이와 차이가 클 수 있어요</div></div>` : ''}
      <figure><figcaption>위험을 올린 요인 · <b>바꿀 수 있는 요인</b></figcaption>
        ${topLine(a)}
        ${fa.length ? `<div class="bars">${bars(fa)}</div>` : ''}
        ${fixedNote(a.factors)}
        ${linkHint('MODEL_A', a)}
      </figure>`;
  }

  if (pred.model_b.status !== 'completed') {
    bHtml = `<div class="callout"><b>모델 B: ${B_SKIP_MSG[pred.model_b.skip_reason] || '이번엔 예측할 수 없습니다'}</b></div>`;
  } else {
    const b = pred.model_b, fb = shown(b.factors);
    const n = Math.round(b.probability * 100), avg = Math.round(B_AVG * 100);
    const many = n >= avg;
    bHtml = `<p class="sect">나와 비슷한 사람들의 혈압</p>
      <div class="riskrow" style="border-color:var(--accent)">
        <span style="flex:1; font-size:13.5px; line-height:1.55">나와 나이·성별·체형·생활습관이 비슷한 한국인 <b>100명 중 약 ${n}명</b>이 혈압 '주의혈압·고혈압전단계'예요.</span>
        <span class="pct" style="color:var(--accent)">${n}%</span>
      </div>
      <div class="topline" style="margin-top:10px">비슷한 조건이 아닌 전체 평균은 100명 중 약 ${avg}명이에요. 나와 비슷한 사람들은 평균보다 <b>${many ? '많은' : '적은'} 편</b>이에요.</div>
      <p class="hint" style="margin:0 0 10px">내 혈압 판정은 위 '입력 혈압 판정'을 따라요. 이 수치로 앞으로 고혈압이 될지는 알 수 없어요.</p>
      <figure><figcaption>관련 요인 · <b>바꿀 수 있는 요인</b></figcaption>
        ${fb.length ? `<div class="bars">${bars(fb)}</div>` : '<div class="topline">표시할 요인이 없어요</div>'}
        ${fixedNote(b.factors)}
        ${linkHint('MODEL_B', b)}
      </figure>`;
  }

  html += ageSkipA
    ? bHtml + '<div class="callout" style="margin-top:12px; text-align:center; font-size:15px; line-height:1.6">10년 내 심혈관 위험은 <b>만 32~70세</b>에게만 계산해요</div>'
    : aHtml + bHtml;

  const needsGuide = pred.bp_stage === 'hypertension' && pred.htn_status === 'none';
  html += `<p class="tip">진단이 아닌 선별 정보입니다. AI가 예측한 정보이며, 정확한 진단은 의사에게 문의하세요.</p>
    <a class="cta" style="display:block; text-align:center; text-decoration:none" href="${needsGuide ? 'guide.html' : 'challenges.html'}">${needsGuide ? '검사 · 상담 안내 보기' : '맞춤 챌린지 보기'}</a>`;

  screen.innerHTML = html;
}
</script>
</body>
</html>
