<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 12주 변화</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .screen{gap:20px}
  .h1{font-size:20px; font-weight:800; height:56px; display:flex; align-items:center; margin:0 0 -8px}
  .bpcard{background:var(--cream); border-radius:28px; padding:20px 20px 14px; display:flex; flex-direction:column; gap:4px}
  .bpcard .top{display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:700; color:#4A5C6D}
  .bpcard .delta{height:26px; padding:0 12px; border-radius:13px; background:#fff; font-size:13px; font-weight:800; color:#234257; display:inline-flex; align-items:center}
  .bpcard .val{display:flex; align-items:baseline; gap:6px}
  .bpcard .val b{font-size:44px; font-weight:800; letter-spacing:-1.5px; line-height:1.1}
  .bpcard .val i{font-style:normal; font-size:15px; font-weight:700; color:var(--muted)}
  .bpcard .val span{font-size:13px; color:var(--muted); margin-left:6px}
  .bpcard svg{display:block; width:100%; height:auto; margin-top:4px}
  .shorts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
  .shorts a{display:flex; flex-direction:column; gap:12px; border:1px solid var(--line); border-radius:22px; padding:16px; text-decoration:none; color:inherit; font-size:16px; font-weight:800}
  .shorts a:last-child:nth-child(odd){grid-column:1 / -1; flex-direction:row; align-items:center}
  .shorts .ic{width:48px; height:48px; border-radius:16px; background:var(--notice); color:var(--accent); display:flex; align-items:center; justify-content:center}
  .sec{display:flex; flex-direction:column; gap:12px}
  .sec .t{font-size:18px; font-weight:800}
  .tabs{display:flex; gap:8px}
  .tabs button{flex:1; height:52px; border-radius:22px; padding:0; border:1px solid var(--sage); background:#fff; color:#4A5C6D; font-size:15px; font-weight:500}
  .tabs button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; line-height:1.2}
  .tabs button small{font-size:11px; font-weight:400; color:inherit; opacity:.75}
  .tabs button.on{background:var(--accent-light); border-color:var(--accent-light); color:#1E3246; font-weight:800}
  .ch{display:flex; flex-direction:column; gap:4px; padding-top:4px}
  .ch .l1{display:flex; align-items:center; justify-content:space-between; font-size:17px; font-weight:800}
  .ch .tag{height:24px; padding:0 10px; border-radius:12px; background:var(--notice); color:#234257; font-size:12px; font-weight:700; display:inline-flex; align-items:center}
  .ch .l2{font-size:13px; color:var(--muted)}
  .rows{border-bottom:1px solid var(--line)}
  .rw{display:flex; align-items:center; justify-content:space-between; min-height:56px; border-top:1px solid var(--line); font-size:15px}
  .rw>span:first-child{color:#4A5C6D}
  .rw .v{display:flex; align-items:center; gap:8px}
  .rw .v em{font-style:normal; color:var(--muted)}
  .rw .v b{font-size:16px}
  .two{display:flex; gap:10px}
  .two .cta,.two .ghost{flex:1; width:auto; height:50px; font-size:15px}
  .pend{background:var(--cream); border-radius:22px; padding:18px 20px; display:flex; flex-direction:column; gap:10px}
  .pend b{font-size:15px; line-height:1.5}
  .pend .tr{height:8px; border-radius:4px; background:var(--track)}
  .pend .tr i{display:block; height:8px; border-radius:4px; background:var(--accent)}
  .pend .s{font-size:13px; color:#4A5C6D; line-height:1.6}
  .pend .cta{height:46px; font-size:15px}
  .wk{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:20px; padding:14px 16px; text-decoration:none; color:inherit}
  .wk.run{background:var(--notice); border-color:var(--notice)}
  .wk .tx{flex:1; display:flex; flex-direction:column; gap:3px}
  .wk .tx b{font-size:15px}
  .wk .tx b em{font-style:normal; font-size:12px; font-weight:700; color:var(--muted)}
  .wk .tx span{font-size:13px; color:var(--muted)}
  .wkhd{display:flex; align-items:baseline; justify-content:space-between}
  .wkhd a{font-size:13px; font-weight:700; color:#4A5C6D; text-decoration:underline; min-height:44px; display:flex; align-items:center}
  .small{font-size:12px; color:var(--muted); line-height:1.6}
  /* 전·후 비교 */
  .cmphd .s{font-size:13px; color:var(--muted)}
  .cmphd .big{font-size:28px; font-weight:800; letter-spacing:-.7px; line-height:1.3; margin-top:8px}
  .cbox{border:1px solid var(--line); border-radius:20px; padding:20px 20px 16px; display:flex; flex-direction:column; gap:8px}
  .cbox .hd{display:flex; justify-content:space-between; align-items:baseline; font-size:15px; font-weight:800}
  .cbox .hd span{font-size:13px; font-weight:500; color:var(--muted)}
  .cbox svg{display:block; width:100%; height:auto}
  .tb .th{display:flex; padding:0 0 10px; font-size:13px; color:var(--muted)}
  .tb .th span:first-child,.tb .rw>span:first-child{flex:1}
  .tb .th span:not(:first-child),.tb .rw>span:not(:first-child){text-align:right}
  .tb .th span:nth-child(2),.tb .rw>span:nth-child(2){width:84px}
  .tb .th span:nth-child(3),.tb .rw>span:nth-child(3){width:96px}
  .tb .rw>span:nth-child(2){color:var(--muted)}
  .tb .rw>span:nth-child(3){font-weight:800}
  .tb .rw:last-child{border-bottom:1px solid var(--line)}
  .hab .t{font-size:18px; font-weight:800; padding-bottom:8px}
  .hab .rw:last-child{border-bottom:1px solid var(--line)}
  .simbox{background:var(--cream); border-radius:16px; padding:18px 20px; display:flex; flex-direction:column; gap:6px}
  .simbox .a{font-size:13px; color:#4A5C6D; line-height:1.6}
  .simbox .t{font-size:14px; font-weight:800; color:var(--ink)}
  .simbox .s{font-size:15px; color:var(--ink)}
  .simbox .b{font-size:18px; font-weight:800}
  .rates .rw>span:last-child{font-weight:800}
  .tb + .pnote{margin-top:-8px}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" id="app"><p class="hint">불러오는 중...</p></div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const RISK = { normal: '양호', borderline: '주의', high: '높음' };
const SMOKING = { current: '현재 피움', former: '끊음', never: '피운 적 없음' };
const DRINK = { never_lifetime: '안 마심', none_past_year: '4주간 안 마심', lt_monthly: '한 달에 1번 미만', monthly: '한 달에 1번',
  '2_4_per_month': '한 달에 2–4번', '2_3_per_week': '일주일에 2–3번', '4plus_per_week': '일주일에 4번 이상' };
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const IC = (p) => `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const md = (iso) => { if (!iso) return ''; const [, m, d] = iso.split('-'); return `${Number(m)}/${Number(d)}`; };
const mdKo = (iso) => { if (!iso) return ''; const [, m, d] = iso.split('-'); return `${Number(m)}월 ${Number(d)}일`; };
const bpText = (x) => x && x.sbp != null ? `${x.sbp}/${x.dbp}` : '—';
const unit = (v, u) => v == null ? '—' : v + u;

// 점은 첫 번째만 채우고 나머지는 속이 빈 점. 기준선은 140.
function lineChart({ points, W, H, ref, refLabel, color, labelFont, big }) {
  const vals = points.map(p => p.v);
  const lo = Math.min(ref, ...vals) - 6, hi = Math.max(ref, ...vals) + 6;
  const padX = big ? 70 : 20, padT = big ? 36 : 14, padB = big ? 40 : 22;
  const X = i => points.length > 1 ? padX + i * (W - 2 * padX) / (points.length - 1) : W / 2;
  const Y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const fill = big ? '#FFFFFF' : '#F8F1E7';
  const r = big ? 6 : 5, sw = 2.5;
  const s = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="수축기 혈압 ${vals.join(', ')}">`,
    `<line x1="0" y1="${Y(ref).toFixed(1)}" x2="${W}" y2="${Y(ref).toFixed(1)}" stroke="#5A6B7A" stroke-width="1" stroke-dasharray="4 4"/>`,
    `<text x="${W}" y="${(Y(ref) - 6).toFixed(1)}" text-anchor="end" font-size="${big ? 12 : 11}" fill="#5A6B7A">${refLabel}</text>`];
  if (points.length > 1) s.push(`<polyline fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" points="${points.map((p, i) => X(i).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')}"/>`);
  points.forEach((p, i) => {
    const x = X(i).toFixed(1), y = Y(p.v).toFixed(1);
    s.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${i === 0 ? color : fill}" stroke="${color}" stroke-width="${sw}"/>`);
    if (big) s.push(`<text x="${x}" y="${(Y(p.v) + (i === 0 ? -16 : 28)).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="800" fill="#243749">${p.v}</text>`);
    s.push(`<text x="${x}" y="${H - (big ? 8 : 4)}" text-anchor="middle" font-size="${labelFont}" fill="#5A6B7A">${esc(p.d)}</text>`);
  });
  return s.join('') + '</svg>';
}

const row = (label, a, b) => `<div class="rw"><span>${label}</span><span class="v">${a != null && a !== '' ? `<em>${esc(a)} →</em>` : ''}<b>${esc(b)}</b></div>`;
const riskText = (m, k) => m && m[k] ? (RISK[m[k]] || '—') + (probText(m[k.replace('risk_level', 'probability')]) ? ` (${probText(m[k.replace('risk_level', 'probability')])})` : '') : '—';
const modelA = (rv) => (rv.models || []).find(m => m.model_code === 'MODEL_A');

const back = (title) => '<div class="page-bar" style="margin-bottom:-8px"><a class="back" href="trend.html" aria-label="뒤로">' + ICON.back + '</a><span class="ttl">' + title + '</span></div>';
const WEEKS = { 0: '0주', 4: '4주', 8: '8주', 12: '12주' };

function render(rv) {
  const b = rv.before || {}, a = rv.after || {}, m = modelA(rv), cmpA = m && m.comparable;
  const mB = (rv.models || []).find(x => x.model_code === 'MODEL_B' && x.comparable);
  const chg = mB ? simChangeText(mB.before_similarity_level, mB.after_similarity_level).replace('4주 전보다', '처음보다') : '';
  const pts = (rv.checkpoints || []).filter(c => c.sbp != null).map(c => ({ v: c.sbp, d: WEEKS[c.week] || c.week + '주' }));
  const pc = cmpA && typeof m.before_percentile === 'number' && typeof m.after_percentile === 'number'
    ? [['상위 % (참고용)', `상위 ${Math.max(1, Math.round(m.before_percentile))}%`, `상위 ${Math.max(1, Math.round(m.after_percentile))}%`]] : [];
  const rates = (rv.cycles || []).map(c => c.cycle_rate).filter(v => typeof v === 'number');
  const avgRate = rates.length ? Math.round(rates.reduce((x, y) => x + y, 0) / rates.length * 100) + '%' : '—';   // 사이클별 달성률 평균
  const wk = rv.weeks_done || 12, done = wk >= 12;      // 3차까지 마쳤으면 12주, 아니면 마지막 재입력까지(지금까지 4·8주)
  const pn = rv.program_number > 1 ? rv.program_number + '번째 ' : '';   // 12주를 여러 번 했을 때만 몇 번째인지 표시
  $('app').innerHTML = back(done ? pn + '12주 변화' : `${pn}지금까지 ${wk}주`) + `
    <div class="cmphd"><span class="s">${done ? '12주' : `지금까지 ${wk}주`} · 처음 입력한 때부터</span><div class="big">${done ? '12주 동안' : `${wk}주 동안`}<br>이렇게 달라졌어요</div></div>
    ${pts.length > 1 ? `<div class="cbox"><div class="hd"><span style="font-size:15px;font-weight:800;color:var(--ink)">수축기 혈압</span><span>mmHg</span></div>${lineChart({ points: pts, W: 310, H: 170, ref: 140, refLabel: '기준 140', color: '#243749', labelFont: 13, big: true })}</div>` : ''}
    <div class="tb"><div class="th"><span>항목</span><span>0주</span><span>${wk}주</span></div>
      ${[['혈압', bpText(b), bpText(a)], ['체중', unit(b.weight_kg, 'kg'), unit(a.weight_kg, 'kg')], ['허리둘레', unit(b.waist_cm, 'cm'), unit(a.waist_cm, 'cm')]]
        .concat([['챌린지 달성률', '—', avgRate]])
        .concat(cmpA ? [['건강 신호', riskText(m, 'before_risk_level'), riskText(m, 'after_risk_level')]] : [])
        .map(r => `<div class="rw"><span>${r[0]}</span><span>${esc(r[1])}</span><span>${esc(r[2])}</span></div>`).join('')}</div>
    ${cmpA && (probText(m.before_probability) || probText(m.after_probability)) ? probNoteHtml(false, true) : ''}
    ${cmpA ? goodNoteAny(m) : ''}
    ${pc.length ? `<div class="tb"><div class="th"><span>같은 성별·연령대</span><span>0주</span><span>${wk}주</span></div>${pc.map(r => `<div class="rw"><span>${r[0]}</span><span>${esc(r[1])}</span><span>${esc(r[2])}</span></div>`).join('')}</div>${ageNoteHtml(null)}` : ''}
    <div class="hab"><div class="t">습관 변화</div>
      <div class="rw"><span>흡연</span><span>${SMOKING[b.smoking] || '—'} → <b>${SMOKING[a.smoking] || '—'}</b></span></div>
      <div class="rw"><span>음주</span><span>${DRINK[b.drink_freq] || '—'} → <b>${DRINK[a.drink_freq] || '—'}</b></span></div></div>
    ${(rv.cycles || []).length > 1 ? `<div class="hab rates"><div class="t">4주마다 챌린지 달성률</div>${rv.cycles.map(c => `<div class="rw"><span>${c.cycle_number}차</span><span>${Math.round((c.cycle_rate || 0) * 100)}%</span></div>`).join('')}</div>` : ''}
    ${modelANoticeHtml(rv.models)}
    ${mB ? simBoxHtml(mB, '지금', chg) : ''}
    ${rv.bp_note ? `<div class="small" style="font-size:13px; line-height:1.7">${esc(rv.bp_note)}</div>` : ''}
    ${rv.model_version ? `<div class="small" style="font-size:13px; line-height:1.7">분석 모델 ${esc(rv.model_version)}${rv.model_updated_on ? ' · ' + esc(rv.model_updated_on) + ' 업데이트' : ''}. 이 결과는 12주를 시작한 모델 그대로 처음부터 끝까지 계산했어요.</div>` : ''}
    <div class="small" style="font-size:13px; line-height:1.7">진단이 아닌 참고 정보입니다. 정확한 판단은 의료진과 상담하세요.</div>
    ${done ? '' : `<a class="cta" style="height:56px; border-radius:28px; font-size:17px" href="challenges.html">${wk / 4 + 1}차 챌린지 시작하기</a>`}
    <a class="ghost" href="twelve-weeks.html">12주 기록 보기</a>`;
  window.scrollTo(0, 0);
}

(async () => {
  try { const pn = new URLSearchParams(location.search).get('program'); render((await apiCall('GET', '/challenges/program/review' + (pn ? '?program=' + encodeURIComponent(pn) : ''), undefined, '12주 결과를 불러오지 못했습니다')).data); }
  catch (e) {
    $('app').innerHTML = back('12주 변화') + (e.code === 'PROGRAM_REVIEW_NOT_READY'
      ? '<div class="empty"><b>첫 4주 재입력을 마치면 볼 수 있어요</b><span>재입력을 마치면 처음과 지금까지를 한 번에 비교해 드려요.</span><a class="cta" href="trend.html">내 변화로</a></div>'
      : `<div class="callout">${esc(friendlyError(e))}</div>`);
  }
})();
</script>
</body>
</html>
