<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 챌린지 선택</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .chips{overflow-x:auto; flex-wrap:nowrap; padding-bottom:2px}
  .chip{flex:none; font-size:14px; border:1px solid var(--sage); background:#fff; color:var(--ink)}
  .sect{font-size:18px; font-weight:800; margin-top:6px}
  .card2{display:flex; align-items:center; gap:14px; border:1px solid var(--line); border-radius:24px; padding:16px; background:#fff}
  .card2 .ic{width:52px; height:52px; border-radius:16px; background:var(--cream); color:var(--muted); display:flex; align-items:center; justify-content:center; flex:none}
  .card2 .tx{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .card2 .st{font-size:16px; font-weight:800}
  .card2 .sd{font-size:13px; color:var(--muted)}
  .card2 .pk{height:40px; padding:0 16px; border-radius:20px; border:1px solid var(--sage); font-size:14px; font-weight:700; display:flex; align-items:center; flex:none; background:#fff}
  .pickable{cursor:pointer}
  .pickable[data-on="1"]{border-color:var(--accent); background:var(--notice)}
  .pickable[data-on="1"] .pk{background:var(--accent); border-color:var(--accent); color:#fff}
  .card2[data-k="fixed"]{background:var(--cream); border-color:var(--cream)}
  .card2[data-k="out"]{opacity:.65; border-style:dashed}
  .card2[data-k="fixed"] .ic{background:#fff}
  .badge-done{font-size:11px; font-weight:700; color:var(--ok); border:1px solid var(--ok); border-radius:999px; padding:0 8px; margin-left:6px}
  .keep{font-size:12px; color:var(--ok); background:var(--ok-soft); border-radius:12px; padding:8px 12px; margin-top:4px}
  .ev{font-size:12px; color:var(--muted); margin-top:2px}
  .src{font-size:11px; color:var(--faint); margin-left:4px}
  .srcbtn{font:inherit; font-size:11px; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:999px; padding:0 8px; margin-left:4px; cursor:pointer}
  .rule{background:var(--notice); border-radius:18px; padding:16px 18px; font-size:16px; font-weight:800; line-height:1.45; color:var(--ink)}
  .rule small{display:block; margin-top:2px; font-size:13px; font-weight:400; color:#4A5C6D}
  .notice{font-size:12px; color:var(--muted); margin:0}
  .countbar{font-size:13px; color:var(--muted)}
  .foot{font-size:12px; color:var(--muted); line-height:1.6; text-align:center; padding-top:4px}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen">
        <div class="chips" id="chips"></div>
        <p class="rule" id="lede" style="margin:0">미션은 세 가지<small>고정 2개 + 직접 고르는 1개</small></p>
        <div id="err" class="callout" style="display:none"></div>
        <p class="sect" id="fixed-title">고정 미션</p>
        <div id="fixed-list"></div>
        <p class="sect">선택 미션 1개</p>
        <p class="notice" id="notice"></p>
        <div id="cat-list"></div>
        <div id="survey-needed"></div>
        <div class="countbar">선택 <b id="pick-count">0</b> / 1</div>
        <p class="sect" id="out-title" style="display:none"></p>
        <div id="out-list"></div>
        <button type="button" id="start-btn" class="cta" disabled>4주 챌린지 시작</button>
        <div class="foot">챌린지는 생활습관 참고용이며 치료를 대신하지 않아요.</div>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let picked = null;
let counts = {};
let catFilter = '';
const _ic = (p) => `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const CAT_ICON = {
  SODIUM: _ic('<path d="M3 13h4l2.5-6 4 11 2.5-5H21"/>'),
  ALCOHOL: _ic('<path d="M4 11h16a8 8 0 0 1-16 0zM9 4c0 2 2 2 2 4"/>'),
  other: _ic('<path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14zM5 19l8-8"/>'),
};

function cardBody(m, keepMsg) {
  return `<span class="ic">${CAT_ICON[m.category] || CAT_ICON.other}</span><div class="tx"><span class="st">${esc(m.name)}${m.completed_before ? '<span class="badge-done">완료함</span>' : ''}</span>
    <span class="sd">${esc(m.category_name || '')} · 4주 · ${esc(m.description)}</span>
    ${counts[m.code] ? `<span class="sd">${counts[m.code].toLocaleString()}명 참여 중</span>` : ''}
    <div class="ev">${esc(m.evidence)} <button type="button" class="srcbtn" onclick="event.preventDefault(); event.stopPropagation(); this.nextElementSibling.hidden = !this.nextElementSibling.hidden">출처</button><span class="src" hidden>· ${esc(m.source)}</span></div>
    ${m.notice ? `<span class="sd">${esc(m.notice)}</span>` : ''}
    ${m.completed_before && keepMsg ? `<div class="keep">${esc(keepMsg)}</div>` : ''}</div>`;
}

function showError(msg) {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = msg;
}

async function main() {
  // 진행 중인 사이클이 있으면 수행 화면으로
  try {
    if (await apiGetCurrentCycle()) { location.replace('challenge-progress.html'); return; }
  } catch (e) { showError(friendlyError(e)); return; }

  try { (await apiCall('GET', '/challenges/participants', undefined, '')).data.forEach(x => counts[x.challenge_code] = x.participants); } catch (e) { /* 참여 인원은 없어도 진행 */ }
  let rec;
  try { rec = await apiGetChallengeRecommendations(); }
  catch (e) {
    if (e.code === 'HEALTH_RECORD_REQUIRED' || e.code === 'PREDICTION_SEX_REQUIRED') {
      document.querySelector('.screen').innerHTML = '<div class="callout"><b>건강정보를 먼저 입력해 주세요</b></div><a class="cta" style="display:block;text-align:center;text-decoration:none" href="health-info.html">건강정보 입력하기</a>';
      return;
    }
    showError(friendlyError(e)); return;
  }

  if (rec.cycle_number > rec.total_cycles) {
    document.querySelector('.screen').innerHTML = `<div class="callout"><b>${rec.total_cycles * 4}주 챌린지를 모두 마쳤어요</b></div>`;
    return;
  }
  // 4주가 끝났는데 재입력 전이면 재입력을 먼저 안내 (다음 차수 추천이 재입력 값으로 바뀜, 가이드 §6.2)
  try {
    const last = (await apiListCycles())[0];
    if (last && ['completed', 'incomplete'].includes(last.status) && !last.reassessed) {
      document.getElementById('err').style.display = 'block';
      document.getElementById('err').innerHTML = `<b>${last.cycle_number}차 4주가 끝났어요</b><br>지금 상태를 입력하면 다음 4주 미션을 새로 골라 드려요. <a href="reassessment.html?cycle=${encodeURIComponent(last.cycle_id)}" style="color:var(--sage-deep); font-weight:700">4주 재입력하기</a>`;
    }
  } catch (e) { /* 이력이 없어도 진행 */ }
  document.getElementById('lede').innerHTML =
    `${rec.total_cycles * 4}주 = 4주씩 ${rec.total_cycles}번 · 지금 ${rec.cycle_number}차<small>미션은 세 가지: 고정 2개 + 직접 고르는 1개</small>`;
  document.getElementById('start-btn').textContent = `${rec.cycle_number}차 챌린지 시작 (4주)`;
  document.getElementById('notice').textContent = rec.selectable_notice;

  document.getElementById('fixed-list').innerHTML = rec.fixed.map(s => s.mission
    ? `<div class="card2" data-k="fixed">${cardBody(s.mission, rec.keep_going_message)}<span class="ctag fixed">고정</span></div>`
    : `<div class="card2" data-k="fixed"><div class="tx"><span class="st">${esc(s.slot_label)} 칸</span><span class="sd">지금 생활습관이 잘 유지되고 있어요</span></div><span class="ctag fixed">고정</span></div>`
  ).join('');

  const catList = document.getElementById('cat-list');
  if (rec.all_good) {
    catList.insertAdjacentHTML('beforeend', '<p class="hint">생활습관이 잘 유지되고 있어요. 하나 골라 보세요</p>');
  }
  const groups = {};
  rec.candidates.forEach(m => (groups[m.category] = groups[m.category] || { name: m.category_name, items: [] }).items.push(m));
  Object.values(groups).forEach(g => {
    const cat = document.createElement('div');
    cat.style.cssText = 'display:flex; flex-direction:column; gap:12px';
    cat.dataset.group = g.items[0].category;
    g.items.forEach(m => {
      const slot = document.createElement('div');
      slot.className = 'card2 pickable';
      slot.dataset.on = '0';
      slot.dataset.id = m.code;
      slot.innerHTML = `${cardBody(m, rec.keep_going_message)}<span class="pk">선택</span>`;
      slot.addEventListener('click', () => {
        picked = (picked === m.code) ? null : m.code;
        document.querySelectorAll('.pickable').forEach(el => {
          const on = el.dataset.id === picked;
          el.dataset.on = on ? '1' : '0';
          el.querySelector('.pk').textContent = on ? '선택됨' : '선택';
        });
        document.getElementById('pick-count').textContent = picked ? '1' : '0';
        document.getElementById('start-btn').disabled = !picked;
      });
      cat.appendChild(slot);
    });
    catList.appendChild(cat);
  });
  catList.style.cssText = 'display:flex; flex-direction:column; gap:12px';
  const chips = document.getElementById('chips');
  const drawChips = () => {
    chips.innerHTML = `<button type="button" class="chip${catFilter ? '' : ' on'}" data-c="">추천</button>` + Object.entries(groups).map(([k, g]) => `<button type="button" class="chip${catFilter === k ? ' on' : ''}" data-c="${esc(k)}">${esc(g.name)}</button>`).join('');
    catList.querySelectorAll('[data-group]').forEach(el => { el.hidden = !!catFilter && el.dataset.group !== catFilter; });
    chips.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { catFilter = c.dataset.c; drawChips(); }));
  };
  drawChips();

  if (rec.survey_needed.length) {
    document.getElementById('survey-needed').innerHTML = `<div class="callout">${rec.survey_needed.map(x => esc(x.category_name)).join(' · ')} 미션은 설문을 마치면 추천돼요. <a href="survey.html">설문하러 가기</a></div>`;
  }
  // 추천에서 빠진 미션은 이유에 따라 말투를 나눠 보여 준다: 이미 잘함 / 정보를 입력하면 추천 / 지금은 권하지 않음
  const OUT_GROUPS = [
    ['doing_well', '지금도 잘하고 있어요', '✓'],
    ['need_info', '이런 미션도 있어요', '+'],
    ['not_advised', '지금은 권하지 않아요', '!'],
  ];
  document.getElementById('out-list').style.cssText = 'display:flex; flex-direction:column; gap:12px';
  document.getElementById('out-list').innerHTML = OUT_GROUPS.map(([kind, title, mark]) => {
    const items = rec.excluded.filter(x => x.kind === kind);
    if (!items.length) return '';
    return `<p class="sect">${title}</p>` + items.map(x =>
      `<div class="card2" data-k="out"><div class="tx"><span class="st">${mark} ${esc(x.code ? x.name : x.name.replace(/ 미션$/, ''))}</span><span class="sd">${esc(x.reason)}</span></div></div>`).join('');
  }).join('');

  document.getElementById('start-btn').addEventListener('click', async () => {
    if (!picked) return;
    // 상담 권고 대상이면 확인하고 넘어간다는 동의를 받는다 (진행을 막지는 않는다)
    const adv = adviceTitle(JSON.parse(localStorage.getItem('paeon-prediction') || 'null'), JSON.parse(localStorage.getItem('paeon-health') || 'null'));
    if (adv && !adviceAcked()) {
      if (!(await confirmDialog('상담 권고를 확인하셨나요?', `${adv}. ${ADVICE_ACK_TEXT}`, '확인했고 동의해요'))) return;
      setAdviceAck(true);
    }
    const btn = document.getElementById('start-btn');
    btn.disabled = true; btn.textContent = '시작하는 중...';
    try {
      await apiStartCycle(picked);
      location.href = 'challenge-progress.html';
    } catch (e) {
      showError(friendlyError(e));
      btn.disabled = false; btn.textContent = `${rec.cycle_number}차 챌린지 시작 (4주)`;
    }
  });
}

main();
</script>
</body>
</html>
