<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 챌린지 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .cat{background:var(--cream); border:1px solid var(--sage-light); border-radius:18px; overflow:hidden; margin-bottom:10px}
  .cat>header{display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--sage-light)}
  .cat>header h3{font-size:14px; margin:0}
  .slot{display:flex; gap:10px; align-items:flex-start; background:#fff; border:1.5px solid var(--sage-light); border-radius:16px; padding:12px 14px; font-size:13.5px; margin:8px 10px}
  .slot[data-k="fixed"]{background:var(--cream)}
  .slot[data-k="out"]{opacity:.6; border-style:dashed; background:transparent}
  .slot .st{font-weight:700}
  .slot .sd{font-size:12px; color:var(--muted)}
  .pickable{cursor:pointer}
  .pickable[data-on="1"]{border-color:var(--sage-deep); background:var(--sage-light)}
  .lvl{font-size:10.5px; font-weight:700; border-radius:999px; padding:0 8px; border:1px solid currentColor; margin-left:6px; white-space:nowrap}
  .lvl[data-l="하"]{color:var(--ok)} .lvl[data-l="중"]{color:var(--warn)} .lvl[data-l="상"]{color:var(--risk)}
  .countbar{font-size:12.5px; color:var(--muted)}
  .slot .ev{font-size:11.5px; color:var(--muted); margin-top:4px}
  .slot .src{font-size:10.5px; color:var(--faint)}
  .badge-done{font-size:10.5px; font-weight:700; color:var(--ok); border:1px solid var(--ok); border-radius:999px; padding:0 8px; margin-left:6px}
  .keep{font-size:12px; color:var(--ok); background:var(--ok-soft); border-radius:12px; padding:8px 12px; margin:4px 10px 0}
  .notice{font-size:12px; color:var(--muted); margin:0 0 6px}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen">
        <p class="lede" id="lede">미션은 고정 2개와 선택 1개, 모두 3개예요. 고정 미션은 입력하신 정보로 정해져요.</p>
        <div id="err" class="callout" style="display:none"></div>
        <p class="sect" id="fixed-title">고정 미션</p>
        <div id="fixed-list"></div>
        <p class="sect">선택 미션 1개 — 카테고리 제한 없음</p>
        <p class="notice" id="notice"></p>
        <div id="cat-list"></div>
        <div id="survey-needed"></div>
        <div class="countbar">선택 <b id="pick-count">0</b> / 1</div>
        <p class="sect" id="out-title" style="display:none"></p>
        <div id="out-list"></div>
        <button type="button" id="start-btn" class="cta" disabled>4주 챌린지 시작</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script>
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let picked = null;

function cardBody(m, keepMsg) {
  return `<span><div class="st">${esc(m.name)} <span class="lvl" data-l="${LEVEL_LABEL[m.difficulty]}">${LEVEL_LABEL[m.difficulty]}</span>${m.completed_before ? '<span class="badge-done">완료함</span>' : ''}</div>
    <div class="sd">${esc(m.description)}</div>
    <div class="ev">${esc(m.evidence)} <span class="src">· ${esc(m.source)}</span></div>
    ${m.notice ? `<div class="sd">${esc(m.notice)}</div>` : ''}
    ${m.completed_before && keepMsg ? `<div class="keep">${esc(keepMsg)}</div>` : ''}</span>`;
}

function showError(msg) {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = msg;
}

async function main() {
  // 진행 중인 사이클이 있으면 수행 화면으로
  try {
    if (await apiGetCurrentCycle()) { location.replace('challenge-progress.html'); return; }
  } catch (e) { showError(friendlyError(e)); return; }

  let rec;
  try { rec = await apiGetChallengeRecommendations(); }
  catch (e) {
    if (e.code === 'HEALTH_RECORD_REQUIRED' || e.code === 'PREDICTION_SEX_REQUIRED') {
      document.querySelector('.screen').innerHTML = '<div class="callout"><b>건강정보를 먼저 입력해 주세요</b><br>입력하신 정보로 챌린지를 정해 드려요.</div><a class="cta" style="display:block;text-align:center;text-decoration:none" href="health-info.html">건강정보 입력하기</a>';
      return;
    }
    showError(friendlyError(e)); return;
  }

  if (rec.cycle_number > rec.total_cycles) {
    document.querySelector('.screen').innerHTML = `<div class="callout"><b>${rec.total_cycles * 4}주 챌린지를 모두 마쳤어요 🎉</b><br>끝까지 해내셨어요.</div>`;
    return;
  }
  // 4주가 끝났는데 재입력 전이면 재입력을 먼저 안내 (다음 차수 추천이 재입력 값으로 바뀜, 가이드 §6.2)
  try {
    const last = (await apiListCycles())[0];
    if (last && ['completed', 'incomplete'].includes(last.status) && !last.reassessed) {
      document.getElementById('err').style.display = 'block';
      document.getElementById('err').innerHTML = `<b>${last.cycle_number}차 4주가 끝났어요</b><br>지금 상태를 입력하면 처음과 비교하고, 다음 차수 미션도 바뀐 값으로 골라 드려요. <a href="reassessment.html?cycle=${encodeURIComponent(last.cycle_id)}" style="color:var(--sage-deep); font-weight:700">4주 재입력하기</a>`;
    }
  } catch (e) { /* 이력이 없어도 진행 */ }
  document.getElementById('lede').textContent =
    `${rec.total_cycles * 4}주 챌린지를 4주씩 ${rec.total_cycles}번으로 나눠 해요. 지금은 ${rec.cycle_number}차예요. 미션은 고정 2개와 선택 1개, 모두 3개예요. 고정 미션은 입력하신 정보로 정해져요.`;
  document.getElementById('start-btn').textContent = `${rec.cycle_number}차 챌린지 시작 (4주)`;
  document.getElementById('notice').textContent = rec.selectable_notice;

  document.getElementById('fixed-list').innerHTML = rec.fixed.map(s => s.mission
    ? `<div class="slot" data-k="fixed"><span>📌</span>${cardBody(s.mission, rec.keep_going_message)}</div>`
    : `<div class="slot" data-k="fixed"><span>📌</span><span><div class="st">${esc(s.slot_label)} 칸</div><div class="sd">지금 생활습관이 잘 유지되고 있어요</div></span></div>`
  ).join('');

  const catList = document.getElementById('cat-list');
  if (rec.all_good) {
    catList.insertAdjacentHTML('beforeend', '<p class="hint">모든 생활습관이 잘 유지되고 있어요. 하고 싶은 미션을 하나 골라 보세요</p>');
  }
  const groups = {};
  rec.candidates.forEach(m => (groups[m.category] = groups[m.category] || { name: m.category_name, items: [] }).items.push(m));
  Object.values(groups).forEach(g => {
    const cat = document.createElement('div');
    cat.className = 'cat';
    cat.innerHTML = `<header><h3>${esc(g.name)}</h3></header>`;
    g.items.forEach(m => {
      const slot = document.createElement('div');
      slot.className = 'slot pickable';
      slot.dataset.on = '0';
      slot.dataset.id = m.code;
      slot.innerHTML = `<span class="mk">⬜</span>${cardBody(m, rec.keep_going_message)}`;
      slot.addEventListener('click', () => {
        picked = (picked === m.code) ? null : m.code;
        document.querySelectorAll('.pickable').forEach(el => {
          const on = el.dataset.id === picked;
          el.dataset.on = on ? '1' : '0';
          el.querySelector('.mk').textContent = on ? '✅' : '⬜';
        });
        document.getElementById('pick-count').textContent = picked ? '1' : '0';
        document.getElementById('start-btn').disabled = !picked;
      });
      cat.appendChild(slot);
    });
    catList.appendChild(cat);
  });

  if (rec.survey_needed.length) {
    document.getElementById('survey-needed').innerHTML = `<div class="callout">${rec.survey_needed.map(x => esc(x.category_name)).join(' · ')} 미션은 설문을 마치면 추천돼요. <a href="survey.html">설문하러 가기</a></div>`;
  }
  if (rec.excluded.length) {
    const t = document.getElementById('out-title');
    t.style.display = 'block';
    t.textContent = `추천하지 않은 미션 ${rec.excluded.length}개`;
    document.getElementById('out-list').innerHTML = rec.excluded.map(x =>
      `<div class="slot" data-k="out"><span>—</span><span><div class="st">${esc(x.name)}</div><div class="sd">${esc(x.reason)}</div></span></div>`).join('');
  }

  document.getElementById('start-btn').addEventListener('click', async () => {
    if (!picked) return;
    const btn = document.getElementById('start-btn');
    btn.disabled = true; btn.textContent = '시작하는 중...';
    try {
      await apiStartCycle(picked);
      location.href = 'challenge-progress.html';
    } catch (e) {
      showError(friendlyError(e));
      btn.disabled = false; btn.textContent = `${rec.cycle_number}차 챌린지 시작 (4주)`;
    }
  });
}

main();
</script>
</body>
</html>
