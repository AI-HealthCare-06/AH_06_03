<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAEON — 챌린지 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .cat{background:var(--cream); border:1px solid var(--sage-light); border-radius:18px; overflow:hidden; margin-bottom:10px}
  .cat>header{display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--sage-light)}
  .cat>header h3{font-size:14px; margin:0}
  .slot{display:flex; gap:10px; align-items:flex-start; background:#fff; border:1.5px solid var(--sage-light); border-radius:16px; padding:12px 14px; font-size:13.5px; margin:8px 10px}
  .slot[data-k="fixed"]{background:var(--cream)}
  .slot[data-k="out"]{opacity:.65; border-style:dashed; background:transparent}
  .slot[data-k="ask"]{border-style:dashed; background:transparent}
  .slot .st{font-weight:700}
  .slot .sd{font-size:12px; color:var(--muted)}
  .slot .ev{font-size:11.5px; color:var(--muted); margin-top:4px}
  .slot .ev small{color:var(--faint)}
  .slot .nt{font-size:11.5px; color:var(--warn); margin-top:4px}
  .pickable{cursor:pointer}
  .pickable[data-on="1"]{border-color:var(--sage-deep); background:var(--sage-light)}
  .lvl{font-size:10.5px; font-weight:700; border-radius:999px; padding:0 8px; border:1px solid currentColor; margin-left:6px; white-space:nowrap}
  .lvl[data-l="하"]{color:var(--ok)} .lvl[data-l="중"]{color:var(--warn)} .lvl[data-l="상"]{color:var(--risk)}
  .tag{font-size:10.5px; color:var(--sage-deep); border:1px solid var(--sage-deep); border-radius:999px; padding:0 8px; margin-left:6px; white-space:nowrap}
  .countbar{font-size:12.5px; color:var(--muted)}
  .cups{border-collapse:collapse; margin-top:6px; font-size:11px; color:var(--muted)}
  .cups th,.cups td{border:1px solid var(--sage-light); padding:3px 7px; text-align:left}
  details summary{cursor:pointer; font-size:11.5px; color:var(--sage-deep); margin-top:4px}
</style>
</head>
<body>

<div id="header-slot"></div>

<div class="wrapper">
  <div class="frame">
    <div class="frame-body">
      <div class="screen" id="screen">
        <p class="lede" id="lede">미션은 고정 2개와 선택 1개, 모두 3개예요. 고정 미션은 입력하신 정보로 정해져요.</p>
        <p class="sect">고정 미션 2개 — 흡연 한 칸, 음주 한 칸</p>
        <div id="fixed-list"></div>
        <p class="sect">선택 미션 1개</p>
        <p class="hint" id="sel-note">나트륨·신체 활동·외식·아침 미션은 위험도 계산에 쓰이지 않아요.</p>
        <div id="all-good" class="callout" style="display:none"><b>모든 생활습관이 잘 유지되고 있어요.</b><br>하고 싶은 미션을 하나 골라 보세요.</div>
        <div id="cat-list"></div>
        <div id="ask-list"></div>
        <div class="countbar">선택 <b id="pick-count">0</b> / 1</div>
        <p class="sect" id="out-title" style="display:none"></p>
        <div id="out-list"></div>
        <button type="button" id="start-btn" class="cta" disabled>4주 챌린지 시작</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
// 가이드(modeling/handoff/생활습관_입력_가이드.md) §2.2 분류 · §3 추천 · §4 미션 · §4.1 카드 문구.
// 분류·추천은 최종적으로 서버가 계산한다(혜성님 챌린지 API). 서버가 준비되기 전까지 같은 규칙으로 화면에서 계산한다.
const _rd = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const _localIso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const prevCycle = _rd('paeon-cycle');
const prevNo = prevCycle ? (prevCycle.cycleNo || 1) : 0;
const prevDone = prevCycle && Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(prevCycle.startedOn + 'T00:00:00')) / 86400000) >= 28;
const nextNo = prevNo + 1;                      // 12주 = 4주 x 3차
if (prevCycle && !prevDone) {
  window.location.replace('challenge-progress.html');
} else if (prevCycle && prevNo >= 3) {
  document.getElementById('screen').innerHTML = '<div class="callout"><b>12주 챌린지를 모두 마쳤어요 🎉</b><br>끝까지 해내셨어요. 변화는 추이 화면에서 확인할 수 있어요.</div><a class="cta" style="display:block;text-align:center;text-decoration:none" href="trend.html">추이 보기</a>';
} else {
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const baseHealth = read('paeon-health');
  const recheck = prevCycle ? read('paeon-recheck') : null;           // 2·3차는 4주 뒤 다시 입력한 값(혈압·흡연)으로 추천을 다시 계산 (가이드 §6.2)
  const health = baseHealth && recheck ? { ...baseHealth, sbp: recheck.sbp ?? baseHealth.sbp, dbp: recheck.dbp ?? baseHealth.dbp, smoking: recheck.smoking || baseHealth.smoking } : baseHealth;
  const survey = read('paeon-survey') || {};
  document.getElementById('lede').textContent = `12주 챌린지를 4주씩 3번으로 나눠 해요. 지금은 ${nextNo}차예요. 미션은 고정 2개와 선택 1개, 모두 3개예요. 고정 미션은 입력하신 정보로 정해져요.`;
  document.getElementById('start-btn').textContent = `${nextNo}차 챌린지 시작 (4주)`;
  const screen = document.getElementById('screen');
  if (!health) {
    screen.innerHTML = '<div class="callout"><b>건강정보를 먼저 입력해 주세요</b><br>입력하신 정보로 챌린지를 정해 드려요.</div><a class="cta" style="display:block;text-align:center;text-decoration:none" href="health-info.html">건강정보 입력하기</a>';
  } else {
    run();
  }

  function run() {
    const fmt = (n) => Number(n).toLocaleString();
    const bmi = health.weight_kg / Math.pow(health.height_cm / 100, 2);
    const h2 = Math.pow(health.height_cm / 100, 2);
    const soStatus = survey.sodium ? survey.sodium.status : null;
    const sodiumKnown = soStatus === 'ok' || soStatus === 'not_applicable';
    const highSodium = soStatus === 'not_applicable' || (soStatus === 'ok' && ['careful_high', 'severe'].includes(survey.sodium.grade));

    // §2.2 분류. 값이 없으면(설문 건너뜀) null = 분류 없음
    const C = {
      smoker: health.smoking === 'current',
      drinker: !['never_lifetime', 'none_past_year'].includes(health.drink_freq) && ['3_4', '5_6', '7_9', '10plus'].includes(health.drink_amount),
      highSodium: sodiumKnown ? highSodium : null,
      lowActivity: survey.activity_code ? survey.activity_code !== '150plus' : null,
      hasSteps: survey.baseline_steps != null,
      eatoutCount: survey.eatout_code || null,
      frequentEatout: (survey.eatout_code && sodiumKnown) ? (['5_6_week', '1_day', '2plus_day'].includes(survey.eatout_code) && highSodium) : null,
      breakfastSkip: survey.breakfast_code ? ['3_4', '1_2', '0'].includes(survey.breakfast_code) : null,
      bp160: health.sbp >= 160 || health.dbp >= 100,
      overweight: bmi >= 25,
    };

    const stepsTarget = C.hasSteps ? survey.baseline_steps + 2000 : null;
    const normLo = Math.round(18.5 * h2), normHi = Math.round(22.9 * h2);
    const ecigOn = health.ecig && health.ecig !== 'none';
    const CUPS = '<details><summary>잔 기준표 보기</summary><table class="cups"><tr><th>술</th><th>1잔</th><th>병·캔으로 셀 때</th></tr><tr><td>소주</td><td>소주잔 1잔</td><td>1병(360ml) = 7잔</td></tr><tr><td>맥주</td><td>맥주잔 1잔</td><td>캔 355ml = 1.5잔 · 500ml = 2잔</td></tr><tr><td>와인</td><td>와인잔 1잔</td><td>1병(750ml) = 5잔</td></tr><tr><td>막걸리</td><td>막걸리 사발 1잔</td><td>1병(750ml) = 3잔</td></tr><tr><td>양주</td><td>양주잔 1잔</td><td></td></tr><tr><td>소맥</td><td colspan="2">맥주잔 1잔 = 1잔</td></tr></table></details>';

    // §4 / §4.1. bp는 4주 비교 화면의 예상치 계산용 내부 값(화면에 숫자로 보이지 않음)
    const M = {
      'SMK-1': { cat: 'SMOKING', t: '금연 유지', lv: '상', weekly: 7, bp: 0, d: '4주 동안 일반담배를 피우지 않아요 (전자담배로 바꾸지 않아요)',
        ev: '하루 1개비만 피워도 관상동맥질환 위험이 크게 높아져요. 줄이기보다 끊는 것이 목표예요', src: 'BMJ 2018',
        note: '금연상담전화 1544-9030 · 가까운 보건소 금연클리닉에서 무료로 도움받을 수 있어요.' + (ecigOn ? ' 전자담배도 함께 끊어요.' : '') },
      'ALC-1': { cat: 'ALCOHOL', t: '절주', lv: '중', weekly: 7, bp: 0, d: '술을 마신 날에도 남성 2잔, 여성 1잔까지만 마셔요',
        ev: '한 번에 많이 마시던 분이 양을 줄이면 혈압이 내려간다는 연구가 있어요', src: 'Lancet Public Health 2017',
        note: '건강을 위해서는 마시지 않는 것이 가장 좋아요.', extra: CUPS },
      'NA-1': { cat: 'SODIUM', t: '국물 남기기', lv: '하', weekly: 5, bp: -4, d: '국·찌개·탕·라면의 국물을 남겨요',
        ev: '소금을 하루 4–5g 줄이면 수축기 혈압이 평균 약 4mmHg 내려가요', src: 'Cochrane Database Syst Rev 2013' },
      'NA-2': { cat: 'SODIUM', t: '소금·간장 더 넣지 않기', lv: '중', weekly: 5, bp: -4, d: '식탁에서 소금이나 간장을 더 넣지 않아요',
        ev: '소금을 하루 4–5g 줄이면 수축기 혈압이 평균 약 4mmHg 내려가요', src: 'Cochrane Database Syst Rev 2013' },
      'ACT-1': { cat: 'ACTIVITY', t: '걸음 수 늘리기', lv: '하', weekly: 5, bp: -4, d: `하루 걸음 수를 평소보다 2,000보 늘려요${stepsTarget ? ` (목표 ${fmt(stepsTarget)}보)` : ''}`,
        ev: '하루 2,000보를 더 걸으면 수축기 혈압이 약 4mmHg 내려간다는 연구가 있어요', src: 'J Hum Hypertens 2018', note: '걸음 수는 휴대폰 건강 앱에 나온 숫자를 입력해요.' },
      'ACT-2': { cat: 'ACTIVITY', t: '빠르게 걷기 30분', lv: '중', weekly: 5, bp: -4, d: '숨이 조금 찰 정도로 30분 이상 빠르게 걸어요',
        ev: '빠르게 걷기를 꾸준히 하면 수축기 혈압이 평균 약 4mmHg 내려가요', src: 'Cochrane Database Syst Rev 2021' },
      'ACT-3': { cat: 'ACTIVITY', t: '벽 스쿼트', lv: '상', weekly: 3, bp: 0, d: '벽에 등을 대고 무릎을 굽힌 자세로 2분 버티기를 4번 해요 (사이 2분 휴식)',
        ev: '벽 스쿼트 같은 버티기 운동은 혈압을 낮추는 효과가 큰 운동으로 알려져 있어요', src: 'Br J Sports Med 2023',
        note: '운동 중 숨을 참지 마세요. 어지럽거나 가슴이 아프면 바로 멈추세요. 처음에는 무릎을 조금만 굽혀요.' },
      'OUT-1': { cat: 'EATOUT', t: '외식·배달 때 "싱겁게" 요청', lv: '중', weekly: 3, bp: -4, d: '외식·배달 주문 때 "싱겁게 해 주세요"라고 요청해요',
        ev: '외식 음식의 소금을 줄이는 방법이에요. 소금을 하루 4–5g 줄이면 수축기 혈압이 평균 약 4mmHg 내려가요', src: 'Cochrane Database Syst Rev 2013',
        note: '배달 앱 요청사항 칸에 적어도 돼요.' },
      'BRK-1': { cat: 'BREAKFAST', t: '아침 식사 하기', lv: '하', weekly: 5, bp: 0, d: '아침 식사를 해요',
        ev: '아침을 거르는 사람은 고혈압이 있을 가능성이 약 1.2배 높다는 연구가 있어요. 정부 식생활지침도 아침 식사를 권장해요', src: 'Int J Hypertens 2022 · 「한국인을 위한 식생활지침」 2021',
        note: '커피·음료만 마신 경우는 제외해요.' },
      'WT-1': { cat: 'WEIGHT', t: '끼니마다 밥 2/3공기', lv: '중', weekly: 5, bp: -1, d: '끼니마다 밥을 2/3공기만 먹어요. 4주마다 몸무게·허리둘레를 다시 재요',
        ev: '체중을 1kg 줄일 때마다 수축기 혈압이 약 1mmHg 내려가요', src: 'Hypertension 2003',
        note: `줄인 밥 대신 다른 음식을 더 먹지 않아요. 키 기준 정상 체중 ${normLo}–${normHi}kg · 허리둘레 기준 남 90cm, 여 85cm 미만` },
    };
    Object.entries(M).forEach(([id, m]) => { m.id = id; });
    const CAT_NAME = { SODIUM: '나트륨 줄이기', ACTIVITY: '신체 활동', EATOUT: '외식 · 배달', BREAKFAST: '아침 식사', WEIGHT: '체중 관리' };

    // §3.3 대체 순서: 위에서부터 조건이 맞는 첫 카테고리의 대표 미션
    const REPLACE = [
      ['SODIUM', () => C.highSodium === true, () => 'NA-1'],
      ['ACTIVITY', () => C.lowActivity === true, () => (C.hasSteps ? 'ACT-1' : 'ACT-2')],
      ['EATOUT', () => C.frequentEatout === true, () => 'OUT-1'],
      ['BREAKFAST', () => C.breakfastSkip === true, () => 'BRK-1'],
    ];
    const replacement = (exceptCat) => { const r = REPLACE.find(([cat, ok]) => cat !== exceptCat && ok()); return r ? { id: r[2](), cat: r[0] } : null; };

    // §3.2 고정 2칸
    const fixed = [];
    let slot1, from1 = null;
    if (C.smoker) slot1 = { id: 'SMK-1' };
    else { slot1 = replacement(null); from1 = '흡연 칸 대체'; }
    let slot2, from2 = null;
    if (C.drinker) slot2 = { id: 'ALC-1' };
    else { slot2 = replacement(slot1 ? slot1.cat : null); from2 = '음주 칸 대체'; }
    // (같은 카테고리 제외 규칙은 고정 1이 대체 미션일 때만 의미가 있다)
    if (slot1) fixed.push({ ...M[slot1.id], from: from1 });
    if (slot2) fixed.push({ ...M[slot2.id], from: from2 });
    const emptySlots = 2 - fixed.length;
    const usedIds = new Set(fixed.map(m => m.id));

    // §3.4 선택 후보와 제외 사유
    const cand = [], outs = [], asks = [];
    const addCat = (cat, ids, okCond, whyNot, unknown) => {
      if (unknown) { asks.push(cat); return; }
      const list = ids.filter(id => !usedIds.has(id));
      if (okCond) list.forEach(id => cand.push(M[id])); else outs.push([CAT_NAME[cat] + ' 미션', whyNot]);
    };
    addCat('SODIUM', ['NA-1', 'NA-2'], C.highSodium === true, '추정 나트륨 섭취가 많지 않아요', C.highSodium == null);
    addCat('ACTIVITY', ['ACT-1', 'ACT-2', 'ACT-3'].filter(id => (id !== 'ACT-1' || C.hasSteps) && (id !== 'ACT-3' || !C.bp160)), C.lowActivity === true,
      '운동 권장량(주 150분)을 이미 채우고 있어요', C.lowActivity == null);
    const eatWhy = !['5_6_week', '1_day', '2plus_day'].includes(C.eatoutCount) ? '외식·배달 횟수가 많지 않아요' : '추정 나트륨 섭취가 많지 않아요';
    addCat('EATOUT', ['OUT-1'], C.frequentEatout === true, eatWhy, C.frequentEatout == null);
    addCat('BREAKFAST', ['BRK-1'], C.breakfastSkip === true, '아침 식사를 잘 챙기고 있어요', C.breakfastSkip == null);
    addCat('WEIGHT', ['WT-1'], C.overweight, '지금 체중은 관리 미션 대상이 아니에요', false);
    let allGood = false;
    if (!cand.length) {                          // 후보 0개: 가이드 §3.4의 전체 후보 (설문 미응답이 없을 때만 "모두 잘 유지" 문구)
      allGood = asks.length === 0;
      ['NA-1', 'NA-2', ...(C.hasSteps ? ['ACT-1'] : []), 'ACT-2', ...(C.bp160 ? [] : ['ACT-3']), 'OUT-1', 'BRK-1']
        .filter(id => !usedIds.has(id)).forEach(id => cand.push(M[id]));
    }

    // ---- 그리기
    const card = (m, extra = '') => `
      <span>${extra}</span>
      <span><div class="st">${m.t} <span class="lvl" data-l="${m.lv}">${m.lv}</span><span class="tag">주 ${m.weekly}회</span>${m.from ? `<span class="tag">${m.from}</span>` : ''}</div>
        <div class="sd">${m.d}</div>
        <div class="ev">${m.ev} <small>— ${m.src}</small></div>
        ${m.note ? `<div class="nt">${m.note}</div>` : ''}${m.extra || ''}</span>`;
    document.getElementById('fixed-list').innerHTML =
      fixed.map(m => `<div class="slot" data-k="fixed">${card(m, '📌')}</div>`).join('') +
      Array.from({ length: emptySlots }, () => '<div class="slot" data-k="fixed"><span>📌</span><span><div class="st">지금 생활습관이 잘 유지되고 있어요</div><div class="sd">이 칸에 넣을 미션이 없어요. 아래에서 하고 싶은 미션을 골라 보세요.</div></span></div>').join('');

    document.getElementById('all-good').style.display = allGood ? 'block' : 'none';
    const byCat = {};
    cand.forEach(m => { (byCat[m.cat] = byCat[m.cat] || []).push(m); });
    let picked = null;
    const catList = document.getElementById('cat-list');
    Object.entries(byCat).forEach(([cat, ms]) => {
      const box = document.createElement('div');
      box.className = 'cat';
      box.innerHTML = `<header><h3>${CAT_NAME[cat]}</h3>${cat === 'BREAKFAST' ? '<span class="lvl" style="color:var(--faint)">원할 때만</span>' : ''}</header>`;
      ms.forEach(m => {
        const slot = document.createElement('div');
        slot.className = 'slot pickable';
        slot.dataset.on = '0'; slot.dataset.id = m.id;
        slot.innerHTML = card(m, '⬜');
        slot.addEventListener('click', (e) => {
          if (e.target.closest('details')) return;
          picked = picked === m.id ? null : m.id;
          document.querySelectorAll('.pickable').forEach(s => { const on = s.dataset.id === picked; s.dataset.on = on ? '1' : '0'; s.querySelector('span').textContent = on ? '✅' : '⬜'; });
          document.getElementById('pick-count').textContent = picked ? '1' : '0';
          document.getElementById('start-btn').disabled = !picked;
        });
        box.appendChild(slot);
      });
      catList.appendChild(box);
    });
    document.getElementById('ask-list').innerHTML = asks.map(cat =>
      `<div class="slot" data-k="ask"><span>📝</span><span><div class="st">${CAT_NAME[cat]} 미션 <span class="tag">설문을 마치면 추천돼요</span></div><div class="sd"><a href="survey.html" style="color:var(--sage-deep); font-weight:700">설문으로 가기</a></div></span></div>`).join('');
    if (outs.length) {
      document.getElementById('out-title').style.display = 'block';
      document.getElementById('out-title').textContent = `추천하지 않은 미션 ${outs.length}개 — 이미 잘 하고 계신 것은 다시 시키지 않아요`;
      document.getElementById('out-list').innerHTML = outs.map(([t, w]) => `<div class="slot" data-k="out"><span>—</span><span><div class="st">${t}</div><div class="sd">${w}</div></span></div>`).join('');
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      const keep = (m) => ({ id: m.id, t: m.t, d: m.d, lv: m.lv, cat: m.cat, weekly: m.weekly, bp: m.bp });
      const missions = [...fixed.map(keep), ...(picked ? [keep(M[picked])] : [])];
      const prevProgress = _rd('paeon-progress');
      if (prevCycle) {                               // 끝난 차수는 이력으로 보관하고, 주간 혈압 기록은 차수를 넘어 이어간다
        const hist = _rd('paeon-cycle-history') || [];
        hist.push({ cycle: prevCycle, progress: prevProgress });
        localStorage.setItem('paeon-cycle-history', JSON.stringify(hist));
      }
      localStorage.setItem('paeon-cycle', JSON.stringify({ missions, cycleNo: nextNo, startedOn: _localIso(new Date()) }));
      localStorage.setItem('paeon-progress', JSON.stringify({ days: [], bpLog: prevProgress && prevProgress.bpLog ? prevProgress.bpLog : [] }));
      window.location.href = 'challenge-progress.html';
    });
  }
}
</script>
</body>
</html>
