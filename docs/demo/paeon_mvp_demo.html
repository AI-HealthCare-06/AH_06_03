<title>PAEON MVP 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 와이어프레임 v4 팔레트(핑크). 상단 버튼으로 초록과 바꿔 볼 수 있다 */
  --cream:#F5EBEB; --sage-light:#E8C9C9; --sage:#CB9F9F; --sage-deep:#BD8484; --track:#F0E0E0;
  --petal1:#F2A6BE; --petal2:#E8879F; --center:#FCE8B8; --dots:#E0A836; --stem:#BD8484;
  --shadow-btn:rgba(189,132,132,.45);
}
:root[data-pal="green"]{
  --cream:#FEF5ED; --sage-light:#D3E4CD; --sage:#ADC2A9; --sage-deep:#99A799; --track:#EEF4EB;
  --petal1:#D3E4CD; --petal2:#99A799; --center:#F6C6A5; --dots:#E88B72; --stem:#ADC2A9;
  --shadow-btn:rgba(153,167,153,.45);
}
:root{
  --ink:#384038; --muted:#5C665C; --faint:#8A928A;
  --surface:#FFFFFF; --surface-2:var(--cream);
  --line:var(--sage-light); --line-soft:var(--track);
  --accent:var(--sage-deep); --accent-soft:var(--sage-light);
  --ok:#3E7A55; --ok-soft:#E4EFE5;
  --warn:#8C6014; --warn-soft:#F7EDD9;
  --risk:#B0543F; --risk-soft:#FBEAE5;
  --danger:#D97362; --peach:#F6C6A5;
  --shadow:0 8px 24px rgba(56,64,56,.08), 0 2px 6px rgba(56,64,56,.06);
}
*{box-sizing:border-box}
body{margin:0; background:#F1ECE4; color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-size:14px; line-height:1.6; padding-bottom:70px}
h1,h2,h3,.heading-font{font-family:'Gowun Dodum','Noto Sans KR',sans-serif}
h1,h2,h3{margin:0; font-weight:700}
p{margin:0}
button{font:inherit; cursor:pointer}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--sage-deep); outline-offset:2px; border-radius:6px}

/* ── 상단 단계 선택 (와이어프레임 picker) ── */
.picker{position:sticky; top:0; z-index:50; background:rgba(245,235,235,.95); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--sage); padding:12px 20px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
:root[data-pal="green"] .picker{background:rgba(254,245,237,.95)}
.picker .brand{font-weight:900; font-size:18px; margin-right:10px; color:var(--sage-deep); display:flex; align-items:center; gap:4px}
#steps{display:flex; gap:6px; flex-wrap:wrap; flex:1}
#steps button{border:1px solid var(--sage); background:#fff; color:var(--muted); border-radius:999px; padding:5px 11px; font-size:12.5px}
#steps button:hover:not(:disabled){background:var(--sage-deep); color:#fff; border-color:var(--sage-deep)}
#steps button[data-on="1"]{background:var(--sage-deep); color:#fff; border-color:var(--sage-deep); font-weight:700}
#steps button[data-done="1"]{color:var(--ink)}
#steps button:disabled{opacity:.4; cursor:not-allowed}
.pal{display:flex; gap:4px; font-size:11.5px; color:var(--muted); align-items:center}
.pal button{border:1px solid var(--sage); background:#fff; border-radius:999px; padding:3px 10px; font-size:11.5px; color:var(--muted)}
.pal button[data-on="1"]{background:var(--sage-light); color:var(--ink); font-weight:700}

/* ── 화면 프레임 (와이어프레임 frame) ── */
.wrapper{max-width:900px; margin:34px auto 0; padding:0 20px}
.screen-tag{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.screen-tag .id{background:var(--sage-deep); color:#fff; font-weight:700; font-size:13px; padding:4px 12px; border-radius:999px}
.screen-tag .name{font-weight:700; font-size:15px}
.screen-tag .flow{color:var(--muted); font-size:12.5px; margin-left:auto; text-align:right}
.frame{background:#fff; border-radius:28px; box-shadow:var(--shadow); border:1px solid #EDE3D6; overflow:hidden}
.frame-bar{display:flex; gap:6px; padding:12px 18px; background:var(--cream); border-bottom:1px solid var(--sage-light)}
.frame-bar span{width:9px; height:9px; border-radius:50%; background:var(--sage)}
.frame-body{padding:28px 30px; position:relative}
.app-shell{display:flex; gap:22px}
.nav-col{width:150px; flex:none}
.nav-item{display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:14px; font-size:13.5px; color:var(--muted); margin-bottom:6px; font-weight:500; cursor:pointer}
.nav-item.active{background:var(--sage-light); color:var(--ink); font-weight:700; box-shadow:0 3px 10px rgba(56,64,56,.07)}
.content-col{flex:1; min-width:0}
.screen{display:flex; flex-direction:column; gap:14px}
.notes{margin-top:12px; background:#fff; border:1px dashed var(--sage); border-radius:14px; padding:12px 16px; font-size:12px; color:var(--muted); line-height:1.7}
.notes .why{display:flex; flex-direction:column; gap:3px; margin-top:8px}
.notes .why b{color:var(--ink)}
.disclaimer{font-size:11.5px; color:var(--faint); margin-top:8px}
.idlist{display:flex; flex-wrap:wrap; gap:4px}
.id{font-size:10.5px; font-weight:700; border:1px solid var(--sage-light); border-radius:4px; padding:1px 6px; color:var(--muted); background:#fff}
.id[data-t="w"]{color:#fff; background:var(--sage-deep); border-color:var(--sage-deep)}
@media (max-width:760px){ .app-shell{flex-direction:column} .nav-col{width:auto; display:flex; gap:6px; flex-wrap:wrap} .frame-body{padding:20px 16px} }

/* ── 폼 ── */
.lede{font-size:12.5px; color:var(--muted)}
.sect{font-size:13px; font-weight:700; margin-top:4px}
.field{display:flex; flex-direction:column; gap:4px}
.field label{font-size:12.5px; font-weight:700; color:var(--muted)}
.field input,.field select{font:inherit; font-size:13.5px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--sage-light); background:#fff; color:var(--ink); width:100%}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px}
.cta{width:100%; border:0; border-radius:999px; padding:13px 22px; font-weight:700; font-size:14.5px; background:var(--sage-deep); color:#fff; box-shadow:0 6px 14px var(--shadow-btn)}
.cta:disabled{opacity:.4; cursor:not-allowed; box-shadow:none}
.ghost{width:100%; border:1.5px solid var(--sage); border-radius:999px; padding:11px 18px; font-weight:700; background:#fff; color:var(--ink); font-size:13.5px}
.q{display:flex; flex-direction:column; gap:7px}
.qt{font-size:13.5px; font-weight:700}
.qh{font-size:11.5px; color:var(--muted)}
.optrow{display:flex; flex-wrap:wrap; gap:8px}
.opt{border:1.5px solid var(--sage-light); background:#fff; color:var(--ink); border-radius:16px; padding:8px 14px; font-size:13px; font-weight:600; box-shadow:0 3px 10px rgba(56,64,56,.07)}
.opt[data-on="1"]{border-color:var(--sage-deep); background:var(--sage-light)}
.opt .badge{font-size:10.5px; color:var(--muted); margin-left:6px; font-weight:500}
.tip,.hint{font-size:11.5px; color:var(--muted)}
.privacy{display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--muted); border:1px solid var(--sage-light); border-radius:14px; padding:11px 14px; background:#fff}

/* ── 카드류 ── */
.callout{background:var(--cream); border:1px solid var(--sage-light); border-radius:18px; padding:14px 18px; font-size:12.5px; color:var(--muted)}
.callout b{color:var(--ink)}
.warnbox{border:1.5px solid var(--danger); background:#FBEAE5; border-radius:18px; padding:14px 18px; font-size:13px}
.warnbox b{color:var(--risk)}
.warnbox .acts{display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap}
.warnbox .acts span{font-size:12.5px; font-weight:700}
.warnbox .acts button{width:auto; padding:8px 18px}
.call119{display:inline-block; margin-top:8px; background:var(--danger); color:#fff; border-radius:999px; padding:8px 18px; font-weight:700; font-size:13px; text-decoration:none}
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.kpi{background:#fff; border:1px solid var(--sage-light); border-radius:14px; padding:10px 8px; text-align:center}
.kpi .k{font-size:11.5px; color:var(--muted)}
.kpi .v{font-size:18px; font-weight:900; margin-top:2px}
.riskrow{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--sage-light); border-radius:18px; padding:14px 18px}
.chip{font-size:11.5px; font-weight:700; border-radius:999px; padding:3px 11px; border:1.5px solid currentColor; white-space:nowrap}
.riskrow .pct{font-size:30px; font-weight:900; margin-left:auto}
.agebox{background:var(--cream); border:1px solid var(--sage-light); border-radius:18px; padding:16px; text-align:center}
.agebox .big{font-size:34px; font-weight:900; line-height:1.1}
.agebox .sub{font-size:12px; color:var(--muted); margin-top:3px}
.agebox .gap{font-size:13.5px; font-weight:700; margin-top:5px}
.speech{background:var(--sage-light); border-radius:18px; padding:13px 18px; font-size:13.5px}
.speech .who{font-size:11px; color:var(--muted); font-weight:700; margin-bottom:2px}
figure{margin:0; background:#fff; border:1px solid var(--sage-light); border-radius:18px; padding:14px 18px}
figcaption{font-size:12.5px; color:var(--muted); margin-bottom:8px}
figcaption b{color:var(--ink)}
.chart{width:100%; height:auto; display:block; overflow:visible}
.bars{display:grid; grid-template-columns:88px 1fr 46px; gap:8px 10px; align-items:center; font-size:13px}
.bk{color:var(--ink)}
.bb{background:var(--track); border-radius:8px; height:9px; overflow:hidden}
.bb i{display:block; height:100%; border-radius:8px}
.bv{text-align:right; font-weight:700; font-size:12px}
.trk{background:var(--track); border-radius:999px; height:10px; overflow:hidden}
.trk i{display:block; height:100%; background:var(--sage-deep); border-radius:999px}
.substeps{display:flex; gap:6px; flex-wrap:wrap}
.substeps span{font-size:12px; border:1px solid var(--sage-light); border-radius:999px; padding:4px 12px; color:var(--muted); background:var(--cream); font-weight:700}
.substeps span[data-on="1"]{background:var(--sage-deep); border-color:var(--sage-deep); color:#fff}
.substeps span[data-done="1"]{color:var(--ink)}
.countbar{font-size:12.5px; color:var(--muted)}
.countbar b{color:var(--ink)}

/* ── 챌린지 ── */
.cat{background:var(--cream); border:1px solid var(--sage-light); border-radius:18px; overflow:hidden}
.cat>header{display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--sage-light)}
.cat>header h3{font-size:14px}
.slot{display:flex; gap:10px; align-items:flex-start; background:#fff; border:1.5px solid var(--sage-light); border-radius:16px; padding:12px 14px; font-size:13.5px; margin:8px 10px}
.cat .slot{margin:8px 10px}
.screen>.slot{margin:0}
.slot[data-k="fixed"]{background:var(--cream)}
.slot[data-k="out"]{opacity:.6; border-style:dashed; background:transparent}
.slot .st{font-weight:700}
.slot .sd{font-size:12px; color:var(--muted)}
.slot .from{font-size:10.5px; color:var(--sage-deep); border:1px solid var(--sage-deep); border-radius:999px; padding:0 8px; margin-left:6px; white-space:nowrap; font-weight:700}
.pickable{cursor:pointer}
.pickable[data-on="1"]{border-color:var(--sage-deep); background:var(--sage-light)}
.lvl{font-size:10.5px; font-weight:700; border-radius:999px; padding:0 8px; border:1px solid currentColor; margin-left:6px; white-space:nowrap}
.lvl[data-l="하"]{color:var(--ok)} .lvl[data-l="중"]{color:var(--warn)} .lvl[data-l="상"]{color:var(--risk)}
.daygrid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.daygrid button{border:1px solid var(--sage-light); background:#fff; border-radius:10px; padding:8px 0; font-size:11.5px; color:var(--muted)}
.daygrid button[data-on="1"]{background:var(--sage-deep); border-color:var(--sage-deep); color:#fff; font-weight:700}
.wk{font-size:12px; color:var(--muted); font-weight:700; margin-top:4px}
.bplog{display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; font-size:12.5px; align-items:center}
.inline{display:flex; gap:8px; align-items:flex-end}
.inline .field{flex:1}
.inline button{width:auto; padding:10px 20px}

/* ── 홈 / 비교 ── */
.state{display:flex; gap:6px; flex-wrap:wrap}
.state button{border:1px solid var(--sage); background:#fff; border-radius:999px; padding:5px 12px; font-size:12px; color:var(--muted)}
.state button[data-on="1"]{background:var(--sage-deep); border-color:var(--sage-deep); color:#fff; font-weight:700}
.hero{background:#fff; border:1px solid var(--sage-light); border-radius:18px; padding:16px 20px}
.hero h1{font-size:18px; line-height:1.35}
.hero p{font-size:12.5px; color:var(--muted); margin-top:4px}
.tworow{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.mini{background:#fff; border:1px solid var(--sage-light); border-radius:18px; padding:14px; text-align:center}
.mini .lb{font-size:11.5px; color:var(--muted)}
.mini .vv{font-size:32px; font-weight:900}
.mini .sb{font-size:12px; color:var(--muted)}
.deltarow{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; background:#fff; border:1px solid var(--sage-light); border-radius:18px; padding:16px}
.deltarow .side{text-align:center}
.deltarow .side .lb{font-size:11.5px; color:var(--muted)}
.deltarow .side .vv{font-size:32px; font-weight:900}
.deltarow .arrow{font-size:22px; color:var(--faint)}
.hero-w01{text-align:center; padding:26px 8px 8px}
.hero-w01 h2{font-size:24px; margin:6px 0 4px}
.hero-w01 .headline{font-size:19px; font-weight:700; margin:16px 0 4px}
.trio{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:left; margin-top:6px}
.trio .opt{display:flex; align-items:center; gap:8px; border-radius:16px; cursor:default}
.dots{position:absolute; width:70px; height:70px; opacity:.35; pointer-events:none; background-image:radial-gradient(var(--sage) 1.6px, transparent 1.6px); background-size:12px 12px}
</style>

  <symbol id="logo-paeon" viewBox="0 0 100 100">

  <span class="brand"><svg width="20" height="20"><use href="#logo-paeon"/></svg> PAEON</span>

<div class="wrapper">
  <div class="screen-tag"><span class="id" id="sid">W01</span><span class="name" id="stitle">서비스 소개</span><span class="flow" id="sflow"></span></div>

        <div class="nav-col" id="navcol"></div>

<script>
/* ═══════════ 유틸 ═══════════ */
const el = (t,a={},...kids)=>{const n=document.createElement(t);
  for(const [k,v] of Object.entries(a)){ if(k==='cls')n.className=v; else if(k==='html')n.innerHTML=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v); else if(v!=null)n.setAttribute(k,v); }
  kids.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c))); return n;};
const f1 = n => (Math.round(n*10)/10).toFixed(1);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const sig = z => 1/(1+Math.exp(-z));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ═══════════ 모델 A — 10년 내 관상동맥질환 위험 (유일한 예측 모델) ═══════════
   Framingham 위험요인(나이·성별·수축기혈압·총콜레스테롤·HDL·흡연·당뇨·고혈압 치료)을 쓰는
   선형 로지스틱 예시 모델. 선형이라 기여도 = 계수 x (값 − 평균) 이 그대로 설명값(SHAP)이다.
   계수는 모델 문서가 확정되기 전까지 쓰는 잠정값. 구조만 확정. 모델 B는 사용하지 않는다. */
const FEATS = [
  {k:'age',   label:'나이',        coef: 0.065, mean:40,  fixed:true},
  {k:'male',  label:'성별(남)',    coef: 0.50,  mean:0.5, fixed:true},
  {k:'sbp',   label:'수축기혈압',  coef: 0.014, mean:125},
  {k:'tc',    label:'총콜레스테롤',coef: 0.005, mean:200},
  {k:'hdl',   label:'HDL',         coef:-0.015, mean:50},
  {k:'smoke', label:'흡연',        coef: 0.60,  mean:0.2},
  {k:'htnTx', label:'고혈압 치료', coef: 0.20,  mean:0.2},
  {k:'diab',  label:'당뇨',        coef: 0.50,  mean:0.1},
];
const INTERCEPT = -2.95;   // FIXED_PATCH
const AGE_COEF = 0.065;
const contribs = x => FEATS.map(f=>({...f, val:x[f.k], c:f.coef*(x[f.k]-f.mean)}));
const risk = x => sig(INTERCEPT + contribs(x).reduce((s,f)=>s+f.c,0));
/* 혈관 나이: 나이·성별 외 기여도를 나이 계수로 환산해 더한다. */
const vascAge = x => clamp(x.age + contribs(x).filter(f=>!f.fixed).reduce((s,f)=>s+f.c,0)/AGE_COEF, 20, 90);
const band = r => r<0.10 ? {t:'정상', v:'ok'} : r<=0.20 ? {t:'경계', v:'warn'} : {t:'위험', v:'risk'};

/* ═══════════ 입력 상태 ═══════════ */
const P = {age:45, male:1, h:172, w:78, sbp:145, dbp:92, smoke:1, drink:3, diab:0, htn:0, tc:212, hdl:45, glu:104, fam:1};
const A = {N1:5.5, N2:2, N3:2, N4:1, O1:3.5, O2:4, M1:1.5, W2:0, X3:2};
const SPORTS = [
  {id:'walk', n:'걷기', tier:'저강도', w:0.8}, {id:'fwalk', n:'빠르게 걷기', tier:'중강도', w:1},
  {id:'bike', n:'자전거', tier:'중강도', w:1},  {id:'yoga', n:'요가·필라테스', tier:'중강도', w:1},
  {id:'run', n:'달리기', tier:'고강도', w:2},    {id:'hike', n:'등산', tier:'고강도', w:2},

function excludeReason(m){
  const d = derive();
  if (m.cat==='salt' && d.salt<=4) return '이미 싱겁게 드십니다';
  if (m.id==='a2' && d.act>=150) return '권고 150분을 이미 넘겼습니다';

}
/* 고정 2칸: 흡연 한 칸, 음주 한 칸. 해당 없으면 나트륨 미션이 채우고,
   나트륨도 이미 낮으면 기여도가 큰 개선 가능 요인의 미션으로 넘어간다. */
function fixedMissions(){
  const d = derive(), used = new Set(), out = [];
  const salt = [M.s1, M.s2]; let si = 0;
  const nextSalt = () => { while (si<salt.length){ const m=salt[si++]; if(!used.has(m.id)) return m; } return null; };
  const fb = [M.a2, M.o2, M.w2]; let fi = 0;
  const nextFb = () => { while (fi<fb.length){ const m=fb[fi++]; if(!used.has(m.id) && !excludeReason(m)) return m; } return null; };
  const fill = (base, keep, from) => {
    if (keep){ used.add(base.id); out.push({...base, from}); return; }
    const m = d.salt>4 ? nextSalt() : nextFb();
    if (m){ used.add(m.id); out.push({...m, from:from+' → 대체'}); }
    else out.push({id:'none'+out.length, t:'대체할 미션이 없습니다', d:'후보가 모자랄 때의 규칙은 팀 논의 중입니다', lv:'-', bp:0, from:from+' → 대체'});
  };
  fill(M.b1, P.smoke===1, '흡연'); fill(M.b2, P.drink>0, '음주');
  return out;
}
const pickedMission = () => S.pick ? M[S.pick] : null;

/* 4주 뒤 — 인증한 비율만큼만 반영. 모델 A 입력 중 4주 사이 바뀌는 것(혈압·흡연)만 바뀐다. */
function after(){
  const done = S.days.size/28, x = X(), z = {...x};
  const all = [...fixedMissions(), ...(pickedMission()?[pickedMission()]:[])];
  const plan = clamp(-all.reduce((s,m)=>s+(m.bp||0),0), 0, 12)*done;
  const measured = S.bpLog.length ? S.bpLog[S.bpLog.length-1].sys : null;
  z.sbp = measured!=null ? measured : x.sbp - plan;
  if (all.some(m=>m.id==='b1')) z.smoke = x.smoke*(1-done);
  return {z, drop:x.sbp - z.sbp, measured:measured!=null};
}

function bpChart(series){
  const W=356, H=150, padL=32, padR=58, padT=10, padB=22;
  const lo = Math.min(120, ...series)-4, hi = Math.max(150, ...series)+4;
  const Xp = i => padL + (series.length>1 ? i*(W-padL-padR)/(series.length-1) : 0);
  const Yp = v => padT + (hi-v)/(hi-lo)*(H-padT-padB);
  const s = ['<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="수축기 혈압 추이">'];
  s.push('<line x1="'+padL+'" y1="'+Yp(140).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Yp(140).toFixed(1)+'" stroke="'+cssv('--warn')+'" stroke-width="1.5" stroke-dasharray="5 4"/>');
  s.push('<text x="'+(W-padR+6)+'" y="'+(Yp(140)+4).toFixed(1)+'" font-size="10" font-weight="600" fill="'+cssv('--warn')+'">고혈압 140</text>');
  [120,130,150].forEach(v=>{ if(v>lo&&v<hi) s.push('<text x="'+(padL-6)+'" y="'+(Yp(v)+3).toFixed(1)+'" text-anchor="end" font-size="9" font-family="IBM Plex Mono, monospace" fill="'+cssv('--faint')+'">'+v+'</text>'); });
  s.push('<polyline fill="none" stroke="'+cssv('--accent')+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+series.map((v,i)=>Xp(i).toFixed(1)+','+Yp(v).toFixed(1)).join(' ')+'"/>');
  series.forEach((v,i)=>{
    s.push('<circle cx="'+Xp(i).toFixed(1)+'" cy="'+Yp(v).toFixed(1)+'" r="'+(i===series.length-1?5:3.5)+'" fill="'+cssv('--surface')+'" stroke="'+cssv('--accent')+'" stroke-width="2"><title>'+i+'주 '+Math.round(v)+' mmHg</title></circle>');
    s.push('<text x="'+Xp(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="'+cssv('--faint')+'">'+i+'주</text>');
  });
  s.push('<text x="'+(Xp(series.length-1)-2).toFixed(1)+'" y="'+(Yp(series[series.length-1])+17).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="600" font-family="IBM Plex Mono, monospace" fill="'+cssv('--ink')+'">'+Math.round(series[series.length-1])+'</text>');
  s.push('</svg>'); return s.join('');
}
function bars(rows){
  const mx = Math.max(0.2, ...rows.map(r=>Math.abs(r.c)));
  return el('div',{cls:'bars'}, rows.map(r=>{
    const col = r.fixed ? 'var(--sage)' : (r.c>=0 ? 'var(--sage-deep)' : 'var(--sage)');
    return [el('span',{cls:'bk'}, r.label),
      el('span',{cls:'bb'}, el('i',{style:'width:'+(Math.abs(r.c)/mx*100)+'%;background:'+col})),
      el('span',{cls:'bv', style:'color:var(--ink)'}, (r.c>=0?'+':'−')+f1(Math.abs(r.c)*100))];
  }).flat());
}

/* ── W11 · 내 기록 (추이 · 변화 추적) ── */
function riskChart(pts){
  const W=356, H=130, padL=34, padR=16, padT=12, padB=24;
  const hi = Math.max(0.3, ...pts.map(p=>p.r))+0.02;
  const Xp = i => padL + (pts.length>1 ? i*(W-padL-padR)/(pts.length-1) : 0);
  const Yp = v => padT + (1-v/hi)*(H-padT-padB);
  const s = ['<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="10년 위험 변화">'];
  s.push('<rect x="'+padL+'" y="'+Yp(0.10).toFixed(1)+'" width="'+(W-padL-padR)+'" height="'+(Yp(0)-Yp(0.10)).toFixed(1)+'" fill="'+cssv('--ok-soft')+'"/>');
  s.push('<text x="'+(W-padR-4)+'" y="'+(Yp(0.10)+11).toFixed(1)+'" text-anchor="end" font-size="9" font-weight="700" fill="'+cssv('--ok')+'">정상 범위</text>');
  s.push('<polyline fill="none" stroke="'+cssv('--accent')+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+pts.map((p,i)=>Xp(i).toFixed(1)+','+Yp(p.r).toFixed(1)).join(' ')+'"/>');
  pts.forEach((p,i)=>{
    s.push('<circle cx="'+Xp(i).toFixed(1)+'" cy="'+Yp(p.r).toFixed(1)+'" r="5" fill="'+cssv('--surface')+'" stroke="'+cssv('--accent')+'" stroke-width="2.5"/>');
    s.push('<text x="'+Xp(i).toFixed(1)+'" y="'+(Yp(p.r)-10).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+cssv('--ink')+'">'+Math.round(p.r*100)+'%</text>');
    s.push('<text x="'+Xp(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="'+cssv('--faint')+'">'+p.l+'</text>');
  });
  s.push('</svg>'); return s.join('');
}

  const hasHistory = S.days.size>0 || S.bpLog.length>0;
  add(el('div',{cls:'state'}, ['3개월','6개월','1년','전체'].map((t,i)=>el('button',{type:'button','data-on':i===3?'1':'0'}, t))));
