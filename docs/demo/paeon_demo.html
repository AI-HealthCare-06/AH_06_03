<title>PAEON 서비스 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3FAF2; --surface:#FFFFFF; --surface-2:#E9F6E6; --surface-3:#F8FCF6;
  --ink:#1F2A20; --muted:#4E5C4D; --faint:#7C8B7A; --ghost:#AEBCAB;
  --line:#D3E7CD; --line-soft:#E7F2E2;
  --accent:#2A7849; --accent-vivid:#4FB877; --accent-soft:#D9F2DF;
  --ok:#2C8F55; --ok-soft:#DCF3E2;
  --warn:#A8720D; --warn-soft:#FBEFD1;
  --risk:#C44E36; --risk-soft:#FCE3DB;
  --shadow:0 1px 2px rgba(31,42,32,.04), 0 10px 28px -20px rgba(31,42,32,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101510; --surface:#1A211A; --surface-2:#222C21; --surface-3:#1E261D;
  --ink:#EAF1E7; --muted:#AAB8A8; --faint:#83917F; --ghost:#5E6B5C;
  --line:#33402F; --line-soft:#283224;
  --accent:#8FD9A8; --accent-vivid:#5FC98A; --accent-soft:#22362A;
  --ok:#7FD69A; --ok-soft:#1D2F23; --warn:#E7B565; --warn-soft:#33291A;
  --risk:#F0937B; --risk-soft:#35221C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --bg:#101510; --surface:#1A211A; --surface-2:#222C21; --surface-3:#1E261D;
  --ink:#EAF1E7; --muted:#AAB8A8; --faint:#83917F; --ghost:#5E6B5C;
  --line:#33402F; --line-soft:#283224;
  --accent:#8FD9A8; --accent-vivid:#5FC98A; --accent-soft:#22362A;
  --ok:#7FD69A; --ok-soft:#1D2F23; --warn:#E7B565; --warn-soft:#33291A;
  --risk:#F0937B; --risk-soft:#35221C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased}
.num{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace; font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em; text-wrap:balance}
p{margin:0}
button{font:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--surface); border-bottom:1px solid var(--line)}
.navin{max-width:1200px; margin:0 auto; padding:0 24px; height:58px; display:flex; align-items:center; gap:20px}
.brand{font-size:18px; font-weight:600; letter-spacing:.14em}
.navin .right{margin-left:auto; font-size:13px; color:var(--faint)}
.rail{max-width:1200px; margin:0 auto; padding:12px 24px 0; display:flex; gap:4px; flex-wrap:wrap}
.rail button{border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:6px 11px;
  font-size:12.5px; color:var(--faint); display:flex; flex-direction:column; align-items:flex-start; line-height:1.3; min-width:92px}
.rail button b{font-size:10.5px; letter-spacing:.06em; color:var(--faint); font-weight:600}
.rail button[data-on="1"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.rail button[data-on="1"] b{color:var(--accent)}
.rail button:disabled{opacity:.42; cursor:not-allowed}

main{max-width:1200px; margin:0 auto; padding:16px 24px 64px; display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,296px); gap:22px; align-items:start}
@media (max-width:940px){ main{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){ .navin,.rail,main{padding-left:16px; padding-right:16px} }

.card{background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:22px 24px; box-shadow:var(--shadow)}
.stack{display:flex; flex-direction:column; gap:16px}
.hd{margin-bottom:16px}
.hd h1{font-size:21px}
.hd p{font-size:14px; color:var(--muted); margin-top:5px}
.sect{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:9px}

.opts{display:flex; flex-direction:column; gap:6px}
.optrow{display:flex; gap:6px; flex-wrap:wrap}
.opt{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:10px;
  padding:11px 14px; font-size:14.5px; background:var(--surface); text-align:left; width:100%; color:var(--ink)}
.opt:hover{border-color:var(--accent-vivid); background:var(--surface-3)}
.opt[data-on="1"]{border-color:var(--accent); background:var(--accent-soft); font-weight:600}
.opt .tick{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); flex:none; display:grid; place-items:center; font-size:9px; color:transparent}
.opt[data-on="1"] .tick{border-color:var(--accent); background:var(--accent); color:#fff}
.optrow .opt{width:auto; flex:1 1 100px; justify-content:center; padding:10px}
.optrow .opt .tick{display:none}
.q{margin-bottom:20px}
.q .qt{font-size:15.5px; font-weight:600; margin-bottom:4px}
.q .qh{font-size:13px; color:var(--faint); margin-bottom:9px}

.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:13px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:11px}
@media (max-width:620px){ .grid2,.grid4{grid-template-columns:1fr 1fr} }
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:13px; color:var(--muted); font-weight:500}
.field input{font:inherit; font-size:15.5px; padding:10px 12px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); width:100%}
.field input[data-ocr="1"]{border-color:var(--accent-vivid); background:var(--accent-soft)}

.kpi{border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--surface-3)}
.kpi .k{font-size:12px; color:var(--faint)}
.kpi .v{font-size:21px; font-weight:600; margin-top:2px}
.kpi .v[data-empty="1"]{color:var(--ghost); font-weight:500}
.kpi .u{font-size:11.5px; color:var(--faint); font-weight:400}

.primary{border:0; border-radius:11px; padding:13px 24px; font-weight:600; font-size:15.5px;
  background:var(--accent); color:#FFF}
:root[data-theme="dark"] .primary{color:#11150F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#11150F}}
.primary:disabled{opacity:.45; cursor:not-allowed}
.ghost{border:1px solid var(--line); border-radius:11px; padding:12px 20px; background:var(--surface); color:var(--muted); font-size:14.5px}
.acts{display:flex; gap:10px; margin-top:20px; align-items:center}
.acts .note{font-size:12.5px; color:var(--faint)}

.callout{border:1px solid var(--line); background:var(--surface-3); border-radius:11px; padding:13px 15px; font-size:13.5px; color:var(--muted)}
.callout b{color:var(--ink); font-weight:600}
.warnbox{border:1px solid var(--warn); background:var(--warn-soft); color:var(--warn); border-radius:11px; padding:13px 15px; font-size:13.5px}
.privacy{display:flex; gap:9px; border:1px dashed var(--line); border-radius:11px; padding:12px 15px; font-size:13px; color:var(--muted)}

/* 결과 카드 2종 */
.res{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media (max-width:820px){ .res{grid-template-columns:1fr} }
.res>div{border:1px solid var(--line); border-radius:14px; padding:18px 20px; background:var(--surface-3)}
.res .tag{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--accent); margin-bottom:8px}
.res .big{font-size:36px; font-weight:600; line-height:1.1}
.res .sub{font-size:13px; color:var(--muted); margin-top:3px}
.pill{font-size:11.5px; font-weight:600; border:1px solid currentColor; border-radius:999px; padding:1px 9px}
.bars{display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; font-size:13px; align-items:center; margin-top:14px}
.bars .bk{color:var(--muted)}
.bars .bb{height:7px; border-radius:4px; background:var(--line-soft); overflow:hidden}
.bars .bb i{display:block; height:100%}
.bars .bv{font-weight:600; font-size:12.5px}
.speech{border:1px solid var(--line); border-radius:11px; border-top-left-radius:3px; background:var(--surface-2); padding:13px 15px; font-size:14px; margin-top:14px}
.speech .who{font-size:10.5px; letter-spacing:.08em; color:var(--faint); font-weight:600; margin-bottom:3px}

/* 챌린지 */
.cats{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
@media (max-width:760px){ .cats{grid-template-columns:repeat(2,1fr)} }
.cat{border:1px solid var(--line); border-radius:11px; padding:12px 10px; background:var(--surface);
  font-size:13.5px; font-weight:500; text-align:center; color:var(--ink)}
.cat[data-on="1"]{border-color:var(--accent); background:var(--accent-soft); font-weight:600}
.cat small{display:block; font-size:11px; color:var(--faint); font-weight:400; margin-top:2px}
.slot{border:1px solid var(--line); border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start}
.slot[data-k="fixed"]{border-color:var(--accent); background:var(--accent-soft)}
.slot[data-k="pick"][data-on="1"]{border-color:var(--ok); background:var(--ok-soft)}
.slot .mk{font-size:16px; flex:none; line-height:1.4}
.slot .st{font-size:14.5px; font-weight:600}
.slot .sd{font-size:12.5px; color:var(--muted); margin-top:1px}
.slot .src{font-size:11.5px; color:var(--accent); margin-top:4px}
.badge{font-size:10.5px; font-weight:700; border:1px solid currentColor; border-radius:5px; padding:0 6px; margin-left:7px; white-space:nowrap}
.lvl[data-l="하"]{color:var(--ok)} .lvl[data-l="중"]{color:var(--warn)} .lvl[data-l="상"]{color:var(--risk)}

/* 인증 */
.week{display:flex; gap:8px; justify-content:space-between; margin:14px 0 4px}
.day{display:flex; flex-direction:column; align-items:center; gap:5px; font-size:12px; color:var(--faint)}
.ring{width:38px; height:38px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:13px; color:var(--ghost); background:var(--surface)}
.ring[data-on="1"]{border-color:var(--ok); background:var(--ok-soft); color:var(--ok); font-weight:700}
.trk{height:8px; border-radius:5px; background:var(--line-soft); overflow:hidden}
.trk i{display:block; height:100%; border-radius:5px; background:var(--accent-vivid)}
.prog{display:flex; align-items:baseline; gap:8px; font-size:13.5px; color:var(--muted); margin-bottom:7px}
.prog b{color:var(--ink); margin-left:auto}

svg{display:block; width:100%; height:auto; overflow:visible}
.deltarow{display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; text-align:center}
.deltarow .lb{font-size:11.5px; letter-spacing:.06em; color:var(--faint); font-weight:600}
.deltarow .vv{font-size:28px; font-weight:600}
.deltarow .ar{color:var(--faint); font-size:19px}

/* 오른쪽 근거 */
.side{display:flex; flex-direction:column; gap:12px}
@media (min-width:941px){ .side{position:sticky; top:74px} }
.sc{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.sc h3{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--faint); margin-bottom:9px}
.sc p{font-size:13px; color:var(--muted)}
.sc p+p{margin-top:7px}
.sc b{color:var(--ink); font-weight:600}
.ids{display:flex; flex-wrap:wrap; gap:4px}
.id{font-size:11.5px; font-weight:600; border:1px solid var(--line); border-radius:5px; padding:1px 6px; color:var(--muted)}
.id[data-t="w"]{color:var(--accent); border-color:var(--accent)}
</style>

<nav class="nav"><div class="navin">
  <span class="brand">PAEON</span>
  <span class="right">서비스 데모 · 숫자는 예시이며 의학적 진단이 아닙니다</span>
</div></nav>
<div class="rail" id="rail"></div>
<main><div class="stack" id="view"></div><aside class="side" id="side"></aside></main>

<script>
const el=(t,a={},...k)=>{const n=document.createElement(t);
  for(const[p,v] of Object.entries(a)){ if(p==='cls')n.className=v; else if(p==='html')n.innerHTML=v;
    else if(p.startsWith('on'))n.addEventListener(p.slice(2),v); else if(v!=null)n.setAttribute(p,v); }
  k.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c))); return n;};
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const f1=n=>(Math.round(n*10)/10).toFixed(1);

/* ══ 모델 A · B ══════════════════════════════════════════
   둘 다 선형 로지스틱이라 계수 x (값 − 평균) 이 그대로 SHAP 기여도다.
   A = 10년 내 고혈압 발생(장기). 4주로는 거의 움직이지 않는다.
   B = 현재 고혈압 유병(횡단면). 혈압을 입력으로 쓰지 않는다 — 혈압으로 고혈압을
       맞히면 예측이 아니라 판정이 되고, 혈압 추이 그래프와 같은 말을 반복하게 된다. */
const A_F=[{k:'age',label:'나이',coef:0.085,mean:45},{k:'male',label:'성별',coef:0.35,mean:0.5},
  {k:'bmi',label:'체질량지수',coef:0.070,mean:23.8},{k:'sys',label:'수축기혈압',coef:0.022,mean:122},
  {k:'chol',label:'총콜레스테롤',coef:0.005,mean:190},{k:'smoke',label:'흡연',coef:0.20,mean:0.2}];
const B_F=[{k:'age',label:'나이',coef:0.034,mean:45},{k:'male',label:'성별',coef:0.40,mean:0.5},
  {k:'bmi',label:'체질량지수',coef:0.095,mean:23.8},{k:'salt',label:'나트륨 습관',coef:0.075,mean:5},
  {k:'eatout',label:'외식·배달',coef:0.04,mean:4},{k:'act',label:'신체활동',coef:-0.0022,mean:100},
  {k:'smoke',label:'흡연',coef:0.26,mean:0.2},{k:'drink',label:'음주',coef:0.018,mean:4}];
const A_I=-1.30, B_I=-1.35;
const contrib=(F,x)=>F.map(f=>({...f,c:f.coef*(x[f.k]-f.mean)}));
const sig=z=>1/(1+Math.exp(-z));
const riskA=x=>sig(A_I+contrib(A_F,x).reduce((s,f)=>s+f.c,0));
const riskB=x=>sig(B_I+contrib(B_F,x).reduce((s,f)=>s+f.c,0));
const vasc=x=>{const r=contrib(A_F,x).filter(f=>f.k!=='age').reduce((s,f)=>s+f.c,0);
  return Math.max(20,Math.min(90,x.age+r/0.085));};
const band=r=>r<0.15?{t:'정상',v:'ok'}:r<0.30?{t:'경계',v:'warn'}:{t:'위험',v:'risk'};

/* ══ 챌린지 — 고정 2 + 카테고리 1개 안에서 2개 ══ */
const FIX_SMOKE={id:'f1',t:'금연 유지 (전자담배 포함)',d:'6대 수칙에 전자담배가 따로 명시됩니다'};
const FIX_DRINK={id:'f2',t:'표준잔 지키기 · 남 2 / 여 1',d:'초과 입력 시 경고와 함께 해당 일차를 실패로 처리합니다'};
const SALT_ALT=[{id:'f3',t:'국물 남기기 주 5회',d:'국·찌개·라면은 한 번에 염분이 많이 들어갑니다'},
                {id:'f4',t:'라면 주 1회 이하',d:'단일 식품 중 염분이 가장 눈에 띕니다'}];
const CATS=[
 {id:'salt',n:'나트륨 줄이기',ms:[
  {id:'s1',t:'국물 남기기 주 5회',lv:'하',eff:{salt:-3}},
  {id:'s2',t:'김치 한 끼 1접시 이하',lv:'중',eff:{salt:-2}},
  {id:'s3',t:'찌개 대신 구이·찜 주 3회',lv:'중',eff:{salt:-2}}]},
 {id:'act',n:'신체 활동',ms:[
  {id:'a1',t:'앉아서 발뒤꿈치 들기 주 5일',lv:'하',eff:{act:50}},
  {id:'a2',t:'하루 30분 걷기 주 5일',lv:'중',eff:{act:150}},
  {id:'a3',t:'저항운동 주 2회',lv:'상',eff:{act:60}}]},
 {id:'out',n:'외식 · 배달 조절',ms:[
  {id:'o1',t:'배달 앱 주 2회 줄이기',lv:'하',eff:{eatout:-2}},
  {id:'o2',t:'집밥 저염식 주 3회',lv:'중',eff:{eatout:-3,salt:-1}},
  {id:'o3',t:'외식할 때 "덜 짜게" 요청',lv:'하',eff:{salt:-1}}]},
 {id:'morn',n:'아침 식사',ms:[
  {id:'m1',t:'아침 거르지 않기 주 5일',lv:'중',eff:{}},
  {id:'m2',t:'아침은 밥 대신 샌드위치',lv:'하',eff:{}}]},
 {id:'wt',n:'체중 관리',ms:[
  {id:'w1',t:'4주 −1kg',lv:'상',eff:{bmi:-0.35}},
  {id:'w2',t:'저녁 밥 2/3공기',lv:'중',eff:{bmi:-0.2}},
  {id:'w3',t:'야식 없는 날 주 5일',lv:'하',eff:{bmi:-0.15}}]},
];

const S={
 step:0, reached:0, ocr:false,
 raw:{age:45,sex:1,h:172,w:78,sys:145,dia:92,glu:104,chol:212},
 sv:{salt:6,eatout:4,act:60,smoke:1,drink:7},
 cat:null, picks:new Set(), days:new Set(),
};
const bmi=()=>S.raw.w/Math.pow(S.raw.h/100,2);
const X=()=>({age:S.raw.age,male:S.raw.sex,bmi:bmi(),sys:S.raw.sys,chol:S.raw.chol,
  salt:S.sv.salt,eatout:S.sv.eatout,act:S.sv.act,smoke:S.sv.smoke,drink:S.sv.drink});

function fixed(){
  const out=[]; let i=0;
  out.push(S.sv.smoke>=0.7?{...FIX_SMOKE,from:'흡연'}:{...SALT_ALT[i++],from:'흡연 → 나트륨 대체'});
  out.push(S.sv.drink>0 ?{...FIX_DRINK,from:'음주'}:{...SALT_ALT[i++],from:'음주 → 나트륨 대체'});
  return out;
}
/* 4주 뒤 — 인증한 비율만큼만 반영. 모델 B 입력만 바뀐다 */
function after(){
  const y={...X()}; const done=S.days.size/28; let bp=0;
  const all=[...fixed(), ...(S.cat?CATS.find(c=>c.id===S.cat).ms.filter(m=>S.picks.has(m.id)):[])];
  all.forEach(m=>{ for(const[k,v] of Object.entries(m.eff||{})) y[k]=(y[k]||0)+v; });
  if(S.sv.smoke>=0.7) y.smoke=0;
  if(S.sv.drink>0) y.drink=Math.min(y.drink,8);
  ['salt','eatout'].forEach(k=>y[k]=Math.max(0,y[k]));
  const z={}; Object.keys(y).forEach(k=>z[k]=X()[k]+(y[k]-X()[k])*done);
  bp = Math.min(12, (S.cat==='salt'?5:0)+(S.cat==='act'?6:0)+(S.cat==='wt'?3:0)+4)*done;
  z.sys=S.raw.sys-bp;
  return {z,bp};
}

const STEPS=[
 {id:'W03',n:'적합성'},{id:'W04',n:'검진 입력'},{id:'W04',n:'생활습관'},{id:'W05',n:'입력 검토'},
 {id:'W06',n:'예측 결과'},{id:'W09',n:'챌린지'},{id:'W10',n:'인증'},{id:'W08',n:'대시보드'},{id:'W11',n:'전 · 후'},
];

function chart(series, lo, hi){
  const W=720,H=180,pl=42,pr=78,pt=12,pb=26;
  const Xp=i=>pl+i*(W-pl-pr)/(series.length-1), Yp=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const s=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="수축기 혈압 추이">'];
  [130,140].forEach(v=>s.push('<line x1="'+pl+'" y1="'+Yp(v).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Yp(v).toFixed(1)+'" stroke="'+cssv('--line-soft')+'"/>'));
  s.push('<line x1="'+pl+'" y1="'+Yp(140).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Yp(140).toFixed(1)+'" stroke="'+cssv('--warn')+'" stroke-width="1.5" stroke-dasharray="5 4"/>');
  s.push('<text x="'+(W-pr+8)+'" y="'+(Yp(140)+4).toFixed(1)+'" font-size="12" font-weight="600" fill="'+cssv('--warn')+'">고혈압 140</text>');
  [lo+5,130,140,hi-5].forEach(v=>s.push('<text x="'+(pl-8)+'" y="'+(Yp(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" font-family="IBM Plex Mono, monospace" fill="'+cssv('--faint')+'">'+v+'</text>'));
  s.push('<polyline fill="none" stroke="'+cssv('--accent-vivid')+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+
    series.map((v,i)=>Xp(i).toFixed(1)+','+Yp(v).toFixed(1)).join(' ')+'"/>');
  series.forEach((v,i)=>{const last=i===series.length-1;
    s.push('<circle cx="'+Xp(i).toFixed(1)+'" cy="'+Yp(v).toFixed(1)+'" r="'+(last?6:4.5)+'" fill="'+(last?cssv('--accent-vivid'):cssv('--surface'))+'" stroke="'+cssv('--accent-vivid')+'" stroke-width="2.5"><title>'+i+'주 '+Math.round(v)+' mmHg</title></circle>');
    s.push('<text x="'+Xp(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="11" fill="'+cssv('--faint')+'">'+i+'주</text>');});
  s.push('</svg>'); return s.join('');
}

    el('span',{cls:'bv', style:'color:var(--'+(r.c>=0?'risk':'ok')+')'},(r.c>=0?'+':'−')+f1(Math.abs(r.c)*100))]).flat());
}

/* W11 */
function scr8(){
  const x=X(), {z,bp}=after();
  const a0=riskA(x), a1=riskA(z), b0=riskB(x), b1=riskB(z), v0=vasc(x), v1=vasc(z);
  const rank=t=>contrib(B_F,t).filter(f=>f.c>0&&!['age','male'].includes(f.k)).sort((p,q)=>q.c-p.c).map(f=>f.label);
  const r0=rank(x), r1=rank(z);
  const moved=r0[0]&&r1.indexOf(r0[0])>0?{n:r0[0],to:r1.indexOf(r0[0])+1}:null;
  view.append(el('div',{cls:'card'},
    el('div',{cls:'hd'}, el('h1',{},'4주 중간 재평가'),
      el('p',{},'생활습관과 혈압만 다시 받아 모델 B 로 비교했습니다. 혈액 수치를 포함한 전체 재검진은 3~6개월 뒤입니다.')),
    el('div',{cls:'deltarow',style:'border:1px solid var(--line);border-radius:12px;padding:16px'},
      el('div',{}, el('div',{cls:'lb'},'시작'), el('div',{cls:'vv num'}, Math.round(b0*100)+'%')),
      el('div',{cls:'ar'},'→'),
      el('div',{}, el('div',{cls:'lb'},'4주 후'),
        el('div',{cls:'vv num',style:'color:var(--'+(b1<b0?'ok':'muted')+')'}, Math.round(b1*100)+'%'))),
    el('div',{cls:'callout',style:'margin-top:12px',
      html:'모델 A(10년 장기)도 금연·혈압 변화로 <b>'+Math.round(a0*100)+'% → '+Math.round(a1*100)+'%</b> 움직였습니다. '+
           '다만 10년 뒤 발생을 예측한 값이라 4주 만에 맞았는지 확인할 수 없어, 전·후 비교의 기준은 모델 B 로 둡니다.'}),
    el('div',{cls:'speech'}, el('div',{cls:'who'},'한 줄 해석'),
      el('div',{}, S.days.size===0?'인증 기록이 없어 변화를 계산할 수 없습니다. 인증 화면에서 며칠 눌러보세요.'
        : moved?moved.n+' 기여도가 1위에서 '+moved.to+'위로 내려갔습니다. 혈압 그래프가 못 하는 얘기입니다.'
        :'아직 순위가 바뀔 만큼은 아닙니다. 다음 4주에 난이도를 한 단계 올려볼까요?')),
    el('p',{cls:'sect',style:'margin:18px 0 9px'},'수축기 혈압 · 혈관 나이'),
    el('div',{html:chart([0,1,2,3,4].map(i=>S.raw.sys-bp*(i/4)),120,150)}),
    el('p',{cls:'callout',style:'margin-top:12px'},
      bp>0?'−'+Math.round(bp)+' mmHg 는 질병관리청 감소폭(저염 4~6 · 유산소 5~7mmHg)을 인증 비율만큼 적용한 값입니다. 혈관 나이는 '+f1(v0).replace('.0','')+'세 → '+f1(v1).replace('.0','')+'세.'
        :'측정·인증 기록이 없으면 이 그래프가 비어 있게 됩니다.'),
    nav('처음부터 다시',()=>{S.step=0;S.reached=0;S.days.clear();S.picks.clear();S.cat=null;S.ocr=false;render();})));
