<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>캘린더</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1300px; background: #FFFFFF; color: #243749; font-family: 'Nanum Gothic', sans-serif; font-weight: 500; -webkit-font-smoothing: antialiased; overflow: hidden">
  <div style="height: 64px; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 20px; font-weight: 800">캘린더</span>
    <a href="HealthInput.dc.html" style="height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 18px; border: 1px solid #D2C4B4; font-size: 13px; font-weight: 700; display: flex; align-items: center">내 기록으로</a>
  </div>

  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="이전 달" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243749; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <span style="font-size: 18px; font-weight: 800">2026년 10월</span>
      <button aria-label="다음 달" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243749; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
    </div>

    <div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 13px; color: #5A6B7A; padding-bottom: 6px"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
          <div style="position: relative; aspect-ratio: 1 / 1; box-sizing: border-box; border-radius: 10px; background: {{d.bg}}; border: {{d.border}}; visibility: {{d.show}}">
            <span style="position: absolute; top: 4px; left: 6px; font-size: 13px; line-height: 1; color: {{d.color}}; font-weight: {{d.weight}}">{{d.n}}</span>
            <i style="position: absolute; right: 5px; bottom: 5px; width: 6px; height: 6px; border-radius: 3px; background: {{d.dot}}"></i>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 16px; padding-top: 12px; font-size: 12px; color: #5A6B7A">
        <span style="display: flex; align-items: center; gap: 6px"><i style="width: 12px; height: 12px; border-radius: 4px; background: #AACDDC"></i>사진 있는 날</span>
        <span style="display: flex; align-items: center; gap: 6px"><i style="width: 6px; height: 6px; border-radius: 3px; background: #5C86AC"></i>글만 있는 날</span>
      </div>
    </div>

    <!-- 선택한 날 -->
    <div style="display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #E6DBCD; padding-top: 18px">
      <div style="font-size: 18px; font-weight: 800">10월 14일 수요일</div>
      <div style="background: #F8F1E7; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; font-weight: 700">일기</span><a href="Calendar.dc.html" style="min-height: 32px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #5C86AC">수정</a></div>
        <span style="font-size: 14px; color: #4A5C6D; line-height: 1.6">점심 먹고 회사 근처를 한 바퀴 돌았다. 어제보다 덜 힘들었다.</span>
      </div>
      <div style="display: flex; gap: 10px">
        <span style="width: 84px; height: 84px; border-radius: 16px; background: #F3E3D0; color: #5A6B7A; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="사진 자리"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10.5" r="1.5"></circle><path d="M4 18l5-5 4 4 3-3 4 4"></path></svg></span>
        <span style="width: 84px; height: 84px; box-sizing: border-box; border-radius: 16px; border: 1.5px dashed #D2C4B4; color: #5A6B7A; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-label="사진 추가" role="img"><path d="M12 5v14M5 12h14"></path></svg></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; font-weight: 700; padding-top: 4px">오늘 할 일</span>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 48px"><span style="width: 26px; height: 26px; border-radius: 13px; background: #5C86AC; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5l2.5 2.5L11 4.5"></path></svg></span><span style="font-size: 15px; color: #5A6B7A; text-decoration: line-through; flex: 1">국물 남기기</span><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: #E4F0F5; color: #234257; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center">챌린지</span></div>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 48px"><span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2px solid #5C86AC; flex: none"></span><span style="font-size: 15px; flex: 1">하루 걸음 수: 평소 + 2,000보</span><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: #E4F0F5; color: #234257; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center">챌린지</span></div>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 48px"><span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2px solid #5C86AC; flex: none"></span><span style="font-size: 15px; flex: 1">병원 예약 전화하기</span><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: #F3E3D0; color: #4A5C6D; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center">내가 추가</span></div>

        <!-- 챌린지 기반 추천 -->
        <div style="display: flex; flex-direction: column; gap: 10px; background: #F8F1E7; border-radius: 20px; padding: 16px 16px 18px; margin-top: 10px">
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">내 챌린지에서 추천해요</span><span style="font-size: 13px; color: #4A5C6D">눌러서 오늘 할 일에 넣어 보세요</span></div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <span style="height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 20px; border: 1px solid #D2C4B4; background: #FFFFFF; font-size: 14px; display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#5C86AC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 2v10M2 7h10"></path></svg>음식에 소금·간장 더 넣지 않기</span>
            <span style="height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 20px; border: 1px solid #D2C4B4; background: #FFFFFF; font-size: 14px; display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#5C86AC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 2v10M2 7h10"></path></svg>물 6잔 마시기</span>
            <span style="height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 20px; border: 1px solid #D2C4B4; background: #FFFFFF; font-size: 14px; display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#5C86AC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 2v10M2 7h10"></path></svg>계단으로 오르기</span>
          </div>
        </div>

        <!-- 직접 추가 -->
        <div style="display: flex; gap: 8px; margin-top: 10px">
          <label for="newTodo" style="position: absolute; left: -9999px">할 일 직접 추가</label>
          <input id="newTodo" placeholder="내 할 일 직접 적기" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; border: 0; border-radius: 14px; background: #F8F1E7; padding: 0 16px; font: 500 15px 'Nanum Gothic', sans-serif; color: #243749; outline: none">
          <button style="width: 76px; height: 52px; border: 0; border-radius: 14px; background: #81A6C6; color: #1E3246; font: 700 15px 'Nanum Gothic', sans-serif">추가</button>
        </div>
      </div>
    </div>
  </div>

  <nav aria-label="주요 메뉴" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E6DBCD; display: flex; padding: 8px 4px 0">
    <a href="Trend.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; color: #243749; font-size: 12px; font-weight: 800"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>내 기록</a>
    <a href="Challenge.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; color: #5A6B7A; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l3 3 5-6"></path></svg>챌린지</a>
    <a href="Home.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; color: #5A6B7A; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"></path></svg>홈</a>
    <a href="Feed.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; color: #5A6B7A; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11h-7l-4 4v-4H4z"></path></svg>커뮤니티</a>
    <a href="Menu.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; color: #5A6B7A; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>더보기</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const photo = [2, 6, 8, 9, 12, 13, 14];
    const memo = [5, 7];
    const tones = ['#F3E3D0', '#AACDDC', '#D2C4B4'];
    const days = [];
    for (let i = 0; i < 3; i++) days.push({ n: '', bg: 'transparent', border: '0', color: '#243749', weight: 500, dot: 'transparent', show: 'hidden' });
    for (let n = 1; n <= 31; n++) {
      const p = photo.indexOf(n);
      days.push({
        n,
        bg: p >= 0 ? tones[p % 3] : '#F8F1E7',
        border: n === 14 ? '2px solid #243749' : '0',
        color: p >= 0 ? '#243749' : (n > 14 ? '#8A98A5' : '#4A5C6D'),
        weight: n === 14 ? 800 : 500,
        dot: memo.includes(n) ? '#5C86AC' : 'transparent',
        show: 'visible'
      });
    }
    return { days };
  }
}
</script>
</body>
</html>
