<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>빈 상태 · 오류 · 로딩</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
input{outline:none}
</style>
</helmet>
<div style="width: 1360px; height: 560px; box-sizing: border-box; padding: 40px; background: #F8F1E7; color: #243749; font-family: 'Nanum Gothic', sans-serif; font-weight: 500; -webkit-font-smoothing: antialiased; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px; overflow: hidden">

  <!-- 빈 상태 -->
  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #5A6B7A">빈 상태</span>
    <div style="flex: 1; background: #FFFFFF; border-radius: 20px; border: 1px solid #E6DBCD; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5A6B7A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>
      <div style="font-size: 18px; font-weight: 800">아직 분석 결과가 없어요</div>
      <div style="font-size: 14px; color: #4A5C6D; line-height: 1.6">건강정보와 설문을 입력하면<br>10년 내 심장 혈관 건강 신호를<br>볼 수 있어요.</div>
      <button style="margin-top: 8px; height: 48px; padding: 0 28px; border: 0; border-radius: 24px; background: #81A6C6; color: #1E3246; font: 700 15px 'Nanum Gothic', sans-serif">입력 시작하기</button>
    </div>
  </div>

  <!-- 오류 -->
  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #5A6B7A">불러오기 오류</span>
    <div style="flex: 1; background: #FFFFFF; border-radius: 20px; border: 1px solid #E6DBCD; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5A6B7A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.5"></path></svg>
      <div style="font-size: 18px; font-weight: 800">불러오지 못했어요</div>
      <div style="font-size: 14px; color: #4A5C6D; line-height: 1.6">네트워크가 불안정한 것 같아요.<br>입력한 내용은 그대로 남아 있어요.</div>
      <button style="margin-top: 8px; height: 48px; padding: 0 28px; border: 1px solid #D2C4B4; border-radius: 24px; background: #FFFFFF; color: #243749; font: 700 15px 'Nanum Gothic', sans-serif">다시 시도</button>
    </div>
  </div>

  <!-- 로딩 -->
  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #5A6B7A">로딩 (분석 중)</span>
    <div style="flex: 1; background: #FFFFFF; border-radius: 20px; border: 1px solid #E6DBCD; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px" role="status" aria-label="분석하고 있어요">
      <div style="height: 14px; width: 55%; border-radius: 7px; background: #E6DBCD"></div>
      <div style="height: 44px; width: 38%; border-radius: 10px; background: #E6DBCD"></div>
      <div style="display: flex; gap: 4px"><i style="flex: 1; height: 8px; border-radius: 4px; background: #E6DBCD"></i><i style="flex: 1; height: 8px; border-radius: 4px; background: #E6DBCD"></i><i style="flex: 1; height: 8px; border-radius: 4px; background: #E6DBCD"></i></div>
      <div style="height: 72px; border-radius: 14px; background: #F3E3D0"></div>
      <div style="height: 14px; width: 80%; border-radius: 7px; background: #E6DBCD"></div>
      <div style="margin-top: auto; text-align: center; font-size: 14px; color: #4A5C6D">분석하고 있어요. 잠시만요.</div>
    </div>
  </div>

  <!-- 입력 오류 -->
  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #5A6B7A">입력 오류</span>
    <div style="flex: 1; background: #FFFFFF; border-radius: 20px; border: 1px solid #E6DBCD; padding: 24px 20px; display: flex; flex-direction: column; gap: 10px">
      <label for="stH" style="font-size: 13px; color: #5A6B7A">키</label>
      <div style="display: flex; align-items: center; height: 56px; border-radius: 12px; background: #F8F1E7; padding: 0 16px; gap: 8px; border: 2px solid #243749; box-sizing: border-box">
        <input id="stH" value="16" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 800 20px 'Nanum Gothic', sans-serif; color: #243749" aria-invalid="true" aria-describedby="stHm">
        <span style="font-size: 14px; color: #5A6B7A">cm</span>
      </div>
      <div id="stHm" style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#243749" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"></circle><path d="M8 5v3.5M8 11v.2"></path></svg>키는 100~220 사이로 적어 주세요</div>
      <div style="font-size: 13px; color: #5A6B7A; line-height: 1.6; margin-top: 6px">오류는 글자와 아이콘, 굵은 테두리로 알려요. 색에 기대지 않아요.</div>
      <button disabled="" style="margin-top: auto; height: 52px; border: 0; border-radius: 26px; background: #E6DBCD; color: #5A6B7A; font: 700 16px 'Nanum Gothic', sans-serif">다음</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":560}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
