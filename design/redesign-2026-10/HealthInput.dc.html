<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>건강정보 입력</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
input{outline:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #FFFFFF; color: #243749; font-family: 'Nanum Gothic', sans-serif; font-weight: 500; -webkit-font-smoothing: antialiased; overflow: hidden">
  <!-- 상단: 뒤로 + 진행 -->
  <div style="height: 64px; padding: 0 8px 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="Home.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#243749" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; height: 4px; border-radius: 2px; background: #E6DBCD"><div style="width: 33%; height: 4px; border-radius: 2px; background: #5C86AC"></div></div>
    <span style="width: 56px; text-align: right; padding-right: 12px; font-size: 13px; color: #5A6B7A; box-sizing: border-box">3 / 9</span>
  </div>

  <div style="padding: 32px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.7px; line-height: 1.3">혈압을<br>입력해 주세요</div>
    <div style="font-size: 14px; color: #4A5C6D; line-height: 1.6">가장 최근에 잰 값이면 돼요.</div>
  </div>

  <div style="padding: 40px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="sys" style="font-size: 13px; color: #5A6B7A">수축기 (높은 쪽)</label>
      <div style="display: flex; align-items: center; height: 64px; border-radius: 14px; background: #F8F1E7; padding: 0 20px; gap: 8px; border: 2px solid #243749; box-sizing: border-box">
        <input id="sys" inputmode="numeric" value="128" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 800 28px 'Nanum Gothic', sans-serif; color: #243749">
        <span style="font-size: 15px; color: #5A6B7A">mmHg</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="dia" style="font-size: 13px; color: #5A6B7A">이완기 (낮은 쪽)</label>
      <div style="display: flex; align-items: center; height: 64px; border-radius: 14px; background: #F8F1E7; padding: 0 20px; gap: 8px; border: 2px solid transparent; box-sizing: border-box">
        <input id="dia" inputmode="numeric" placeholder="예: 80" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 800 28px 'Nanum Gothic', sans-serif; color: #243749">
        <span style="font-size: 15px; color: #5A6B7A">mmHg</span>
      </div>
    </div>
    <div style="font-size: 13px; color: #5A6B7A; line-height: 1.6; padding-top: 4px">입력한 건강정보는 위험 신호 분석과 챌린지 추천에만 쓰고, 다른 용도로 쓰거나 제3자에게 제공하지 않아요. 마이페이지에서 언제든 지울 수 있어요.</div>
  </div>

  <!-- 하단 고정 버튼 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; background: #FFFFFF">
    <a href="Survey.dc.html" style="height: 56px; border-radius: 28px; background: #81A6C6; color: #1E3246; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">다음</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
