    <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; font-size: 16px; font-weight: 800; border-bottom: 1px solid #E6DBCD"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #5C86AC">전체 동의</label>

    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px"><label style="display: flex; align-items: center; gap: 12px; font-size: 14px"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #5C86AC">(필수) 개인정보 수집·이용</label><a href="Privacy.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 13px; color: #5A6B7A; text-decoration: underline">내용 보기</a></div>

    <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; font-size: 14px"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #5C86AC">(필수) 만 19세 이상입니다</label>
