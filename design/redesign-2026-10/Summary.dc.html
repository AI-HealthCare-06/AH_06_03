<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>12주 요약</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; background: #FFFFFF; color: #243749; font-family: 'Nanum Gothic', sans-serif; font-weight: 500; -webkit-font-smoothing: antialiased; overflow: hidden">
  <div style="height: 64px; padding: 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="Challenge.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#243749" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 17px; font-weight: 800">1번째 12주 요약</span>
  </div>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #5A6B7A">1번째 12주 · 7월 22일 ~ 10월 13일</span>
      <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.7px; line-height: 1.3">4주씩 세 번,<br>끝까지 해냈어요</div>
    </div>

    <!-- 한눈에 -->
    <div style="display: flex; gap: 10px">
      <div style="flex: 1; background: #F8F1E7; border-radius: 16px; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #4A5C6D">평균 달성률</span><span style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px">81%</span></div>
      <div style="flex: 1; background: #F8F1E7; border-radius: 16px; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #4A5C6D">수축기 혈압</span><span style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px">−15</span></div>
      <div style="flex: 1; background: #F8F1E7; border-radius: 16px; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #4A5C6D">체중</span><span style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px">−3.1kg</span></div>
    </div>

    <!-- 추이 그래프 -->
    <div style="border: 1px solid #E6DBCD; border-radius: 20px; padding: 20px 20px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 800">수축기 혈압 추이</span><span style="font-size: 13px; color: #5A6B7A">mmHg</span></div>
      <svg width="310" height="150" viewBox="0 0 310 150" role="img" aria-label="수축기 혈압이 시작 138, 1차 129, 2차 126, 3차 123으로 내려갔어요" style="display: block">
        <line x1="0" y1="70" x2="310" y2="70" stroke="#5A6B7A" stroke-width="1" stroke-dasharray="4 4"></line>
        <text x="310" y="62" text-anchor="end" font-size="12" fill="#5A6B7A" font-family="Nanum Gothic, sans-serif">기준 130</text>
        <polyline points="35,43 112,73 188,83 265,93" fill="none" stroke="#243749" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
        <circle cx="35" cy="43" r="5.5" fill="#243749"></circle>
        <circle cx="112" cy="73" r="5.5" fill="#FFFFFF" stroke="#243749" stroke-width="2.5"></circle>
        <circle cx="188" cy="83" r="5.5" fill="#FFFFFF" stroke="#243749" stroke-width="2.5"></circle>
        <circle cx="265" cy="93" r="5.5" fill="#FFFFFF" stroke="#243749" stroke-width="2.5"></circle>
        <text x="35" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#243749" font-family="Nanum Gothic, sans-serif">138</text>
        <text x="112" y="58" text-anchor="middle" font-size="14" font-weight="800" fill="#243749" font-family="Nanum Gothic, sans-serif">129</text>
        <text x="188" y="108" text-anchor="middle" font-size="14" font-weight="800" fill="#243749" font-family="Nanum Gothic, sans-serif">126</text>
        <text x="265" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#243749" font-family="Nanum Gothic, sans-serif">123</text>
        <text x="35" y="144" text-anchor="middle" font-size="13" fill="#5A6B7A" font-family="Nanum Gothic, sans-serif">시작</text>
        <text x="112" y="144" text-anchor="middle" font-size="13" fill="#5A6B7A" font-family="Nanum Gothic, sans-serif">1차</text>
        <text x="188" y="144" text-anchor="middle" font-size="13" fill="#5A6B7A" font-family="Nanum Gothic, sans-serif">2차</text>
        <text x="265" y="144" text-anchor="middle" font-size="13" fill="#5A6B7A" font-family="Nanum Gothic, sans-serif">3차</text>
      </svg>
    </div>

    <!-- 사이클별 -->
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 18px; font-weight: 800">사이클별 기록</div>
      <a href="Compare.dc.html" style="display: flex; align-items: center; gap: 14px; border: 1px solid #E6DBCD; border-radius: 16px; padding: 16px 18px">
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #81A6C6; color: #1E3246; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">1</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">1차 · 7/22 ~ 8/18</span><span style="font-size: 13px; color: #4A5C6D">달성률 78% · 혈압 138 → 129</span></div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#5A6B7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg>
      </a>
      <a href="Compare.dc.html" style="display: flex; align-items: center; gap: 14px; border: 1px solid #E6DBCD; border-radius: 16px; padding: 16px 18px">
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #81A6C6; color: #1E3246; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">2</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">2차 · 8/19 ~ 9/15</span><span style="font-size: 13px; color: #4A5C6D">달성률 82% · 혈압 129 → 126</span></div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#5A6B7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg>
      </a>
      <a href="Compare.dc.html" style="display: flex; align-items: center; gap: 14px; border: 1px solid #E6DBCD; border-radius: 16px; padding: 16px 18px">
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #81A6C6; color: #1E3246; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">3</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">3차 · 9/16 ~ 10/13</span><span style="font-size: 13px; color: #4A5C6D">달성률 83% · 혈압 126 → 123</span></div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#5A6B7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg>
      </a>
    </div>

    <div style="font-size: 13px; color: #5A6B7A; line-height: 1.7">진단이 아닌 참고 정보예요. 걱정되면 의료기관에 상담하세요.</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; background: #FFFFFF; border-top: 1px solid #E6DBCD; display: flex; flex-direction: column; gap: 8px">
    <a href="Result.dc.html" style="height: 56px; border-radius: 28px; background: #81A6C6; color: #1E3246; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">새 정보로 다시 분석하기</a>
    <a href="Menu.dc.html" style="height: 48px; border-radius: 24px; border: 1px solid #D2C4B4; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">내 데이터 내려받기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
