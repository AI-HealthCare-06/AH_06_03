<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>글쓰기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
input,textarea{outline:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #FFFFFF; color: #243749; font-family: 'Nanum Gothic', sans-serif; font-weight: 500; -webkit-font-smoothing: antialiased; overflow: hidden">
  <div style="height: 64px; padding: 0 8px 0 4px; display: flex; align-items: center; justify-content: space-between">
    <a href="Feed.dc.html" style="min-width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #4A5C6D">취소</a>
    <span style="font-size: 17px; font-weight: 800">글쓰기</span>
    <span style="min-width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #5A6B7A">등록</span>
  </div>

  <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 20px">
    <!-- 안내 -->
    <div style="background: #F8F1E7; border-radius: 14px; padding: 14px 16px; font-size: 13px; color: #3B5063; line-height: 1.6"><b>건강정보(혈압, 진단명 등)와 개인정보는 쓰지 마세요.</b><br>쓴 글은 다른 이용자에게 보여요.</div>

    <!-- 카테고리 -->
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; color: #5A6B7A">카테고리</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <span style="height: 40px; box-sizing: border-box; padding: 0 16px; border-radius: 20px; border: 1px solid #D2C4B4; color: #3B5063; font-size: 14px; display: inline-flex; align-items: center">식단</span>
        <span style="height: 40px; box-sizing: border-box; padding: 0 16px; border-radius: 20px; border: 1px solid #D2C4B4; color: #3B5063; font-size: 14px; display: inline-flex; align-items: center">운동</span>
        <span style="height: 40px; box-sizing: border-box; padding: 0 16px; border-radius: 20px; background: #81A6C6; color: #1E3246; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center">챌린지 인증</span>
        <span style="height: 40px; box-sizing: border-box; padding: 0 16px; border-radius: 20px; border: 1px solid #D2C4B4; color: #3B5063; font-size: 14px; display: inline-flex; align-items: center">고민과 꿀팁</span>
      </div>
    </div>

    <!-- 제목 · 본문 -->
    <div style="display: flex; flex-direction: column">
      <label for="wt" style="position: absolute; left: -9999px">제목</label>
      <input id="wt" placeholder="제목" value="3주차 식후 걷기, 12일째" style="height: 56px; border: 0; border-bottom: 1px solid #E6DBCD; padding: 0; font: 800 20px 'Nanum Gothic', sans-serif; color: #243749; background: transparent">
      <label for="wb" style="position: absolute; left: -9999px">내용</label>
      <textarea id="wb" placeholder="오늘의 챌린지 이야기를 남겨 보세요" style="height: 220px; border: 0; padding: 16px 0 0; resize: none; font: 500 15px 'Nanum Gothic', sans-serif; line-height: 1.7; color: #243749; background: transparent">점심 먹고 회사 근처를 한 바퀴 돌아요.</textarea>
      <div style="text-align: right; font-size: 13px; color: #5A6B7A">23 / 1000</div>
    </div>

    <!-- 사진 -->
    <div style="display: flex; align-items: center; gap: 12px">
      <button style="width: 72px; height: 72px; border: 1px dashed #D2C4B4; border-radius: 14px; background: #FFFFFF; color: #4A5C6D; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 12px 'Nanum Gothic', sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10.5" r="1.5"></circle><path d="M4 18l5-5 4 4 3-3 4 4"></path></svg>0 / 3</button>
      <span style="font-size: 13px; color: #5A6B7A; line-height: 1.6">얼굴과 이름이 보이는 사진은<br>올리지 않아요.</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; background: #FFFFFF; border-top: 1px solid #E6DBCD">
    <button style="width: 100%; height: 56px; border: 0; border-radius: 28px; background: #81A6C6; color: #1E3246; font: 700 17px 'Nanum Gothic', sans-serif">등록하기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
