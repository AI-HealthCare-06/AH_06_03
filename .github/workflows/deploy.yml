name: Deploy to EC2

on:
  push:
    branches: [main]

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/AH_06_03
            git pull origin main
            sudo docker compose up --build -d
            sudo docker builder prune -f --filter until=24h || true
            sudo docker compose exec -T fastapi alembic upgrade head

      - name: Notify Discord on success
        if: success()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ **배포 성공** — ${{ github.actor }}님의 push(${{ github.sha }})가 서버에 반영됐어요.\"}" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **배포 실패** — ${{ github.actor }}님의 push가 서버 반영에 실패했어요. Actions 탭에서 로그 확인해주세요.\"}" \
            "${{ secrets.DISCORD_WEBHOOK }}"
