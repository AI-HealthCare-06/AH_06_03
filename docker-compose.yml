# 컨테이너 로그 크기 제한(서비스마다 10MB x 5개). 넘치면 오래된 줄부터 지워지므로,
# 보관 기간 동안 남길 로그는 서버의 ~/paeon-monitor/log_archive.sh가 1시간마다 ~/logs로 옮긴다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    entrypoint: sh -c "exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - static_volume:/app/static
      - media_volume:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    logging: *default-logging

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./frontend:/srv/frontend:ro
      - caddy_data:/data
    depends_on:
      - fastapi
    restart: unless-stopped
    logging: *default-logging

  mysql:
    image: mysql:8.0
    volumes:
      - mysql_volume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

volumes:
  mysql_volume:
  static_volume:
  media_volume:
  caddy_data:
